name: V1.6.0 PR263 Test Refresh

on:
  push:
    branches:
      - v160-today-source-patch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-today-source-patch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh stale Today assertions
        shell: python
        run: |
          from pathlib import Path

          unit = Path('src/ui/SelectedMosqueLocationStateV153.test.ts')
          text = unit.read_text()
          old = '''    expect(todayScreen).toContain('<SalahIcon name="mosques"');
              expect(todayScreen).toContain('{directoryMosqueActive && (');
'''.replace('              expect', '    expect')
          new = '''    expect(todayScreen).toContain('<SalahIcon name="mosques"');
              expect(todayScreen).toContain('directoryMosqueLocationAdopted && (');
'''.replace('              expect', '    expect')
          if old not in text:
              raise SystemExit('SelectedMosqueLocationStateV153 assertion block drifted')
          unit.write_text(text.replace(old, new))

          visual = Path('scripts/visual-australian-mosque-directory.mjs')
          text = visual.read_text()
          old = '''    assert(
              (await sunrise.textContent())?.includes('Not applicable') === true,
              'Sunrise incorrectly exposes an Iqamah configuration state',
            );
            const dhuhr = today.locator('[data-today-prayer-name="dhuhr"]');
            assert(
              (await dhuhr.getAttribute('data-directory-published-iqamah')) === 'true',
              'Selected mosque published Dhuhr congregation time was not applied as Iqamah/Jama’ah context',
            );
            const dhuhrText = (await dhuhr.textContent()) ?? '';
            assert(
              dhuhrText.includes('13:15'),
              'Sanitized published Dhuhr congregation time was not exposed on Today',
            );
            assert(
              !dhuhrText.includes('12:15'),
              'Jumu’ah-colliding 12:15 value leaked back into the daily Dhuhr congregation row',
            );
'''.replace('            ', '    ')
          new = '''    const todayText = (await today.textContent()) ?? '';
            assert(
              !todayText.includes('Iqamah') && !todayText.includes('Not applicable'),
              'Today still exposes removed Iqamah presentation or placeholders',
            );
            const dhuhr = today.locator('[data-today-prayer-name="dhuhr"]');
            assert(
              (await dhuhr.getAttribute('data-directory-published-iqamah')) === null,
              'Today still exposes the removed directory-published Iqamah attribute',
            );
            const dhuhrText = (await dhuhr.textContent()) ?? '';
            assert(
              !dhuhrText.includes('13:15') && !dhuhrText.includes('12:15'),
              'Published congregation values leaked into the V1.6.0 Today prayer row',
            );
'''.replace('            ', '    ')
          if old not in text:
              raise SystemExit('Australian mosque Today assertion block drifted')
          text = text.replace(old, new)
          text = text.replace("'stage47-selected-mosque-today-sunrise-iqamah.png'", "'stage47-selected-mosque-today.png'")
          text = text.replace("      sanitizedPublishedDhuhr: '13:15',\n", "      publishedPrayerContextRetainedInDirectory: true,\n")
          visual.write_text(text)

      - name: Verify refreshed assertions
        run: |
          npx prettier --write src/ui/SelectedMosqueLocationStateV153.test.ts scripts/visual-australian-mosque-directory.mjs
          npm run lint
          npm run typecheck
          npx vitest run src/ui/SelectedMosqueLocationStateV153.test.ts src/ui/TodayScreenV160.test.ts
      - name: Commit refreshed tests without helper
        run: |
          rm .github/workflows/v160-pr263-test-refresh.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/SelectedMosqueLocationStateV153.test.ts scripts/visual-australian-mosque-directory.mjs .github/workflows/v160-pr263-test-refresh.yml
          git commit -m "test: align Today acceptance with V1.6.0"
          git push origin HEAD:v160-today-source-patch
