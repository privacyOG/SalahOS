name: Persistence Format Fix

on:
  push:
    branches:
      - privacyog/android-native-preferences

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-native-preferences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Commit exact formatter output
        run: |
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git rm .github/workflows/persistence-format-fix.yml
          git add -A
          git commit -m 'Apply repository formatting [format-fixed]'
          git push origin HEAD:privacyog/android-native-preferences
