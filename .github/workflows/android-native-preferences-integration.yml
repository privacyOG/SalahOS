name: Android Native Preferences Integration

on:
  push:
    branches:
      - privacyog/android-native-preferences

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[native-preferences-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-native-preferences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native preferences dependency
        run: npm install --save-exact @capacitor/preferences@8.0.1
      - name: Route existing application stores through initialized storage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/App.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = "import { synchronizeAndroidPrayerNotifications } from './platform/androidNotificationScheduler';\n";
          if (!source.includes("from './platform/applicationStorage'")) {
            source = source.replace(anchor, `${anchor}import { getApplicationStorage } from './platform/applicationStorage';\n`);
          }
          const occurrences = (source.match(/window\.localStorage/g) || []).length;
          if (occurrences !== 7) {
            throw new Error(`Expected exactly 7 window.localStorage references in App.tsx, found ${occurrences}`);
          }
          source = source.replaceAll('window.localStorage', 'getApplicationStorage()');
          fs.writeFileSync(path, source);
          NODE
      - name: Format generated changes
        run: npm run format
      - name: Run repository quality gate
        run: npm run check
      - name: Build Android debug application
        run: npm run android:build
      - name: Commit integrated changes
        run: |
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git add package.json package-lock.json src/App.tsx android
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate Android native preferences [native-preferences-integrated]'
          git push origin HEAD:privacyog/android-native-preferences
