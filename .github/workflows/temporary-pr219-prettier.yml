name: Temporary PR219 Prettier

on:
  push:
    branches: [agent/pr219-prettier-fix]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'chore: capture prettier output' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format target files
        run: npx prettier --write src/ui/AustralianMosqueDirectoryPanel.tsx src/ui/TodayScreen.tsx
      - name: Commit exact formatted files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/AustralianMosqueDirectoryPanel.tsx src/ui/TodayScreen.tsx
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git commit -m 'chore: capture prettier output'
          git push
