name: Stage 23.6 Format Cleanup

on:
  push:
    branches:
      - stage-23/scenic-spiritual

permissions:
  contents: write

jobs:
  format-stage-23-6:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout Scenic branch
        uses: actions/checkout@v4
        with:
          ref: stage-23/scenic-spiritual
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Stage 23.6 sources
        run: |
          npx prettier --write \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx
          npx prettier --check \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx

      - name: Commit canonical sources
        run: |
          if git diff --quiet -- \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx; then
            echo 'Stage 23.6 files already canonical.'
            exit 0
          fi
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx
          git commit -m 'Canonicalize Scenic Spiritual sources'
          git push origin HEAD:stage-23/scenic-spiritual
