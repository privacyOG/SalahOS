name: Stage 56 implementation preflight

on:
  push:
    branches:
      - stage-56/v1.5-hadith-fiqh-expansion

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-56/v1.5-hadith-fiqh-expansion
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Stage 56 changes
        run: python3 scripts/stage56-implement.py
      - name: Format changed files
        run: npx prettier --write src/domain/islamicKnowledgeStage7.ts src/domain/islamicKnowledgeStage7.test.ts src/domain/islamicKnowledge.ts src/ui/KnowledgeStage7Details.tsx src/ui/KnowledgeScreen.tsx src/islamic-knowledge.css scripts/visual-islamic-knowledge.mjs docs/ISLAMIC_KNOWLEDGE_GOVERNANCE.md package.json
      - name: Static and governance preflight
        run: |
          npm run lint
          npm run typecheck
          npm run knowledge:content:check
      - name: Full tests and production build
        run: |
          npm run test
          npm run build
      - name: Publish clean Stage 56 commit
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm .github/workflows/stage56-implement-hadith-fiqh.yml
          git rm .github/workflows/stage56-implement-v2.yml
          git rm scripts/stage56-implement.py
          git add src/domain/islamicKnowledgeStage7.ts src/domain/islamicKnowledgeStage7.test.ts src/domain/islamicKnowledge.ts src/ui/KnowledgeStage7Details.tsx src/ui/KnowledgeScreen.tsx src/islamic-knowledge.css scripts/visual-islamic-knowledge.mjs docs/ISLAMIC_KNOWLEDGE_GOVERNANCE.md package.json
          git commit -m "Stage 56: expand Hadith and Fiqh knowledge"
          git push origin HEAD:stage-56/v1.5-hadith-fiqh-expansion
