name: Integrate Platform Status Matrix

on:
  push:
    branches:
      - agent/platform-status-matrix

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/platform-status-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/platform-status-matrix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository policies
        run: npm run security:sensitive-files && npm run security:audit && npm run security:licenses && npm run docs:links && python scripts/generate_pwa_icons.py --check

      - name: Apply platform status integration
        run: python scripts/apply_platform_status_matrix.py

      - name: Canonicalize documentation
        run: npx prettier --write README.md BUILD.md docs/PLATFORM_STATUS.md

      - name: Validate documentation and repository
        run: npm run docs:links && npm run format:check && npm run lint && npm run typecheck && npm run test && npm run build && npm run verify:web-build

      - name: Commit platform status integration
        run: |
          if git diff --quiet -- README.md BUILD.md docs/PLATFORM_STATUS.md; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add README.md BUILD.md docs/PLATFORM_STATUS.md
          git commit -m "docs: synchronize tested platform status"
          git push origin HEAD:agent/platform-status-matrix
