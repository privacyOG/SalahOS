name: Fix Settings visual readiness

on:
  push:
    branches:
      - stage-22/settings-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Correct large-text Settings readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/visual-regression.mjs')
          text = path.read_text()
          old = """    url: '?view=settings',\n    fontScale: 1.25,\n  },\n"""
          new = """    url: '?view=settings',\n    fontScale: 1.25,\n    readySelector: '.settings-screen',\n  },\n"""
          if old not in text:
              raise SystemExit('large-text Settings scenario marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/visual-regression.mjs
          npm run format:check

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-settings-visual-ready.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add scripts/visual-regression.mjs .github/workflows/fix-settings-visual-ready.yml
          git commit -m "Fix large-text Settings visual readiness"
          git push origin HEAD:stage-22/settings-v2
