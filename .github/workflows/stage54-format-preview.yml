name: Stage 54 Format Preview

on:
  push:
    branches:
      - 'stage-54/v1.5-knowledge-governance'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show canonical formatting patch
        run: |
          ./node_modules/.bin/prettier --write \
            scripts/visual-islamic-knowledge.mjs \
            src/domain/islamicKnowledge.ts \
            src/domain/islamicKnowledgeGovernance.test.ts \
            src/domain/islamicKnowledgeGovernance.ts
          git diff --no-ext-diff --unified=3 -- \
            scripts/visual-islamic-knowledge.mjs \
            src/domain/islamicKnowledge.ts \
            src/domain/islamicKnowledgeGovernance.test.ts \
            src/domain/islamicKnowledgeGovernance.ts
