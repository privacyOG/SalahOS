name: Stage 54 Format Preview

on:
  push:
    branches:
      - 'stage-54/v1.5-knowledge-governance'

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply canonical formatting and remove helper
        run: |
          ./node_modules/.bin/prettier --write \
            scripts/visual-islamic-knowledge.mjs \
            src/domain/islamicKnowledge.ts \
            src/domain/islamicKnowledgeGovernance.test.ts \
            src/domain/islamicKnowledgeGovernance.ts
          rm .github/workflows/stage54-format-preview.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/visual-islamic-knowledge.mjs \
            src/domain/islamicKnowledge.ts \
            src/domain/islamicKnowledgeGovernance.test.ts \
            src/domain/islamicKnowledgeGovernance.ts \
            .github/workflows/stage54-format-preview.yml
          git commit -m "Stage 54: apply canonical formatting"
          git push origin HEAD:stage-54/v1.5-knowledge-governance
