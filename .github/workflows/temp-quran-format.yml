name: Temporary Qur'an formatting

on:
  push:
    branches:
      - quran-mutashabih-final-reconcile

permissions:
  contents: write

jobs:
  format-quran-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quran-mutashabih-final-reconcile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Qur'an audit files
        run: >-
          npx prettier --write
          src/data/quran-mutashabih-full-audit.json
          src/data/quran-mutashabih-policy-triggers.json
          src/data/quran-mutashabih-review-register.json
          src/domain/quranSalahos2026.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quran-mutashabih-full-audit.json src/data/quran-mutashabih-policy-triggers.json src/data/quran-mutashabih-review-register.json src/domain/quranSalahos2026.test.ts
          git commit -m "chore: format expanded Qur'an audit"
          git push origin HEAD:quran-mutashabih-final-reconcile
