name: Temporary Qur'an formatting

on:
  push:
    branches:
      - quran-mutashabih-final-reconcile
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-quran-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quran-mutashabih-final-reconcile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Qur'an audit files
        run: >-
          npx prettier --write
          src/data/quran-mutashabih-full-audit.json
          src/data/quran-mutashabih-policy-triggers.json
          src/data/quran-mutashabih-review-register.json
          src/domain/quranSalahos2026.test.ts
      - name: Show formatting diff
        run: >-
          git diff --no-color --
          src/data/quran-mutashabih-full-audit.json
          src/data/quran-mutashabih-policy-triggers.json
          src/data/quran-mutashabih-review-register.json
          src/domain/quranSalahos2026.test.ts
