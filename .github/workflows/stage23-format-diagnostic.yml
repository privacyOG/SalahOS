name: Stage 23 Format Diagnostic

on:
  pull_request:
    paths:
      - 'src/domain/mosqueIdentity.ts'
      - 'src/domain/mosqueProfile.ts'
      - 'src/domain/mosqueProfile.test.ts'
      - '.github/workflows/stage23-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/domain/mosqueIdentity.ts src/domain/mosqueProfile.ts src/domain/mosqueProfile.test.ts
          git diff -- src/domain/mosqueIdentity.ts src/domain/mosqueProfile.ts src/domain/mosqueProfile.test.ts
