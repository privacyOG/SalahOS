name: Apply SalahOS branding assets

on:
  push:
    branches:
      - privacyog/salahos-brand-assets

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4
        with:
          ref: privacyog/salahos-brand-assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply supplied SalahOS branding
        run: node scripts/apply-salahos-branding.mjs

      - name: Generate web and native brand icons
        run: python3 scripts/generate_pwa_icons.py

      - name: Format text assets
        run: npx prettier --write scripts/apply-salahos-branding.mjs src/App.tsx src/ui/SmartDisplay.tsx src/styles.css src/smart-display.css public/manifest.webmanifest public/sw.js index.html README.md

      - name: Validate generated branding
        run: |
          set -euo pipefail
          python3 scripts/generate_pwa_icons.py --check
          npm run check
          grep -F '/icons/salahos-wordmark.svg' src/App.tsx
          grep -F '/icons/salahos-wordmark.svg' src/ui/SmartDisplay.tsx
          grep -F '#00543e' public/manifest.webmanifest
          grep -F '#00543E' android/app/src/main/res/values/ic_launcher_background.xml
          git diff --check

      - name: Commit branding and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          rm -f scripts/apply-salahos-branding.mjs .github/workflows/apply-salahos-branding.yml
          git add -A
          git diff --cached --check
          git commit -m 'Apply SalahOS logo and app icon branding'
          git push origin HEAD:privacyog/salahos-brand-assets
