name: Home Hub Formatting Inspection
on:
  push:
    branches:
      - feature/home-hub-prayer-dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Show exact Prettier patch without making commits
        run: |
          npx prettier --write docs/HOME_PRAYER_HUB.md src/home-hub-board.css src/mobile-prayer-themes.css src/ui/SmartDisplay.test.tsx src/ui/StructuredSplitBoard.tsx
          git diff --no-ext-diff -- docs/HOME_PRAYER_HUB.md src/home-hub-board.css src/mobile-prayer-themes.css src/ui/SmartDisplay.test.tsx src/ui/StructuredSplitBoard.tsx
