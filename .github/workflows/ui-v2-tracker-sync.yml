name: UI v2 tracker sync

on:
  push:
    branches:
      - stage-22/settings-v2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reconcile visual harness and trackers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual = Path('scripts/visual-regression.mjs')
          text = visual.read_text()
          text = text.replace("    fontScale: 1.25,\n    openSettings: true,\n", "    fontScale: 1.25,\n", 1)
          visual.write_text(text)

          todo = Path('TODO.md')
          text = todo.read_text()
          if '## 22. UI/UX v2 architecture and visual redesign' not in text:
              marker = '---\n\n## Definition of Done for SalahOS v1'
              if marker not in text:
                  raise SystemExit('TODO Definition of Done marker not found')
              tracker = '''---\n\n## 22. UI/UX v2 architecture and visual redesign\n\n- [~] Complete the UI/UX v2 architecture and visual redesign defined in `docs/UI_UX_V2_PLAN.md`\n- [x] Separate congregation, managed administration, smart-display and Touch Display fixture surfaces\n- [x] Provide reloadable Today, Mosques, Qiblah, Community and Settings destinations\n- [x] Replace the legacy Today composition with a dedicated prayer-first Today screen\n- [x] Provide five-item phone navigation, compact tablet navigation and readable desktop navigation with RTL support\n- [~] Replace the legacy Settings monolith with category-based progressive disclosure\n- [ ] Complete dedicated Qiblah, Mosques and Community experience refinements\n- [ ] Complete Design System v2 consolidation and retire overlapping global layout rules\n\n**Stage 22 progress note (2026-08-21):** PR #165 established explicit product surfaces, reloadable congregation destinations and the managed administration shell. PR #166 replaced the legacy Today composition with the dedicated prayer-first Today experience and corrected phone/tablet/desktop/RTL navigation. Its exact final head `f17437139e96bcc097a893f430102dec75560f72` passed Quality Gate #1502, Android Build #507, Visual Regression #352 and iOS Build #417, including fresh iPhone/iPad Simulator install-launch-relaunch acceptance. The Visual #352 artifact also received human review for phone, tablet, 1080p and Arabic/RTL composition before merge. Stage 22 remains partial because Settings extraction, Design System consolidation and destination-specific Qiblah/Mosques/Community refinement are still in progress.\n\n---\n\n## 23. Daily Prayer Display Theme Library\n\n- [ ] Build the shared prayer-board template/data contract\n- [ ] Implement Heritage Classic\n- [ ] Implement Minimal Modern\n- [ ] Implement Bold Countdown Focus\n- [ ] Implement Structured Split Board\n- [ ] Implement Scenic Spiritual\n- [ ] Implement Family & Classroom\n- [ ] Add template preview, configuration, branding and managed-display assignment\n\n---\n\n## 24. Managed-masjid admin UX redesign\n\n- [~] Continue the dedicated managed-masjid administration surface introduced in Stage 22\n- [ ] Complete the administration information architecture and overview dashboard\n- [ ] Complete display-theme management, assignment, publication and rollback UX\n\n---\n\n## 25. Device-specific UX refinement\n\n- [~] Continue phone, tablet and desktop responsive refinement\n- [ ] Complete Raspberry Pi Touch Display 2 close-range UX refinement\n- [ ] Complete 1080p/4K TV and kiosk refinement for all required prayer-board templates\n\n---\n\n## 26. Accessibility, RTL and visual acceptance\n\n- [~] Continue accessibility, RTL and human visual acceptance across redesigned surfaces\n- [ ] Complete the full Stage 26 accessibility and internationalisation matrix\n- [ ] Complete screenshot and golden-state coverage for all redesigned application/display surfaces\n\n---\n\n## 27. Legacy UI retirement and migration completion\n\n- [ ] Remove legacy destination-hiding and superseded global CSS only after all consumers migrate\n- [ ] Run the complete cross-platform regression suite after legacy retirement\n- [ ] Update final design-system/platform documentation and screenshots\n- [ ] Mark UI/UX v2 complete only after automated and human acceptance are complete\n\n'''
              text = text.replace(marker, tracker + marker, 1)
              todo.write_text(text)

          plan = Path('docs/UI_UX_V2_PLAN.md')
          text = plan.read_text()
          completed = [
              'Replace the current feature-stacked composition with explicit product surfaces.',
              'Create a dedicated congregation application layout.',
              'Create a dedicated managed-masjid administration layout.',
              'Keep TV/kiosk/signage presentation separate from congregation navigation and administration forms.',
              'Keep deterministic Touch Display 2 fixture/testing routes isolated from unrelated application chrome.',
              'Define stable screen/destination state instead of relying on DOM scrolling and CSS hiding as the primary navigation mechanism.',
              'Preserve deep-link/reload behaviour for supported destinations.',
              'Ensure route/surface separation does not duplicate or fork prayer-domain logic.',
              'Today.',
              'Mosques.',
              'Qiblah.',
              'Community.',
              'Settings.',
              'Phone: five-item bottom navigation with consistent iconography and labels.',
              'Tablet: compact navigation rail with content-aware two-column layouts where useful.',
              'Desktop/web: persistent or collapsible sidebar with page title/context area.',
              'TV/kiosk: no ordinary congregation navigation chrome in normal display mode.',
              'Support logical RTL navigation order and icon/text alignment.',
              'Replace the large introductory hero treatment with a compact application/header area.',
              'Keep SalahOS branding, current location/preferred mosque, date and language access visible without dominating the page.',
              'Make the next prayer the dominant content block.',
              "Show next prayer name, Athan/start time, Iqamah/Jama'ah time and countdown with unambiguous labels.",
              "Present today's full prayer schedule as a clean secondary timetable instead of six visually competing cards on narrow screens.",
              'Clearly distinguish obligatory prayers from supplementary times such as Sunrise.',
              'Highlight current/next prayer without relying on colour alone.',
              'Surface selected mosque/location and data provenance in a compact secondary treatment.',
              "Surface Jumu'ah context when relevant.",
              'Add at most a small number of useful quick actions below prayer information, such as Qiblah, Mosque and Notifications.',
              'Move the Qiblah Finder out of the long stacked home flow into its own primary congregation destination.',
              'Create a dedicated Community destination.',
          ]
          for item in completed:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if old in text:
                  text = text.replace(old, new, 1)
          plan.write_text(text)
          PY

      - name: Format and validate tracker changes
        run: |
          npx prettier --write scripts/visual-regression.mjs TODO.md docs/UI_UX_V2_PLAN.md
          npm run format:check
          npm run docs:links
          npm run typecheck

      - name: Commit reconciled tracker and remove temporary workflow
        run: |
          rm .github/workflows/ui-v2-tracker-sync.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add scripts/visual-regression.mjs TODO.md docs/UI_UX_V2_PLAN.md .github/workflows/ui-v2-tracker-sync.yml
          git commit -m "Reconcile UI v2 progress tracking"
          git push origin HEAD:stage-22/settings-v2
