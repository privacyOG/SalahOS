name: Stage 55 Quran Offline Import

on:
  push:
    branches:
      - stage-55/v1.5-quran-expansion
    paths:
      - .github/workflows/stage55-quran-import.yml

permissions:
  contents: read

jobs:
  import-quran:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 55 branch
        uses: actions/checkout@v4
        with:
          ref: stage-55/v1.5-quran-expansion

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Build validated offline Quran pack
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          ARABIC_COMMIT = "c0dc86b060b854d03f62848692bf1d2936dba630"
          TRANSLATION_COMMIT = "3a796d5d7f80c80b83adae5b39affcec2aeb426c"
          ARABIC_URL = (
              "https://raw.githubusercontent.com/mjmirza/quran-dataset/"
              f"{ARABIC_COMMIT}/data/quran.json"
          )
          PICKTHALL_URL = (
              "https://raw.githubusercontent.com/Kristories/quran/"
              f"{TRANSLATION_COMMIT}/fixtures/en/pickthall/source.json"
          )

          def load_json(url):
              request = Request(url, headers={"User-Agent": "SalahOS-Quran-Importer/1.0"})
              with urlopen(request, timeout=90) as response:
                  return json.load(response)

          arabic = load_json(ARABIC_URL)
          pickthall = load_json(PICKTHALL_URL)

          surahs = arabic.get("surahs")
          if not isinstance(surahs, list) or len(surahs) != 114:
              raise SystemExit("Arabic source must contain exactly 114 surahs")
          if not isinstance(pickthall, list) or len(pickthall) != 114:
              raise SystemExit("Pickthall source must contain exactly 114 surahs")

          pickthall_by_surah = {int(item["number"]): item for item in pickthall}
          output_surahs = []
          verse_keys = set()
          ayah_total = 0

          for surah in surahs:
              surah_number = int(surah["number"])
              translation_surah = pickthall_by_surah.get(surah_number)
              if translation_surah is None:
                  raise SystemExit(f"Missing Pickthall surah {surah_number}")

              translations = {
                  int(verse["number"]): verse.get("translation")
                  for verse in translation_surah.get("verses", [])
              }
              output_ayahs = []
              for ayah in surah.get("ayahs", []):
                  ayah_number = int(ayah["number"])
                  verse_key = str(ayah["verse_key"])
                  expected_key = f"{surah_number}:{ayah_number}"
                  if verse_key != expected_key:
                      raise SystemExit(f"Unexpected verse key {verse_key}; expected {expected_key}")
                  if verse_key in verse_keys:
                      raise SystemExit(f"Duplicate verse key {verse_key}")
                  verse_keys.add(verse_key)

                  translation = translations.get(ayah_number)
                  if not isinstance(translation, str) or not translation.strip():
                      raise SystemExit(f"Missing Pickthall translation for {verse_key}")

                  output_ayahs.append({
                      "ayah": ayah_number,
                      "key": verse_key,
                      "arabic": str(ayah["text"]),
                      "translations": {"pickthall-1930": translation.strip()},
                      "juz": int(ayah["juz"]),
                      "page": int(ayah["page"]),
                  })
                  ayah_total += 1

              expected_count = int(surah["counts"]["ayahs"])
              if len(output_ayahs) != expected_count:
                  raise SystemExit(
                      f"Surah {surah_number} ayah count mismatch: "
                      f"{len(output_ayahs)} != {expected_count}"
                  )

              output_surahs.append({
                  "surah": surah_number,
                  "nameArabic": str(surah["name_arabic"]),
                  "nameTransliteration": str(surah["name_transliteration"]),
                  "nameEnglish": str(surah["name_english"]),
                  "ayahs": output_ayahs,
              })

          if ayah_total != 6236 or len(verse_keys) != 6236:
              raise SystemExit(
                  f"Offline Quran pack must contain 6236 unique ayat; got {ayah_total}"
              )

          pack = {
              "schemaVersion": 1,
              "counts": {"surahs": 114, "ayahs": 6236},
              "sources": {
                  "arabic": {
                      "id": "quran-uthmani-text",
                      "upstream": "mjmirza/quran-dataset",
                      "commit": ARABIC_COMMIT,
                      "license": "CC BY 4.0 dataset; Tanzil source attribution retained",
                  },
                  "translations": {
                      "pickthall-1930": {
                          "sourceId": "quran-pickthall-1930",
                          "upstream": "Kristories/quran",
                          "commit": TRANSLATION_COMMIT,
                          "translator": "Mohammed Marmaduke Pickthall",
                      }
                  },
              },
              "surahs": output_surahs,
          }

          target = Path("public/data/quran/quran-offline-pack.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          encoded = json.dumps(pack, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          target.write_bytes(encoded)
          digest = hashlib.sha256(encoded).hexdigest()

          manifest = {
              "schemaVersion": 1,
              "packPath": "/data/quran/quran-offline-pack.json",
              "sha256": digest,
              "surahs": 114,
              "ayahs": 6236,
              "translationIds": ["pickthall-1930"],
              "arabicSourceCommit": ARABIC_COMMIT,
              "translationSourceCommit": TRANSLATION_COMMIT,
          }
          Path("src/data/quran-offline-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          ignore_path = Path(".prettierignore")
          ignore_line = "public/data/quran/quran-offline-pack.json"
          ignore_lines = ignore_path.read_text(encoding="utf-8").splitlines()
          if ignore_line not in ignore_lines:
              ignore_lines.append(ignore_line)
              ignore_path.write_text("\n".join(ignore_lines) + "\n", encoding="utf-8")

          print(f"Validated offline Quran pack: 114 surahs / 6236 ayat / sha256:{digest}")

      - name: Format Stage 55 source files
        run: |
          npx prettier --write \
            src/domain/islamicKnowledge.test.ts \
            src/domain/islamicKnowledgeGovernance.ts \
            src/platform/quranReadingPreferences.ts \
            src/ui/KnowledgeScreen.tsx \
            src/data/quran-offline-manifest.json \
            .github/workflows/stage55-quran-import.yml

      - name: Verify generated corpus and repository checks
        run: |
          npm run knowledge:content:check
          npm run format:check

      - name: Export validated Stage 55 files
        uses: actions/upload-artifact@v4
        with:
          name: stage55-quran-import
          if-no-files-found: error
          retention-days: 3
          path: |
            .prettierignore
            public/data/quran/quran-offline-pack.json
            src/data/quran-offline-manifest.json
            src/domain/islamicKnowledge.test.ts
            src/domain/islamicKnowledgeGovernance.ts
            src/platform/quranReadingPreferences.ts
            src/ui/KnowledgeScreen.tsx
