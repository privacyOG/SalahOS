name: Stage 55 record Knowledge golden

on:
  push:
    branches:
      - stage-55/v1.5-quran-expansion

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-golden-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-golden-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-55/v1.5-quran-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build production application
        run: npm run build
      - name: Install isolated Chromium harness
        run: |
          rm -rf /tmp/salahos-golden-harness
          mkdir -p /tmp/salahos-golden-harness
          cd /tmp/salahos-golden-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-golden-http.log 2>&1 &
          echo $! >/tmp/salahos-golden-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local production server did not become ready')
          PY
      - name: Record deterministic golden and constrain change
        env:
          SALAHOS_GOLDEN_RECORD: '1'
        run: |
          node scripts/visual-golden-regression.mjs
          CHANGED="$(git diff --name-only -- tests/golden)"
          test "$CHANGED" = "tests/golden/knowledge-phone-ar-dark.png" || {
            echo "Unexpected golden changes:"
            printf '%s\n' "$CHANGED"
            exit 1
          }
      - name: Create clean binary baseline commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha)"
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          payload = {
              'content': base64.b64encode(Path('tests/golden/knowledge-phone-ar-dark.png').read_bytes()).decode(),
              'encoding': 'base64',
          }
          Path('/tmp/blob.json').write_text(json.dumps(payload))
          PY
          GOLDEN_BLOB="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" -X POST --input /tmp/blob.json --jq .sha)"
          python3 - <<PY
          import json
          from pathlib import Path
          Path('/tmp/tree.json').write_text(json.dumps({
              'base_tree': '${BASE_TREE}',
              'tree': [
                  {'path': 'tests/golden/knowledge-phone-ar-dark.png', 'mode': '100644', 'type': 'blob', 'sha': '${GOLDEN_BLOB}'},
                  {'path': '.github/workflows/stage55-record-knowledge-golden.yml', 'mode': '100644', 'type': 'blob', 'sha': None},
              ],
          }))
          PY
          TREE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees" -X POST --input /tmp/tree.json --jq .sha)"
          python3 - <<PY
          import json
          from pathlib import Path
          Path('/tmp/commit.json').write_text(json.dumps({
              'message': 'Stage 55: refresh intended Knowledge golden baseline',
              'tree': '${TREE_SHA}',
              'parents': ['${GITHUB_SHA}'],
          }))
          PY
          COMMIT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" -X POST --input /tmp/commit.json --jq .sha)"
          echo "STAGED_COMMIT_SHA=${COMMIT_SHA}"
      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-golden-server.pid ]; then
            kill "$(cat /tmp/salahos-golden-server.pid)" 2>/dev/null || true
          fi
