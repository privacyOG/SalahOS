name: Temporary v1.5.1 Release Prep

on:
  push:
    branches:
      - release-prep/v1.5.1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate synchronized v1.5.1 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.5.1 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android/app/build.gradle')
          text = android.read_text()
          text = text.replace('versionCode 7', 'versionCode 8')
          text = text.replace('versionName "1.5.0"', 'versionName "1.5.1"')
          android.write_text(text)

          ios = Path('ios/App/App.xcodeproj/project.pbxproj')
          text = ios.read_text()
          text = text.replace('CURRENT_PROJECT_VERSION = 7;', 'CURRENT_PROJECT_VERSION = 8;')
          text = text.replace('MARKETING_VERSION = 1.5.0;', 'MARKETING_VERSION = 1.5.1;')
          ios.write_text(text)
          PY

          test "$(node -p "require('./package.json').version")" = '1.5.1'
          test "$(node -p "require('./package-lock.json').version")" = '1.5.1'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '1.5.1'
          grep -q 'versionCode 8' android/app/build.gradle
          grep -q 'versionName "1.5.1"' android/app/build.gradle
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 8;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'MARKETING_VERSION = 1.5.1;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2

      - name: Validate generated dependency metadata
        run: npm ci --ignore-scripts

      - name: Create repository blobs for generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > v151-blob-shas.txt
          for file in \
            package.json \
            package-lock.json \
            android/app/build.gradle \
            ios/App/App.xcodeproj/project.pbxproj; do
            sha="$(jq -Rs '{content: ., encoding: "utf-8"}' "$file" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
            test -n "$sha"
            printf '%s %s\n' "$sha" "$file" >> v151-blob-shas.txt
          done
          cat v151-blob-shas.txt

      - name: Upload blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: v151-blob-shas
          path: v151-blob-shas.txt
          if-no-files-found: error
          retention-days: 1
