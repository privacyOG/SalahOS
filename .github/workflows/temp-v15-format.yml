name: Temporary v1.5 formatter

on:
  push:
    branches:
      - stage-51/v1.5-location-weather

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Stage 1 and Stage 2 files
        run: >-
          npx prettier@3.9.6 --write
          src/platform/automaticLocationSync.ts
          src/platform/bestAvailableLocation.ts
          src/platform/browserGeolocation.ts
          src/platform/currentLocation.ts
          src/platform/prayerBoardWeather.test.ts
          src/platform/prayerBoardWeather.ts
          src/ui/QiblaPermissionOnboarding.tsx
      - name: Remove temporary helper and create formatted commit
        run: |
          git rm .github/workflows/temp-v15-format.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add src/platform/automaticLocationSync.ts src/platform/bestAvailableLocation.ts src/platform/browserGeolocation.ts src/platform/currentLocation.ts src/platform/prayerBoardWeather.test.ts src/platform/prayerBoardWeather.ts src/ui/QiblaPermissionOnboarding.tsx
          git commit -m "Format v1.5 location and weather implementation"
          echo "FORMAT_COMMIT=$(git rev-parse HEAD)"
      - name: Upload commit object to repository
        run: |
          git push origin HEAD:stage-51/v1.5-location-weather || true
          echo "FORMAT_COMMIT=$(git rev-parse HEAD)"
