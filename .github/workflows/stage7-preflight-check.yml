name: Stage 7 Preflight Check

on:
  push:
    branches:
      - preflight/stage7-check

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Theme and calendar acceptance
        run: npm run ui:theme-contrast && npm run ui:theme-architecture && npm run ui:theme-stage45 && npm run calendar:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
