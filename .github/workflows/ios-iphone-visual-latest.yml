name: iPhone Visual Acceptance Latest

on:
  push:
    branches:
      - privacyog/ios-iphone-visual-latest

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build iOS simulator app
        run: |
          npm run build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/SalahOSDerivedData" CODE_SIGNING_ALLOWED=NO build
          APP_BUNDLE="$(find "$RUNNER_TEMP/SalahOSDerivedData/Build/Products" -path '*Debug-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_BUNDLE"
          test -s "$APP_BUNDLE/public/index.html"
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
      - name: Select iPhone Simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          selected=None
          for runtime, entries in reversed(list(devices.items())):
              for d in entries:
                  if d.get('name','').startswith('iPhone'):
                      selected=(d['name'],d['udid'],runtime); break
              if selected: break
          if not selected: raise SystemExit('No available iPhone Simulator')
          print('Selected:', selected)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'IPHONE_NAME={selected[0]}\nIPHONE_UDID={selected[1]}\n')
          PY
      - name: Cold launch and capture iPhone
        timeout-minutes: 5
        run: |
          mkdir -p simulator-evidence
          xcrun simctl shutdown "$IPHONE_UDID" 2>/dev/null || true
          xcrun simctl boot "$IPHONE_UDID"
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl install "$IPHONE_UDID" "$APP_BUNDLE"
          xcrun simctl terminate "$IPHONE_UDID" com.privacyog.salahos 2>/dev/null || true
          output="$(xcrun simctl launch "$IPHONE_UDID" com.privacyog.salahos)"
          echo "$output"
          grep -F 'com.privacyog.salahos:' <<<"$output"
          sleep 5
          xcrun simctl io "$IPHONE_UDID" screenshot simulator-evidence/iphone-5s.png
          sleep 15
          xcrun simctl io "$IPHONE_UDID" screenshot simulator-evidence/iphone-20s.png
          xcrun simctl get_app_container "$IPHONE_UDID" com.privacyog.salahos app
          sips -g pixelWidth -g pixelHeight simulator-evidence/iphone-5s.png simulator-evidence/iphone-20s.png
      - name: Upload iPhone evidence
        uses: actions/upload-artifact@v4
        with:
          name: iphone-visual-latest
          path: simulator-evidence/
          if-no-files-found: error
