name: V1.6.0 Quran Lint Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.head_ref == 'v160-salahos-2026-quran'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: v160-salahos-2026-quran
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Simplify Bismillah normalizer control flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domain/quranOfflineLibrary.ts')
          text = path.read_text()
          text = text.replace(
              "  if (!parsed || parsed.ayah !== 1 || parsed.surah === 1) return arabic;",
              "  if (parsed?.ayah !== 1 || parsed.surah === 1) return arabic;",
          )
          old = '''  let changed = false;\n  const surahs = pack.surahs.map((surah) => {\n    if (surah.surah === 1) return surah;\n\n    let surahChanged = false;\n    const ayahs = surah.ayahs.map((ayah) => {\n      if (ayah.ayah !== 1) return ayah;\n      const arabic = quranReaderArabicForAyah(ayah.key, ayah.arabic, canonicalBasmala);\n      if (arabic === ayah.arabic) return ayah;\n      changed = true;\n      surahChanged = true;\n      return Object.freeze({ ...ayah, arabic });\n    });\n\n    return surahChanged ? Object.freeze({ ...surah, ayahs: Object.freeze(ayahs) }) : surah;\n  });\n\n  return changed ? Object.freeze({ ...pack, surahs: Object.freeze(surahs) }) : pack;'''
          new = '''  const surahs = pack.surahs.map((surah) => {\n    if (surah.surah === 1) return surah;\n\n    const ayahs = surah.ayahs.map((ayah) => {\n      if (ayah.ayah !== 1) return ayah;\n      const arabic = quranReaderArabicForAyah(ayah.key, ayah.arabic, canonicalBasmala);\n      return arabic === ayah.arabic ? ayah : Object.freeze({ ...ayah, arabic });\n    });\n\n    return Object.freeze({ ...surah, ayahs: Object.freeze(ayahs) });\n  });\n\n  return Object.freeze({ ...pack, surahs: Object.freeze(surahs) });'''
          if old not in text:
              raise SystemExit('Expected Bismillah normalizer block was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply ESLint and Prettier fixes
        run: |
          npx eslint src/domain/quranOfflineLibrary.ts src/ui/QuranOfflineReader.tsx --fix
          npx prettier --write src/domain/quranOfflineLibrary.ts src/ui/QuranOfflineReader.tsx
          npx eslint src/domain/quranOfflineLibrary.ts src/ui/QuranOfflineReader.tsx
          git diff --check

      - name: Create normalized commit object
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/quranOfflineLibrary.ts src/ui/QuranOfflineReader.tsx
          git commit --allow-empty -m 'fix: satisfy Quran reader lint contracts'
          echo "NORMALIZED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v160-salahos-2026-quran
