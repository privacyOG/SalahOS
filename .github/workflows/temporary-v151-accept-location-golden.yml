name: Temporary v1.5.1 accept location golden

on:
  push:
    branches:
      - utility/v151-accept-location-golden
    paths:
      - .github/workflows/temporary-v151-accept-location-golden.yml

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download exact visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9709385781/zip" \
            -o /tmp/visual.zip
          mkdir -p /tmp/visual
          unzip -q /tmp/visual.zip -d /tmp/visual
          test -s /tmp/visual/golden-today-phone-en-light-actual.png
      - name: Create accepted baseline blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encoded="$(base64 -w0 /tmp/visual/golden-today-phone-en-light-actual.png)"
          payload="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}')"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "$payload")"
          echo "$response" | jq -r '.sha' > blob-sha.txt
          test -s blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v151-location-golden-blob
          path: blob-sha.txt
          retention-days: 1
