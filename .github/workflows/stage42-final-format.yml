name: Stage 42 Final Format

on:
  push:
    branches:
      - 'stage-42/qiblah-finder'

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout Stage 42 branch
        uses: actions/checkout@v4
        with:
          ref: stage-42/qiblah-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply canonical formatting
        run: npx prettier --write src/platform/qiblaLocation.ts

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/stage42-final-format.yml

      - name: Commit canonical formatting
        run: |
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Format final Stage 42 lint fixes"
          git push origin HEAD:stage-42/qiblah-finder
