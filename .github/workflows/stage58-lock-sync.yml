name: Stage 58 Lockfile Reconciliation

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/stage58-lock-sync.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconcile root lockfile version
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
          if (packageJson.version !== '1.5.0') {
            throw new Error(`Expected package version 1.5.0, got ${packageJson.version}`);
          }
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          lock.version = packageJson.version;
          if (!lock.packages?.['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version = packageJson.version;
          await writeFile('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          rm .github/workflows/stage58-lock-sync.yml

      - name: Commit reconciled lockfile to staging ref
        env:
          TARGET_BRANCH: agent/stage58-v15-lock-sync
        run: |
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add package-lock.json .github/workflows/stage58-lock-sync.yml
          git diff --cached --check
          git commit -m 'release: reconcile v1.5 lockfile metadata'
          git push --force origin HEAD:"$TARGET_BRANCH"
