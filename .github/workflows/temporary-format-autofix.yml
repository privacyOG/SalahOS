name: Temporary Prettier Autofix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-format-autofix.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format repository
        run: npx prettier --write .

      - name: Remove temporary workflow from exported workspace
        run: rm .github/workflows/temporary-format-autofix.yml

      - name: Package formatted workspace
        run: tar --exclude='.git' --exclude='node_modules' -czf /tmp/salahos-formatted.tar.gz .

      - name: Upload formatted workspace
        uses: actions/upload-artifact@v4
        with:
          name: salahos-formatted-workspace
          path: /tmp/salahos-formatted.tar.gz
          if-no-files-found: error
          retention-days: 1
