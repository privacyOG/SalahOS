name: Temporary Prettier Autofix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-format-autofix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format repository
        run: npx prettier --write .

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "privacyOG"
          git config user.email "privacyOG@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository formatting"
          git push origin HEAD:main
