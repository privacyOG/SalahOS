name: Stage 37 Home Assistant compatibility

on:
  push:
    branches:
      - 'stage-37/home-assistant-integration'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-37/home-assistant-integration
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install stable Home Assistant
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.7.4'
      - name: Run public API contract tests
        run: python -m unittest discover -s integrations/home-assistant/tests -p 'test_*.py'
      - name: Import custom integration against Home Assistant
        env:
          PYTHONPATH: integrations/home-assistant
        run: |
          python - <<'PY'
          import importlib
          for module in (
              'custom_components.salahos',
              'custom_components.salahos.config_flow',
              'custom_components.salahos.coordinator',
              'custom_components.salahos.sensor',
          ):
              importlib.import_module(module)
          print('SalahOS Home Assistant compatibility imports passed.')
          PY
      - name: Remove compatibility workflow after success
        run: |
          rm .github/workflows/stage37-ha-compat.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- .github/workflows/stage37-ha-compat.yml
          git commit -m 'Verify Stage 37 Home Assistant compatibility'
          git push origin HEAD:stage-37/home-assistant-integration
