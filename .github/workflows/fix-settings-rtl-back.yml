name: Fix Settings RTL back affordance

on:
  push:
    branches:
      - stage-22/settings-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Correct RTL back affordance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('src/ui/SettingsScreen.tsx')
          text = component.read_text()
          old = """        >\n          ← {copy.back}\n        </button>\n"""
          new = """        >\n          <span className=\"settings-screen__back-arrow\" aria-hidden=\"true\">\n            ←\n          </span>\n          <span>{copy.back}</span>\n        </button>\n"""
          if old not in text:
              raise SystemExit('Settings back-button marker not found')
          component.write_text(text.replace(old, new, 1))

          stylesheet = Path('src/settings-screen.css')
          text = stylesheet.read_text()
          marker = """[dir='rtl'] .settings-screen__back {\n  direction: rtl;\n}\n\n"""
          addition = marker + """.settings-screen__back-arrow {\n  display: inline-block;\n}\n\n[dir='rtl'] .settings-screen__back-arrow {\n  transform: scaleX(-1);\n}\n\n"""
          if marker not in text:
              raise SystemExit('Settings back CSS marker not found')
          stylesheet.write_text(text.replace(marker, addition, 1))
          PY
          npx prettier --write src/ui/SettingsScreen.tsx src/settings-screen.css
          npm run format:check
          npm run typecheck

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-settings-rtl-back.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/ui/SettingsScreen.tsx src/settings-screen.css .github/workflows/fix-settings-rtl-back.yml
          git commit -m "Fix RTL Settings back affordance"
          git push origin HEAD:stage-22/settings-v2
