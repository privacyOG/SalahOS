name: Android Exact Alarm Finalization

on:
  push:
    branches:
      - privacyog/android-exact-alarm-strategy

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[exact-alarm-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-exact-alarm-strategy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Wire exact-alarm UI and documentation
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${path}`);
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }

          let app = fs.readFileSync('src/App.tsx', 'utf8');
          app = app.replace(
            "import { PrayerCard } from './ui/PrayerCard';\n",
            "import { PrayerCard } from './ui/PrayerCard';\nimport {\n  AndroidExactAlarmNotice,\n  ANDROID_EXACT_ALARM_CAPABILITY_CHANGE_EVENT,\n} from './ui/AndroidExactAlarmNotice';\n",
          );
          app = app.replace(
            "  const [mosqueMessage, setMosqueMessage] = useState<TranslationKey | null>(null);\n\n  useEffect(() => {\n    applyDocumentLocale",
            "  const [mosqueMessage, setMosqueMessage] = useState<TranslationKey | null>(null);\n  const [notificationSyncRevision, setNotificationSyncRevision] = useState(0);\n\n  useEffect(() => {\n    applyDocumentLocale",
          );
          const dashboardAnchor = "  const dashboardResult = useMemo(\n";
          if (!app.includes(dashboardAnchor)) throw new Error('dashboard anchor missing');
          app = app.replace(
            dashboardAnchor,
            "  useEffect(() => {\n    const resynchronize = () => {\n      setNotificationSyncRevision((current) => current + 1);\n    };\n    window.addEventListener(ANDROID_EXACT_ALARM_CAPABILITY_CHANGE_EVENT, resynchronize);\n    return () => {\n      window.removeEventListener(ANDROID_EXACT_ALARM_CAPABILITY_CHANGE_EVENT, resynchronize);\n    };\n  }, []);\n\n" + dashboardAnchor,
          );
          app = app.replace(
            "    errorLogger,\n  ]);\n\n  const effectiveSettings",
            "    errorLogger,\n    notificationSyncRevision,\n  ]);\n\n  const effectiveSettings",
          );
          app = app.replace(
            "          <p className=\"setting-help\">{translate(locale, 'notificationDeliveryPending')}</p>",
            "          <AndroidExactAlarmNotice locale={locale} />\n          <p className=\"setting-help\">{translate(locale, 'notificationDeliveryPending')}</p>",
          );
          fs.writeFileSync('src/App.tsx', app);

          replaceExact(
            'TODO.md',
            '- [ ] Implement Android exact-alarm strategy where permitted and required',
            '- [x] Implement Android exact-alarm strategy where permitted and required',
          );
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const alarmMarker = '- [x] Implement Android exact-alarm strategy where permitted and required';
          const alarmIndex = todo.indexOf(alarmMarker);
          if (alarmIndex < 0) throw new Error('exact-alarm tracker marker missing');
          const insertionPoint = todo.indexOf('\n- [ ] Handle Android battery optimisation/background restrictions honestly', alarmIndex);
          if (insertionPoint < 0) throw new Error('exact-alarm insertion point missing');
          const note = `\n\n**Android exact-alarm verification note (2026-08-16):** the Android manifest declares user-managed \`SCHEDULE_EXACT_ALARM\` access. The native notification adapter checks the current exact-alarm setting without opening system settings automatically, reports exact versus inexact scheduling capability, and continues with an explicit inexact fallback when access is unavailable. The notification settings UI explains that Android may delay alerts while precise access is off and offers a user-initiated path to the system exact-alarm settings. Capability changes on return trigger notification reconciliation so current prayer jobs are rescheduled under the new precision state. Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate and Capacitor/Gradle Android debug assembly. Tests cover granted, denied/fallback, unsupported-target, explicit-settings-action and display-permission ordering behavior. Doze/idle delivery, battery optimisation, vendor restrictions, reboot recovery and physical/emulator timing evidence remain separately open.`;
          todo = todo.slice(0, insertionPoint) + note + todo.slice(insertionPoint);
          fs.writeFileSync('TODO.md', todo);

          const notificationBefore = `### Current Android implementation boundary\n\nThe committed Android shell now has an on-device Local Notifications adapter. It requests display permission only when a configured prayer alert requires native delivery, reconciles today/tomorrow prayer jobs from the shared scheduler, ignores already-past jobs and removes stale SalahOS-owned pending jobs without touching unrelated notifications.\n\nExact alarms are not enabled in the current Android manifest. Consequently, scheduled times are notification intent rather than a guarantee of exact wall-clock delivery, especially under Doze, battery optimisation, OEM background restrictions or user notification-channel settings. Reboot rescheduling and Adhan playback are also not yet implemented.`;
          const notificationAfter = `### Current Android implementation boundary\n\nThe committed Android shell has an on-device Local Notifications adapter. It requests display permission only when a configured prayer alert requires native delivery, reconciles today/tomorrow prayer jobs from the shared scheduler, ignores already-past jobs and removes stale SalahOS-owned pending jobs without touching unrelated notifications.\n\nThe manifest declares \`SCHEDULE_EXACT_ALARM\`, which is user-managed special access on supported Android versions. SalahOS checks that setting and never opens the system settings screen without an explicit user action. When access is granted, scheduled \`at\` notifications can use exact-alarm delivery; when it is unavailable, the same prayer notifications remain scheduled with an explicitly reported inexact fallback and the UI warns that Android may delay them. Returning from a changed exact-alarm setting triggers reconciliation of current jobs.\n\nExact-alarm access still does not bypass Doze, battery optimisation, OEM background restrictions, notification-channel settings, device power-off or reboot behavior. Reboot recovery, idle/battery handling, Adhan playback and physical/emulator timing verification remain separately tracked.`;
          replaceExact('docs/NOTIFICATION_LIMITATIONS.md', notificationBefore, notificationAfter);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          android = android.replace(
            `## Notifications and Adhan\n\nThe Android shell in this stage does **not** complete native local prayer notifications, exact-alarm handling, notification permission-version logic, reboot rescheduling, battery-optimisation handling or native Adhan lifecycle policy. Those items remain open in \`TODO.md\` and must not be inferred from the existence of the native project.\n\n`,
            `## Notifications and Adhan\n\nAndroid local prayer notifications, display-permission handling and the exact-alarm capability/fallback strategy are implemented. Reboot recovery, battery/idle/vendor-background handling, native Adhan lifecycle policy and physical/emulator timing acceptance remain separately tracked in \`TODO.md\`.\n\n`,
          );
          const oldEnding = `This implementation deliberately does **not** request \`SCHEDULE_EXACT_ALARM\`. Android can therefore defer delivery under alarm, Doze, battery-optimisation or vendor background policies. Exact-alarm policy, reboot recovery, Adhan audio playback and physical/emulator delivery testing remain separate tracker items and must not be represented as complete.`;
          const newEnding = `The manifest declares \`android.permission.SCHEDULE_EXACT_ALARM\`. On supported Android versions this is user-managed special access: SalahOS checks the current exact-alarm setting, never opens the system settings screen automatically, and exposes a user-initiated settings action when precise access is off. With access granted, the Local Notifications plugin can use exact alarms for scheduled \`at\` notifications. Without access, SalahOS continues scheduling the same prayer alerts as an inexact fallback and explicitly tells the user that Android may delay delivery.\n\nA capability change detected after returning to the app triggers scheduler reconciliation so current jobs are rebuilt under the new precision state. Exact scheduling is not described as a guarantee against Doze, battery optimisation, OEM restrictions, reboot/power-off or user notification settings. Those lifecycle and device-level items remain open.`;
          if (!android.includes(oldEnding)) throw new Error('Android exact-alarm documentation anchor missing');
          android = android.replace(oldEnding, newEnding);
          fs.writeFileSync('docs/ANDROID.md', android);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android exact-alarm strategy')) {
            testing += `\n\n### 2026-08-16 — Android exact-alarm strategy\n\n- Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate and Android debug assembly.\n- The Android manifest declares user-managed \`SCHEDULE_EXACT_ALARM\` access; the application checks exact-alarm capability without automatically opening special-access settings.\n- Unit coverage verifies granted exact capability, denied inexact fallback, unsupported targets, explicit settings navigation and display-permission ordering.\n- The settings UI warns when precise access is off and capability changes trigger notification reconciliation.\n- Doze/idle behavior, battery optimisation/vendor restrictions, reboot recovery and physical/emulator timing evidence remain open.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Format all changes
        run: npm run format
      - name: Run repository quality gate
        run: npm run check
      - name: Build Android debug application
        run: npm run android:build
      - name: Commit verified exact-alarm batch
        run: |
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git rm .github/workflows/android-exact-alarm-finalize.yml
          git add -A
          git commit -m 'Verify Android exact alarm strategy [exact-alarm-verified]'
          git push origin HEAD:privacyog/android-exact-alarm-strategy
