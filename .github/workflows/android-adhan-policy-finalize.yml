name: Android Adhan Policy Finalization

on:
  push:
    branches:
      - privacyog/android-adhan-policy

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[adhan-policy-verified]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-adhan-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Wire Android Adhan lifecycle policy
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${path}`);
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }

          replaceExact(
            'src/platform/androidNotificationScheduler.ts',
            `import {\n  applyNotificationSchedulerPlan,`,
            `import { androidAdhanPlaybackPolicy, type AndroidAdhanPlaybackPolicy } from './androidAdhanPolicy';\nimport {\n  applyNotificationSchedulerPlan,`,
          );
          replaceExact(
            'src/platform/androidNotificationScheduler.ts',
            `interface StoredNotificationExtra {\n  readonly namespace: typeof extraNamespace;\n  readonly record: ScheduledNotificationRecord;\n}`,
            `interface StoredNotificationExtra {\n  readonly namespace: typeof extraNamespace;\n  readonly record: ScheduledNotificationRecord;\n  readonly adhanPolicy?: AndroidAdhanPlaybackPolicy;\n}`,
          );
          replaceExact(
            'src/platform/androidNotificationScheduler.ts',
            `    const extra: StoredNotificationExtra = { namespace: extraNamespace, record };`,
            `    const extra: StoredNotificationExtra = {\n      namespace: extraNamespace,\n      record,\n      ...(record.kind === 'adhan'\n        ? { adhanPolicy: androidAdhanPlaybackPolicy('background') }\n        : {}),\n    };`,
          );

          replaceExact(
            'src/i18n/translations.ts',
            `    adhanEnabled: 'Enable Adhan playback',\n    notificationDeliveryPending:`,
            `    adhanEnabled: 'Enable Adhan alert',\n    adhanDeliveryPolicy:\n      'The current Android Adhan option schedules an Adhan-labelled notification alert. It does not auto-play a full Adhan recording in the background or after the app is terminated. User-selected local Adhan audio remains a separate feature.',\n    notificationDeliveryPending:`,
          );
          replaceExact(
            'src/i18n/translations.ts',
            `    adhanEnabled: 'تفعيل تشغيل الأذان',\n    notificationDeliveryPending:`,
            `    adhanEnabled: 'تفعيل تنبيه الأذان',\n    adhanDeliveryPolicy:\n      'خيار الأذان الحالي في أندرويد يجدول تنبيهاً يحمل اسم الأذان. لا يشغّل تسجيلاً كاملاً للأذان تلقائياً في الخلفية أو بعد إغلاق التطبيق. اختيار ملف أذان محلي يبقى ميزة منفصلة.',\n    notificationDeliveryPending:`,
          );
          replaceExact(
            'src/App.tsx',
            `          </div>\n          <AndroidExactAlarmNotice locale={locale} />`,
            `          </div>\n          <p className="setting-help">{translate(locale, 'adhanDeliveryPolicy')}</p>\n          <AndroidExactAlarmNotice locale={locale} />`,
          );

          replaceExact(
            'TODO.md',
            '- [ ] Implement Adhan playback policy compatible with Android lifecycle constraints',
            '- [x] Implement Adhan playback policy compatible with Android lifecycle constraints',
          );
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const marker = '- [x] Implement Adhan playback policy compatible with Android lifecycle constraints';
          const markerIndex = todo.indexOf(marker);
          const insertion = todo.indexOf('\n- [x] Handle notification permission versions correctly', markerIndex);
          if (markerIndex < 0 || insertion < 0) throw new Error('Android Adhan policy tracker anchor missing');
          const note = `\n\n**Android Adhan lifecycle-policy verification note (2026-08-16):** the Android runtime now has an executable Adhan delivery policy that distinguishes foreground, background and terminated lifecycle states. Scheduled Adhan jobs are explicitly notification alerts and persist that policy in SalahOS-owned native notification metadata; unrestricted full-recording auto-play is disabled in every state until a separate supported local-audio implementation exists. English and Arabic settings text now says \"Adhan alert\" rather than promising playback and explains that background/terminated full audio is not implemented. Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate and Capacitor/Gradle Android debug assembly. User-selectable/local Adhan audio remains open in Stage 10 and is not claimed by this item.`;
          todo = todo.slice(0, insertion) + note + todo.slice(insertion);
          fs.writeFileSync('TODO.md', todo);

          replaceExact(
            'docs/ANDROID.md',
            'SalahOS does not request an unrestricted battery-optimisation exemption. Doze, Battery Saver, manufacturer background controls, notification-channel settings and device power state can still delay or suppress presentation even when precise-alarm access is granted. The settings UI states this explicitly in English and Arabic rather than promising guaranteed background delivery. Reboot recovery, Adhan playback and physical/emulator timing evidence remain separately tracked.',
            'SalahOS does not request an unrestricted battery-optimisation exemption. Doze, Battery Saver, manufacturer background controls, notification-channel settings and device power state can still delay or suppress presentation even when precise-alarm access is granted. The settings UI states this explicitly in English and Arabic rather than promising guaranteed background delivery. Reboot recovery and physical/emulator timing evidence remain separately tracked.\n\n## Adhan lifecycle policy\n\nThe current Android Adhan preference schedules an Adhan-labelled local notification at prayer time. The executable platform policy records that scheduled delivery as a notification alert and disables full-recording auto-play for foreground, background and terminated lifecycle states. This avoids treating a local-notification sound as equivalent to reliable full Adhan playback. User-selected/local Adhan audio, audio focus, interruption policy and any future foreground playback implementation remain separate Stage 10 work.',
          );
          replaceExact(
            'docs/NOTIFICATION_LIMITATIONS.md',
            'Reboot recovery, Adhan playback and physical/emulator timing verification remain separately tracked.',
            'Reboot recovery and physical/emulator timing verification remain separately tracked. Android Adhan lifecycle policy is explicit: the current Adhan option is a notification alert, not unrestricted full-recording playback. Full local Adhan audio remains a separate feature and must define audio focus/interruption behavior before implementation.',
          );

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android Adhan lifecycle policy')) {
            testing += `\n\n### 2026-08-16 — Android Adhan lifecycle policy\n\n- Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate and Android debug assembly.\n- Unit coverage locks foreground, background and terminated policy decisions and prevents full-audio auto-play from being implied before a supported local-audio implementation exists.\n- Android Adhan notification metadata records the notification-alert policy for Adhan jobs.\n- English and Arabic settings text describes the current control as an Adhan alert, not full background playback.\n- User-selectable/local audio and audio-focus/interruption behavior remain separate open work.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Android debug assembly
        run: npm run android:build
      - name: Commit verified batch
        run: |
          rm .github/workflows/android-adhan-policy-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Define Android Adhan lifecycle policy [adhan-policy-verified]"
          git push origin HEAD:privacyog/android-adhan-policy
