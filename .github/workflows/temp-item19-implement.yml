name: TEMP Item 19 Night Prayer Implementation

on:
  push:
    branches:
      - v1.5.3/item-19-night-prayer-times
    paths:
      - .github/workflows/temp-item19-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-19-night-prayer-times

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Item 19 changes
        run: python3 scripts/temp-item19-implement.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Item 19 files
        run: >-
          npx prettier --write
          src/domain/nightPrayerPresentation.ts
          src/domain/nightPrayerPresentation.test.ts
          src/platform/settingsStorage.ts
          src/platform/settingsStorage.test.ts
          src/ui/SettingsScreen.tsx
          src/ui/TodayScreen.tsx
          src/ui/TodayNightSection.tsx
          src/ui/TodayNightSection.test.tsx
          src/today-night.css

      - name: Run Item 19 gate
        run: npm run typecheck && npm run lint && npm run test && npm run calendar:check

      - name: Retain clean implementation commit
        shell: bash
        run: |
          rm .github/workflows/temp-item19-implement.yml scripts/temp-item19-implement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Tahajjud and night prayer times"
          echo "ITEM19_RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-19-night-prayer-times
