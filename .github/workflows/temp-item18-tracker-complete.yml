name: TEMP Item 18 Tracker Completion

on:
  push:
    branches:
      - v1.5.3/item-18-tracker-complete
    paths:
      - .github/workflows/temp-item18-tracker-complete.yml

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-18-tracker-complete

      - name: Mark Item 18 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TEMP_TODO_V1.5.3.md')
          text = path.read_text()
          heading = '## Work Item 18 — Consolidate bottom navigation and label overflow'
          next_heading = '\n## Work Item 19 — Wire up Tahajjud, Islamic midnight, and Ishraq'
          start = text.index(heading)
          end = text.index(next_heading, start)
          block = text[start:end]
          if '— COMPLETE' not in block.splitlines()[0]:
              block = block.replace(heading, heading + ' — COMPLETE', 1)
          block = block.replace('- [ ]', '- [x]')
          text = text[:start] + block + text[end:]
          completion = '- Work Item 18: complete via PR #252, merged as `372c2d1c8ceff5bb0dfa8416e1a6a8047759068f`; final head `cd26766d6cf5f26c457f042fd2c58563973f1bbc` passed Quality and Visual Regression, including 320/360/390/430px phone coverage, LTR/RTL, 44px touch targets, equal-width six-destination phone navigation, ellipsis safety, Indonesian `Ilmu`, and 800/1200px sidebar transition acceptance.'
          if completion not in text:
              text = text.rstrip() + '\n' + completion + '\n'
          path.write_text(text)
          PY
          rm .github/workflows/temp-item18-tracker-complete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMP_TODO_V1.5.3.md .github/workflows/temp-item18-tracker-complete.yml
          git commit -m "Mark v1.5.3 Item 18 complete"
          echo "ITEM18_TRACKER_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-18-tracker-complete
