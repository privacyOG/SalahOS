name: Format Raspberry Pi Touch Display Guide

on:
  push:
    branches:
      - agent/rpi-touch-display-docs

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/rpi-touch-display-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/rpi-touch-display-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository policies
        run: npm run security:sensitive-files && npm run security:audit && npm run security:licenses && npm run docs:links && python scripts/generate_pwa_icons.py --check

      - name: Canonicalize guide
        run: npx prettier --write docs/RASPBERRY_PI_TOUCH_DISPLAY_2.md

      - name: Commit formatted guide
        run: |
          if git diff --quiet -- docs/RASPBERRY_PI_TOUCH_DISPLAY_2.md; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add docs/RASPBERRY_PI_TOUCH_DISPLAY_2.md
          git commit -m "style: format Raspberry Pi Touch Display guide"
          git push origin HEAD:agent/rpi-touch-display-docs
