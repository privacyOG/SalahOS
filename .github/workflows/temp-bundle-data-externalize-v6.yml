name: TEMP externalize Australian mosque runtime catalogue v6

on:
  push:
    branches:
      - release/bundle-budget-recovery

permissions:
  contents: write

jobs:
  retain-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/bundle-budget-recovery
          fetch-depth: 0

      - name: Apply the v5 guarded transformation without dependency installation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temp-bundle-data-externalize-v5.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'temp-bundle-data-externalize-v5-retain.py', 'exec'))
          PY

      - name: Retain transformed commit on GitHub
        shell: bash
        run: |
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -A
          git commit -m 'Externalize Australian mosque catalogue from JavaScript bundle'
          echo "RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/bundle-budget-recovery || true
