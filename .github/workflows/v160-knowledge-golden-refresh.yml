name: V1.6.0 Knowledge Golden Refresh

on:
  push:
    branches:
      - v160-knowledge-golden-reconcile

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-golden-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-golden-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-knowledge-golden-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install deterministic Chromium harness
        run: |
          rm -rf /tmp/salahos-golden-harness
          mkdir -p /tmp/salahos-golden-harness
          cd /tmp/salahos-golden-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0 pngjs@7.0.0 pixelmatch@7.1.0
          npx playwright install --with-deps chromium
      - name: Start production fixture
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-golden-http.log 2>&1 &
          echo $! >/tmp/salahos-golden-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('golden fixture server did not become ready')
          PY
      - name: Record deterministic baselines
        env:
          SALAHOS_GOLDEN_RECORD: '1'
        run: node scripts/visual-golden-regression.mjs
      - name: Retain only reviewed Knowledge baseline
        run: |
          git checkout -- tests/golden/today-phone-en-light.png
          test -n "$(git status --short -- tests/golden/knowledge-phone-ar-dark.png)"
          test -z "$(git status --short -- tests/golden/today-phone-en-light.png)"
      - name: Verify both golden scenarios against recorded state
        run: node scripts/visual-golden-regression.mjs
      - name: Publish clean validated Knowledge golden commit
        run: |
          rm .github/workflows/v160-knowledge-golden-refresh.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/golden/knowledge-phone-ar-dark.png .github/workflows/v160-knowledge-golden-refresh.yml
          git commit -m "test(visual): accept V1.6.0 Knowledge golden"
          echo "VALIDATED_KNOWLEDGE_GOLDEN_COMMIT=$(git rev-parse HEAD)"
          git tag -f v160-knowledge-golden-validated
          git push origin refs/tags/v160-knowledge-golden-validated --force
      - name: Stop production fixture
        if: always()
        run: |
          if [ -f /tmp/salahos-golden-server.pid ]; then
            kill "$(cat /tmp/salahos-golden-server.pid)" 2>/dev/null || true
          fi
