name: Probe iOS Simulator capability

on:
  push:
    branches:
      - privacyog/current-ios-release-evidence
    paths:
      - .github/workflows/probe-ios-simulator.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect Xcode and Simulator capability
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes -j
          xcrun simctl list devicetypes -j
          echo '--- simctl help ---'
          xcrun simctl help || true
          echo '--- simctl ui help ---'
          xcrun simctl help ui || true
          echo '--- simctl io help ---'
          xcrun simctl help io || true
