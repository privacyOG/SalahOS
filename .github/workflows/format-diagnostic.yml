name: Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  qiblah-format:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Print canonical Qiblah formatting diff
        run: |
          npx prettier --write src/ui/QiblaFinder.tsx
          git diff -- src/ui/QiblaFinder.tsx
