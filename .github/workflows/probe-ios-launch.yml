name: Probe iOS Simulator launch

on:
  push:
    branches:
      - privacyog/current-ios-release-evidence
    paths:
      - .github/workflows/probe-ios-launch.yml

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production web assets
        run: npm run build

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/SalahOSDerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Resolve Simulator profiles
        id: profiles
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess

          runtimes = json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and r.get('platform') == 'iOS']
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          ios.sort(key=lambda r: tuple(int(x) for x in r['version'].split('.')), reverse=True)
          runtime = ios[0]['identifier']

          types = json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          def choose(preferred, prefix):
              for d in types:
                  if d['name'] == preferred:
                      return d['identifier']
              for d in types:
                  if d['name'].startswith(prefix):
                      return d['identifier']
              raise SystemExit(f'No {prefix} Simulator device type')

          print(f'runtime={runtime}')
          print(f'iphone={choose("iPhone 17 Pro", "iPhone")}')
          print(f'ipad={choose("iPad Pro 13-inch (M5)", "iPad")}')
          PY

      - name: Install, launch and relaunch on iPhone and iPad
        env:
          RUNTIME: ${{ steps.profiles.outputs.runtime }}
          IPHONE_TYPE: ${{ steps.profiles.outputs.iphone }}
          IPAD_TYPE: ${{ steps.profiles.outputs.ipad }}
          BUNDLE_ID: io.github.privacyog.salahos
          EVIDENCE_DIR: ${{ runner.temp }}/ios-simulator-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          CREATED_UDIDS=()
          cleanup() {
            for udid in "${CREATED_UDIDS[@]}"; do
              xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
              xcrun simctl delete "$udid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          verify_launch() {
            local output="$1"
            local pid
            echo "$output"
            pid="${output##*: }"
            [[ "$output" == "$BUNDLE_ID:"* ]]
            [[ "$pid" =~ ^[0-9]+$ ]]
          }

          capture() {
            local udid="$1"
            local target="$2"
            local width height
            xcrun simctl io "$udid" screenshot --type=png "$target"
            test -s "$target"
            file "$target"
            width="$(sips -g pixelWidth "$target" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$target" | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$width" -gt 0 ]]
            [[ "$height" =~ ^[0-9]+$ && "$height" -gt 0 ]]
            echo "Screenshot ${width}x${height}: $target"
          }

          exercise() {
            local profile="$1"
            local device_type="$2"
            local appearance="$3"
            local name="SalahOS-${profile}-${GITHUB_RUN_ID}"
            local udid launch_output
            udid="$(xcrun simctl create "$name" "$device_type" "$RUNTIME")"
            CREATED_UDIDS+=("$udid")
            echo "$profile UDID: $udid"

            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl get_app_container "$udid" "$BUNDLE_ID" app

            launch_output="$(xcrun simctl launch "$udid" "$BUNDLE_ID")"
            verify_launch "$launch_output"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-launch.png"

            xcrun simctl terminate "$udid" "$BUNDLE_ID"
            launch_output="$(xcrun simctl launch "$udid" "$BUNDLE_ID")"
            verify_launch "$launch_output"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-relaunch.png"
          }

          exercise iphone "$IPHONE_TYPE" light
          exercise ipad "$IPAD_TYPE" dark
          ls -lh "$EVIDENCE_DIR"

      - name: Upload launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-launch-probe-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          retention-days: 7
