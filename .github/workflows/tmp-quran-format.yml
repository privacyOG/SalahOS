name: Temporary Qur'an format

on:
  push:
    branches:
      - quran-mutashabih-final-reconcile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quran-mutashabih-final-reconcile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed Qur'an files
        run: |
          npx prettier --write \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/data/quran-salahos-2026-source.json \
            src/domain/quranEditorialPolicy.test.ts \
            src/domain/quranSalahos2026.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/data/quran-salahos-2026-source.json \
            src/domain/quranEditorialPolicy.test.ts \
            src/domain/quranSalahos2026.test.ts
          git commit -m "chore: format Quran audit files"
          git push origin HEAD:quran-mutashabih-final-reconcile
