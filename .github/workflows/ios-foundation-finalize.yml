name: iOS Foundation Finalization

on:
  push:
    branches:
      - privacyog/ios-native-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/ios-native-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate and configure iOS shell
        run: |
          npm install --save-exact @capacitor/ios@8.4.2
          npm run build
          npx cap add ios
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string SalahOS uses your location only when you ask it to calculate prayer times for your current position." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string SalahOS uses your location only when you ask it to calculate prayer times for your current position." ios/App/App/Info.plist
          npx cap sync ios
      - name: Verify iOS privacy configuration
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/App/App/Info.plist | grep -F "SalahOS uses your location only when you ask it to calculate prayer times for your current position."
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" ios/App/App/Info.plist | grep -F "SalahOS uses your location only when you ask it to calculate prayer times for your current position."
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist >/tmp/background-modes 2>/dev/null && grep -q "location" /tmp/background-modes; then
            echo "Unexpected background location mode" >&2
            exit 1
          fi
          grep -q "@capacitor/ios.*8.4.2" package-lock.json
      - name: Repository quality gate
        run: npm run check
      - name: Build iOS simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Record verified foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          todo = Path('TODO.md')
          text = todo.read_text()
          replacements = {
            '- [ ] Configure iOS project/shell': '- [x] Configure iOS project/shell',
            '- [ ] Implement location permission descriptions and flow': '- [x] Implement location permission descriptions and flow',
            '- [ ] Implement persistent settings/storage': '- [x] Implement persistent settings/storage',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing TODO item: {old}')
            text = text.replace(old, new, 1)
          anchor = '- [x] Implement persistent settings/storage\n'
          note = '''\n**iOS native-foundation verification note (2026-08-16):** macOS validation run `31941000000` generated and synchronised the committed Capacitor iOS shell with `@capacitor/ios` pinned to the same 8.4.2 runtime line as the existing core/Android packages, added both Apple-required location privacy descriptions without enabling background-location mode, and built the `App` scheme for a generic iOS Simulator with code signing disabled. The shared one-shot native geolocation adapter checks/requests Capacitor location permission and retains only latitude/longitude, while the existing native Preferences-backed application storage is platform-neutral and hydrates settings, saved locations and mosque timetables before React mounts. Actual simulator permission-prompt interaction, offline launch, notification delivery and iPhone/iPad layout acceptance remain separate open items.\n'''
          text = text.replace(anchor, anchor + note, 1)
          todo.write_text(text)

          docs = Path('docs/IOS_VALIDATION_STATUS.md')
          d = docs.read_text()
          d += '''\n\n## Native foundation validation — 2026-08-16\n\nThe committed iOS shell is generated from the shared SalahOS web application and uses the same `com.privacyog.salahos` application identifier. The iOS target includes `NSLocationWhenInUseUsageDescription` and `NSLocationAlwaysAndWhenInUseUsageDescription` as required by the installed geolocation bridge, does not enable background location, and builds for an iOS Simulator with code signing disabled. The shared native Preferences adapter provides the same versioned settings, saved-location and mosque-library storage contract used on Android. Simulator/device interaction remains separately tracked.\n'''
          docs.write_text(d)

          testing = Path('TESTING.md')
          t = testing.read_text()
          t += '''\n\n## iOS native foundation — 2026-08-16\n\nThe macOS validation workflow installs the pinned iOS runtime, generates/synchronises the native project, asserts both required location usage-description keys, rejects accidental background-location mode, runs the complete repository quality gate, and compiles the `App` scheme for a generic iOS Simulator with `CODE_SIGNING_ALLOWED=NO`. This validates project generation, privacy metadata and compilation only; interactive simulator/device acceptance remains separately open.\n'''
          testing.write_text(t)
          PY
          # Replace the placeholder with this run's immutable Actions run id.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('TODO.md')
          p.write_text(p.read_text().replace('31941000000', os.environ['GITHUB_RUN_ID']))
          PY
      - name: Format evidence updates
        run: npm run format
      - name: Re-run repository quality gate
        run: npm run check
      - name: Commit verified iOS foundation
        run: |
          rm .github/workflows/ios-foundation-finalize.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify iOS native foundation [ios-foundation-verified]"
          git push origin HEAD:privacyog/ios-native-foundation
