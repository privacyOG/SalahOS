name: Stage 23.6 Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  clean-stage-23-6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Correct Scenic shell height and format sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/scenic-spiritual.css')
          text = path.read_text()
          old = '  height: 100dvh;\n  min-height: 100vh;'
          new = '  height: calc(100dvh - clamp(2rem, 5vw, 4.5rem));\n  min-height: calc(100vh - clamp(2rem, 5vw, 4.5rem));'
          if old not in text and new not in text:
              raise SystemExit('Expected Scenic shell-height block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx
          npx prettier --check \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'Stage 23.6 sources already corrected and canonical.'
            exit 0
          fi
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add \
            package.json \
            public/artwork/scenic-spiritual.svg \
            scripts/visual-scenic-spiritual.mjs \
            src/scenic-spiritual.css \
            src/ui/ScenicSpiritualPrayerBoard.tsx \
            src/ui/ScenicSpiritualPrayerBoard.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/SmartDisplay.test.tsx
          git commit -m 'Correct and canonicalize Scenic Spiritual display'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
