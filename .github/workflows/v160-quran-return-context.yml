name: V1.6.0 Quran Return Context Fix

on:
  push:
    branches:
      - v160-quran-reader-ux-validated

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-quran-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-quran-reader-ux-validated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply return-context transform
        run: python3 scripts/apply-v160-quran-return-context.py
      - name: Verify source contract
        run: |
          npx prettier --write src/ui/QuranOfflineReader.tsx src/ui/QuranReaderUxV160.test.ts
          npm run lint
          npm run typecheck
          npx vitest run src/ui/QuranReaderUxV160.test.ts src/platform/quranReadingPreferences.test.ts src/domain/quranOfflineLibrary.test.ts
          npm run build
      - name: Install isolated Chromium harness
        run: |
          rm -rf /tmp/salahos-quran-harness
          mkdir -p /tmp/salahos-quran-harness
          cd /tmp/salahos-quran-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start production fixture
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-quran-http.log 2>&1 &
          echo $! >/tmp/salahos-quran-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Quran fixture server did not become ready')
          PY
      - name: Verify complete Quran rendered flow
        run: node scripts/visual-quran-offline-reader.mjs
      - name: Publish clean validated commit
        run: |
          rm .github/workflows/v160-quran-return-context.yml scripts/apply-v160-quran-return-context.py
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/QuranOfflineReader.tsx src/ui/QuranReaderUxV160.test.ts .github/workflows/v160-quran-return-context.yml scripts/apply-v160-quran-return-context.py
          git commit -m "fix(quran): preserve related-ayah search return context"
          echo "VALIDATED_QURAN_CONTEXT_COMMIT=$(git rev-parse HEAD)"
          git tag -f v160-quran-return-context-validated
          git push origin refs/tags/v160-quran-return-context-validated --force
      - name: Stop production fixture
        if: always()
        run: |
          if [ -f /tmp/salahos-quran-server.pid ]; then
            kill "$(cat /tmp/salahos-quran-server.pid)" 2>/dev/null || true
          fi
