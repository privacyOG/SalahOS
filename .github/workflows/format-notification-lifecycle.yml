name: Format notification lifecycle test

on:
  push:
    branches:
      - privacyog/notification-delivery-latest
    paths:
      - .github/workflows/format-notification-lifecycle.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/notification-delivery-latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical format
        run: npx prettier --write src/integration/notificationDeliveryLifecycle.test.ts
      - name: Commit canonical output
        run: |
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/integration/notificationDeliveryLifecycle.test.ts
          if git diff --cached --quiet; then
            echo 'Formatter made no changes.'
            exit 0
          fi
          git commit -m 'Apply canonical formatting to notification lifecycle tests'
          git push origin HEAD:privacyog/notification-delivery-latest
