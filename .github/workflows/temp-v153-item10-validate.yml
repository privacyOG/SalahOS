name: Temporary v1.5.3 Item 10 Validation

on:
  push:
    branches:
      - v1.5.3-work-item-10

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[item10-validate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Item 10 implementation
        run: python3 scripts/temp-implement-v153-item10.py
      - name: Format changed files
        run: npx prettier src/ui/TodayScreen.tsx src/ui/SelectedMosqueLocationStateV153.test.ts src/today-screen.css TEMP_TODO_V1.5.3.md --write
      - name: Required Item 10 gate
        run: npm run ui:theme-contrast && npm run ui:theme-architecture && npm run ui:design-system-ownership
      - name: Targeted source and type validation
        run: npm run typecheck && npx vitest run src/ui/SelectedMosqueLocationStateV153.test.ts
      - name: Build and bundle regression
        run: npm run build && npm run bundle:size
      - name: Publish validated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TEMP_TODO_V1.5.3.md src/ui/TodayScreen.tsx src/ui/SelectedMosqueLocationStateV153.test.ts src/today-screen.css
          git commit -m '[item10-validated] style selected mosque location state'
          git tag -f temp-v153-item10-validated
          git push --force origin refs/tags/temp-v153-item10-validated
