name: Prepare SalahOS v1 release metadata

on:
  push:
    branches:
      - privacyog/v1.0.0-release-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: privacyog/v1.0.0-release-prep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare release files
        run: node scripts/prepare-v1-release.mjs

      - name: Format release files
        run: npx prettier --write package.json package-lock.json CHANGELOG.md RELEASE_NOTES.md README.md TODO.md docs/PLATFORM_STATUS.md

      - name: Validate release diff
        run: |
          set -euo pipefail
          git diff --check
          grep -F '"version": "1.0.0"' package.json
          grep -F 'versionName "1.0.0"' android/app/build.gradle
          test "$(grep -c 'MARKETING_VERSION = 1.0.0;' ios/App/App.xcodeproj/project.pbxproj)" -eq 2
          grep -F '# SalahOS v1.0.0 release notes' RELEASE_NOTES.md

      - name: Commit release preparation and remove helpers
        env:
          BRANCH: privacyog/v1.0.0-release-prep
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          rm -f scripts/prepare-v1-release.mjs .github/workflows/prepare-v1-release.yml
          git add -A
          git diff --cached --check
          git commit -m 'Prepare SalahOS v1.0.0 production release'
          git push origin "HEAD:$BRANCH"
