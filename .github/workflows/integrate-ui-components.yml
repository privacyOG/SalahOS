name: Integrate UI Components

on:
  push:
    branches:
      - agent/ui-component-tests

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/ui-component-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ui-component-tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Documentation link verification
        run: npm run docs:links

      - name: PWA raster icon reproducibility
        run: python scripts/generate_pwa_icons.py --check

      - name: Integrate UI components
        run: python scripts/integrate_ui_components.py

      - name: Canonicalize UI files
        run: npx prettier --write src/App.tsx src/ui/PrayerCard.tsx src/ui/PrayerCard.test.tsx src/ui/NextPrayerBlock.tsx src/ui/NextPrayerBlock.test.tsx

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify deployable web artifact
        run: npm run verify:web-build

      - name: Commit integrated UI components
        run: |
          if git diff --quiet -- src/App.tsx src/ui; then
            echo "No UI integration changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/App.tsx src/ui
          git commit -m "refactor: test prayer presentation components"
          git push origin HEAD:agent/ui-component-tests
