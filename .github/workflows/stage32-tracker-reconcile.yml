name: Stage 32 tracker reconciliation

on:
  push:
    branches:
      - 'stage-32/taraweeh-timetable'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-32/taraweeh-timetable
          fetch-depth: 0

      - name: Mark Taraweeh roadmap item complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TODO.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] Taraweeh timetable support'
          new = '- [x] Taraweeh timetable support'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one open Taraweeh roadmap item')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/stage32-tracker-reconcile.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md
          git commit -m "Mark Stage 32 Taraweeh roadmap complete"
          git push origin HEAD:stage-32/taraweeh-timetable
