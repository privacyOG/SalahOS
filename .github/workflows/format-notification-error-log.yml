name: Format Notification Error Log

on:
  push:
    branches:
      - agent/android-local-notifications

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/android-local-notifications'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-local-notifications
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/platform/errorLog.ts src/platform/errorLog.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/platform/errorLog.ts src/platform/errorLog.test.ts; then
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/platform/errorLog.ts src/platform/errorLog.test.ts
          git commit -m "style: format notification error logging"
          git push origin HEAD:agent/android-local-notifications
