name: Android Release Evidence Finalization

on:
  push:
    branches:
      - privacyog/android-release-latest

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-release-latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Record passed release evidence
        env:
          VALIDATION_RUN: '31941241775'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const before = '- [ ] Build signed/release-ready configuration without committing secrets';
          const after = '- [x] Build signed/release-ready configuration without committing secrets';
          if (!todo.includes(before)) throw new Error('Android release tracker marker missing');
          todo = todo.replace(before, after);
          const note = `\n\n**Android release-configuration verification note (2026-08-16):** validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate, Android debug assembly with reboot-restoration verification, unsigned \`assembleRelease\`, and the negative test proving partial signing configuration is rejected. Release signing activates only when all four external \`SALAHOS_ANDROID_KEYSTORE_PATH\`, \`SALAHOS_ANDROID_KEYSTORE_PASSWORD\`, \`SALAHOS_ANDROID_KEY_ALIAS\` and \`SALAHOS_ANDROID_KEY_PASSWORD\` values are supplied; no keystore or signing credential is committed. This validates the release-ready signing path without claiming a production distribution key was present in CI.`;
          todo = todo.replace(after, after + note);
          fs.writeFileSync('TODO.md', todo);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('## Android release configuration — 2026-08-16')) {
            testing += `\n\n## Android release configuration — 2026-08-16\n\nValidation run \`${process.env.VALIDATION_RUN}\` passed the complete repository gate, debug build/reboot verifier, unsigned release assembly, and a negative partial-signing test. The release Gradle configuration remains unsigned when no external secrets are supplied and switches to the external signing config only when every required value is present.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          if (!android.includes('## Release signing')) {
            android += `\n\n## Release signing\n\nRepository validation can assemble the release variant without a signing key. A distributable signed build requires all four values through the local environment or an encrypted CI secret store: \`SALAHOS_ANDROID_KEYSTORE_PATH\`, \`SALAHOS_ANDROID_KEYSTORE_PASSWORD\`, \`SALAHOS_ANDROID_KEY_ALIAS\`, and \`SALAHOS_ANDROID_KEY_PASSWORD\`. Partial signing configuration fails closed. Keystores and credentials must remain outside the repository. Run \`npm run android:release-check\` to synchronize the shared application and assemble the release variant.\n`;
          }
          fs.writeFileSync('docs/ANDROID.md', android);
          NODE
      - name: Format authored changes
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Commit verified release configuration
        run: |
          rm .github/workflows/android-release-evidence-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify Android release configuration [release-latest-verified]"
          git push origin HEAD:privacyog/android-release-latest
