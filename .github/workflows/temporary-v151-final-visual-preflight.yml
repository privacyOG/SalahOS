name: Temporary v1.5.1 final visual preflight

on:
  push:
    branches:
      - utility/v151-final-visual-preflight
    paths:
      - .github/workflows/temporary-v151-final-visual-preflight.yml

permissions:
  contents: read

jobs:
  visual-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-visual-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --ignore-scripts
      - name: Verify formatting, lint and types
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Build production application
        run: npm run build
      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact \
            playwright@1.62.0 \
            axe-core@4.10.3 \
            pngjs@7.0.0 \
            pixelmatch@7.1.0
          npm audit --audit-level=moderate
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local SalahOS production server did not become ready')
          PY
      - name: Diagnose Today render readiness
        run: node scripts/visual-today-smoke.mjs
      - name: Run full visual regression matrix
        run: npm run visual:check
      - name: Run v1.5 real-world accessibility acceptance
        run: node scripts/visual-real-world-verification-v15.mjs
      - name: Rebuild Google satellite Qibla fixture
        env:
          VITE_GOOGLE_MAPS_API_KEY: salahos-visual-fixture-key
        run: npm run build
      - name: Run Google satellite Qibla fixture
        run: node scripts/visual-qibla-google.mjs
      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-server.pid)" 2>/dev/null || true
          fi
