name: Temporary Fix Mosque Lint

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

concurrency:
  group: temporary-fix-mosque-lint
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Narrow source array safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domain/australianMosqueDirectoryCombined.ts')
          text = path.read_text()
          old = "const sources = Array.isArray(value.source.sources) ? value.source.sources : [];"
          new = "const sources = Array.isArray(value.source.sources) ? value.source.sources.map((entry: unknown) => entry) : [];"
          if old not in text:
              raise SystemExit('Expected source-array expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/domain/australianMosqueDirectoryCombined.ts

      - name: Verify lint, typecheck and directory snapshots
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          node scripts/generate-australian-mosque-finder.mjs
          node scripts/generate-australian-mosque-combined.mjs --check

      - name: Stage canonical lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add src/domain/australianMosqueDirectoryCombined.ts
          git rm .github/workflows/temporary-fix-mosque-lint.yml
          git commit -m 'fix: type-safe mosque directory source parsing'
          echo "LINT_FIXED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:data/australia-mosque-finder
