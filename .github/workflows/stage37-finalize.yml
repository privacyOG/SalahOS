name: Stage 37 finalize

on:
  push:
    branches:
      - 'stage-37/home-assistant-integration'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-37/home-assistant-integration
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Apply canonical formatting
        run: npm run format
      - name: Compile Home Assistant Python package
        run: python3 -m compileall -q integrations/home-assistant
      - name: Mark Stage 37 complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TODO.md')
          text = path.read_text()
          old = '- [ ] Home Assistant integration'
          new = '- [x] Home Assistant integration'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Home Assistant roadmap row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit verified Stage 37 result
        run: |
          rm .github/workflows/stage37-preflight.yml .github/workflows/stage37-finalize.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- TODO.md docs/HOME_ASSISTANT.md integrations/home-assistant scripts/home-assistant-integration.test.mjs .github/workflows/stage37-preflight.yml .github/workflows/stage37-finalize.yml
          git commit -m 'Finalize Stage 37 Home Assistant integration'
          git push origin HEAD:stage-37/home-assistant-integration
