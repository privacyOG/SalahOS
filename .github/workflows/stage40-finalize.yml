name: Stage 40 finalize

on:
  push:
    branches:
      - 'stage-40/wearable-companion-exploration'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-40/wearable-companion-exploration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Mark wearable exploration complete
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TODO.md')
          text = path.read_text()
          old = '- [ ] Wearable/watch companion exploration'
          new = '- [x] Wearable/watch companion exploration'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one wearable exploration TODO marker')
          path.write_text(text.replace(old, new))
          PY

      - name: Canonical formatting
        run: |
          npx prettier --write \
            .github/workflows/stage40-finalize.yml \
            docs/WATCH_COMPANION_EXPLORATION.md \
            src/domain/wearableCompanion.ts \
            src/domain/wearableCompanion.test.ts

      - name: Full repository check
        run: npm run check

      - name: Commit verified Stage 40 source
        run: |
          set -euo pipefail
          rm .github/workflows/stage40-finalize.yml
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add \
            TODO.md \
            docs/WATCH_COMPANION_EXPLORATION.md \
            src/domain/wearableCompanion.ts \
            src/domain/wearableCompanion.test.ts \
            .github/workflows/stage40-finalize.yml
          git commit -m 'Finalize wearable companion exploration'
          git push origin HEAD:stage-40/wearable-companion-exploration
