name: Android Storage Finalization

on:
  push:
    branches:
      - privacyog/android-native-preferences

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-native-preferences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize documentation and tracker
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${path}`);
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }

          replaceExact(
            'TODO.md',
            '- [ ] Implement persistent settings/storage',
            '- [x] Implement persistent settings/storage',
          );

          const notificationMarker = '**Android local-notification verification note (2026-08-16):**';
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const markerIndex = todo.indexOf(notificationMarker);
          if (markerIndex < 0) throw new Error('Android notification marker missing');
          const insertionPoint = todo.indexOf('\n\n- [ ] Test offline cold start', markerIndex);
          if (insertionPoint < 0) throw new Error('Android storage insertion point missing');
          const storageNote = `\n\n**Android persistent-storage verification note (2026-08-16):** Android now hydrates the existing versioned settings, saved-location and mosque-library stores from native preferences before the React application mounts, then preserves the existing synchronous validated storage contracts through an ordered write-through cache. Browser/PWA targets continue to use browser local storage. Native writes are requested to flush when the document is hidden or the page is being left, while the cached value is updated immediately for same-session reads. Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate, 62 test files / 284 tests, production Web/PWA build verification and a Capacitor Android sync plus Gradle \`assembleDebug\` with the native preferences plugin present. The repository tests cover hydration, ordered writes, removal and isolation from unrelated preference keys. Uninstall/app-data clearing, backup/restore and physical/emulator cold-start lifecycle evidence remain open and are not claimed by this item.`;
          todo = todo.slice(0, insertionPoint) + storageNote + todo.slice(insertionPoint);
          fs.writeFileSync('TODO.md', todo);

          const androidBefore = `## Persistent settings\n\nThe current native shell reuses the shared local settings/storage path inside the app WebView. Device-level persistence across uninstall/reinstall, OS data clearing, storage migration and backup/restore is not implied by repository tests and should be validated separately before release claims are made.`;
          const androidAfter = `## Persistent settings\n\nAndroid hydrates SalahOS settings, saved locations and the mosque library from the Capacitor Preferences bridge before the React application mounts. The bridge uses the existing validated/versioned storage schemas, exposes their synchronous key/value contract through an in-memory cache, and serializes native writes in order so application code does not need a second Android-specific settings model. Browser/PWA builds continue to use browser local storage.\n\nA hide/page-leave lifecycle event requests completion of queued native writes. Clearing application data or uninstalling the app can remove locally stored preferences; backup/restore behavior and physical/emulator cold-start persistence remain device-level acceptance items and are not implied by repository tests.`;
          replaceExact('docs/ANDROID.md', androidBefore, androidAfter);

          const testingEntry = `\n\n### 2026-08-16 — Android native persistent storage\n\n- Validation run \`${process.env.VALIDATION_RUN}\` passed the complete quality gate, 62 test files / 284 tests, production build verification and Android debug assembly.\n- Android startup hydrates versioned settings, saved locations and the mosque library from native preferences before the application renders.\n- The native adapter retains the shared synchronous storage interface through a hydrated cache and ordered write-through queue; tests cover hydration, ordered writes, removal and isolation from unrelated preference keys.\n- Browser/PWA storage behavior is unchanged. Android uninstall/app-data clearing, backup/restore and physical/emulator cold-start lifecycle validation remain open.\n`;
          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android native persistent storage')) {
            testing += testingEntry;
          }
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Format
        run: npm run format
      - name: Run quality gate
        run: npm run check
      - name: Build Android debug application
        run: npm run android:build
      - name: Commit verified finalization
        run: |
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git rm .github/workflows/android-storage-finalize.yml
          git add TODO.md TESTING.md docs/ANDROID.md
          git commit -m 'Verify Android persistent settings storage'
          git push origin HEAD:privacyog/android-native-preferences
