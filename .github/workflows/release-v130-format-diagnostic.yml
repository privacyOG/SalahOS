name: v1.3.0 Published Release Observer

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify published release metadata and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view v1.3.0 \
            --repo privacyOG/SalahOS \
            --json tagName,targetCommitish,name,isDraft,isPrerelease,publishedAt,url,assets)"
          printf '%s\n' "$RELEASE_JSON" | jq .

          [[ "$(jq -r '.tagName' <<< "$RELEASE_JSON")" == 'v1.3.0' ]]
          [[ "$(jq -r '.targetCommitish' <<< "$RELEASE_JSON")" == '617cb4551e80bc1def088c0062f79efe0a573e31' ]]
          [[ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")" == 'false' ]]

          EXPECTED="$(printf '%s\n' \
            'SalahOS-v1.3.0-android.aab' \
            'SalahOS-v1.3.0-android.apk' \
            'SalahOS-v1.3.0-raspberry-pi-kiosk.tar.gz' \
            'SalahOS-v1.3.0-web-pwa.zip' \
            'SHA256SUMS.txt' | sort)"
          ACTUAL="$(jq -r '.assets[].name' <<< "$RELEASE_JSON" | sort)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo 'Published release asset set is not exact.' >&2
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          }

          mkdir release-v1.3.0
          cd release-v1.3.0
          gh release download v1.3.0 \
            --repo privacyOG/SalahOS \
            --pattern 'SalahOS-v1.3.0-*' \
            --pattern 'SHA256SUMS.txt'
          sha256sum --check SHA256SUMS.txt

          DOWNLOADED="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$DOWNLOADED" == "$EXPECTED" ]] || {
            echo 'Downloaded published release asset set is not exact.' >&2
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$DOWNLOADED") || true
            exit 1
          }
          echo 'Published v1.3.0 assets and checksums verified.'
          sha256sum SalahOS-v1.3.0-* SHA256SUMS.txt
