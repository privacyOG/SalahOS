name: Temporary Mosque Finder Publish

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

concurrency:
  group: temporary-mosque-finder-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply audited dedup patch
        run: python3 scripts/temporary-patch-australian-mosque-dedup.py

      - name: Retrieve Finder snapshot
        run: node scripts/generate-australian-mosque-finder.mjs --fetch

      - name: Validate Finder snapshot
        run: node scripts/generate-australian-mosque-finder.mjs

      - name: Generate combined snapshot
        run: node scripts/generate-australian-mosque-combined.mjs

      - name: Validate combined snapshot
        run: node scripts/generate-australian-mosque-combined.mjs --check

      - name: Commit audited snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/generate-australian-mosque-finder.mjs \
            scripts/generate-australian-mosque-combined.mjs \
            src/data/australian-mosque-finder.json \
            src/data/australian-mosques-combined.json
          git commit -m 'data: finalize deduplicated Australian mosque directory'
          echo "AUDITED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:data/australia-mosque-finder
