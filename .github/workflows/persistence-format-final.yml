name: Persistence Final Format

on:
  push:
    branches:
      - privacyog/android-native-preferences

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[final-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-native-preferences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Commit formatter output
        run: |
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git rm .github/workflows/persistence-format-final.yml
          git add -A
          git commit -m 'Finalize repository formatting [final-format]'
          git push origin HEAD:privacyog/android-native-preferences
