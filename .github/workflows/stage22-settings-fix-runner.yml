name: Stage 22 Settings Fix Runner

on:
  push:
    branches:
      - stage-22/settings-fix-runner

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2-completion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove stale mosque import guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual = Path('scripts/visual-regression.mjs')
          text = visual.read_text()
          old = """      '.notification-fieldset',
                '.settings-transfer',
              ],
            },
            {
              name: 'tablet-settings-advanced-ar-dark',
          """
          new = """      '.notification-fieldset',
                '.settings-transfer',
                \".settings-screen__legacy[data-settings-category='mosque'] .settings-panel > .inline-message\",
              ],
            },
            {
              name: 'tablet-settings-advanced-ar-dark',
          """
          assert old in text
          visual.write_text(text.replace(old, new, 1))

          styles = Path('src/settings-screen.css')
          text = styles.read_text()
          old = """.settings-screen__legacy[data-settings-category='mosque'] .settings-transfer,
          .settings-screen__legacy[data-settings-category='mosque'] .manual-mosque-fieldset,
          """
          new = """.settings-screen__legacy[data-settings-category='mosque'] .settings-transfer,
          .settings-screen__legacy[data-settings-category='mosque'] .settings-panel > .inline-message,
          .settings-screen__legacy[data-settings-category='mosque'] .manual-mosque-fieldset,
          """
          assert old in text
          styles.write_text(text.replace(old, new, 1))
          PY

          npx prettier --write scripts/visual-regression.mjs src/settings-screen.css
          npm run format:check

      - name: Commit target changes
        run: |
          printf '%s\n' 'Stage 22.6 human-review cleanup applied and formatted.' > .stage22-settings-fix-ready
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -- \
            .stage22-settings-fix-ready \
            scripts/visual-regression.mjs \
            src/settings-screen.css
          git diff --cached --check
          git commit -m 'Hide stale mosque import guidance'
          git push origin HEAD:stage-22/settings-v2-completion
