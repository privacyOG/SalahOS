name: Stage 22 Settings Fix Runner

on:
  push:
    branches:
      - stage-22/settings-fix-runner

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2-completion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Stage 22.6 cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual = Path('scripts/visual-regression.mjs')
          text = visual.read_text()
          old = "visibleSelectors: ['.mosque-library-row', '.settings-screen__seasonal'],"
          assert old in text
          visual.write_text(text.replace(old, "visibleSelectors: ['.mosque-library-row'],", 1))

          settings = Path('src/ui/SettingsScreen.tsx')
          text = settings.read_text()
          old = "          <p>{copy.displayDescription}</p>\n"
          assert old in text
          settings.write_text(text.replace(old, '', 1))

          styles = Path('src/settings-screen.css')
          text = styles.read_text()
          old = """.settings-display-entry p {
            max-width: 62ch;
            margin: 0;
            color: var(--salah-fg-secondary);
          }

          """
          assert old in text
          styles.write_text(text.replace(old, '', 1))
          PY

          npx prettier --write \
            scripts/visual-regression.mjs \
            src/settings-screen.css \
            src/ui/SettingsScreen.tsx \
            src/ui/SettingsProgressiveDisclosureV2.test.ts
          npm run format:check

      - name: Commit target changes
        run: |
          printf '%s\n' 'Stage 22.6 settings cleanup applied and formatted.' > .stage22-settings-fix-ready
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -- \
            .stage22-settings-fix-ready \
            scripts/visual-regression.mjs \
            src/settings-screen.css \
            src/ui/SettingsScreen.tsx \
            src/ui/SettingsProgressiveDisclosureV2.test.ts
          git diff --cached --check
          git commit -m 'Finish Stage 22.6 settings disclosure cleanup'
          git push origin HEAD:stage-22/settings-v2-completion
