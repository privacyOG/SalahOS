name: Temporary v1.5.3 Item 8 Cleanup

on:
  push:
    branches:
      - v1.5.3-work-item-8

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[item8-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-8
      - name: Delete temporary finalization tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git :refs/tags/temp-v153-item8-finalized
