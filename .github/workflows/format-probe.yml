name: Format Probe

on:
  push:
    branches:
      - stage-23/mosque-following

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Print Prettier diff
        run: |
          npx prettier --write src/domain/mosqueFollowing.ts src/domain/mosqueFollowing.test.ts
          git diff -- src/domain/mosqueFollowing.ts src/domain/mosqueFollowing.test.ts
