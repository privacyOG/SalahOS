name: Temporary Item 12 formatter

on:
  push:
    branches:
      - v1.5.3/item-12-prayer-setup-onboarding
    paths:
      - .github/workflows/temp-item12-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Item 12 branch
        uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-12-prayer-setup-onboarding

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier --write src/ui/PrayerSetupOnboarding.tsx
          git --no-pager diff -- src/ui/PrayerSetupOnboarding.tsx
