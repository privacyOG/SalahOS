name: Stage 47 Australian Mosque Bootstrap

on:
  push:
    branches:
      - stage-47/v1.4-australian-mosque-directory
    paths:
      - scripts/generate-australian-mosque-directory.mjs
      - .github/workflows/stage47-bootstrap-australian-mosques.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-australian-mosque-directory.mjs
      - .github/workflows/stage47-bootstrap-australian-mosques.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-47/v1.4-australian-mosque-directory

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Fetch and generate Australian mosque directory
        run: |
          if [ ! -f data/osm/australian-muslim-places-of-worship.overpass.json ] || [ ! -f src/data/australian-mosques.json ]; then
            node scripts/generate-australian-mosque-directory.mjs --fetch
          fi
          npx prettier --write scripts/generate-australian-mosque-directory.mjs

      - name: Upload bootstrap snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage47-australian-mosque-bootstrap
          path: |
            data/osm/australian-muslim-places-of-worship.overpass.json
            src/data/australian-mosques.json
            scripts/generate-australian-mosque-directory.mjs
          if-no-files-found: error
          retention-days: 7
