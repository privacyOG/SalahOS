name: Iqamah Settings Integration

on:
  push:
    branches:
      - agent/iqamah-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/iqamah-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/iqamah-settings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Apply Iqamah settings integration
        run: python scripts/apply_iqamah_settings.py

      - name: Canonicalize changed files
        run: npx prettier --write src/App.tsx src/i18n/translations.ts

      - name: Commit Iqamah settings integration
        run: |
          if git diff --quiet -- src/App.tsx src/i18n/translations.ts; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/App.tsx src/i18n/translations.ts
          git commit -m "feat: add Iqamah settings controls"
          git push origin HEAD:agent/iqamah-settings
