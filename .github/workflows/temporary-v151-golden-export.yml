name: Temporary v1.5.1 Golden Export

on:
  push:
    branches:
      - utility/v151-golden-baseline

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Download failed visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9708943812/zip" > /tmp/visual.zip
          mkdir -p /tmp/visual
          unzip -q /tmp/visual.zip -d /tmp/visual
          test -s /tmp/visual/golden-today-phone-en-light-actual.png

      - name: Create repository blob for accepted golden
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 /tmp/visual/golden-today-phone-en-light-actual.png \
            | jq -Rs '{content: ., encoding: "base64"}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha \
            > golden-blob-sha.txt
          test -s golden-blob-sha.txt
          printf 'Golden blob SHA: '
          cat golden-blob-sha.txt

      - name: Upload blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: v151-golden-blob-sha
          path: golden-blob-sha.txt
          if-no-files-found: error
          retention-days: 1
