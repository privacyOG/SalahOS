name: Temporary PR formatter

on:
  push:
    branches:
      - quran-mutashabih-comprehensive-tawil

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quran-mutashabih-comprehensive-tawil
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed Qur'an audit files
        run: |
          npx prettier --write \
            docs/quran-editorial-policy-v1.6.0.md \
            docs/quran-salahos-2026-policy.md \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/data/quran-salahos-2026-source.json \
            src/domain/quranSalahos2026.test.ts
      - name: Emit formatted files
        run: |
          files=(
            "docs/quran-editorial-policy-v1.6.0.md"
            "docs/quran-salahos-2026-policy.md"
            "scripts/check-quran-salahos-2026.mjs"
            "src/data/quran-mutashabih-policy-triggers.json"
            "src/data/quran-mutashabih-review-register.json"
            "src/data/quran-salahos-2026-source.json"
            "src/domain/quranSalahos2026.test.ts"
          )
          for file in "${files[@]}"; do
            echo "FORMATTED_FILE_BEGIN:${file}"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_FILE_END:${file}"
          done
