name: Temporary PR218 Golden Blob

on:
  push:
    branches:
      - utility/format-stage45-v2

permissions:
  actions: read
  contents: write

jobs:
  blob:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact failed visual artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/9711291638/zip \
            > /tmp/pr218-visual.zip
          mkdir -p /tmp/pr218-visual
          unzip -q /tmp/pr218-visual.zip -d /tmp/pr218-visual
          test -s /tmp/pr218-visual/golden-knowledge-phone-ar-dark-actual.png

      - name: Create exact Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          image_path = '/tmp/pr218-visual/golden-knowledge-phone-ar-dark-actual.png'
          with open(image_path, 'rb') as handle:
              content = base64.b64encode(handle.read()).decode('ascii')

          payload = json.dumps({'content': content, 'encoding': 'base64'}).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          sha = result['sha']
          print(f'PR218_GOLDEN_BLOB_SHA={sha}')
          with open('/tmp/pr218-golden-blob-sha.txt', 'w', encoding='utf-8') as handle:
              handle.write(f'{sha}\n')
          PY

      - name: Upload blob SHA
        uses: actions/upload-artifact@v4
        with:
          name: pr218-golden-blob-sha
          path: /tmp/pr218-golden-blob-sha.txt
          retention-days: 1
