name: Temporary Stage45 Formatter

on:
  push:
    branches:
      - utility/format-stage45-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: utility/format-stage45-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format exact acceptance file
        run: npx prettier --write scripts/check-theme-stage45.mjs

      - name: Verify formatting
        run: npx prettier --check scripts/check-theme-stage45.mjs

      - name: Commit exact formatted output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- scripts/check-theme-stage45.mjs; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/check-theme-stage45.mjs
          git commit -m 'style: apply exact Stage45 formatter output'
          git push origin HEAD:utility/format-stage45-v2
