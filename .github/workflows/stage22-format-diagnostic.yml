name: Stage 22.5 Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Print canonical Stage 22.5 formatting diff
        run: |
          npx prettier --write src/i18n/mosquesCommunityV2Translations.ts src/ui/MosquesScreen.tsx
          git diff -- src/i18n/mosquesCommunityV2Translations.ts src/ui/MosquesScreen.tsx
