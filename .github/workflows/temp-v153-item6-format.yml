name: Temporary v1.5.3 Item 6 Format Cleanup

on:
  push:
    branches: [v1.5.3-work-item-6]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[item6-format-cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete temporary formatting tag
        run: git push origin :refs/tags/temp-v153-item6-formatted
