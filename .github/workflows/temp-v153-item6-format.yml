name: Temporary v1.5.3 Item 6 Format

on:
  push:
    branches: [v1.5.3-work-item-6]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[item6-format]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format licensing document
        run: npx prettier docs/QURAN_TRANSLATION_TRANSLITERATION_LICENSING.md --write
      - name: Verify formatting
        run: npx prettier docs/QURAN_TRANSLATION_TRANSLITERATION_LICENSING.md --check
      - name: Commit formatted result to temporary tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/QURAN_TRANSLATION_TRANSLITERATION_LICENSING.md
          git commit -m '[item6-generated] format licensing documentation'
          git tag -f temp-v153-item6-formatted
          git push --force origin refs/tags/temp-v153-item6-formatted
