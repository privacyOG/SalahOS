name: Stage 38 canonical repair

on:
  push:
    branches:
      - 'stage-38/local-network-api'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-38/local-network-api
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Repair timezone syntax and format Stage 38 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('local-api/server.mjs')
          text = path.read_text()
          old = "throw new RangeError(`${label} must be a supported IANA timezone`) from error;"
          new = "throw new RangeError(`${label} must be a supported IANA timezone`, { cause: error });"
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('timezone validation line is not in an expected state')
          path.write_text(text)
          PY
          npx prettier --write local-api/server.mjs local-api/server.test.mjs local-api/public-data.example.json docs/LOCAL_NETWORK_API.md eslint.config.js package.json
      - name: Commit canonical Stage 38 source
        run: |
          rm .github/workflows/stage38-finalize.yml .github/workflows/stage38-repair.yml .github/workflows/stage38-format-repair.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- local-api docs/LOCAL_NETWORK_API.md eslint.config.js package.json .github/workflows/stage38-finalize.yml .github/workflows/stage38-repair.yml .github/workflows/stage38-format-repair.yml
          git commit -m 'Apply canonical Stage 38 source formatting'
          git push origin HEAD:stage-38/local-network-api
