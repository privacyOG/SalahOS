name: Stage 23.4 Tracker Reconciliation

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile-stage-23-4:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile Stage 23.4 trackers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo = Path('TODO.md')
          todo_text = todo.read_text()
          old_root = '- [ ] Implement Bold Countdown Focus'
          if todo_text.count(old_root) != 1:
              raise SystemExit('Expected exactly one unchecked Bold Countdown Focus root item')
          todo_text = todo_text.replace(old_root, '- [x] Implement Bold Countdown Focus', 1)

          old_tail = 'Stage 23.3 is therefore complete. Four required visual templates and the mobile template work remain open.'
          new_tail = "Stage 23.3 is therefore complete. PR #178 completed Bold Countdown Focus on code-bearing head `0de2c0123010cc05a261a4229040bc54416a25ca`, which passed Quality Gate `32485632660`, Android Build `32485632576`, Visual Regression `32485632537` and iOS Build `32485632581`, including fresh iPhone/iPad Simulator runtime acceptance. The Bold Countdown Focus board consumes the shared `PrayerBoardData` presentation contract, keeps current time and the active countdown dominant, preserves the full five-prayer Start/Iqamah timetable as a secondary band, and derives presentation-only next-prayer, pre-Iqamah and Iqamah-now focus states without changing calculation, source, Iqamah, notification or next-prayer semantics. Its permanent 1920×1080 and 3840×2160 English/Arabic/RTL scenarios enforce exact five-prayer rendering, no horizontal clipping, at least 90% viewport-height use and long-distance countdown sizing; human review confirmed balanced full-height composition, clear non-animation state transitions, composed RTL and an unwrapped 4K prayer label. Stage 23.4 is therefore complete. Three required visual templates and the mobile template work remain open."
          if todo_text.count(old_tail) != 1:
              raise SystemExit('Expected Stage 23.3 progress-note tail not found exactly once')
          todo_text = todo_text.replace(old_tail, new_tail, 1)
          todo.write_text(todo_text)

          plan = Path('docs/UI_UX_V2_PLAN.md')
          plan_text = plan.read_text()
          old_block = """- [ ] Implement an original SalahOS Bold Countdown Focus design.\n- [ ] Make current time and next-prayer countdown the dominant display elements.\n- [ ] Keep today's full timetable visible as a secondary band.\n- [ ] Provide strong current/next state transitions that do not depend on animation.\n- [ ] Support optional pre-Iqamah and Iqamah-now states.\n- [ ] Prioritize long-distance readability over decorative content.\n"""
          new_block = """- [x] Implement an original SalahOS Bold Countdown Focus design.\n- [x] Make current time and next-prayer countdown the dominant display elements.\n- [x] Keep today's full timetable visible as a secondary band.\n- [x] Provide strong current/next state transitions that do not depend on animation.\n- [x] Support optional pre-Iqamah and Iqamah-now states.\n- [x] Prioritize long-distance readability over decorative content.\n\n**Stage 23.4 verification note (2026-08-21):** PR #178 code-bearing head `0de2c0123010cc05a261a4229040bc54416a25ca` passed Quality Gate `32485632660`, Android Build `32485632576`, Visual Regression `32485632537` and iOS Build `32485632581`, including fresh iPhone and iPad Simulator install, launch and relaunch acceptance. Bold Countdown Focus renders only from the shared `PrayerBoardData` presentation contract. It does not recalculate prayers or change selected source, Iqamah, notification or next-prayer semantics. The original SalahOS composition makes current time and the active countdown the dominant long-distance elements while retaining the complete five-prayer Start/Athan-versus-Iqamah timetable as a secondary band. Static labels, borders and inversion distinguish current, next, pre-Iqamah and Iqamah-now states without depending on animation. The permanent focused visual harness passed English and Arabic/RTL at 1920×1080 and 3840×2160, including deliberately long mosque names, exact five-prayer assertions, at least 90% viewport-height use, minimum countdown-size checks and zero horizontal clipping. Human review of the final evidence confirmed full-height density, immediate countdown hierarchy, clear state transitions, composed RTL and an unwrapped 4K prayer label. Later templates, preview/assignment UX and Stage 23.13 mobile variants remain open.\n"""
          if plan_text.count(old_block) != 1:
              raise SystemExit('Expected exactly one unchecked Stage 23.4 block')
          plan_text = plan_text.replace(old_block, new_block, 1)
          if '- [ ] Implement an original SalahOS Structured Split Board design.' not in plan_text:
              raise SystemExit('Stage 23.5 must remain open')
          plan.write_text(plan_text)
          PY

      - name: Commit tracker reconciliation and remove helper workflow
        run: |
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git rm .github/workflows/stage-23-4-trackers.yml
          git add -- TODO.md docs/UI_UX_V2_PLAN.md
          git commit -m 'Complete Stage 23.4 trackers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
