name: V1.6.0 Prettier Gate Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    if: github.head_ref == 'v160-salahos-2026-quran'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write scripts/check-quran-editorial-release-gate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v160-prettier-gate-output
          path: scripts/check-quran-editorial-release-gate.mjs
          retention-days: 1
