name: Format release checksum fix

on:
  push:
    branches:
      - privacyog/v1.1.0-checksum-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout checksum-fix branch
        uses: actions/checkout@v4
        with:
          ref: privacyog/v1.1.0-checksum-fix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format and validate
        run: |
          npx prettier --write scripts/release-packaging.test.mjs .github/workflows/release-assets.yml
          npm run check
          git diff --check

      - name: Commit formatted result and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          rm -f .github/workflows/format-release-checksum-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'Finalize portable release checksum fix'
          git push origin HEAD:privacyog/v1.1.0-checksum-fix
