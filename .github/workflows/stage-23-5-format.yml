name: Stage 23.5 Format Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-stage-23-5:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Stage 23.5 sources
        run: |
          npx prettier --write \
            scripts/visual-structured-split-board.mjs \
            src/ui/SmartDisplay.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/StructuredSplitBoard.tsx
          npx prettier --check \
            scripts/visual-structured-split-board.mjs \
            src/ui/SmartDisplay.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/StructuredSplitBoard.tsx

      - name: Commit canonical sources
        run: |
          if git diff --quiet -- \
            scripts/visual-structured-split-board.mjs \
            src/ui/SmartDisplay.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/StructuredSplitBoard.tsx; then
            echo 'Stage 23.5 files already canonical.'
            exit 0
          fi
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add \
            scripts/visual-structured-split-board.mjs \
            src/ui/SmartDisplay.test.tsx \
            src/ui/SmartDisplay.tsx \
            src/ui/StructuredSplitBoard.tsx
          git commit -m 'Canonicalize Structured Split Board sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
