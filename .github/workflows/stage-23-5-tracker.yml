name: Stage 23.5 Tracker Reconciliation

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile-stage-23-5:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile Stage 23.5 trackers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code_head = '13ad0a56597bc37fc955a942f4db3d7f6c8a4bd1'
          quality = '32489547751'
          android = '32489547621'
          visual = '32489547618'
          ios = '32489547663'

          todo = Path('TODO.md')
          text = todo.read_text()
          old = '- [ ] Implement Structured Split Board'
          new = '- [x] Implement Structured Split Board'
          if old not in text:
              raise SystemExit('Structured Split Board TODO item not found')
          text = text.replace(old, new, 1)
          old_tail = 'Stage 23.4 is therefore complete. Three required visual templates and the mobile template work remain open.'
          note = (
              f'Stage 23.4 is therefore complete. PR #179 completed Structured Split Board on code-bearing head `{code_head}`, '
              f'which passed Quality Gate `{quality}`, Android Build `{android}`, Visual Regression `{visual}` and iOS Build `{ios}`, '
              'including fresh iPhone/iPad Simulator runtime acceptance. The Structured Split Board consumes the shared `PrayerBoardData` '
              'presentation contract, preserves authoritative calculation/source/Iqamah/notification/next-prayer semantics, presents five '
              'obligatory prayers in precisely aligned Start/Athan-versus-Iqamah columns, and keeps clock/date/next-prayer content in a '
              'separate information rail with compact Jumu\'ah and sunrise/sunset modules. Permanent 1920×1080 and 3840×2160 English/Arabic/RTL '
              'scenarios enforce exact five-prayer rendering, split-region separation, Start/Iqamah column alignment, at least 90% viewport-height '
              'use and zero horizontal clipping; exact-head screenshots received human review and remained byte-identical after canonical '
              'formatting. Stage 23.5 is therefore complete. Two required visual templates and the mobile template work remain open.'
          )
          if old_tail not in text:
              raise SystemExit('Stage 23.4 TODO progress tail not found')
          text = text.replace(old_tail, note, 1)
          todo.write_text(text)

          plan = Path('docs/UI_UX_V2_PLAN.md')
          text = plan.read_text()
          items = [
              'Implement an original SalahOS Structured Split Board design.',
              "Use a precise Athan/start versus Iqamah/Jama'ah column layout.",
              'Use a separate clock/date/next-prayer column or region.',
              "Provide dedicated compact areas for multiple Jumu'ah sessions and sunrise/sunset.",
              'Optimize for mosques and schools that prioritise information density and precision.',
              'Maintain clean alignment at both 1080p and 4K without looking like a spreadsheet.',
          ]
          for item in items:
              old_item = f'- [ ] {item}'
              new_item = f'- [x] {item}'
              if old_item not in text:
                  raise SystemExit(f'Stage 23.5 plan item not found: {item}')
              text = text.replace(old_item, new_item, 1)
          marker = '\n## 23.6 Template 5 — Scenic Spiritual\n'
          verification = (
              f"\n**Stage 23.5 verification note (2026-08-21):** PR #179 code-bearing head `{code_head}` passed Quality Gate `{quality}`, "
              f"Android Build `{android}`, Visual Regression `{visual}` and iOS Build `{ios}`, including fresh iPhone and iPad Simulator install, "
              "launch and relaunch acceptance. Structured Split Board renders only from the shared `PrayerBoardData` presentation contract and "
              "does not recalculate prayers or change selected source, Iqamah, notification or next-prayer semantics. Its original SalahOS "
              "composition uses a distinct timetable region with precisely aligned Start/Athan and Iqamah/Jama'ah columns plus a separate "
              "clock/date/next-prayer rail, while multiple Jumu'ah sessions and sunrise/sunset remain compact. The permanent focused visual "
              "harness passed English and Arabic/RTL at 1920×1080 and 3840×2160, including deliberately long mosque names, exact five-prayer "
              "assertions, split-region separation, Start/Iqamah column-alignment checks, at least 90% viewport-height use and zero horizontal "
              "clipping. Human review of the exact screenshots confirmed high information density without a spreadsheet-like appearance, clear "
              "current/next states, composed RTL presentation and crisp alignment at both resolutions. Later templates, preview/assignment UX "
              "and Stage 23.13 mobile variants remain open.\n"
          )
          if marker not in text:
              raise SystemExit('Stage 23.6 marker not found')
          text = text.replace(marker, verification + marker, 1)
          plan.write_text(text)
          PY

      - name: Commit reconciliation and remove helper
        run: |
          rm .github/workflows/stage-23-5-tracker.yml
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add TODO.md docs/UI_UX_V2_PLAN.md .github/workflows/stage-23-5-tracker.yml
          git commit -m 'Complete Stage 23.5 trackers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
