name: Visual Tail Preflight

on:
  push:
    branches:
      - preflight/device-nav-calendar

permissions:
  contents: read

jobs:
  visual-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-visual-tail-pw
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-tail-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-visual-tail-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Fast static preflight
        run: |
          npx prettier --check \
            scripts/visual-device-ux-refinement.mjs \
            scripts/visual-display-device-refinement.mjs \
            scripts/visual-accessibility-rtl-acceptance.mjs \
            scripts/visual-ui-v2-retirement.mjs \
            scripts/visual-golden-regression.mjs \
            scripts/visual-accessibility-axe.mjs \
            scripts/cross-browser-smoke.mjs \
            scripts/visual-theme-matrix.mjs
          npx eslint scripts/visual-device-ux-refinement.mjs

      - name: Build production application
        run: npm run build

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/salahos-visual-tail-harness
          mkdir -p /tmp/salahos-visual-tail-harness
          cd /tmp/salahos-visual-tail-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact \
            playwright@1.62.0 \
            axe-core@4.10.3 \
            pngjs@7.0.0 \
            pixelmatch@7.1.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-tail-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-tail-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local production server did not become ready')
          PY

      - id: device
        name: Run device UX refinement
        continue-on-error: true
        run: node scripts/visual-device-ux-refinement.mjs

      - id: display
        name: Run display device refinement
        continue-on-error: true
        run: node scripts/visual-display-device-refinement.mjs

      - id: accessibility
        name: Run accessibility and RTL acceptance
        continue-on-error: true
        run: node scripts/visual-accessibility-rtl-acceptance.mjs

      - id: retirement
        name: Run UI v2 retirement acceptance
        continue-on-error: true
        run: node scripts/visual-ui-v2-retirement.mjs

      - id: golden
        name: Run golden regression
        continue-on-error: true
        run: node scripts/visual-golden-regression.mjs

      - id: axe
        name: Run axe accessibility acceptance
        continue-on-error: true
        run: node scripts/visual-accessibility-axe.mjs

      - id: cross_browser
        name: Run cross-browser smoke
        continue-on-error: true
        run: node scripts/cross-browser-smoke.mjs

      - id: theme
        name: Run theme matrix
        continue-on-error: true
        run: node scripts/visual-theme-matrix.mjs

      - name: Enforce visual-tail result
        if: always()
        run: |
          failures=""
          [ "${{ steps.device.outcome }}" = "success" ] || failures="$failures device"
          [ "${{ steps.display.outcome }}" = "success" ] || failures="$failures display"
          [ "${{ steps.accessibility.outcome }}" = "success" ] || failures="$failures accessibility"
          [ "${{ steps.retirement.outcome }}" = "success" ] || failures="$failures retirement"
          [ "${{ steps.golden.outcome }}" = "success" ] || failures="$failures golden"
          [ "${{ steps.axe.outcome }}" = "success" ] || failures="$failures axe"
          [ "${{ steps.cross_browser.outcome }}" = "success" ] || failures="$failures cross-browser"
          [ "${{ steps.theme.outcome }}" = "success" ] || failures="$failures theme"
          if [ -n "$failures" ]; then
            echo "Visual-tail failures:$failures"
            exit 1
          fi

      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-tail-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-tail-server.pid)" 2>/dev/null || true
          fi
