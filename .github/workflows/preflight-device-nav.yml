name: Focused Visual Repair Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-visual-repair-pw
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-repair-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-visual-repair-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Focused static checks
        run: |
          npx prettier --check \
            scripts/visual-theme-matrix.mjs \
            src/theme-contrast-guard.css

      - name: Build production application
        run: npm run build

      - name: Install Chromium visual harness
        run: |
          rm -rf /tmp/salahos-visual-repair-harness
          mkdir -p /tmp/salahos-visual-repair-harness
          cd /tmp/salahos-visual-repair-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact \
            playwright@1.62.0 \
            pngjs@7.0.0 \
            pixelmatch@7.1.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-repair-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-repair-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local production server did not become ready')
          PY

      - name: Run complete theme matrix
        run: node scripts/visual-theme-matrix.mjs

      - name: Record candidate golden baselines
        env:
          SALAHOS_GOLDEN_RECORD: '1'
        run: node scripts/visual-golden-regression.mjs

      - name: Verify recorded golden baselines
        run: node scripts/visual-golden-regression.mjs

      - name: Upload candidate golden baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-repair-goldens-${{ github.sha }}
          path: tests/golden/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-repair-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-repair-server.pid)" 2>/dev/null || true
          fi
