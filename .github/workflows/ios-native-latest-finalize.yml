name: iOS Native Latest Finalization

on:
  push:
    branches:
      - privacyog/ios-native-latest

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/ios-native-latest
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Transplant validated iOS implementation
        run: |
          git fetch origin privacyog/ios-notification-policy
          git checkout origin/privacyog/ios-notification-policy -- \
            ios \
            src/App.tsx \
            src/platform/iosNotificationScheduler.ts \
            src/platform/iosNotificationScheduler.test.ts \
            src/platform/iosNotificationPolicy.ts \
            src/platform/iosNotificationPolicy.test.ts
          npm install --save-exact @capacitor/ios@8.4.2
      - name: Preserve repository generated-file boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.prettierignore')
          lines = p.read_text().splitlines()
          for line in ['ios/App/App/public/', 'ios/App/App/Assets.xcassets/', 'ios/App/App/capacitor.config.json']:
              if line not in lines:
                  lines.append(line)
          p.write_text('\n'.join(lines) + '\n')

          p = Path('eslint.config.js')
          s = p.read_text()
          anchor = "      'android/app/src/main/assets/**',\n"
          addition = "      'ios/App/App/public/**',\n"
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('ESLint Android asset ignore anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s)
          PY
      - name: Add permanent iOS build gate
        run: |
          cat > .github/workflows/ios.yml <<'YAML'
          name: iOS Build

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            ios:
              runs-on: macos-15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies from lockfile
                  run: npm ci --ignore-scripts
                - name: Repository quality gate
                  run: npm run check
                - name: Synchronize iOS application
                  run: npx cap sync ios
                - name: Build iOS simulator application
                  run: |
                    xcodebuild \
                      -project ios/App/App.xcodeproj \
                      -scheme App \
                      -configuration Debug \
                      -sdk iphonesimulator \
                      -destination 'generic/platform=iOS Simulator' \
                      CODE_SIGNING_ALLOWED=NO \
                      build
          YAML
      - name: Record validated iOS implementation
        env:
          FOUNDATION_RUN: '31941296351'
          NOTIFICATION_RUN: '31941790069'
          POLICY_RUN: '31941980679'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const replacements = [
            ['- [ ] Configure iOS project/shell', '- [x] Configure iOS project/shell'],
            ['- [ ] Implement location permission descriptions and flow', '- [x] Implement location permission descriptions and flow'],
            ['- [ ] Implement persistent settings/storage', '- [x] Implement persistent settings/storage'],
            ['- [ ] Implement local prayer notifications within iOS scheduling limits', '- [x] Implement local prayer notifications within iOS scheduling limits'],
            ['- [ ] Implement Adhan/notification audio within Apple platform restrictions', '- [x] Implement Adhan/notification audio within Apple platform restrictions'],
            ['- [ ] Handle background execution limitations explicitly', '- [x] Handle background execution limitations explicitly'],
          ];
          for (const [before, after] of replacements) {
            if (!todo.includes(before)) throw new Error(`iOS tracker marker missing: ${before}`);
            todo = todo.replace(before, after);
          }
          const anchor = '- [x] Handle background execution limitations explicitly';
          const note = `\n\n**iOS native implementation verification note (2026-08-16):** macOS foundation run \`${process.env.FOUNDATION_RUN}\` generated and synchronised the committed Capacitor iOS shell with \`@capacitor/ios\` 8.4.2, verified the foreground location privacy descriptions without enabling background-location mode, passed the complete repository gate and compiled the App scheme for an iOS Simulator with signing disabled. The shared native Preferences adapter supplies the existing versioned settings, saved-location and mosque-library storage contract before React mounts. Local-notification run \`${process.env.NOTIFICATION_RUN}\` added the iOS adapter over the shared today/tomorrow prayer intents, with deterministic owned request IDs, permission fail-closed behavior, stale-request reconciliation, silent alerts and platform-default notification sound fallback; the bounded two-day horizon produces at most 30 configured requests. Lifecycle-policy run \`${process.env.POLICY_RUN}\` verified foreground/background/terminated system-notification policy, no dependency on SalahOS executing in the background at delivery time, and no claim of full Adhan-recording auto-play. All three runs passed Xcode simulator compilation. Interactive iPhone/iPad layout, offline cold-start and simulator/device acceptance remain separate items.`;
          todo = todo.replace(anchor, anchor + note);
          fs.writeFileSync('TODO.md', todo);

          let status = fs.readFileSync('docs/IOS_VALIDATION_STATUS.md', 'utf8');
          status += `\n\n## Native iOS implementation — 2026-08-16\n\nThe committed iOS shell, foreground location privacy metadata, Preferences-backed persistence, local prayer notification adapter, and notification/audio/background lifecycle policy have all been validated on macOS with an Xcode iOS Simulator build. Local notification scheduling is bounded to today and tomorrow and reconciles only SalahOS-owned requests. Silent alerts and platform-default notification sound are supported; full Adhan recording auto-play is not claimed. The app does not enable background location and does not depend on application background execution for scheduled local-notification delivery. Interactive simulator layout/offline acceptance remains separately tracked.\n`;
          fs.writeFileSync('docs/IOS_VALIDATION_STATUS.md', status);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          testing += `\n\n## iOS consolidated native implementation — 2026-08-16\n\nFoundation run \`${process.env.FOUNDATION_RUN}\`, local-notification run \`${process.env.NOTIFICATION_RUN}\`, and lifecycle-policy run \`${process.env.POLICY_RUN}\` each passed the complete repository quality gate and Xcode simulator compilation. The latest-main consolidation replays only the validated iOS native project and authored scheduler/policy files, regenerates the locked \`@capacitor/ios\` dependency on top of current Android-complete main, and introduces a permanent macOS \`iOS Build\` pull-request/main gate.\n`;
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Synchronize iOS application
        run: npx cap sync ios
      - name: Build iOS simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Commit verified latest iOS batch
        run: |
          rm .github/workflows/ios-native-latest-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify iOS native implementation [ios-latest-verified]"
          git push origin HEAD:privacyog/ios-native-latest
