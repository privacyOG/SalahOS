name: Stage 39 commit canonical patch

on:
  push:
    branches:
      - 'stage-39/calendar-integrations'

permissions:
  contents: write

jobs:
  commit-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-39/calendar-integrations
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Apply the reviewed Stage 39 patch block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/stage39-finalize.yml').read_text()
          opener = "          python3 - <<'PY'\n"
          closer = "          PY\n      - name: Apply canonical formatting"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          indented = workflow[start:end]
          source = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in indented.splitlines()
          )
          exec(compile(source, 'stage39-finalizer-patch.py', 'exec'), {})
          PY
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit ordinary Stage 39 source
        run: |
          rm .github/workflows/stage39-finalize.yml .github/workflows/stage39-commit-patch.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- TODO.md docs/CALENDAR.md docs/CALENDAR_INTEGRATIONS.md docs/LOCAL_NETWORK_API.md local-api src/domain/calendarIntegration.ts src/domain/calendarIntegration.test.ts .github/workflows/stage39-finalize.yml .github/workflows/stage39-commit-patch.yml
          git commit -m 'Wire Stage 39 calendar subscription feed'
          git push origin HEAD:stage-39/calendar-integrations
