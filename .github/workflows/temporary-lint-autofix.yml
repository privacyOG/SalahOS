name: Temporary Lint Autofix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-lint-autofix.yml'

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply safe ESLint autofixes
        run: npx eslint . --fix || true

      - name: Resolve strict lint findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected repair target not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/domain/calendar.ts',
              "export function hijriMonthName(month: number) {\n  if (!Number.isInteger(month) || month < 1 || month > 12)\n    throw new RangeError('Hijri month must be 1 through 12');\n  return HIJRI_MONTH_NAMES[month - 1];\n}\nexport function formatHijriDateEnglish(civilDate: Date, correctionDays = 0) {\n  const h = hijriDateParts(civilDate, correctionDays);\n  return `${h.day} ${hijriMonthName(h.month)} ${h.year} AH`;\n}",
              "export function hijriMonthName(month: number): (typeof HIJRI_MONTH_NAMES)[number] {\n  if (!Number.isInteger(month) || month < 1 || month > 12)\n    throw new RangeError('Hijri month must be 1 through 12');\n  const name = HIJRI_MONTH_NAMES[month - 1];\n  if (name === undefined) throw new RangeError('Hijri month must be 1 through 12');\n  return name;\n}\nexport function formatHijriDateEnglish(civilDate: Date, correctionDays = 0) {\n  const h = hijriDateParts(civilDate, correctionDays);\n  return [String(h.day), hijriMonthName(h.month), String(h.year), 'AH'].join(' ');\n}",
          )

          replace_once(
              'src/domain/prayerCalendar.ts',
              "    label: `${h.day} ${hijriMonthName(h.month)} ${h.year} AH`,",
              "    label: [String(h.day), hijriMonthName(h.month), String(h.year), 'AH'].join(' '),",
          )
          replace_once(
              'src/domain/prayerCalendar.ts',
              "      value = `${parts.find((p) => p.type === 'year')?.value}-${parts.find((p) => p.type === 'month')?.value}-${parts.find((p) => p.type === 'day')?.value}`;\n    if (value === target) return instant;",
              "      year = parts.find((part) => part.type === 'year')?.value,\n      month = parts.find((part) => part.type === 'month')?.value,\n      day = parts.find((part) => part.type === 'day')?.value;\n    if (year === undefined || month === undefined || day === undefined) continue;\n    const value = [year, month, day].join('-');\n    if (value === target) return instant;",
          )

          path = Path('src/ui/CongregationShell.tsx')
          text = path.read_text()
          old = "type Props = Readonly<{ children: (destination: CongregationDestination) => ReactNode }>;\nconst copy: Readonly<Record<Locale, Record<string, string>>> = {"
          new = "type Props = Readonly<{ children: (destination: CongregationDestination) => ReactNode }>;\ntype CongregationCopy = Readonly<{\n  navigation: string;\n  today: string;\n  calendar: string;\n  mosques: string;\n  qiblah: string;\n  knowledge: string;\n  community: string;\n  settings: string;\n}>;\nconst copy: Readonly<Record<Locale, CongregationCopy>> = {"
          if old not in text:
              raise SystemExit('Expected CongregationShell copy target not found')
          text = text.replace(old, new, 1)
          for key in ('navigation', 'today', 'calendar', 'mosques', 'qiblah', 'knowledge', 'community', 'settings'):
              text = text.replace(f'l.{key}!', f'l.{key}')
          path.write_text(text)

          replace_once(
              'src/ui/PrayerCalendarScreen.tsx',
              'aria-label={`${year} calendar`}',
              "aria-label={[String(year), 'calendar'].join(' ')}",
          )
          replace_once(
              'src/ui/PrayerCalendarScreen.tsx',
              "? ` – ${end.monthName}` : ''",
              "? ` – ${String(end.monthName)}` : ''",
          )
          replace_once(
              'src/ui/PrayerCalendarScreen.tsx',
              "{start.year === end.year ? `${start.year} AH` : `${start.year}–${end.year} AH`}",
              "{start.year === end.year\n                ? [String(start.year), 'AH'].join(' ')\n                : [String(start.year), '–', String(end.year), 'AH'].join(' ')}",
          )
          replace_once(
              'src/ui/SettingsScreen.tsx',
              "{day > 0 ? `+${day}` : day}",
              "{day > 0 ? `+${String(day)}` : day}",
          )
          replace_once(
              'src/ui/SmartDisplayApplication.tsx',
              "      s === null ? invalidate() : reset(s);",
              "      if (s === null) invalidate();\n      else reset(s);",
          )
          PY

      - name: Format repairs
        run: npx prettier --write .

      - name: Validate lint
        run: npm run lint

      - name: Validate typecheck
        run: npm run typecheck

      - name: Remove temporary workflow from final tree
        run: rm .github/workflows/temporary-lint-autofix.yml

      - name: Create remote repair commit object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_tree="$(git rev-parse HEAD^{tree})"
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree.json
          first=1
          while IFS=$'\t' read -r status path; do
            [ -n "$path" ] || continue
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            if [ "$status" = "D" ]; then
              jq -cn --arg path "$path" '{path:$path,mode:"100644",type:"blob",sha:null}' >> /tmp/tree.json
            else
              blob_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$(cat "$path")" -f encoding=utf-8 --jq .sha)"
              jq -cn --arg path "$path" --arg sha "$blob_sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree.json
            fi
          done < <(git diff --name-status)
          printf ']}' >> /tmp/tree.json
          tree_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq .sha)"
          commit_sha="$(jq -cn --arg message 'fix: resolve release gate lint failures' --arg tree "$tree_sha" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"
          printf '%s\n' "$commit_sha" | tee /tmp/repair-commit-sha.txt

      - name: Upload repair commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: salahos-lint-repair-commit
          path: /tmp/repair-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
