name: Temporary Lint Autofix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-lint-autofix.yml'

permissions:
  contents: read

jobs:
  lint-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply ESLint autofixes
        run: npx eslint . --fix || true

      - name: Format autofixes
        run: npx prettier --write .

      - name: Report remaining lint findings
        run: npx eslint . || true

      - name: Remove temporary workflow from exported workspace
        run: rm .github/workflows/temporary-lint-autofix.yml

      - name: Package autofixed workspace
        run: tar --exclude='.git' --exclude='node_modules' -czf /tmp/salahos-lint-autofix.tar.gz .

      - name: Upload autofixed workspace
        uses: actions/upload-artifact@v4
        with:
          name: salahos-lint-autofix-workspace
          path: /tmp/salahos-lint-autofix.tar.gz
          if-no-files-found: error
          retention-days: 1
