name: Stage 52 Golden Baseline Helper

on:
  pull_request:
    paths:
      - '.github/workflows/stage52-golden-baseline-helper.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'stage-52/v1.4-verification-upgrades'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Stage 52 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build application
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install pinned golden harness
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0 pngjs@7.0.0 pixelmatch@7.1.0
          npx playwright install chromium

      - name: Record deterministic baselines
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
          SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
          SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-visual-harness
          SALAHOS_GOLDEN_RECORD: '1'
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-golden-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1).status == 200:
                      raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Golden fixture server did not become ready')
          PY
          node scripts/visual-golden-regression.mjs

      - name: Create baseline commit object
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_TREE="$(gh api "repos/${REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')"
          TREE_ENTRIES='[]'
          for file in tests/golden/today-phone-en-light.png tests/golden/knowledge-phone-ar-dark.png; do
            encoded="$(base64 -w0 "$file")"
            blob="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha')"
            TREE_ENTRIES="$(jq --arg path "$file" --arg sha "$blob" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<< "$TREE_ENTRIES")"
          done
          TREE_SHA="$(jq -n --arg base_tree "$BASE_TREE" --argjson tree "$TREE_ENTRIES" '{base_tree:$base_tree,tree:$tree}' | gh api --method POST "repos/${REPOSITORY}/git/trees" --input - --jq '.sha')"
          GENERATED_COMMIT="$(jq -n --arg message 'Stage 52: record deterministic golden baselines' --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${REPOSITORY}/git/commits" --input - --jq '.sha')"
          echo "STAGE52_GOLDEN_COMMIT=${GENERATED_COMMIT}"
