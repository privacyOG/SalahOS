name: Raspberry Pi Kiosk Continuity Tracker

on:
  push:
    branches:
      - agent/rpi-kiosk-continuity

permissions:
  contents: write

jobs:
  record:
    if: github.ref == 'refs/heads/agent/rpi-kiosk-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/rpi-kiosk-continuity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository policies
        run: npm run security:sensitive-files && npm run security:audit && npm run security:licenses && npm run docs:links && python scripts/generate_pwa_icons.py --check

      - name: Record Raspberry Pi kiosk continuity verification
        run: python scripts/record_rpi_kiosk_continuity.py

      - name: Canonicalize tracker evidence
        run: npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        run: |
          if git diff --quiet -- TODO.md TESTING.md; then
            echo "No tracker changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add TODO.md TESTING.md
          git commit -m "docs: verify Raspberry Pi kiosk continuity"
          git push origin HEAD:agent/rpi-kiosk-continuity
