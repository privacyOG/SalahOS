name: Temporary Home Hub Documentation Format Diff
on:
  push:
    branches:
      - feature/home-hub-prayer-dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Show formatted docs
        run: |
          npx prettier --write docs/HOME_HUB_DEVICE_ACCEPTANCE.md TEMP_TODO_HOME_HUB.md
          git diff --no-ext-diff -- docs/HOME_HUB_DEVICE_ACCEPTANCE.md TEMP_TODO_HOME_HUB.md
