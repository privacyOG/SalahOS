name: Stage 57 UX finalizer

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement

permissions:
  contents: write

jobs:
  finalize-stage57:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-57/v1.5-product-ux-refinement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Stage 57 source
        run: python3 .github/stage57-finalizer.py

      - name: Format Stage 57 files
        run: npx prettier --write src/ui/applicationRoute.ts src/ui/applicationRoute.test.ts src/ui/SettingsScreen.tsx src/ui/SalahIcon.tsx src/ui/PrimaryNavigation.tsx src/ui/CongregationShell.tsx src/ui/MobilePrayerThemeSurface.tsx src/ui/TodayScreen.tsx src/congregation-shell.css src/today-screen.css src/ui/prayer-board-weather.css src/settings-screen.css scripts/visual-product-ux-stage8.mjs docs/PRODUCT_UX_V1.5.md package.json

      - name: Validate Stage 57 source
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Publish helper-free Stage 57 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm .github/workflows/stage57-ux-builder.yml
          git rm .github/workflows/stage57-ux-builder-v2.yml
          git rm .github/workflows/stage57-ux-builder-v3.yml
          git rm .github/workflows/stage57-ux-builder-v4.yml
          git rm .github/workflows/stage57-ux-builder-v5.yml
          git rm .github/workflows/stage57-ux-builder-v6.yml
          git rm .github/workflows/stage57-ux-diagnostic.yml
          git rm .github/stage57-finalizer.py
          git add src/ui/applicationRoute.ts src/ui/applicationRoute.test.ts src/ui/SettingsScreen.tsx src/ui/SalahIcon.tsx src/ui/PrimaryNavigation.tsx src/ui/CongregationShell.tsx src/ui/MobilePrayerThemeSurface.tsx src/ui/TodayScreen.tsx src/congregation-shell.css src/today-screen.css src/ui/prayer-board-weather.css src/settings-screen.css scripts/visual-product-ux-stage8.mjs docs/PRODUCT_UX_V1.5.md package.json
          git commit -m "Stage 57: refine product UX"
          git push origin HEAD:stage-57/v1.5-product-ux-refinement
