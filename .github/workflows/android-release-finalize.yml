name: Android Release Configuration Finalization

on:
  push:
    branches:
      - privacyog/android-release-config

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[release-config-verified]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-release-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Add release validation commands and documentation
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['android:release-check'] =
            'npm run android:sync && cd android && ./gradlew assembleRelease';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          let todo = fs.readFileSync('TODO.md', 'utf8');
          const marker = '- [ ] Build signed/release-ready configuration without committing secrets';
          if (!todo.includes(marker)) throw new Error('Android release tracker marker missing');
          todo = todo.replace(marker, '- [x] Build signed/release-ready configuration without committing secrets');
          const doneMarker = '- [x] Build signed/release-ready configuration without committing secrets';
          const markerIndex = todo.indexOf(doneMarker);
          const insertion = todo.indexOf('\n- [ ] Run on real Android device or emulator and record evidence', markerIndex);
          if (insertion < 0) throw new Error('Android release tracker insertion point missing');
          const note = `\n\n**Android release-configuration verification note (2026-08-16):** the Gradle release build now supports signing only through four external environment values: keystore path/password and key alias/password. A partial signing configuration fails immediately instead of silently producing an incorrectly configured release. With no credentials present, CI builds an unsigned release artifact to validate the release variant without storing signing material. Validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate, debug Android assembly, unsigned \`assembleRelease\`, and an explicit negative check proving partial signing configuration is rejected. Keystores and credentials remain excluded by repository policy and are never committed.`;
          todo = todo.slice(0, insertion) + note + todo.slice(insertion);
          fs.writeFileSync('TODO.md', todo);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          android += `\n\n## Release signing configuration\n\nThe release variant can be signed without storing any credential in the repository. Supply all four environment variables only in a secure local/release environment:\n\n- \`SALAHOS_ANDROID_KEYSTORE_PATH\`\n- \`SALAHOS_ANDROID_KEYSTORE_PASSWORD\`\n- \`SALAHOS_ANDROID_KEY_ALIAS\`\n- \`SALAHOS_ANDROID_KEY_PASSWORD\`\n\nAll four values are required together. A partial configuration stops Gradle with an error. With none set, \`npm run android:release-check\` builds the unsigned release variant so CI can validate release compilation without possessing signing secrets. The existing secret-file policy excludes keystores and private credential material from version control. Distribution signing should inject these values from the release operator's secure environment or encrypted CI secret store.\n`;
          fs.writeFileSync('docs/ANDROID.md', android);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android release configuration')) {
            testing += `\n\n### 2026-08-16 — Android release configuration\n\n- Validation run \`${process.env.VALIDATION_RUN}\` passed the repository quality gate, debug Android assembly and unsigned release assembly.\n- Gradle accepts release signing only when keystore path/password and key alias/password are all supplied externally.\n- A negative validation invokes Gradle with only one signing variable and requires the build configuration to fail.\n- No keystore, password or signing credential is committed; the repository secret-file policy remains authoritative.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Android debug assembly
        run: npm run android:build
      - name: Unsigned release assembly
        run: npm run android:release-check
      - name: Reject partial release signing configuration
        run: |
          set +e
          (cd android && SALAHOS_ANDROID_KEY_ALIAS=privacyOG ./gradlew tasks >/tmp/salahos-partial-signing.log 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/salahos-partial-signing.log
            echo "Partial Android signing configuration was not rejected" >&2
            exit 1
          fi
          grep -q "Android release signing requires all" /tmp/salahos-partial-signing.log
      - name: Commit verified batch
        run: |
          rm .github/workflows/android-release-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Configure Android release signing safely [release-config-verified]"
          git push origin HEAD:privacyog/android-release-config
