name: Stage 24 Tracker Update

on:
  push:
    branches:
      - stage-24/admin-shell-overview
    paths:
      - .github/workflows/stage24-tracker-update.yml

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-24/admin-shell-overview
          fetch-depth: 0

      - name: Update verified Stage 24 tracker state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path('TODO.md')
          todo = todo_path.read_text()
          todo_old = '- [ ] Complete the administration information architecture and overview dashboard'
          todo_new = '- [x] Complete the administration information architecture and overview dashboard'
          assert todo.count(todo_old) == 1, f'expected one TODO target, found {todo.count(todo_old)}'
          todo = todo.replace(todo_old, todo_new, 1)

          todo_anchor = '- [ ] Complete display-theme management, assignment, publication and rollback UX\n\n---'
          todo_note = '''- [ ] Complete display-theme management, assignment, publication and rollback UX

**Stage 24.1–24.2 verification note (2026-08-23):** PR #188 code-bearing head `a9b23bfeddf490b3e5145dd84295c6c5bc5f255a` passed Quality Gate `32620048449`, Android Build `32620048448`, Visual Regression `32620048450` and iOS Build `32620048456`. The dedicated administration shell now provides eight reloadable destinations, route-specific titles/context/breadcrumbs, compact narrow navigation, congregation-surface isolation and confirmation-gated destructive fleet revocation. The overview presents local prayer/Iqamah, draft-versus-published fixture state, Jumu'ah/Ramadan context, display health, upcoming community content, signage state, quiet failure reporting and short-path common tasks without changing prayer calculations. Exact Visual artifact `9488130221` (`sha256:af9eb38276f3125c69c53c487519c5787775e258e4d45dc03cefb2e7991b212b`) passed permanent desktop, Arabic/RTL tablet, narrow-phone and destructive-confirmation checks and received human review after correcting the narrow common-action clipping found during review. Stage 24.1 and 24.2 are complete; Stage 24.3 display-theme publication/rollback remains open.

---'''
          assert todo.count(todo_anchor) == 1, f'expected one TODO note anchor, found {todo.count(todo_anchor)}'
          todo = todo.replace(todo_anchor, todo_note, 1)
          todo_path.write_text(todo)

          plan_path = Path('docs/UI_UX_V2_PLAN.md')
          plan = plan_path.read_text()
          replacements = {
              '- [ ] Build a dedicated admin shell with persistent navigation on desktop/tablet and appropriate compact navigation on narrow screens.': '- [x] Build a dedicated admin shell with persistent navigation on desktop/tablet and appropriate compact navigation on narrow screens.',
              '- [ ] Provide page titles, breadcrumbs/context and clear primary actions.': '- [x] Provide page titles, breadcrumbs/context and clear primary actions.',
              '- [ ] Remove display credentials, fleet controls and publication tools from congregation-facing pages.': '- [x] Remove display credentials, fleet controls and publication tools from congregation-facing pages.',
              '- [ ] Keep dangerous/destructive actions visually distinct and confirmation-gated.': '- [x] Keep dangerous/destructive actions visually distinct and confirmation-gated.',
              "- [ ] Show today's published prayer/Iqamah status.": "- [x] Show today's published prayer/Iqamah status.",
              '- [ ] Show draft versus published timetable state.': '- [x] Show draft versus published timetable state.',
              "- [ ] Show upcoming Jumu'ah/Ramadan overrides.": "- [x] Show upcoming Jumu'ah/Ramadan overrides.",
              '- [ ] Show display online/stale/offline state.': '- [x] Show display online/stale/offline state.',
              '- [ ] Show upcoming announcements/events and signage schedule.': '- [x] Show upcoming announcements/events and signage schedule.',
              '- [ ] Surface failed synchronization/configuration issues without making the dashboard noisy.': '- [x] Surface failed synchronization/configuration issues without making the dashboard noisy.',
              '- [ ] Make common daily tasks reachable in very few interactions.': '- [x] Make common daily tasks reachable in very few interactions.',
          }
          for old, new in replacements.items():
              assert plan.count(old) == 1, f'expected one plan target for {old!r}, found {plan.count(old)}'
              plan = plan.replace(old, new, 1)

          plan_anchor = '## 24.3 Display theme management'
          plan_note = '''**Stage 24.1–24.2 verification note (2026-08-23):** PR #188 code-bearing head `a9b23bfeddf490b3e5145dd84295c6c5bc5f255a` passed Quality Gate `32620048449`, Android Build `32620048448`, Visual Regression `32620048450` and iOS Build `32620048456`. Exact Visual artifact `9488130221` (`sha256:af9eb38276f3125c69c53c487519c5787775e258e4d45dc03cefb2e7991b212b`) passed permanent desktop, Arabic/RTL tablet, narrow-phone and destructive-confirmation acceptance and received human visual review after the narrow common-action clipping found during review was corrected. The administration shell now has eight reloadable destinations with responsive navigation, route context/breadcrumbs, congregation-surface isolation and confirmation-gated destructive fleet revocation. The overview exposes local prayer/Iqamah, draft-versus-published fixture state, Jumu'ah/Ramadan context, fleet health, community/signage state, quiet issue reporting and short-path daily tasks without altering prayer calculations. Stage 24.1 and 24.2 are complete; Stage 24.3 remains open.

## 24.3 Display theme management'''
          assert plan.count(plan_anchor) == 1, f'expected one plan note anchor, found {plan.count(plan_anchor)}'
          plan = plan.replace(plan_anchor, plan_note, 1)
          plan_path.write_text(plan)
          PY

          git diff --check
          git diff -- TODO.md docs/UI_UX_V2_PLAN.md

      - name: Commit tracker update
        shell: bash
        run: |
          git config user.name privacyOG
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TODO.md docs/UI_UX_V2_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "Mark Stage 24.1 and 24.2 complete"
          git push origin HEAD:stage-24/admin-shell-overview
