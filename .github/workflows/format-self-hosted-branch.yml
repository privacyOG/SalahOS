name: Canonical branch formatting

on:
  push:
    branches:
      - privacyog/self-hosted-evox2-ci

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-format]') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply canonical formatting
        run: npx prettier --write docs/PRAYER_METHOD_REFERENCES.md scripts/check-native-permissions.mjs scripts/check-remote-network-policy.mjs

      - name: Commit canonical formatting
        run: |
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add docs/PRAYER_METHOD_REFERENCES.md scripts/check-native-permissions.mjs scripts/check-remote-network-policy.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Canonicalize release hardening files [canonical-format]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
