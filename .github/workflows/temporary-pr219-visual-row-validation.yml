name: Temporary PR219 Visual Row Validation

on:
  push:
    branches: [agent/pr219-visual-row-fix]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply obligatory and Sunrise row contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/visual-mobile-prayer-themes.mjs')
          text = path.read_text()

          boundary = """async function assertPrayerBoardDataBoundary(page, name) {
            const today = page.locator('main.today-screen');
            if ((await today.getAttribute('data-prayer-board-data-version')) !== '1') {
              throw new Error(`${name} did not render through PrayerBoardData v1`);
            }
            if ((await today.getAttribute('data-prayer-board-source')) !== 'local-mosque') {
              throw new Error(`${name} did not preserve the PrayerBoardData source mode`);
            }
          }
          """
          boundary = '\n'.join(line[10:] if line.startswith('          ') else line for line in boundary.splitlines()) + '\n'
          helper = boundary + """
          async function assertPrayerRowContract(page, name) {
            const obligatoryPrayerRows = page.locator(
              '.today-prayer-row[data-today-prayer-name="fajr"], .today-prayer-row[data-today-prayer-name="dhuhr"], .today-prayer-row[data-today-prayer-name="asr"], .today-prayer-row[data-today-prayer-name="maghrib"], .today-prayer-row[data-today-prayer-name="isha"]',
            );
            if ((await obligatoryPrayerRows.count()) !== 5) {
              throw new Error(`${name} did not preserve exactly five obligatory prayer rows`);
            }
            const sunriseRows = page.locator('.today-prayer-row[data-today-prayer-name="sunrise"]');
            if ((await sunriseRows.count()) !== 1) {
              throw new Error(`${name} did not preserve exactly one Sunrise/Fajr-end row`);
            }
            if ((await page.locator('.today-prayer-row.is-supplementary').count()) !== 0) {
              throw new Error(`${name} left Sunrise duplicated inside the prayer timetable`);
            }
          }
          """
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          assert boundary in text
          text = text.replace(boundary, helper, 1)

          old_theme = "    const prayerRows = page.locator('.today-prayer-row:not(.today-prayer-row--header)');\n    if ((await prayerRows.count()) !== 5) {\n      throw new Error(`${scenario.name} did not preserve exactly five obligatory prayer rows`);\n    }\n    if ((await page.locator('.today-prayer-row.is-supplementary').count()) !== 0) {\n      throw new Error(`${scenario.name} left Sunrise duplicated inside the prayer timetable`);\n    }\n"
          assert old_theme in text
          text = text.replace(old_theme, "    await assertPrayerRowContract(page, scenario.name);\n", 1)

          old_modules = "    if ((await page.locator('.today-prayer-row:not(.today-prayer-row--header)').count()) !== 5) {\n      throw new Error('Optional module changes altered the core five-prayer timetable');\n    }\n"
          assert old_modules in text
          text = text.replace(
              old_modules,
              "    await assertPrayerRowContract(page, 'mobile-theme-modules-hidden-today-en');\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Format and static checks
        run: |
          npx prettier --write scripts/visual-mobile-prayer-themes.mjs
          npm run format:check
          npm run lint
          git diff --check
      - name: Build production application
        run: npm run build
      - name: Install isolated Chromium harness
        shell: bash
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local SalahOS production server did not become ready')
          PY
      - name: Validate mobile prayer theme row contract
        run: node scripts/visual-mobile-prayer-themes.mjs
      - name: Capture validated script bytes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/visual-mobile-prayer-themes.mjs
          git commit -m 'test: distinguish obligatory prayers from sunrise'
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          git push
      - name: Stop local production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/salahos-visual-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-server.pid)" 2>/dev/null || true
          fi
