name: Home Hub Dependency Inspection
on:
  push:
    branches:
      - feature/home-hub-prayer-dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched direct dependencies and refresh lockfile (runner only)
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const dep of ['@capacitor/android', '@capacitor/ios', '@capacitor/core']) p.dependencies[dep] = '8.5.3';
          Object.assign(p.devDependencies, {
            '@capacitor/cli': '8.5.3',
            'vite': '8.3.5',
            'vitest': '4.1.12',
            '@vitest/coverage-v8': '4.1.12'
          });
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --global npm@11
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=moderate || true
      - name: Emit updated manifests for owner-authored repository updates
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json', 'package-lock.json']) {
            const content = fs.readFileSync(file, 'utf8');
            const chunkSize = 4000;
            for (let offset = 0; offset < content.length; offset += chunkSize) {
              console.log('DEPCHUNK|' + file + '|' + (offset / chunkSize) + '|' + JSON.stringify(content.slice(offset, offset + chunkSize)));
            }
            console.log('DEPFINISH|' + file + '|' + content.length);
          }
          NODE
