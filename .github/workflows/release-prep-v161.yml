name: One-shot v1.6.1 release metadata prep

on:
  push:
    branches:
      - 'release-prep/v1.6.1'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize v1.6.1 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.6.1 --no-git-tag-version --allow-same-version
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 12/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.6.1"/' android/app/build.gradle
          sed -i -E 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = 12;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i -E 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.6.1;/g' ios/App/App.xcodeproj/project.pbxproj

          test "$(node -p "require('./package.json').version")" = '1.6.1'
          test "$(node -p "require('./package-lock.json').version")" = '1.6.1'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '1.6.1'
          grep -Eq '^[[:space:]]*versionCode[[:space:]]+12([[:space:]]|$)' android/app/build.gradle
          grep -Eq '^[[:space:]]*versionName[[:space:]]+"1\.6\.1"' android/app/build.gradle
          test "$(grep -E '^[[:space:]]*MARKETING_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);/\1/' | sort -u)" = '1.6.1'
          test "$(grep -E '^[[:space:]]*CURRENT_PROJECT_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);/\1/' | sort -u)" = '12'

      - name: Commit synchronized metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-prep-v161.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android/app/build.gradle ios/App/App.xcodeproj/project.pbxproj .github/workflows/release-prep-v161.yml
          git commit -m 'chore: prepare v1.6.1 version metadata'
          git push origin HEAD:release-prep/v1.6.1
