name: Stage 35 tracker reconciliation

on:
  push:
    branches:
      - 'stage-35/multiple-mosque-profiles'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-35/multiple-mosque-profiles
          fetch-depth: 0

      - name: Mark multiple mosque profiles roadmap item complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TODO.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] Multiple mosque profiles'
          new = '- [x] Multiple mosque profiles'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one open multiple mosque profiles roadmap item')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/stage35-tracker-reconcile.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md
          git commit -m "Mark Stage 35 multiple mosque profiles complete"
          git push origin HEAD:stage-35/multiple-mosque-profiles
