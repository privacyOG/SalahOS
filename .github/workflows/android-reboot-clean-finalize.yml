name: Android Reboot Clean Finalization

on:
  push:
    branches:
      - privacyog/android-reboot-clean

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[reboot-clean-verified]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-reboot-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply reboot restoration integration
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['verify:android-reboot'] = 'node scripts/verify-android-notification-reboot.mjs';
          pkg.scripts['android:build'] =
            'npm run android:sync && cd android && ./gradlew assembleDebug && cd .. && npm run verify:android-reboot';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          let ignore = fs.readFileSync('.gitignore', 'utf8');
          if (!ignore.includes('*.tsbuildinfo')) {
            ignore += '\n# Generated TypeScript incremental build metadata\n*.tsbuildinfo\n';
          }
          fs.writeFileSync('.gitignore', ignore);

          let todo = fs.readFileSync('TODO.md', 'utf8');
          const marker = '- [ ] Reschedule notifications after device reboot where platform requires it';
          if (!todo.includes(marker)) throw new Error('Reboot tracker marker missing');
          todo = todo.replace(marker, '- [x] Reschedule notifications after device reboot where platform requires it');
          const doneMarker = '- [x] Reschedule notifications after device reboot where platform requires it';
          const markerIndex = todo.indexOf(doneMarker);
          const insertion = todo.indexOf('\n- [~] Reschedule future prayer notifications at date rollover', markerIndex);
          if (insertion < 0) throw new Error('Reboot tracker insertion point missing');
          const note = `\n\n**Android notification reboot-restoration verification note (2026-08-16):** SalahOS pins \`@capacitor/local-notifications\` and verifies its Android reboot-restoration contract during every \`npm run android:build\`. The verifier requires the installed version to equal the repository dependency, requires the plugin manifest to register \`LocalNotificationRestoreReceiver\` for locked/normal boot with \`RECEIVE_BOOT_COMPLETED\`, requires the receiver source to reload saved notification IDs and reschedule them, and scans Gradle build intermediates to prove the receiver and permission survive manifest merging into the application. Clean validation run \`${process.env.VALIDATION_RUN}\` passed the full repository quality gate, Android debug assembly and the permanent reboot verifier on the post-Adhan mainline. Physical-device reboot timing remains part of separate device acceptance and is not claimed here.`;
          todo = todo.slice(0, insertion) + note + todo.slice(insertion);
          fs.writeFileSync('TODO.md', todo);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          if (!android.includes('## Notification restoration after reboot')) {
            android += `\n\n## Notification restoration after reboot\n\nThe pinned Capacitor Local Notifications Android dependency stores pending local notifications and declares its restore receiver for locked boot, normal boot and supported quick-boot broadcasts. SalahOS does not add a duplicate receiver. Instead, every Android build runs \`scripts/verify-android-notification-reboot.mjs\`, which verifies the pinned dependency source contract and confirms that \`LocalNotificationRestoreReceiver\` plus \`RECEIVE_BOOT_COMPLETED\` are present in a Gradle merged application manifest.\n\nThis is repository/build evidence that saved scheduled notifications are restored through the dependency's native reboot path. It is not physical-device evidence for manufacturer-specific boot timing, power-management behavior or notification presentation.\n`;
          }
          fs.writeFileSync('docs/ANDROID.md', android);

          let limits = fs.readFileSync('docs/NOTIFICATION_LIMITATIONS.md', 'utf8');
          if (!limits.includes('### Android reboot restoration')) {
            limits += `\n\n### Android reboot restoration\n\nThe pinned Android Local Notifications dependency provides a native boot restore receiver for saved scheduled notifications. SalahOS verifies the installed source contract and Gradle merged manifest on every Android build rather than duplicating the receiver. Manufacturer boot timing, Doze and notification presentation can still differ on physical devices, so build-time restoration support is not represented as device-level delivery timing evidence.\n`;
          }
          fs.writeFileSync('docs/NOTIFICATION_LIMITATIONS.md', limits);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android notification reboot restoration')) {
            testing += `\n\n### 2026-08-16 — Android notification reboot restoration\n\n- Clean validation run \`${process.env.VALIDATION_RUN}\` passed the complete repository quality gate and Android debug assembly on the current mainline.\n- The permanent Android build verifies that the installed Local Notifications version matches the pinned dependency, its manifest declares the boot restore receiver/permission, its receiver reloads saved notification IDs and reschedules them, and Gradle's merged application manifest retains the receiver.\n- Generated TypeScript incremental metadata is ignored to prevent build artifacts entering feature branches.\n- Physical-device reboot timing remains a separate acceptance concern.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);
          NODE
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Android build with reboot verification
        run: npm run android:build
      - name: Commit verified clean batch
        run: |
          rm .github/workflows/android-reboot-clean-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify Android notification reboot restoration [reboot-clean-verified]"
          git push origin HEAD:privacyog/android-reboot-clean
