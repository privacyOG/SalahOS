name: Temporary Home Hub CSS Format Diff
on:
  push:
    branches:
      - feature/home-hub-prayer-dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Show exact formatted CSS diff
        run: |
          npx prettier --write src/home-hub-board.css
          git diff --no-ext-diff -- src/home-hub-board.css
