name: TEMP Item 20 Native Persistence

on:
  push:
    branches:
      - v1.5.3/item-20-notification-onboarding
    paths:
      - .github/workflows/temp-item20-native-persistence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-20-notification-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add notification onboarding to native hydration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_before(path, anchor, insertion):
              p = Path(path)
              text = p.read_text()
              if insertion.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected one anchor {anchor!r}, found {text.count(anchor)}')
              p.write_text(text.replace(anchor, insertion + anchor, 1))

          insert_before(
              'src/platform/applicationStorage.ts',
              "import { PRAYER_BOARD_ANNOUNCEMENT_ROTATION_STORAGE_KEY } from './prayerBoardAnnouncementRotation';\n",
              "import { NOTIFICATION_ONBOARDING_STORAGE_KEY } from './notificationOnboarding';\n",
          )
          insert_before(
              'src/platform/applicationStorage.ts',
              "  PRAYER_SETUP_ONBOARDING_STORAGE_KEY,\n",
              "  NOTIFICATION_ONBOARDING_STORAGE_KEY,\n",
          )
          insert_before(
              'src/platform/applicationStorage.test.ts',
              "import { PRAYER_SETUP_ONBOARDING_STORAGE_KEY } from './prayerSetupOnboarding';\n",
              "import { NOTIFICATION_ONBOARDING_STORAGE_KEY } from './notificationOnboarding';\n",
          )

          test = Path('src/platform/applicationStorage.test.ts')
          text = test.read_text()
          setup_anchor = "    preferences.values.set(PRAYER_SETUP_ONBOARDING_STORAGE_KEY, '{\"version\":1,\"completed\":true}');\n"
          setup_insert = "    preferences.values.set(\n      NOTIFICATION_ONBOARDING_STORAGE_KEY,\n      '{\"version\":1,\"completed\":true,\"decision\":\"declined\"}',\n    );\n"
          if setup_insert.strip() not in text:
              if text.count(setup_anchor) != 1:
                  raise SystemExit(f'applicationStorage.test.ts setup anchor count {text.count(setup_anchor)}')
              text = text.replace(setup_anchor, setup_anchor + setup_insert, 1)

          assertion_anchor = "    expect(storage.getItem(PRAYER_SETUP_ONBOARDING_STORAGE_KEY)).toBe(\n      '{\"version\":1,\"completed\":true}',\n    );\n"
          assertion_insert = "    expect(storage.getItem(NOTIFICATION_ONBOARDING_STORAGE_KEY)).toBe(\n      '{\"version\":1,\"completed\":true,\"decision\":\"declined\"}',\n    );\n"
          if assertion_insert.strip() not in text:
              if text.count(assertion_anchor) != 1:
                  raise SystemExit(f'applicationStorage.test.ts assertion anchor count {text.count(assertion_anchor)}')
              text = text.replace(assertion_anchor, assertion_anchor + assertion_insert, 1)
          test.write_text(text)
          PY
      - name: Install and validate
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/platform/applicationStorage.ts src/platform/applicationStorage.test.ts
          npm run typecheck
          npm run lint
          npm run test
          npm run security:native-permissions
          npm run format:check
      - name: Retain clean persistence commit
        shell: bash
        run: |
          rm .github/workflows/temp-item20-native-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/applicationStorage.ts src/platform/applicationStorage.test.ts .github/workflows/temp-item20-native-persistence.yml
          git commit -m "Persist notification onboarding in native storage"
          echo "ITEM20_NATIVE_PERSISTENCE_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-20-notification-onboarding
