name: TEMP Item 18 Overflow Harness Fix

on:
  push:
    branches:
      - v1.5.3/item-18-navigation-consolidation
    paths:
      - .github/workflows/temp-item18-overflow-harness-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-18-navigation-consolidation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch overflow detector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/visual-regression.mjs')
          text = path.read_text()
          if text.count('explicitlyClipsContent') != 2:
              raise SystemExit('unexpected overflow predicate count')
          text = text.replace('explicitlyClipsContent', 'visiblyOverflowsOwnBox')
          old = "(style.overflowX === 'hidden' || style.overflowX === 'clip');"
          if text.count(old) != 1:
              raise SystemExit('unexpected overflow criterion count')
          text = text.replace(old, "style.overflowX === 'visible';", 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Item 18
        shell: bash
        run: |
          npx prettier --write scripts/visual-regression.mjs
          npm run ui:design-system-ownership
          npm run ui:theme-architecture
          npm run format:check
          node --check scripts/visual-regression.mjs
          node --check scripts/visual-device-ux-refinement.mjs

      - name: Retain clean commit
        shell: bash
        run: |
          rm .github/workflows/temp-item18-overflow-harness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-regression.mjs .github/workflows/temp-item18-overflow-harness-fix.yml
          git commit -m "Allow intentional ellipsis in visual overflow checks"
          echo "ITEM18_FINAL_RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-18-navigation-consolidation
