name: Stage 56 golden refresh

on:
  push:
    branches:
      - stage-56/v1.5-hadith-fiqh-expansion

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-golden-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_HARNESS_ROOT: /tmp/salahos-golden-harness
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-56/v1.5-hadith-fiqh-expansion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --ignore-scripts
      - name: Build production application
        run: npm run build
      - name: Install isolated Chromium harness
        run: |
          rm -rf /tmp/salahos-golden-harness
          mkdir -p /tmp/salahos-golden-harness
          cd /tmp/salahos-golden-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-golden-http.log 2>&1 &
          echo $! >/tmp/salahos-golden-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('Local SalahOS production server did not become ready')
          PY
      - name: Record Stage 56 Knowledge golden
        env:
          SALAHOS_GOLDEN_RECORD: '1'
        run: node scripts/visual-golden-regression.mjs
      - name: Publish helper-free golden commit object
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm .github/workflows/stage56-golden-refresh.yml
          git add tests/golden/knowledge-phone-ar-dark.png
          git commit -m "Stage 56: refresh Knowledge golden baseline"
          echo "CLEAN_GOLDEN_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:stage-56/v1.5-hadith-fiqh-expansion || true
      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-golden-server.pid ]; then
            kill "$(cat /tmp/salahos-golden-server.pid)" 2>/dev/null || true
          fi
