name: Quran Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show Prettier changes
        run: |
          npx prettier --write scripts/visual-quran-navigation-ux.mjs
          git diff -- scripts/visual-quran-navigation-ux.mjs
