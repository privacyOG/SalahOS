name: Manual Location UI

on:
  push:
    branches:
      - agent/manual-location-search

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/manual-location-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/manual-location-search

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Apply manual location search UI
        run: python scripts/apply_manual_location_search_ui.py

      - name: Canonicalize changed files
        run: npx prettier --write src/App.tsx src/i18n/translations.ts src/styles.css src/integration/manualLocationSearch.test.ts src/domain/locationSearch.ts src/domain/locationSearch.test.ts

      - name: Commit UI integration
        run: |
          if git diff --quiet -- src/App.tsx src/i18n/translations.ts src/styles.css src/integration/manualLocationSearch.test.ts src/domain/locationSearch.ts src/domain/locationSearch.test.ts; then
            echo "No UI changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/App.tsx src/i18n/translations.ts src/styles.css src/integration/manualLocationSearch.test.ts src/domain/locationSearch.ts src/domain/locationSearch.test.ts
          git commit -m "feat: integrate offline manual location search"
          git push origin HEAD:agent/manual-location-search
