name: Settings v2 branch preflight

on:
  push:
    branches:
      - stage-22/settings-v2

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/settings-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Settings v2 polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('src/ui/SettingsScreen.tsx')
          text = settings.read_text()
          marker = """  useEffect(() => {\n    const handlePopState = () => {\n      setCategory(readSettingsCategory(window.location.search));\n    };\n    window.addEventListener('popstate', handlePopState);\n    return () => {\n      window.removeEventListener('popstate', handlePopState);\n    };\n  }, []);\n\n"""
          addition = marker + """  useEffect(() => {\n    try {\n      setSettings(loadPersistedSettings(getApplicationStorage()));\n    } catch {\n      // Keep the current in-memory settings if storage cannot be read.\n    }\n  }, [category]);\n\n"""
          if addition not in text:
              if marker not in text:
                  raise SystemExit('SettingsScreen popstate marker not found')
              text = text.replace(marker, addition, 1)
              settings.write_text(text)

          visual = Path('scripts/visual-regression.mjs')
          text = visual.read_text()
          marker = """  {\n    name: 'phone-mosques-en-light',\n"""
          insertion = """  {\n    name: 'phone-settings-en-light',\n    width: 390,\n    height: 844,\n    locale: 'en',\n    theme: 'light',\n    url: '?view=settings',\n    readySelector: '.settings-category-grid',\n  },\n  {\n    name: 'phone-settings-appearance-ar-dark',\n    width: 390,\n    height: 844,\n    locale: 'ar',\n    theme: 'dark',\n    url: '?view=settings&settingsView=appearance',\n    readySelector: '.settings-focus-panel',\n  },\n  {\n    name: 'tablet-settings-prayer-en-light',\n    width: 1024,\n    height: 1366,\n    locale: 'en',\n    theme: 'light',\n    url: '?view=settings&settingsView=prayer',\n    readySelector: '.settings-focus-panel',\n  },\n""" + marker
          if "name: 'phone-settings-en-light'" not in text:
              if marker not in text:
                  raise SystemExit('visual scenario marker not found')
              text = text.replace(marker, insertion, 1)
              visual.write_text(text)
          PY

      - name: Format changed source
        run: npx prettier --write src/ui/SettingsScreen.tsx src/settings-screen.css src/ui/applicationRoute.ts src/ui/applicationRoute.test.ts src/main.tsx scripts/visual-regression.mjs

      - name: Validate branch
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run verify:web-build

      - name: Commit validated polish and remove temporary workflow
        run: |
          rm .github/workflows/settings-v2-preflight.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/ui/SettingsScreen.tsx src/settings-screen.css src/ui/applicationRoute.ts src/ui/applicationRoute.test.ts src/main.tsx scripts/visual-regression.mjs .github/workflows/settings-v2-preflight.yml
          git commit -m "Polish and validate Settings v2 flows"
          git push origin HEAD:stage-22/settings-v2
