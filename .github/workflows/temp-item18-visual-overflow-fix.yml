name: TEMP Item 18 Visual Overflow Fix

on:
  push:
    branches:
      - v1.5.3/item-18-navigation-consolidation
    paths:
      - .github/workflows/temp-item18-visual-overflow-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-18-navigation-consolidation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile intentional navigation ellipsis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = """      const explicitlyClipsContent =
                element.clientWidth > 0 &&
                element.scrollWidth > element.clientWidth + tolerance &&
                (style.overflowX === 'hidden' || style.overflowX === 'clip');

              if (!outsideViewport && !explicitlyClipsContent) continue;"""
          replacement = """      const explicitlyClipsContent =
                element.clientWidth > 0 &&
                element.scrollWidth > element.clientWidth + tolerance &&
                (style.overflowX === 'hidden' || style.overflowX === 'clip');
              const intentionallyEllipsizedNavigationLabel =
                element.classList.contains('congregation-nav-label') &&
                style.textOverflow === 'ellipsis' &&
                style.whiteSpace === 'nowrap' &&
                (style.overflowX === 'hidden' || style.overflowX === 'clip');

              if (
                !outsideViewport &&
                (!explicitlyClipsContent || intentionallyEllipsizedNavigationLabel)
              )
                continue;"""

          changed = []
          for path in Path('scripts').glob('visual-*.mjs'):
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, replacement))
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No visual overflow helper matched the expected pattern')
          print(f'Updated {len(changed)} visual overflow helpers:')
          print('\n'.join(changed))
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format and validate Item 18 gate
        shell: bash
        run: |
          npx prettier --write scripts/visual-*.mjs
          npm run ui:design-system-ownership
          npm run ui:theme-architecture
          npm run format:check
          for file in $(grep -l "intentionallyEllipsizedNavigationLabel" scripts/visual-*.mjs); do node --check "$file"; done
      - name: Retain clean fix commit
        shell: bash
        run: |
          rm .github/workflows/temp-item18-visual-overflow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-*.mjs .github/workflows/temp-item18-visual-overflow-fix.yml
          git commit -m "Allow intentional navigation ellipsis in visual overflow checks"
          echo "ITEM18_FIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-18-navigation-consolidation
