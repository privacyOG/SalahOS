name: TEMP Item 17 Reader Cleanup

on:
  push:
    branches:
      - v1.5.3/item-17-quran-navigation
    paths:
      - .github/workflows/temp-item17-reader-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove obsolete Show More copy and format Item 17 reader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/QuranOfflineReader.tsx')
          text = path.read_text()
          text = text.replace('  showMore: string;\n', '')
          for line in [
              "    showMore: 'عرض المزيد من الآيات',\n",
              "    showMore: 'Daha fazla ayet göster',\n",
              "    showMore: 'Tampilkan ayat lainnya',\n",
          ]:
              text = text.replace(line, '')
          path.write_text(text)
          PY
          npx prettier --write src/ui/QuranOfflineReader.tsx src/quran-offline-reader.css
          git diff --check
          npm run quran:offline:prepare
          npm run quran:offline:check
      - name: Commit retained cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/QuranOfflineReader.tsx src/quran-offline-reader.css
          git commit -m "V1.5.3 Item 17: clean scalable Qur'an reader"
          echo "ITEM17_CLEANUP_COMMIT=$(git rev-parse HEAD)"
      - name: Push retained commit
        run: git push origin HEAD:${GITHUB_REF_NAME}
