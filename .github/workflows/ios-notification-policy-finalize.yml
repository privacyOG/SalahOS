name: iOS Notification Policy Finalization

on:
  push:
    branches:
      - privacyog/ios-notification-policy

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/ios-notification-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Persist lifecycle policy in scheduled requests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scheduler = Path('src/platform/iosNotificationScheduler.ts')
          s = scheduler.read_text()
          import_anchor = "import type { Locale } from '../i18n/translations';\n"
          import_line = "import { iosNotificationPoliciesForRecord } from './iosNotificationPolicy';\n"
          if import_line not in s:
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          old_iface = """interface StoredNotificationExtra {\n  readonly namespace: typeof extraNamespace;\n  readonly record: ScheduledNotificationRecord;\n}\n"""
          new_iface = """interface StoredNotificationExtra {\n  readonly namespace: typeof extraNamespace;\n  readonly record: ScheduledNotificationRecord;\n  readonly deliveryPolicies: ReturnType<typeof iosNotificationPoliciesForRecord>;\n}\n"""
          if new_iface not in s:
              if old_iface not in s:
                  raise SystemExit('StoredNotificationExtra anchor missing')
              s = s.replace(old_iface, new_iface, 1)
          old_extra = "const extra: StoredNotificationExtra = { namespace: extraNamespace, record };"
          new_extra = """const extra: StoredNotificationExtra = {\n      namespace: extraNamespace,\n      record,\n      deliveryPolicies: iosNotificationPoliciesForRecord(record),\n    };"""
          if new_extra not in s:
              if old_extra not in s:
                  raise SystemExit('scheduled extra anchor missing')
              s = s.replace(old_extra, new_extra, 1)
          scheduler.write_text(s)

          test = Path('src/platform/iosNotificationScheduler.test.ts')
          t = test.read_text()
          anchor = """    expect(client.scheduled[0]?.extra).toMatchObject({\n      namespace: 'salahos-prayer-v1',\n      record: futureRecord,\n    });\n"""
          replacement = """    expect(client.scheduled[0]?.extra).toMatchObject({\n      namespace: 'salahos-prayer-v1',\n      record: futureRecord,\n      deliveryPolicies: [\n        { lifecycle: 'foreground', requiresAppBackgroundExecution: false, fullAdhanAutoPlayback: false },\n        { lifecycle: 'background', requiresAppBackgroundExecution: false, fullAdhanAutoPlayback: false },\n        { lifecycle: 'terminated', requiresAppBackgroundExecution: false, fullAdhanAutoPlayback: false },\n      ],\n    });\n"""
          if replacement not in t:
              if anchor not in t:
                  raise SystemExit('scheduler policy assertion anchor missing')
              t = t.replace(anchor, replacement, 1)
          test.write_text(t)

          todo = Path('TODO.md')
          td = todo.read_text()
          replacements = {
            '- [ ] Implement Adhan/notification audio within Apple platform restrictions': '- [x] Implement Adhan/notification audio within Apple platform restrictions',
            '- [ ] Handle background execution limitations explicitly': '- [x] Handle background execution limitations explicitly',
          }
          for before, after in replacements.items():
              if before not in td:
                  raise SystemExit(f'iOS policy tracker marker missing: {before}')
              td = td.replace(before, after, 1)
          anchor = '- [x] Handle background execution limitations explicitly'
          note = '''\n\n**iOS notification/audio lifecycle-policy verification note (2026-08-16):** scheduled SalahOS prayer and Adhan jobs are explicitly system local notifications across foreground, background and terminated app states. Each owned request records the lifecycle policy in its metadata: silent preference or platform-default notification sound, no requirement for SalahOS to execute in the background at delivery time, and no unrestricted/full Adhan recording auto-play. This matches the Apple local-notification model in which the system handles timed delivery while the app is backgrounded or not running; delivery timing still remains subject to system policy and is not represented as guaranteed. The existing runtime-resume path reconciles future requests when SalahOS returns to the foreground. Focused policy tests, scheduler metadata tests, the complete repository quality gate and an Xcode simulator build validate this boundary. User-selectable/full local Adhan recordings remain separately open in Stage 10.\n'''
          td = td.replace(anchor, anchor + note, 1)
          todo.write_text(td)

          status = Path('docs/IOS_VALIDATION_STATUS.md')
          st = status.read_text()
          st += '''\n\n## Notification audio and background lifecycle policy\n\nSalahOS uses scheduled system local notifications rather than requiring application background execution at prayer time. The iOS adapter supports silent alerts or the platform-default notification sound and records foreground/background/terminated delivery policy in SalahOS-owned request metadata. Full Adhan recording auto-play is deliberately not claimed or implemented by this policy; user-selected/local recordings remain a separate feature. iOS may still delay or suppress presentation according to notification authorization, Focus and system policy.\n'''
          status.write_text(st)

          testing = Path('TESTING.md')
          tt = testing.read_text()
          tt += '''\n\n## iOS notification/audio lifecycle policy — 2026-08-16\n\nPolicy tests cover foreground, background and terminated lifecycle states and lock the invariant that scheduled delivery uses the system local-notification path, never depends on SalahOS background execution, and never represents an Adhan alert as full-recording auto-play. Scheduler tests assert the policy metadata is embedded in owned pending requests. macOS CI then runs the complete repository gate, synchronizes the iOS shell and compiles the simulator target.\n'''
          testing.write_text(tt)
          PY
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Synchronize iOS application
        run: npx cap sync ios
      - name: Build iOS simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Commit verified policy
        run: |
          rm .github/workflows/ios-notification-policy-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify iOS notification lifecycle policy [ios-policy-verified]"
          git push origin HEAD:privacyog/ios-notification-policy
