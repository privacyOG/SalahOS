name: V1.6.0 Test Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-diagnostic:
    if: github.head_ref == 'v160-salahos-2026-quran'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests with JSON reporter
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=test-results.json
          status=$?
          echo "$status" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v160-test-diagnostic
          path: |
            test-results.json
            test-exit-code.txt
          retention-days: 1
