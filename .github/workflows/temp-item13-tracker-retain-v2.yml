name: TEMP retain Item 13 tracker v2

on:
  push:
    branches:
      - temp/item13-tracker-retain-v2

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact post-Item-13 main
        uses: actions/checkout@v4
        with:
          ref: db328a6c35a8561a56dfa3de341e8f9f7df00863
          fetch-depth: 0
      - name: Mark only Item 13 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TEMP_TODO_V1.5.3.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## Work Item 13 — Persistent method/madhhab provenance chip')
          end = text.index('## Work Item 14 —', start)
          block = text[start:end]
          if block.count('- [ ]') != 5:
              raise SystemExit(f'Item 13 expected 5 unchecked boxes, found {block.count("- [ ]")}')
          block = block.replace(
              '## Work Item 13 — Persistent method/madhhab provenance chip',
              '## Work Item 13 — Persistent method/madhhab provenance chip — COMPLETE',
              1,
          ).replace('- [ ]', '- [x]')
          updated = text[:start] + block + text[end:]
          if updated[end + len(block) - (end - start):] == '':
              raise SystemExit('unexpected tracker truncation')
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- TEMP_TODO_V1.5.3.md
      - name: Retain tracker commit
        shell: bash
        run: |
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add TEMP_TODO_V1.5.3.md
          git commit -m 'Mark V1.5.3 Item 13 complete'
          echo "RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v1.5.3/item-13-tracker-reconcile || true
