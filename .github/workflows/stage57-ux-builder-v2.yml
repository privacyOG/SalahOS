name: Stage 57 UX builder v2

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement

permissions:
  contents: write

jobs:
  build-stage57:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-57/v1.5-product-ux-refinement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Stage 57 UX refinement robustly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/stage57-ux-builder.yml').read_text()
          match = re.search(
              r"      - name: Apply Stage 57 UX refinement\n        shell: bash\n        run: \|\n(?P<body>.*?)(?=\n      - name: Format Stage 57 files)",
              workflow,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('Unable to extract Stage 57 transformation from builder v1')

          body = textwrap.dedent(match.group('body'))

          brittle_appearance = re.compile(
              r"appearance_block = \"\"\".*?text = text\.replace\(appearance_block, '', 1\)\n",
              flags=re.S,
          )
          robust_appearance = """text, appearance_count = re.subn(
              r\"\\n\\s*\\{category === 'appearance' && \\(\\n.*?\\n\\s*\\)\\}\\n\",
              \"\\n\",
              text,
              count=1,
              flags=re.S,
          )
          if appearance_count != 1:
              raise SystemExit(f'Appearance block replacement count={appearance_count}')
          """
          body, count = brittle_appearance.subn(lambda _: robust_appearance, body, count=1)
          if count != 1:
              raise SystemExit('Unable to harden Appearance block transformation')

          brittle_display = re.compile(
              r"display_marker = \"\"\".*?text = text\.replace\(display_marker, display_replacement, 1\)\n",
              flags=re.S,
          )
          robust_display = """display_pattern = re.compile(
              r\"(\\{category === 'display' && \\(\\s*<section\\s+className=\\\"settings-focus-panel settings-display-entry\\\"\\s+aria-label=\\{copy\\.displayTitle\\}\\s*>\\s*)(<MobilePrayerThemeSettings />)\",
              flags=re.S,
          )
          display_preferences = \"\"\"<div className=\\\"settings-display-preferences\\\">\n    <h2>{copy.appearanceTitle}</h2>\n    <AppearanceSettingsForm settings={settings} updateSettings={updateSettings} />\n  </div>\n  \"\"\"
          text, display_count = display_pattern.subn(
              lambda match: match.group(1) + display_preferences + match.group(2),
              text,
              count=1,
          )
          if display_count != 1:
              raise SystemExit(f'Display block replacement count={display_count}')
          """
          body, display_patch_count = brittle_display.subn(lambda _: robust_display, body, count=1)
          if display_patch_count != 1:
              raise SystemExit('Unable to harden Display block transformation')

          brittle_hero = re.compile(
              r"next_marker = \"\"\".*?text = text\.replace\(next_marker, next_replacement, 1\)\n",
              flags=re.S,
          )
          robust_hero = """current_prayer_markup = \"\"\"<div className=\\\"today-next__current\\\" data-current-prayer>\n  <span>{translate(locale, 'currentPrayer')}</span>\n  <strong>{currentPrayerLabel}</strong>\n</div>\n\"\"\"
          text, hero_count = re.subn(
              r\"(<section className=\\\"today-next\\\" aria-labelledby=\\\"today-next-prayer\\\">\\s*)\",
              lambda match: match.group(1) + current_prayer_markup,
              text,
              count=1,
          )
          if hero_count != 1:
              raise SystemExit(f'Today hero replacement count={hero_count}')
          """
          body, hero_patch_count = brittle_hero.subn(lambda _: robust_hero, body, count=1)
          if hero_patch_count != 1:
              raise SystemExit('Unable to harden Today hero transformation')

          brittle_dates = re.compile(
              r"dates_marker = \"\"\".*?text = text\.replace\(dates_marker, local_context, 1\)\n",
              flags=re.S,
          )
          robust_dates = """local_context_markup = \"\"\"<section className=\\\"today-local-context\\\" aria-label={uxCopy.localContext}>\n  <div\n    className=\\\"today-location-confidence\\\"\n    data-location-confidence={\n      recentLocation?.isApproximate === true\n        ? 'approximate'\n        : recentLocation === null\n          ? 'saved'\n          : 'precise'\n    }\n  >\n    <div>\n      <span>{uxCopy.localContext}</span>\n      <strong>{locationSourceLabel}</strong>\n    </div>\n    <div className=\\\"today-location-confidence__meta\\\">\n      <span>{locationConfidenceLabel}</span>\n      {locationAccuracyLabel !== null && <span>{locationAccuracyLabel}</span>}\n      <span dir=\\\"auto\\\">{contextLabel}</span>\n    </div>\n  </div>\n  {modules.weather && <PrayerBoardWeatherModule weather={weather} locale={locale} />}\n</section>\n\n\"\"\"
          text, dates_count = re.subn(
              r\"(\\n\\s*\\{modules\\.dates && \\(\\n)\",
              lambda match: '\\n' + local_context_markup + match.group(1),
              text,
              count=1,
          )
          if dates_count != 1:
              raise SystemExit(f'Today local-context replacement count={dates_count}')
          """
          body, dates_patch_count = brittle_dates.subn(lambda _: robust_dates, body, count=1)
          if dates_patch_count != 1:
              raise SystemExit('Unable to harden Today local-context transformation')

          brittle_secondary = re.compile(
              r"contextual_block = \"\"\".*?text = text\.replace\(footer_end, footer_replacement, 1\)\n",
              flags=re.S,
          )
          robust_secondary = """context_match = re.search(
              r\"\\n\\s*<TodayContextualSections\\n.*?\\n\\s*/>\\n\",
              text,
              flags=re.S,
          )
          if context_match is None:
              raise SystemExit('Today contextual sections block missing')
          contextual_markup = context_match.group(0)
          text = text[:context_match.start()] + '\\n' + text[context_match.end():]
          details_open = \"\"\"\n<details className=\\\"today-secondary-context\\\">\n  <summary>\n    <span>{uxCopy.moreToday}</span>\n    <small>{uxCopy.moreTodayHint}</small>\n  </summary>\n  <div className=\\\"today-secondary-context__content\\\">\n\"\"\"
          text, secondary_open_count = re.subn(
              r\"(\\n\\s*\\{modules\\['sunrise-sunset'\\] && \\(\\n)\",
              lambda match: contextual_markup + details_open + match.group(1),
              text,
              count=1,
          )
          if secondary_open_count != 1:
              raise SystemExit(f'Today secondary disclosure opening count={secondary_open_count}')
          text, secondary_close_count = re.subn(
              r\"(\\n\\s*</footer>)(\\n\\s*</>\\n)\",
              lambda match: match.group(1) + '\\n  </div>\\n</details>' + match.group(2),
              text,
              count=1,
          )
          if secondary_close_count != 1:
              raise SystemExit(f'Today secondary disclosure closing count={secondary_close_count}')
          """
          body, secondary_patch_count = brittle_secondary.subn(lambda _: robust_secondary, body, count=1)
          if secondary_patch_count != 1:
              raise SystemExit('Unable to harden Today secondary-content transformation')

          Path('/tmp/stage57-apply.sh').write_text(body)
          PY
          bash /tmp/stage57-apply.sh

      - name: Fix Stage 57 validation issues semantically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          today = Path('src/ui/TodayScreen.tsx')
          text = today.read_text()
          marker = 'const locationAccuracyLabel ='
          marker_index = text.find(marker)
          if marker_index == -1:
              raise SystemExit('Location accuracy declaration missing')
          line_start = text.rfind('\n', 0, marker_index) + 1
          declaration_end = text.find(';', marker_index)
          if declaration_end == -1:
              raise SystemExit('Location accuracy declaration end missing')
          declaration_end += 1
          replacement = """  const locationAccuracyMeters =
    recentLocation === null ? null : recentLocation.accuracyMeters;
  const locationAccuracyLabel =
    locationAccuracyMeters === null
      ? null
      : locationAccuracyMeters < 1_000
        ? `±${String(Math.round(locationAccuracyMeters))} m`
        : `±${(locationAccuracyMeters / 1_000).toFixed(1)} km`;"""
          text = text[:line_start] + replacement + text[declaration_end:]
          today.write_text(text)

          visual = Path('scripts/visual-product-ux-stage8.mjs')
          text = visual.read_text()
          hierarchy = 'const hierarchy = await page.evaluate(() => {'
          hierarchy_index = text.find(hierarchy)
          if hierarchy_index == -1:
              raise SystemExit('Stage 57 hierarchy assertion missing')
          hierarchy_line_start = text.rfind('\n', 0, hierarchy_index) + 1
          indent = text[hierarchy_line_start:hierarchy_index]
          close_more = f"{indent}await page.locator('.congregation-nav-item--more').click();\n\n"
          text = text[:hierarchy_line_start] + close_more + text[hierarchy_line_start:]
          visual.write_text(text)
          PY

      - name: Format Stage 57 files
        run: |
          npx prettier --write \
            src/ui/applicationRoute.ts \
            src/ui/applicationRoute.test.ts \
            src/ui/SettingsScreen.tsx \
            src/ui/SalahIcon.tsx \
            src/ui/PrimaryNavigation.tsx \
            src/ui/CongregationShell.tsx \
            src/ui/MobilePrayerThemeSurface.tsx \
            src/ui/TodayScreen.tsx \
            src/congregation-shell.css \
            src/today-screen.css \
            src/ui/prayer-board-weather.css \
            src/settings-screen.css \
            scripts/visual-product-ux-stage8.mjs \
            docs/PRODUCT_UX_V1.5.md \
            package.json

      - name: Validate Stage 57 source
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Publish validated helper-free candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm -f .github/stage57-finalizer.py || true
          git rm -f .github/workflows/stage57-*.yml || true
          git add -A
          git commit -m "Stage 57: refine product UX"
          echo "VALIDATED_STAGE57_COMMIT=$(git rev-parse HEAD)"
          git push --force origin HEAD:refs/heads/stage57-validated-candidate
