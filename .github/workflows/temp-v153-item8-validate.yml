name: Temporary v1.5.3 Item 8 Validation

on:
  push:
    branches:
      - v1.5.3-work-item-8

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[item8-validate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply lean Item 8 implementation
        run: python3 scripts/temp-implement-v153-item8-lean.py
      - name: Format
        run: npx prettier src/domain/islamicKnowledgeStage7.ts src/domain/islamicKnowledgeStage7.test.ts src/platform/hadithExternalActions.ts src/platform/hadithExternalActions.test.ts src/ui/KnowledgeStage7Details.tsx src/ui/KnowledgeScreen.tsx src/ui/HadithHonestyV153.test.tsx src/islamic-knowledge.css scripts/check-remote-network-policy.mjs --write
      - name: Required Item 8 gate
        run: npm run knowledge:content:check && npm run typecheck && npm run lint && npm run test
      - name: Theme and bundle regression
        run: npm run ui:theme-architecture && npm run ui:design-system-ownership && npm run build && npm run bundle:size
      - name: Publish validated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/islamicKnowledgeStage7.ts src/domain/islamicKnowledgeStage7.test.ts src/platform/hadithExternalActions.ts src/platform/hadithExternalActions.test.ts src/ui/KnowledgeStage7Details.tsx src/ui/KnowledgeScreen.tsx src/ui/HadithHonestyV153.test.tsx src/islamic-knowledge.css scripts/check-remote-network-policy.mjs
          git commit -m '[item8-validated] Hadith honesty typography and scope'
          git tag -f temp-v153-item8-validated
          git push --force origin refs/tags/temp-v153-item8-validated
