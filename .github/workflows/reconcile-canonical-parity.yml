name: Canonical parity reconciliation

on:
  push:
    branches:
      - privacyog/canonical-parity-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[parity-reconcile]') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Reconcile tracker and validation evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo = Path('TODO.md')
          text = todo.read_text()
          replacements = {
              '- [~] Implement and verify Muslim World League method': '- [x] Implement and verify Muslim World League method',
              '- [~] Implement and verify Egyptian method': '- [x] Implement and verify Egyptian method',
              '- [~] Implement and verify ISNA method': '- [x] Implement and verify ISNA method',
              '- [~] Compare against canonical calculation implementation': '- [x] Compare against canonical calculation implementation',
              '**Method-registry note (2026-08-16):** built-in numerical parameters are centralized and cross-checked against pinned/reference sources. MWL, Umm al-Qura, Egyptian, Karachi, ISNA, MUIS, Kuwait and Qatar are tagged `cross-checked-reference`; Diyanet/Turkey and Dubai remain `pending-authoritative-source` because the upstream references themselves describe those profiles as approximation/experimental or require unmodelled offsets. Institutional timetable parity remains a separate requirement from parameter agreement.': '**Method-registry reconciliation note (2026-08-17):** built-in numerical parameters remain centralized and cross-checked against pinned/reference sources. Exact canonical Adhan JS 4.4.4 output fixtures now verify MWL, Egyptian and ISNA within the fixed two-minute model/rounding tolerance. The Turkey interoperability profile also now models the pinned canonical per-event offsets (Sunrise -7, Dhuhr +5, Asr +4, Maghrib +7) and passes its Istanbul fixture, while remaining `pending-authoritative-source` because canonical-library parity is not official Diyanet institutional timetable certification. Dubai remains pending authoritative/offset validation; Karachi remains implemented and parameter-cross-checked but lacks a frozen direct canonical output fixture in this suite.',
              '**Stage 2 verification note (2026-08-16):** Adhan JS `4.4.4` is pinned at commit `a6f1a5c4a00105103f310ef18200b95f7184d2e7`; PrayTimes and AlAdhan method definitions are documented as additional cross-checks in `docs/PRAYER_METHOD_REFERENCES.md`. Read-only Quality Gate run `31900274451` passed frozen external timetable parity fixtures for Makkah/Umm al-Qura, Singapore/MUIS, Doha/Qatar and Kuwait City/Kuwait within the published/reference adjustment ranges. The broader geographic matrix and direct canonical-algorithm parity remain open.': '**Stage 2 reconciliation note (2026-08-17):** Adhan JS `4.4.4` remains pinned at commit `a6f1a5c4a00105103f310ef18200b95f7184d2e7`; PrayTimes and AlAdhan remain independent cross-checks in `docs/PRAYER_METHOD_REFERENCES.md`. PR #93 added frozen direct canonical output fixtures for ISNA/North America, Muslim World League, Egyptian, Turkey interoperability and MUIS/Singapore, comparing all six displayed daily events at an unchanged two-minute tolerance. Exact PR head `c41a845dc38d6c604045abdf2588be16081b95b5` passed Quality Gate `31992557611` and Android Build `31992557906` on EVO-X2. Earlier external timetable parity fixtures remain valid for Makkah/Umm al-Qura, Singapore/MUIS, Doha/Qatar and Kuwait City/Kuwait. Direct canonical implementation comparison is therefore complete for the defined frozen v1 reference set; institutional certification remains separately tracked where applicable.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing TODO replacement target: {old[:80]}')
              text = text.replace(old, new, 1)
          todo.write_text(text)

          validation = Path('docs/VALIDATION_2026-08-17.md')
          vtext = validation.read_text()
          vtext = vtext.replace(
              '- remaining calculation-method authoritative/reference work and direct canonical comparison;',
              '- remaining calculation-method authoritative/reference work where institutional or frozen direct-fixture evidence is still incomplete (notably Diyanet institutional parity, Dubai and Karachi);',
              1,
          )
          section = '''\n## Direct canonical prayer-calculation parity\n\nPR #93 merged after adding frozen direct-output parity against Adhan JS 4.4.4 commit `a6f1a5c4a00105103f310ef18200b95f7184d2e7`. The suite covers ISNA/North America, Muslim World League, Egyptian, Turkey interoperability and MUIS/Singapore across all six displayed daily events.\n\nThe initial Turkey fixture exposed a real seven-minute Sunrise discrepancy because SalahOS modelled only the 18°/17° twilight angles. The engine now supports method-owned adjustments independently from user/manual offsets, and the Turkey interoperability profile records the pinned canonical adjustments of Sunrise -7, Dhuhr +5, Asr +4 and Maghrib +7 minutes. Prayer provenance records method and manual adjustment minutes separately.\n\nExact PR head `c41a845dc38d6c604045abdf2588be16081b95b5` passed Quality Gate `31992557611` and Android Build `31992557906` on EVO-X2. The canonical comparison retained the existing two-minute tolerance; it was not widened to make the Turkey fixture pass.\n\nThis closes the v1 tracker item for direct canonical implementation comparison and upgrades MWL, Egyptian and ISNA verification. It does not claim official Diyanet institutional timetable certification, and it does not close the remaining Dubai or Karachi evidence gaps.\n'''
          anchor = '\n## Remaining release blockers\n'
          if section.strip() not in vtext:
              if anchor not in vtext:
                  raise SystemExit('Validation anchor not found')
              vtext = vtext.replace(anchor, section + anchor, 1)
          validation.write_text(vtext)
          PY

      - name: Verify formatting
        run: npx prettier --write TODO.md docs/VALIDATION_2026-08-17.md

      - name: Commit reconciliation
        run: |
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md docs/VALIDATION_2026-08-17.md
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile canonical prayer parity evidence [parity-reconcile]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
