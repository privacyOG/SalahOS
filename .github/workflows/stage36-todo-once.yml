name: Stage 36 tracker update once

on:
  push:
    branches:
      - 'validation/stage-36-final-quality'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/stage-36-final-quality
      - name: Mark Stage 36 complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TODO.md')
          text = path.read_text()
          old = '- [ ] Remote administration for managed mosque displays'
          new = '- [x] Remote administration for managed mosque displays'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Stage 36 tracker row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/stage36-todo-once.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md .github/workflows/stage36-todo-once.yml
          git commit -m 'Mark Stage 36 remote administration complete'
          git push origin HEAD:validation/stage-36-final-quality
