name: TEMP Item 17 Wire Reader V2

on:
  push:
    branches:
      - v1.5.3/item-17-quran-navigation
    paths:
      - .github/workflows/temp-item17-wire-reader-v2.yml

permissions:
  contents: write

jobs:
  wire-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run corrected Item 17 reader wiring
        shell: bash
        run: |
          python3 - <<'PYWRAP'
          from pathlib import Path

          workflow = Path('.github/workflows/temp-item17-wire-reader.yml').read_text()
          workflow = workflow.replace(
              '              "    surah: \'Surah\',":',
              '              "    surah: \'Surah\',\\n    showMore: \'Show more ayat\',":',
              1,
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'item17-reader-wire.py', 'exec'))
          PYWRAP

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit retained reader wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/QuranOfflineReader.tsx src/quran-offline-reader.css
          git commit -m "V1.5.3 Item 17: wire scalable Qur'an reader"
          echo "ITEM17_RETAINED_COMMIT=$(git rev-parse HEAD)"

      - name: Push retained commit
        run: git push origin HEAD:${GITHUB_REF_NAME}
