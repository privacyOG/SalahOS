name: Prepare v1.1.0 distribution metadata

on:
  push:
    branches:
      - privacyog/v1.1.0-release-distribution

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: privacyog/v1.1.0-release-distribution

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align package metadata
        run: npm version 1.1.0 --no-git-tag-version

      - name: Align native versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path('android/app/build.gradle')
          text = android.read_text()
          text, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 2', text)
          text, name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.1.0"', text)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f'Unexpected Android version fields: code={code_count}, name={name_count}')
          android.write_text(text)

          project = Path('ios/App/App.xcodeproj/project.pbxproj')
          text = project.read_text()
          text, marketing_count = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 1.1.0;', text)
          text, build_count = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 2;', text)
          if marketing_count < 1 or build_count < 1:
              raise SystemExit(
                  f'iOS version settings not found: MARKETING_VERSION={marketing_count}, CURRENT_PROJECT_VERSION={build_count}'
              )
          project.write_text(text)
          print(f'Updated iOS version settings: marketing={marketing_count}, build={build_count}')
          PY

      - name: Add v1.1.0 changelog entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          heading = '## 1.1.0 — Downloadable release assets and canonical branding\n'
          if heading not in text:
              marker = '# Changelog\n'
              lines = [
                  '# Changelog',
                  '',
                  '## 1.1.0 — Downloadable release assets and canonical branding',
                  '',
                  "- Adopt the project owner's canonical SalahOS logo and icon across Web/PWA, Android, iOS and smart-display surfaces.",
                  '- Add reproducible source/hash/dimension validation for the canonical platform icon set.',
                  '- Add GitHub release packaging for Web/PWA and Raspberry Pi/kiosk bundles.',
                  '- Add a signed Android release APK pipeline that refuses to publish unsigned or debug APKs.',
                  '- Add SHA-256 checksum publication for downloadable release assets.',
                  '- Document the current distribution boundary: iOS IPA awaits Apple distribution signing and macOS DMG awaits a real macOS application target.',
                  '',
              ]
              if marker not in text:
                  raise SystemExit('CHANGELOG heading not found')
              text = text.replace(marker, '\n'.join(lines), 1)
              path.write_text(text)
          PY

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write package.json package-lock.json android/app/build.gradle CHANGELOG.md docs/RELEASE_ASSETS.md scripts/release-packaging.test.mjs .github/workflows/release-assets.yml
          npm ci --ignore-scripts
          npm run check
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.1.0'||l.version!=='1.1.0'||l.packages[''].version!=='1.1.0') process.exit(1)"
          grep -F 'versionCode 2' android/app/build.gradle
          grep -F 'versionName "1.1.0"' android/app/build.gradle
          grep -F 'MARKETING_VERSION = 1.1.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -F 'CURRENT_PROJECT_VERSION = 2;' ios/App/App.xcodeproj/project.pbxproj
          git diff --check

      - name: Commit preparation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          rm -f .github/workflows/prepare-v1.1-release.yml
          git add -A
          git diff --cached --check
          git commit -m 'Prepare SalahOS v1.1.0 downloadable releases'
          git push origin HEAD:privacyog/v1.1.0-release-distribution
