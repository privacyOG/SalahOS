name: Stage 24 Object Transfer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage24-object-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-24/admin-shell-overview
          fetch-depth: 0
      - name: Create exact lint correction object
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/AdminOverviewDashboard.tsx')
          source = path.read_text()
          replacements = {
              "          <button type=\"button\" onClick={() => navigate('prayer-iqamah')}>\n": "          <button\n            type=\"button\"\n            onClick={() => {\n              navigate('prayer-iqamah');\n            }}\n          >\n",
              "          <button type=\"button\" onClick={() => navigate('community')}>\n": "          <button\n            type=\"button\"\n            onClick={() => {\n              navigate('community');\n            }}\n          >\n",
              "          <button type=\"button\" onClick={() => navigate('displays')}>\n": "          <button\n            type=\"button\"\n            onClick={() => {\n              navigate('displays');\n            }}\n          >\n",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit('Expected quick-action callback not found')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          git add src/ui/AdminOverviewDashboard.tsx
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m "Fix Stage 24 overview callback lint"
          git push origin HEAD:stage-24/admin-shell-overview
