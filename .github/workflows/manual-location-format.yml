name: Manual Location Format

on:
  push:
    branches:
      - agent/manual-location-search

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/manual-location-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/manual-location-search

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Canonicalize location files
        run: npx prettier --write src/data/ianaPrincipalLocations.json src/domain/locationSearch.ts src/domain/locationSearch.test.ts

      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/data/ianaPrincipalLocations.json src/domain/locationSearch.ts src/domain/locationSearch.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/data/ianaPrincipalLocations.json src/domain/locationSearch.ts src/domain/locationSearch.test.ts
          git commit -m "style: canonicalize location search files"
          git push origin HEAD:agent/manual-location-search
