name: TEMP V1.5.3 Item 14 hosted exact gate v2

on:
  push:
    branches:
      - temp/item14-hosted-exact-gate-v2

permissions:
  contents: read

jobs:
  item14-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact formatted Item 14 head
        uses: actions/checkout@v4
        with:
          ref: 4f3904b716414e5778734bbbf81776b8ace80f0d
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without audit network call
        run: npm ci --ignore-scripts --no-audit
      - name: Format check
        run: npm run format:check
      - name: Item 14 gate
        run: npm run typecheck && npm run lint && npm run test
