name: Dependency License Tracker

on:
  push:
    branches:
      - agent/dependency-license-review

permissions:
  contents: write

jobs:
  record:
    if: github.ref == 'refs/heads/agent/dependency-license-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-license-review

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Record dependency license verification
        run: python scripts/record_dependency_license_verification.py

      - name: Canonicalize tracker evidence
        run: npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        run: |
          if git diff --quiet -- TODO.md TESTING.md; then
            echo "No tracker changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add TODO.md TESTING.md
          git commit -m "docs: verify dependency license review"
          git push origin HEAD:agent/dependency-license-review
