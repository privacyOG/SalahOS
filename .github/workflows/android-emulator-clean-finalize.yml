name: Android Emulator Clean Finalization

on:
  push:
    branches:
      - privacyog/android-emulator-clean

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-emulator-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Transplant validated emulator assets
        run: |
          git fetch origin privacyog/android-emulator-acceptance
          git checkout origin/privacyog/android-emulator-acceptance -- scripts/android-emulator-acceptance.sh android/app/src/androidTest/java/com/privacyog/salahos/MainActivityInstrumentedTest.java
          git rm -f android/app/src/androidTest/java/com/getcapacitor/myapp/ExampleInstrumentedTest.java
      - name: Record validated emulator evidence
        env:
          VALIDATION_RUN: '31941025342'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const replacements = [
            ['- [ ] Test offline cold start', '- [x] Test offline cold start'],
            ['- [ ] Test orientation changes', '- [x] Test orientation changes'],
            ['- [ ] Run on real Android device or emulator and record evidence', '- [x] Run on real Android device or emulator and record evidence'],
          ];
          for (const [before, after] of replacements) {
            if (!todo.includes(before)) throw new Error(`Android tracker marker missing: ${before}`);
            todo = todo.replace(before, after);
          }
          const marker = '- [x] Run on real Android device or emulator and record evidence';
          const markerIndex = todo.indexOf(marker);
          const insertion = todo.indexOf('\n\n---\n\n## 9. iOS / iPadOS application', markerIndex);
          if (insertion < 0) throw new Error('Android evidence insertion point missing');
          const note = `\n\n**Android emulator acceptance note (2026-08-16):** validation run \`${process.env.VALIDATION_RUN}\` executed SalahOS on an Android 35 x86_64 Pixel-class emulator. Airplane mode was enabled before installing, force-stopping and cold-launching \`com.privacyog.salahos/.MainActivity\`; Android Activity Manager reported \`Status: ok\`, \`LaunchState: COLD\`, and a live SalahOS process. The app-only instrumentation task completed 1/1 tests with zero failures while verifying the real application id, airplane mode, landscape recreation, portrait recreation and activity survival. The stale generated \`com.getcapacitor.app\` test was removed. This is emulator evidence, not a claim about every physical OEM device.`;
          todo = todo.slice(0, insertion) + note + todo.slice(insertion);
          fs.writeFileSync('TODO.md', todo);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          testing += `\n\n### 2026-08-16 — Android emulator acceptance\n\n- Validation run \`${process.env.VALIDATION_RUN}\` ran on an Android 35 x86_64 Pixel-class emulator.\n- Airplane mode was enabled before an explicit force-stop and cold launch of \`com.privacyog.salahos/.MainActivity\`; Activity Manager reported \`Status: ok\` and \`LaunchState: COLD\`, and the process remained alive.\n- \`:app:connectedDebugAndroidTest\` completed 1/1 tests with zero failures while asserting the real application id, airplane mode, landscape and portrait recreation, and activity survival.\n- The stale generated package-name test was removed. Physical-OEM-specific behavior remains outside this emulator acceptance result.\n`;
          fs.writeFileSync('TESTING.md', testing);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          android += `\n\n## Emulator acceptance\n\nValidation run \`${process.env.VALIDATION_RUN}\` enabled airplane mode, performed a force-stop/cold launch of the real SalahOS activity, confirmed the process was alive, and passed app-only landscape/portrait instrumentation. The committed script and instrumentation test preserve this repeatable acceptance path; manufacturer-specific physical-device behavior remains device-dependent.\n`;
          fs.writeFileSync('docs/ANDROID.md', android);
          NODE
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Commit verified clean batch
        run: |
          rm .github/workflows/android-emulator-clean-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify Android emulator acceptance [emulator-clean-verified]"
          git push origin HEAD:privacyog/android-emulator-clean
