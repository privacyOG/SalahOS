name: Stage 24 Format Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage24-format-export.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Stage 24 visual script
        run: |
          npx prettier --write scripts/visual-admin-shell-overview.mjs
          mkdir -p stage24-format
          cp scripts/visual-admin-shell-overview.mjs stage24-format/
      - uses: actions/upload-artifact@v4
        with:
          name: stage24-format-${{ github.sha }}
          path: stage24-format/visual-admin-shell-overview.mjs
          retention-days: 1
