name: Temporary v1.5.1 alpha-aware theme matrix formatter check

on:
  push:
    branches:
      - utility/v151-alpha-matrix-check4
    paths:
      - .github/workflows/temporary-v151-alpha-matrix-check4.yml

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier scripts/check-theme-stage45.mjs > /tmp/check-theme-stage45.formatted.mjs
          diff -u scripts/check-theme-stage45.mjs /tmp/check-theme-stage45.formatted.mjs || true
          echo '--- formatted file ---'
          cat /tmp/check-theme-stage45.formatted.mjs
