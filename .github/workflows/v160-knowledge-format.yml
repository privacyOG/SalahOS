name: V1.6.0 Knowledge Format Validation

on:
  push:
    branches:
      - v160-knowledge-disclosure-language

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-knowledge-disclosure-language
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format and validate Knowledge change
        run: |
          npx prettier --write src/ui/KnowledgeStage7Details.tsx
          npm run lint
          npm run typecheck
          npx vitest run src/ui/KnowledgeDisclosureV160.test.ts src/ui/KnowledgeTextDirection.test.tsx
      - name: Publish clean formatted commit
        run: |
          rm .github/workflows/v160-knowledge-format.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/KnowledgeStage7Details.tsx .github/workflows/v160-knowledge-format.yml
          git commit -m "style(knowledge): apply canonical formatting"
          git push origin HEAD:v160-knowledge-disclosure-language
