name: Temp Quran visual formatter

on:
  push:
    branches:
      - temp/format-quran-visual

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write scripts/visual-quran-offline-reader.mjs
          git diff -- scripts/visual-quran-offline-reader.mjs
