name: Format Troubleshooting Docs

on:
  push:
    branches:
      - agent/troubleshooting-docs

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/troubleshooting-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/troubleshooting-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Documentation link verification
        run: npm run docs:links

      - name: Canonicalize documentation files
        run: npx prettier --write scripts/check-doc-links.mjs docs/TROUBLESHOOTING.md README.md

      - name: Commit formatted files
        run: |
          if git diff --quiet -- scripts/check-doc-links.mjs docs/TROUBLESHOOTING.md README.md; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add scripts/check-doc-links.mjs docs/TROUBLESHOOTING.md README.md
          git commit -m "style: format troubleshooting documentation"
          git push origin HEAD:agent/troubleshooting-docs
