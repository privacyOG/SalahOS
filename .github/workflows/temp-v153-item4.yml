name: Temporary v1.5.3 Item 4 Cleanup

on:
  push:
    branches: [v1.5.3-work-item-4]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[item4-cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete temporary validation tag
        run: git push origin :refs/tags/temp-v153-item4-generated
