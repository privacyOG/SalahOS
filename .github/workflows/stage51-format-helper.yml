name: Stage 51 Format Helper

on:
  pull_request:
    paths:
      - '.github/workflows/stage51-format-helper.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'stage-51/v1.4-performance-architecture'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Stage 51 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format Stage 51 authored files and create commit object
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            scripts/check-bundle-size.mjs
            scripts/check-ui-v2-retirement.mjs
          )

          npm ci --ignore-scripts
          npx prettier --write "${FILES[@]}"
          npx prettier --check "${FILES[@]}"

          BASE_TREE="$(gh api "repos/${REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')"
          TREE_ENTRIES='[]'
          for file in "${FILES[@]}"; do
            blob="$(jq -Rs '{content: ., encoding: "utf-8"}' < "$file" | gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha')"
            TREE_ENTRIES="$(jq --arg path "$file" --arg sha "$blob" '. + [{path:$path, mode:"100644", type:"blob", sha:$sha}]' <<< "$TREE_ENTRIES")"
          done

          TREE_SHA="$(jq -n --arg base_tree "$BASE_TREE" --argjson tree "$TREE_ENTRIES" '{base_tree:$base_tree, tree:$tree}' | gh api --method POST "repos/${REPOSITORY}/git/trees" --input - --jq '.sha')"
          GENERATED_COMMIT="$(jq -n --arg message 'Stage 51: apply canonical formatting' --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" '{message:$message, tree:$tree, parents:[$parent]}' | gh api --method POST "repos/${REPOSITORY}/git/commits" --input - --jq '.sha')"
          echo "STAGE51_FORMATTED_COMMIT=${GENERATED_COMMIT}"
