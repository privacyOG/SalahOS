name: Stage 33 tracker reconciliation

on:
  push:
    branches:
      - 'stage-33/community-updates'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-33/community-updates
          fetch-depth: 0

      - name: Mark announcements and events roadmap item complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TODO.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] Mosque announcements/events'
          new = '- [x] Mosque announcements/events'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one open mosque announcements/events roadmap item')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/stage33-tracker-reconcile.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md
          git commit -m "Mark Stage 33 community roadmap complete"
          git push origin HEAD:stage-33/community-updates
