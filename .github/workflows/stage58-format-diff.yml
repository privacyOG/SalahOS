name: Stage 58 Format Diagnostic

on:
  pull_request:
    paths:
      - docs/REAL_WORLD_VERIFICATION_V1.5.md
      - scripts/visual-real-world-verification-v15.mjs
      - src/domain/mosqueDirectoryStage9.test.ts
      - .github/workflows/stage58-format-diff.yml

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Generate exact Prettier diff
        run: |
          npx prettier --write \
            docs/REAL_WORLD_VERIFICATION_V1.5.md \
            scripts/visual-real-world-verification-v15.mjs \
            src/domain/mosqueDirectoryStage9.test.ts
          git diff -- \
            docs/REAL_WORLD_VERIFICATION_V1.5.md \
            scripts/visual-real-world-verification-v15.mjs \
            src/domain/mosqueDirectoryStage9.test.ts
