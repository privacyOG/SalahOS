name: Format Build Documentation

on:
  push:
    branches:
      - agent/web-build-deployment-docs

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/web-build-deployment-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/web-build-deployment-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Canonicalize build documentation
        run: npx prettier --write BUILD.md

      - name: Commit formatted documentation
        run: |
          if git diff --quiet -- BUILD.md; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add BUILD.md
          git commit -m "style: format build documentation"
          git push origin HEAD:agent/web-build-deployment-docs
