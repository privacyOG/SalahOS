name: Integrate Android Native Foundation

on:
  push:
    branches:
      - agent/android-native-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/android-native-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/android-native-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install existing dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Capacitor Android dependencies
        run: |
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/geolocation@8.2.0
          npm install --save-dev --save-exact @capacitor/cli@8.4.2

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Apply Android integration
        run: python scripts/apply_android_native_foundation.py

      - name: Sync Android project
        run: npx cap sync android

      - name: Canonicalize TypeScript and configuration
        run: npx prettier --write package.json capacitor.config.ts src/App.tsx src/platform/currentLocation.ts src/platform/currentLocation.test.ts

      - name: Repository quality gate
        run: npm run check

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit Android native foundation
        run: |
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add .prettierignore eslint.config.js package.json package-lock.json capacitor.config.ts src/App.tsx src/platform/currentLocation.ts src/platform/currentLocation.test.ts android
          if git diff --cached --quiet; then
            echo "No Android foundation changes required"
            exit 0
          fi
          git commit -m "feat: add Android native foundation"
          git push origin HEAD:agent/android-native-foundation
