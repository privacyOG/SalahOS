name: Format Touch Display Fixture

on:
  push:
    branches:
      - agent/touch-display-layout-fixture

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/touch-display-layout-fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/touch-display-layout-fixture

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository policies
        run: npm run security:sensitive-files && npm run security:audit && npm run security:licenses && npm run docs:links && python scripts/generate_pwa_icons.py --check

      - name: Canonicalize fixture component
        run: npx prettier --write src/ui/TouchDisplayFixture.tsx

      - name: Commit formatted component
        run: |
          if git diff --quiet -- src/ui/TouchDisplayFixture.tsx; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/ui/TouchDisplayFixture.tsx
          git commit -m "style: format Touch Display fixture"
          git push origin HEAD:agent/touch-display-layout-fixture
