name: TEMP externalize Australian mosque runtime catalogue v3

on:
  push:
    branches:
      - release/bundle-budget-recovery

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/bundle-budget-recovery
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse hardened patch with whitespace-tolerant JSX edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/temp-bundle-data-externalize-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch = textwrap.dedent(workflow[start:end])

          def replace_block(label, replacement):
              global patch
              pattern = re.compile(
                  r"panel = replace_exact\(\n.*?\n\s*'" + re.escape(label) + r"',\n\s*\)\n",
                  re.S,
              )
              patch, count = pattern.subn(replacement, patch, count=1)
              if count != 1:
                  raise SystemExit(f'Could not replace v2 patch block: {label}')

          replace_block(
              'panel search disabled state',
              """search_pattern = re.compile(r'(type=\"search\"\\s+value=\\{query\\})(?=\\s+placeholder=)')
          panel, search_count = search_pattern.subn(
              lambda match: match.group(1) + '\\n            disabled={directory === null}',
              panel,
              count=1,
          )
          if search_count != 1:
              raise SystemExit(f'panel search disabled state: expected 1 structural match, found {search_count}')
          """,
          )
          replace_block(
              'panel alphabetical disabled state',
              """alpha_pattern = re.compile(r'(aria-pressed=\\{!sortByDistance\\})(?=\\s+onClick=)')
          panel, alpha_count = alpha_pattern.subn(
              lambda match: match.group(1) + '\\n            disabled={directory === null}',
              panel,
              count=1,
          )
          if alpha_count != 1:
              raise SystemExit(f'panel alphabetical disabled state: expected 1 structural match, found {alpha_count}')
          """,
          )
          replace_block(
              'panel footer close',
              """footer_close_pattern = re.compile(r'(?m)^(?P<i>\\s*)</footer>\\n(?P=s)</section>$'.replace('(?P=s)', r'(?P=i)'))
          footer_close_match = re.search(r'(?m)^(?P<i>\\s*)</footer>\\n(?P<j>\\s*)</section>$', panel)
          if footer_close_match is None:
              raise SystemExit('panel footer close: structural closing tags were not found')
          footer_indent = footer_close_match.group('i')
          section_indent = footer_close_match.group('j')
          panel = panel[:footer_close_match.start()] + (
              f'{footer_indent}  </footer>\\n'
              f'{section_indent}  )}}\\n'
              f'{section_indent}</section>'
          ) + panel[footer_close_match.end():]
          """,
          )

          exec(compile(patch, 'temp-bundle-data-externalize-v2.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed text sources
        run: |
          npx prettier --write \
            vite.config.ts \
            src/domain/australianMosqueDirectoryCombined.ts \
            src/domain/australianMosqueDirectoryCombined.test.ts \
            src/domain/australianMosquePrayerContext.test.ts \
            src/platform/australianMosqueDirectoryAsset.ts \
            src/platform/australianMosqueDirectoryAsset.test.ts \
            src/ui/AustralianMosqueDirectoryPanel.tsx \
            src/i18n/australianMosqueDirectoryTranslations.ts \
            scripts/generate-mosque-directory-packs.mjs \
            scripts/generate-australian-mosque-combined.mjs \
            scripts/check-remote-network-policy.mjs \
            scripts/visual-australian-mosque-directory.mjs \
            directory-service/server.mjs \
            directory-service/server.acceptance.mjs \
            public/sw.js \
            docs/AUSTRALIAN_MOSQUE_DIRECTORY.md

      - name: Create retained corrective commit
        shell: bash
        run: |
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -A
          git commit -m 'Externalize Australian mosque catalogue from JavaScript bundle'
          echo "RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/bundle-budget-recovery || true

      - name: Validate source gates
        run: npm run format:check && npm run lint && npm run typecheck && npm run test

      - name: Validate production bundle budget
        run: npm run build && npm run bundle:size
