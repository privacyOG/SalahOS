name: Stage 26 Format

on:
  push:
    branches:
      - stage-25/device-ux-refinement
    paths:
      - scripts/visual-accessibility-rtl-acceptance.mjs
      - .github/workflows/stage26-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 26 branch
        uses: actions/checkout@v4
        with:
          ref: stage-25/device-ux-refinement
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format Stage 26 harness
        run: npx prettier --write scripts/visual-accessibility-rtl-acceptance.mjs
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- scripts/visual-accessibility-rtl-acceptance.mjs; then
            exit 0
          fi
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add scripts/visual-accessibility-rtl-acceptance.mjs
          git commit -m "Format Stage 26 accessibility acceptance"
          git push origin HEAD:stage-25/device-ux-refinement
