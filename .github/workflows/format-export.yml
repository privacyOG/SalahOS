name: Format Export

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-export:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Correct selector navigation fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/visual-mobile-prayer-themes.mjs')
          content = path.read_text()
          old = """      globalThis.Date = FixedDate;\n      localStorage.setItem('salahos.settings', JSON.stringify(settings));\n      localStorage.setItem('salahos.mobilePrayerBoardDisplayConfig', JSON.stringify(mobileConfig));\n"""
          new = """      globalThis.Date = FixedDate;\n      if (localStorage.getItem('salahos.settings') === null) {\n        localStorage.setItem('salahos.settings', JSON.stringify(settings));\n      }\n      if (\n        localStorage.getItem('salahos.mobilePrayerBoardDisplayConfig') === null\n      ) {\n        localStorage.setItem(\n          'salahos.mobilePrayerBoardDisplayConfig',\n          JSON.stringify(mobileConfig),\n        );\n      }\n"""
          if old not in content:
              raise SystemExit('Expected selector seed block was not found')
          path.write_text(content.replace(old, new))
          PY

      - name: Format exact Quality Gate files
        run: |
          npx prettier --write \
            scripts/mobile-safe-area.test.mjs \
            scripts/visual-mobile-prayer-themes-extended.mjs \
            scripts/visual-mobile-prayer-themes.mjs \
            scripts/visual-qibla-google.mjs \
            src/mobile-prayer-theme-settings.css \
            src/mobile-prayer-themes.css \
            src/mobile-prayer-theme-geometry.css \
            src/platform/qiblaGoogleMaps.test.ts \
            src/qibla-compass-premium.css \
            src/ui/MobilePrayerThemeSettings.tsx \
            src/ui/TodayScreen.tsx

      - name: Verify repository formatting
        run: npm run format:check

      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add \
            scripts/mobile-safe-area.test.mjs \
            scripts/visual-mobile-prayer-themes-extended.mjs \
            scripts/visual-mobile-prayer-themes.mjs \
            scripts/visual-qibla-google.mjs \
            src/mobile-prayer-theme-settings.css \
            src/mobile-prayer-themes.css \
            src/mobile-prayer-theme-geometry.css \
            src/platform/qiblaGoogleMaps.test.ts \
            src/qibla-compass-premium.css \
            src/ui/MobilePrayerThemeSettings.tsx \
            src/ui/TodayScreen.tsx
          if git diff --cached --quiet; then
            echo 'Formatter produced no branch changes.'
            exit 0
          fi
          git commit -m 'Normalize mobile UI correction formatting'
          git push origin HEAD:${GITHUB_HEAD_REF}
