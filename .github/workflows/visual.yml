name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  visual:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply native persistence and product-copy correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ios_simulator_acceptance.py')
          content = path.read_text()

          constants_marker = "\n\nclass AcceptanceError(RuntimeError):"
          constants = r'''

MOBILE_THEME_STORAGE_KEY = 'salahos.mobilePrayerBoardDisplayConfig'
MOBILE_THEME_NATIVE_KEY = 'CapacitorStorage.' + MOBILE_THEME_STORAGE_KEY


def mobile_theme_fixture(profile_name):
    template_id = 'scenic-spiritual' if profile_name == 'iphone' else 'family-classroom'
    accent = 'jewel' if profile_name == 'iphone' else 'sandstone'
    artwork = 'scenic-gradient' if profile_name == 'iphone' else 'classroom-pattern'
    return json.dumps(
        {
            'version': 1,
            'templateId': template_id,
            'primaryLocale': 'en',
            'languageMode': 'single',
            'timeFormat': 'h23',
            'accentPreset': accent,
            'moduleVisibility': {
                'current-time': True,
                'dates': True,
                'next-prayer': True,
                'countdown': True,
                'prayer-timetable': True,
                'jumuah': True,
                'sunrise-sunset': True,
                'mosque-branding': True,
                'announcements': True,
                'weather': False,
            },
            'branding': {'mosqueName': None, 'logo': None},
            'background': {'kind': 'builtin', 'artworkId': artwork},
        },
        separators=(',', ':'),
    )
'''
          if constants_marker not in content:
              raise SystemExit('AcceptanceError marker not found')
          content = content.replace(constants_marker, constants + constants_marker, 1)

          helper_marker = "\n\ndef exercise_once(deadline, profile, runtime, device_type, app_path, bundle_id, evidence_dir):"
          helpers = r'''


def seed_mobile_theme(deadline, udid, bundle_id, value):
    simctl(
        deadline,
        60,
        'spawn',
        udid,
        'defaults',
        'write',
        bundle_id,
        MOBILE_THEME_NATIVE_KEY,
        '-string',
        value,
    )


def read_mobile_theme(deadline, udid, bundle_id):
    return simctl(
        deadline,
        60,
        'spawn',
        udid,
        'defaults',
        'read',
        bundle_id,
        MOBILE_THEME_NATIVE_KEY,
    )


def assert_mobile_theme(deadline, udid, bundle_id, expected, phase):
    observed = read_mobile_theme(deadline, udid, bundle_id)
    if observed != expected:
        raise AcceptanceError(
            'Phone/Home theme changed during iOS {}. Expected {!r}, observed {!r}.'.format(
                phase, expected, observed
            )
        )
    log('Phone/Home native theme persistence verified after iOS {}.'.format(phase))
'''
          if helper_marker not in content:
              raise SystemExit('exercise_once marker not found')
          content = content.replace(helper_marker, helpers + helper_marker, 1)

          install_marker = """        container_path = simctl(deadline, 60, 'get_app_container', udid, bundle_id, 'app')
        if not os.path.isdir(container_path):
            raise AcceptanceError('Installed application container {} is missing.'.format(container_path))

        first_pid = start_and_capture(
"""
          install_replacement = """        container_path = simctl(deadline, 60, 'get_app_container', udid, bundle_id, 'app')
        if not os.path.isdir(container_path):
            raise AcceptanceError('Installed application container {} is missing.'.format(container_path))

        expected_mobile_theme = mobile_theme_fixture(profile['name'])
        seed_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme)
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'native seed')

        first_pid = start_and_capture(
"""
          if install_marker not in content:
              raise SystemExit('install/container marker not found')
          content = content.replace(install_marker, install_replacement, 1)

          launch_marker = """        first_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-launch.png')
        )
        simctl(deadline, 90, 'terminate', udid, bundle_id)
        second_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-relaunch.png')
        )

        evidence = [
"""
          launch_replacement = """        first_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-launch.png')
        )
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'launch')
        simctl(deadline, 90, 'terminate', udid, bundle_id)
        second_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-relaunch.png')
        )
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'process relaunch')

        evidence = [
"""
          if launch_marker not in content:
              raise SystemExit('launch/relaunch marker not found')
          content = content.replace(launch_marker, launch_replacement, 1)

          evidence_marker = """            'settled_launch_screenshot=passed',
            'settled_relaunch_screenshot=passed',
"""
          evidence_replacement = """            'settled_launch_screenshot=passed',
            'settled_relaunch_screenshot=passed',
            'mobile_theme_storage_key={}'.format(MOBILE_THEME_STORAGE_KEY),
            'mobile_theme_native_key={}'.format(MOBILE_THEME_NATIVE_KEY),
            'mobile_theme_value={}'.format(expected_mobile_theme),
            'mobile_theme_launch=passed',
            'mobile_theme_relaunch=passed',
"""
          if evidence_marker not in content:
              raise SystemExit('evidence marker not found')
          content = content.replace(evidence_marker, evidence_replacement, 1)
          path.write_text(content)

          replacements = {
              Path('src/i18n/translations.ts'): {
                  "heroCopy: 'Privacy-first prayer times for mobile, Raspberry Pi, TV, and kiosk displays.'":
                      "heroCopy: 'Prayer times for mobile, Raspberry Pi, TV, and kiosk displays.'",
                  "heroCopy: 'مواقيت صلاة تراعي الخصوصية للهاتف وراسبيري باي والتلفاز وشاشات العرض.'":
                      "heroCopy: 'مواقيت الصلاة للهاتف وراسبيري باي والتلفاز وشاشات العرض.'",
              },
              Path('src/i18n/additionalTranslations.ts'): {
                  "heroCopy: 'Mobil, Raspberry Pi, TV ve kiosk ekranları için gizlilik odaklı namaz vakitleri.'":
                      "heroCopy: 'Mobil, Raspberry Pi, TV ve kiosk ekranları için namaz vakitleri.'",
                  "heroCopy: 'Waktu salat yang mengutamakan privasi untuk ponsel, Raspberry Pi, TV, dan layar kios.'":
                      "heroCopy: 'Waktu salat untuk ponsel, Raspberry Pi, TV, dan layar kios.'",
              },
          }
          for source_path, mapping in replacements.items():
              source = source_path.read_text()
              for old, new in mapping.items():
                  if old not in source:
                      raise SystemExit(f'Expected product-copy string not found in {source_path}: {old}')
                  source = source.replace(old, new, 1)
              source_path.write_text(source)
          PY

          python3 -m py_compile scripts/ios_simulator_acceptance.py
          git config user.name privacyOG
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add scripts/ios_simulator_acceptance.py src/i18n/translations.ts src/i18n/additionalTranslations.ts
          git commit -m 'Complete native theme persistence acceptance path'
          echo "CORRECTION_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Build production application
        run: npm run build

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npm audit --audit-level=moderate
          npx playwright install chromium

      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-server.pid
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)

          raise SystemExit('Local SalahOS production server did not become ready')
          PY

      - name: Run visual regression matrix
        run: npm run visual:check

      - name: Build Google satellite Qibla fixture
        env:
          VITE_GOOGLE_MAPS_API_KEY: salahos-visual-fixture-key
        run: npm run build

      - name: Run Google satellite Qibla visual fixture
        run: node scripts/visual-qibla-google.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.sha }}
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-server.pid)" 2>/dev/null || true
          fi
