name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Build production application
        run: npm run build

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npm audit --audit-level=moderate
          npx playwright install chromium

      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-server.pid
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)

          raise SystemExit('Local SalahOS production server did not become ready')
          PY

      - name: Diagnose Today render readiness
        run: node scripts/visual-today-smoke.mjs

      - name: Run visual regression matrix
        run: npm run visual:check

      - name: Build Google satellite Qibla fixture
        env:
          VITE_GOOGLE_MAPS_API_KEY: salahos-visual-fixture-key
        run: npm run build

      - name: Run Google satellite Qibla visual fixture
        run: node scripts/visual-qibla-google.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.sha }}
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-server.pid)" 2>/dev/null || true
          fi

  solar-fix-export:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Publish exact solar correction commit object
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/domain/prayerBoardTemplate.ts')
          text = source.read_text()
          old = """      sunriseLocalMinutes: input.dashboard.base.today.prayers.sunrise.rawLocalMinutes,
                sunsetLocalMinutes: input.dashboard.base.today.prayers.maghrib.rawLocalMinutes,"""
          new = """      sunriseLocalMinutes: input.dashboard.base.today.prayers.sunrise.roundedLocalMinutes,
                sunsetLocalMinutes: input.dashboard.base.today.prayers.maghrib.roundedLocalMinutes,"""
          if text.count(old) != 1:
              raise SystemExit('Expected solar-event source block exactly once')
          source.write_text(text.replace(old, new))

          test = Path('src/domain/prayerBoardTemplate.test.ts')
          test_text = test.read_text()
          marker = """    expect(data.sourceMode).toBe(dashboard.sourceMode);
              expect(data.timeZone).toBe('Australia/Sydney');
          """
          replacement = """    expect(data.sourceMode).toBe(dashboard.sourceMode);
              expect(data.timeZone).toBe('Australia/Sydney');
              expect(data.solarEvents).toEqual({
                sunriseLocalMinutes: dashboard.base.today.prayers.sunrise.roundedLocalMinutes,
                sunsetLocalMinutes: dashboard.base.today.prayers.maghrib.roundedLocalMinutes,
              });
              for (const minutes of Object.values(data.solarEvents)) {
                if (minutes !== null) {
                  expect(Number.isInteger(minutes)).toBe(true);
                  expect(minutes).toBeGreaterThanOrEqual(0);
                  expect(minutes).toBeLessThan(1_440);
                }
              }
          """
          if test_text.count(marker) != 1:
              raise SystemExit('Expected prayer-board assertion marker exactly once')
          test.write_text(test_text.replace(marker, replacement))
          PY
          npx prettier --write src/domain/prayerBoardTemplate.ts src/domain/prayerBoardTemplate.test.ts
          npx prettier --check src/domain/prayerBoardTemplate.ts src/domain/prayerBoardTemplate.test.ts
          npx vitest run src/domain/prayerBoardTemplate.test.ts
          git config user.name privacyOG
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add src/domain/prayerBoardTemplate.ts src/domain/prayerBoardTemplate.test.ts
          git commit -m 'Use rounded solar display minutes'
          echo "SOLAR_FIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/pr186-solar-object || true

      - name: Upload exact solar correction
        uses: actions/upload-artifact@v4
        with:
          name: solar-fix-export-${{ github.sha }}
          path: |
            src/domain/prayerBoardTemplate.ts
            src/domain/prayerBoardTemplate.test.ts
          retention-days: 1
