name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  visual:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/salahos-pw-browsers-1.62.0
      SALAHOS_VISUAL_PLAYWRIGHT_MODULE: /tmp/salahos-visual-harness/node_modules/playwright/index.mjs
      SALAHOS_VISUAL_ARTIFACT_DIR: visual-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Build production application
        run: npm run build

      - name: Install isolated browser harness
        run: |
          rm -rf /tmp/salahos-visual-harness
          mkdir -p /tmp/salahos-visual-harness
          cd /tmp/salahos-visual-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npm audit --audit-level=moderate
          npx playwright install chromium

      - name: Start local production server
        run: |
          rm -rf visual-artifacts
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-visual-http.log 2>&1 &
          echo $! >/tmp/salahos-visual-server.pid
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)

          raise SystemExit('Local SalahOS production server did not become ready')
          PY

      - name: Run visual regression matrix
        run: npm run visual:check

      - name: Commit Stage 23.3 tracker reconciliation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'stage-23/minimal-modern'
        run: |
          cp visual-artifacts/tracker-TODO.md /tmp/salahos-tracker-TODO.md
          cp visual-artifacts/tracker-UI_UX_V2_PLAN.md /tmp/salahos-tracker-UI_UX_V2_PLAN.md
          git fetch origin stage-23/minimal-modern
          git checkout -B stage-23/minimal-modern origin/stage-23/minimal-modern
          cp /tmp/salahos-tracker-TODO.md TODO.md
          cp /tmp/salahos-tracker-UI_UX_V2_PLAN.md docs/UI_UX_V2_PLAN.md
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add TODO.md docs/UI_UX_V2_PLAN.md
          if git diff --cached --quiet; then
            echo 'Stage 23.3 trackers are already reconciled.'
            exit 0
          fi
          git commit -m 'Complete Stage 23.3 tracker reconciliation'
          git push origin HEAD:stage-23/minimal-modern

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.sha }}
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Stop local production server
        if: always()
        run: |
          if [ -f /tmp/salahos-visual-server.pid ]; then
            kill "$(cat /tmp/salahos-visual-server.pid)" 2>/dev/null || true
          fi
