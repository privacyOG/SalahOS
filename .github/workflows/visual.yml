name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Validate and publish monolith-free smart display build
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()
          old_import = "import { App } from './App';"
          new_import = "import { SmartDisplayApplication } from './ui/SmartDisplayApplication';"
          if text.count(old_import) != 1:
              raise SystemExit('legacy App import marker missing')
          if text.count('<App />') != 1:
              raise SystemExit('legacy App render marker missing')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('<App />', '<SmartDisplayApplication />', 1)
          path.write_text(text)
          PY
          rm src/App.tsx
          npx prettier --write src/ui/SmartDisplayApplication.tsx src/main.tsx
          npm run typecheck
          SMART_DISPLAY_APP_BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' src/ui/SmartDisplayApplication.tsx | gh api --method POST /repos/${{ github.repository }}/git/blobs --input - --jq .sha)"
          MAIN_BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' src/main.tsx | gh api --method POST /repos/${{ github.repository }}/git/blobs --input - --jq .sha)"
          echo "SMART_DISPLAY_APP_BLOB_SHA=${SMART_DISPLAY_APP_BLOB_SHA}"
          echo "MAIN_BLOB_SHA=${MAIN_BLOB_SHA}"
          exit 1
