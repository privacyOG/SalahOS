name: Temporary UI08 format diagnostic
on:
  push:
    branches:
      - v160-ui08-acceptance

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write scripts/visual-v160-mosque-settings-fallbacks.mjs
          git diff -- scripts/visual-v160-mosque-settings-fallbacks.mjs
