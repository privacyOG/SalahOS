name: Stage 50 Device UX Repair

on:
  pull_request:
    paths:
      - '.github/workflows/stage50-device-ux-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'stage-50/v1.4-islamic-knowledge'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Stage 50 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore base device UX script and update navigation count
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: d00a280d508d57c7b387cec7ada15686b43d375a
        shell: bash
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:scripts/visual-device-ux-refinement.mjs" > /tmp/device-ux.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/device-ux.mjs')
          text = path.read_text()
          old = """  if (metrics.navigationTargets.length !== 5) {
              throw new Error(`${name} expected five primary navigation targets`);
            }"""
          new = """  if (metrics.navigationTargets.length !== 6) {
              throw new Error(`${name} expected six primary navigation targets`);
            }"""
          if old not in text:
              raise SystemExit('Expected five-item assertion not found in base script')
          path.write_text(text.replace(old, new, 1))
          PY

          BASE_TREE="$(gh api "repos/${REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')"
          BLOB="$(jq -Rs '{content: ., encoding: "utf-8"}' < /tmp/device-ux.mjs | gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha')"
          TREE_SHA="$(jq -n --arg base_tree "$BASE_TREE" --arg blob "$BLOB" '{base_tree:$base_tree,tree:[{path:"scripts/visual-device-ux-refinement.mjs",mode:"100644",type:"blob",sha:$blob}]}' | gh api --method POST "repos/${REPOSITORY}/git/trees" --input - --jq '.sha')"
          GENERATED_COMMIT="$(jq -n --arg message 'Stage 50: preserve device UX regression while adding Knowledge nav' --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${REPOSITORY}/git/commits" --input - --jq '.sha')"
          echo "STAGE50_REPAIRED_COMMIT=${GENERATED_COMMIT}"
