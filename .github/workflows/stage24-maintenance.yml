name: Stage 24 Maintenance

on:
  push:
    branches:
      - stage-24/admin-shell-overview
    paths:
      - .github/workflows/stage24-maintenance.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/admin-shell-overview
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply canonical formatting and scoped visual selector
        run: |
          npx prettier --write src/ui/AdminOverviewDashboard.tsx src/ui/SettingsScreen.tsx
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/visual-managed-display-assignment.mjs')
          source = path.read_text()
          old = """    await page.getByLabel('Managed service URL').fill(managedOrigin);\n    await page.getByLabel('Admin token').fill(adminToken);\n    await page.getByRole('button', { name: 'Connect / refresh fleet' }).click();\n"""
          new = """    const adminPanel = page.locator('.remote-display-admin-panel');\n    await adminPanel.getByLabel('Managed service URL').fill(managedOrigin);\n    await adminPanel.getByLabel('Admin token').fill(adminToken);\n    await adminPanel.getByRole('button', { name: 'Connect / refresh fleet' }).click();\n"""
          if old not in source:
              raise SystemExit('Expected managed-admin visual selector block was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write scripts/visual-managed-display-assignment.mjs
          git diff --check

      - name: Commit exact maintenance changes
        run: |
          if git diff --quiet; then
            echo 'No maintenance changes were required.'
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add src/ui/AdminOverviewDashboard.tsx src/ui/SettingsScreen.tsx scripts/visual-managed-display-assignment.mjs
          git commit -m "Fix Stage 24 formatting and visual scoping"
          git push origin HEAD:stage-24/admin-shell-overview
