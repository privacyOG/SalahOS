name: Temporary Mosque Finder Refresh

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

concurrency:
  group: temporary-mosque-finder-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Mosque Finder detail URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-australian-mosque-finder.mjs')
          s = p.read_text()
          old = """    .filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/]+\\/index\\.html$/iu.test(url))
    .map((url) => url.replace('https://www.mosque-finder.com.au', BASE_URL));"""
          new = """    .filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/?#]+(?:\\/index\\.html|\\/?)$/iu.test(url))
    .map((url) => {
      const normalized = url.replace('https://www.mosque-finder.com.au', BASE_URL).replace(/\\/+$/u, '');
      return normalized.endsWith('/index.html') ? normalized : `${normalized}/index.html`;
    });"""
          if old not in s:
              raise SystemExit('Expected sitemap URL block was not found; refusing an unsafe runtime patch')
          p.write_text(s.replace(old, new))
          PY

      - name: Verify parser
        run: node scripts/generate-australian-mosque-finder.mjs --self-test

      - name: Retrieve Australia-wide mosque directory
        run: node scripts/generate-australian-mosque-finder.mjs --fetch

      - name: Validate source snapshot
        run: node scripts/generate-australian-mosque-finder.mjs

      - name: Merge OSM and Mosque Finder sources
        run: node scripts/generate-australian-mosque-combined.mjs

      - name: Validate merged directory
        run: node scripts/generate-australian-mosque-combined.mjs --check

      - name: Commit importer and directory snapshots
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/generate-australian-mosque-finder.mjs \
            src/data/australian-mosque-finder.json \
            src/data/australian-mosques-combined.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
            exit 0
          fi
          git commit -m 'data: import Australia-wide mosque directory'
          git push origin HEAD:data/australia-mosque-finder