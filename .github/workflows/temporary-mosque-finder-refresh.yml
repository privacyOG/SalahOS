name: Temporary Mosque Finder Refresh

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply verified sitemap URL shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-australian-mosque-finder.mjs')
          s = p.read_text()
          old = ".filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/]+\\/index\\.html$/iu.test(url))"
          new = ".filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/?#]+\\/?$/iu.test(url))"
          if old not in s:
              raise SystemExit('Expected sitemap filter not found')
          s = s.replace(old, new)
          old_slug = ".pathname.split('/').filter(Boolean).at(-2) ?? '';"
          new_slug = ".pathname.split('/').filter(Boolean).at(-1) ?? '';"
          if old_slug not in s:
              raise SystemExit('Expected slug extraction not found')
          s = s.replace(old_slug, new_slug)
          p.write_text(s)
          PY

      - name: Verify parser
        run: node scripts/generate-australian-mosque-finder.mjs --self-test

      - name: Retrieve Australia-wide mosque directory
        run: node scripts/generate-australian-mosque-finder.mjs --fetch

      - name: Validate generated snapshot
        run: node scripts/generate-australian-mosque-finder.mjs

      - name: Commit importer and factual snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/generate-australian-mosque-finder.mjs src/data/australian-mosque-finder.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
            exit 0
          fi
          git commit -m 'data: import Australian Mosque Finder directory'
          git push origin HEAD:data/australia-mosque-finder
