name: Temporary Mosque Finder Refresh

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

concurrency:
  group: temporary-mosque-finder-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Mosque Finder import contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-australian-mosque-finder.mjs')
          s = p.read_text()
          old_filter = ".filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/]+\\/index\\.html$/iu.test(url))"
          new_filter = ".filter((url) => /^https:\\/\\/(?:www\\.)?mosque-finder\\.com\\.au\\/mosque\\/[^/?#]+(?:\\/index\\.html|\\/?)$/iu.test(url))"
          old_map = ".map((url) => url.replace('https://www.mosque-finder.com.au', BASE_URL));"
          new_map = ".map((url) => { const normalized = url.replace('https://www.mosque-finder.com.au', BASE_URL).replace(/\\/+$/u, ''); return normalized.endsWith('/index.html') ? normalized : `${normalized}/index.html`; });"
          if old_filter in s:
              s = s.replace(old_filter, new_filter)
          if old_map in s:
              s = s.replace(old_map, new_map)
          old_region_guard = "  for (const regionCode of Object.values(REGION_CODES)) {\n    assert(regions.has(regionCode), `Mosque Finder directory is missing ${regionCode}`);\n  }\n  return directory;"
          new_region_guard = "  assert(regions.size > 0, 'Mosque Finder directory has no regional coverage');\n  const declaredRegions = new Set(directory.source.regionCodes ?? []);\n  assert(declaredRegions.size === regions.size && [...regions].every((regionCode) => declaredRegions.has(regionCode)), 'Mosque Finder regional coverage metadata mismatch');\n  return directory;"
          if old_region_guard in s:
              s = s.replace(old_region_guard, new_region_guard)
          old_failures = "      failedRecordCount: failures.length,\n    },\n    records: sorted,"
          new_failures = "      failedRecordCount: failures.length,\n      regionCodes: [...new Set(sorted.map((record) => record.address.regionCode))].sort(),\n      missingRegionCodes: Object.values(REGION_CODES).filter((regionCode) => !sorted.some((record) => record.address.regionCode === regionCode)),\n    },\n    records: sorted,"
          if old_failures in s:
              s = s.replace(old_failures, new_failures)
          if new_filter not in s or new_map not in s or new_region_guard not in s or new_failures not in s:
              raise SystemExit('Mosque Finder importer patch did not reach the expected final form')
          p.write_text(s)
          PY

      - name: Verify parser
        run: node scripts/generate-australian-mosque-finder.mjs --self-test

      - name: Retrieve Australia-wide mosque directory
        run: node scripts/generate-australian-mosque-finder.mjs --fetch

      - name: Validate source snapshot
        run: node scripts/generate-australian-mosque-finder.mjs

      - name: Merge OSM and Mosque Finder sources
        run: node scripts/generate-australian-mosque-combined.mjs

      - name: Validate merged directory
        run: node scripts/generate-australian-mosque-combined.mjs --check

      - name: Commit importer and directory snapshots
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add scripts/generate-australian-mosque-finder.mjs \
            src/data/australian-mosque-finder.json \
            src/data/australian-mosques-combined.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
            exit 0
          fi
          git commit -m 'data: import and deduplicate Australia-wide mosque directory'
          git push origin HEAD:data/australia-mosque-finder