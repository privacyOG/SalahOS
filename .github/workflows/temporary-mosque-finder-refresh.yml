name: Temporary Mosque Finder Refresh

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: read

concurrency:
  group: temporary-mosque-finder-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply audited dedup patch
        run: python3 scripts/temporary-patch-australian-mosque-dedup.py

      - name: Verify Finder parser
        run: node scripts/generate-australian-mosque-finder.mjs --self-test

      - name: Retrieve Australia-wide Finder directory
        run: node scripts/generate-australian-mosque-finder.mjs --fetch

      - name: Validate Finder source snapshot
        run: node scripts/generate-australian-mosque-finder.mjs

      - name: Generate audited combined directory
        run: node scripts/generate-australian-mosque-combined.mjs

      - name: Validate audited combined directory
        run: node scripts/generate-australian-mosque-combined.mjs --check

      - name: Verify deduplication invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python3 - <<'PY'
          import json
          from pathlib import Path
          directory = json.loads(Path('src/data/australian-mosques-combined.json').read_text())
          source = directory['source']
          records = directory['records']
          source_ids = {item for record in records for item in record.get('sourceRecordIds', [])}
          expected_duplicate_provenance = {
              'mosque-finder:minto-suburban-islamic-centre-minto-masjid',
              'mosque-finder:whyalla-morris-crescent-mosque',
              'mosque-finder:park-holme-masjid',
              'mosque-finder:north-ryde-macquarie-university-musalla-2',
          }
          quarantined = {
              'mosque-finder:north-ryde-macquarie-university-musalla',
              'mosque-finder:sydney-airport-prayer-room',
          }
          blocked_pairs = {
              ('osm-way-1190951588', 'mosque-finder:ashfield-liverpool-road-musalla'),
              ('osm-way-1126413889', 'mosque-finder:lakemba-islamic-centre'),
              ('osm-node-1614034144', 'mosque-finder:adelaide-islamic-information-centre-of-sa'),
          }
          forced_pairs = {
              ('osm-node-1614034144', 'mosque-finder:adelaide-little-gilbert-street-mosque'),
              ('osm-node-2464887186', 'mosque-finder:minto-mosque'),
              ('osm-node-13919243601', 'mosque-finder:gilles-plains-abu-bakr-assiddiq-masjid'),
              ('osm-way-1170477550', 'mosque-finder:albanvale-station-road-deer-park-mosque'),
              ('osm-node-4243973889', 'mosque-finder:blacktown-afghan-osman-mosque'),
              ('osm-node-7871916571', 'mosque-finder:kensington-university-of-nsw-musalla'),
          }
          actual_pairs = {(m['osmId'], m['finderId']) for m in source['matchEvidence']}
          actual_forced = {(m['osmId'], m['finderId']) for m in source['matchEvidence'] if m['matchType'] == 'audited-forced'}
          assert expected_duplicate_provenance.issubset(source_ids)
          assert source_ids.isdisjoint(quarantined)
          assert actual_pairs.isdisjoint(blocked_pairs)
          assert forced_pairs.issubset(actual_forced)
          assert source['mosqueFinderRawRecordCount'] - source['finderInternalMergedPairCount'] - source['coordinateExcludedCount'] == source['mosqueFinderRecordCount']
          assert source['recordCount'] == source['osmRecordCount'] + source['mosqueFinderRecordCount'] - source['mergedPairCount']
          report = {
              'recordCount': source['recordCount'],
              'osmRaw': source['osmRecordCount'],
              'finderRaw': source['mosqueFinderRawRecordCount'],
              'finderInternalMerged': source['finderInternalMergedPairCount'],
              'coordinateQuarantined': source['coordinateExcludedCount'],
              'finderIntegrated': source['mosqueFinderRecordCount'],
              'crossSourceMerged': source['mergedPairCount'],
              'forcedMatches': source['forcedMatchCount'],
              'automaticMatches': source['automaticMatchCount'],
              'finderOnly': source['finderOnlyCount'],
              'osmOnly': source['osmOnlyCount'],
          }
          Path('tmp/australian-mosque-dedup-review.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Diff check
        run: git diff --check

      - name: Upload canonical import evidence
        uses: actions/upload-artifact@v4
        with:
          name: australian-mosque-directory-audited
          path: |
            scripts/generate-australian-mosque-finder.mjs
            scripts/generate-australian-mosque-combined.mjs
            src/data/australian-mosque-finder.json
            src/data/australian-mosques-combined.json
            tmp/australian-mosque-dedup-review.json
          if-no-files-found: error
          retention-days: 7
