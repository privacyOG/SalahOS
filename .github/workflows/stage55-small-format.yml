name: Stage 55 small format

on:
  push:
    branches:
      - stage-55/v1.5-quran-expansion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-55/v1.5-quran-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format exact Stage 55 files
        run: |
          npx prettier --write src/domain/quranOfflineLibrary.ts src/platform/quranReadingPreferences.ts
          npx prettier --check src/domain/quranOfflineLibrary.ts src/platform/quranReadingPreferences.ts
      - name: Create clean server-side commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          entries = []
          for name in ('src/domain/quranOfflineLibrary.ts', 'src/platform/quranReadingPreferences.ts'):
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': Path(name).read_text()})
          entries.append({'path': '.github/workflows/stage55-small-format.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          Path('/tmp/tree.json').write_text(json.dumps({'tree': entries}))
          PY
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/tree.json').read_text())
          payload['base_tree'] = '${BASE_TREE}'
          Path('/tmp/tree.json').write_text(json.dumps(payload))
          PY
          TREE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees" -X POST --input /tmp/tree.json --jq .sha)"
          python3 - <<PY
          import json
          from pathlib import Path
          Path('/tmp/commit.json').write_text(json.dumps({
              'message': 'Stage 55: format Quran validation files',
              'tree': '${TREE_SHA}',
              'parents': ['${GITHUB_SHA}'],
          }))
          PY
          COMMIT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" -X POST --input /tmp/commit.json --jq .sha)"
          echo "STAGED_COMMIT_SHA=${COMMIT_SHA}"
