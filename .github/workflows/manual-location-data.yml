name: Manual Location Data

on:
  push:
    branches:
      - agent/manual-location-search

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/agent/manual-location-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/manual-location-search

      - name: Generate vendored IANA principal locations
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          URL = 'https://data.iana.org/time-zones/tzdb-2026c/zone1970.tab'
          text = urllib.request.urlopen(URL, timeout=30).read().decode('utf-8')

          def decimal(part, degree_digits):
              sign = -1 if part[0] == '-' else 1
              digits = part[1:]
              degrees = int(digits[:degree_digits])
              rest = digits[degree_digits:]
              if len(rest) == 2:
                  minutes = int(rest)
                  seconds = 0
              elif len(rest) == 4:
                  minutes = int(rest[:2])
                  seconds = int(rest[2:])
              else:
                  raise ValueError(part)
              return round(sign * (degrees + minutes / 60 + seconds / 3600), 6)

          def parse_coordinates(value):
              match = re.fullmatch(r'([+-]\d{4}(?:\d{2})?)([+-]\d{5}(?:\d{2})?)', value)
              if not match:
                  raise ValueError(value)
              return decimal(match.group(1), 2), decimal(match.group(2), 3)

          records = []
          for line in text.splitlines():
              if not line or line.startswith('#'):
                  continue
              columns = line.split('\t')
              countries, coordinate_text, time_zone = columns[:3]
              comments = columns[3] if len(columns) > 3 else ''
              latitude, longitude = parse_coordinates(coordinate_text)
              city = time_zone.rsplit('/', 1)[-1].replace('_', ' ')
              records.append({
                  'city': city,
                  'countryCodes': countries.split(','),
                  'timeZone': time_zone,
                  'latitude': latitude,
                  'longitude': longitude,
                  'comments': comments,
              })

          if len(records) < 300:
              raise RuntimeError(f'Expected comprehensive IANA location data, found {len(records)} rows')

          target = Path('src/data/ianaPrincipalLocations.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Generated {len(records)} principal locations from tzdb 2026c')
          PY

      - name: Commit vendored data
        run: |
          if [ -z "$(git status --porcelain -- src/data/ianaPrincipalLocations.json)" ]; then
            echo "Vendored location data already current"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/data/ianaPrincipalLocations.json
          git commit -m "data: vendor IANA principal locations"
          git push origin HEAD:agent/manual-location-search
