name: Temporary v1.5.3 Item 11 Cleanup

on:
  push:
    branches:
      - v1.5.3-work-item-11

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[item11-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary validation tag
        run: git push origin :refs/tags/temp-v153-item11-validated
