name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Publish type-safe Stage 27 settings panel blob
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui/SettingsMigrationPanels.tsx')
          text = path.read_text()
          old = """  const selectedSavedLocationId =\n    settings.location !== null &&\n    savedLocations.some(\n      (location) => location.id === savedLocationId(settings.location?.coordinates),\n    )\n      ? savedLocationId(settings.location.coordinates)\n      : '';\n"""
          new = """  const currentCoordinates = settings.location?.coordinates ?? null;\n  const selectedSavedLocationId =\n    currentCoordinates !== null &&\n    savedLocations.some((location) => location.id === savedLocationId(currentCoordinates))\n      ? savedLocationId(currentCoordinates)\n      : '';\n"""
          if text.count(old) != 1:
              raise SystemExit('saved-location narrowing marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/ui/SettingsMigrationPanels.tsx
          npm run typecheck || true
          PANELS_BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' src/ui/SettingsMigrationPanels.tsx | gh api --method POST /repos/${{ github.repository }}/git/blobs --input - --jq .sha)"
          echo "PANELS_BLOB_SHA=${PANELS_BLOB_SHA}"
          exit 1

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Native permission policy
        run: npm run security:native-permissions

      - name: Remote network policy
        run: npm run security:remote-network

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Documentation link verification
        run: npm run docs:links

      - name: PWA raster icon reproducibility
        run: python3 scripts/generate_pwa_icons.py --check

      - name: Design-system ownership policy
        run: npm run ui:design-system-ownership

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify deployable web artifact
        run: npm run verify:web-build