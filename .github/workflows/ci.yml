name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply mosque library controls
        if: github.event_name == 'push'
        run: python scripts/apply_mosque_library_ui.py

      - name: Canonicalize mosque library controls
        if: github.event_name == 'push'
        run: npx prettier --write src/App.tsx src/i18n/translations.ts src/styles.css src/platform/mosqueLibrary.ts src/platform/mosqueLibrary.test.ts

      - name: Commit mosque library controls
        if: github.event_name == 'push'
        run: |
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add src/App.tsx src/i18n/translations.ts src/styles.css src/platform/mosqueLibrary.ts src/platform/mosqueLibrary.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add local mosque library controls"
          git push origin HEAD:${{ github.ref_name }}

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
