name: Format v1.4.0 Release Documentation

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'release-prep/v1.4.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@v4
        with:
          ref: release-prep/v1.4.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply pinned formatter and restore canonical Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier CHANGELOG.md RELEASE_NOTES.md --write
          git fetch origin main --no-tags
          git checkout origin/main -- .github/workflows/ci.yml
          npx prettier CHANGELOG.md RELEASE_NOTES.md --check

      - name: Create formatted release candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git add CHANGELOG.md RELEASE_NOTES.md .github/workflows/ci.yml
          git commit -m 'Format SalahOS v1.4.0 release documentation'
          echo "FORMATTED_RELEASE_COMMIT=$(git rev-parse HEAD)"
          git push --force origin HEAD:release-prep/v1.4.0
