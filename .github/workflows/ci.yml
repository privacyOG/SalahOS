name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply ESLint autofix and restore read-only Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src/ui/AdminDisplayThemeManagement.tsx --fix || true
          npx prettier --write src/ui/AdminDisplayThemeManagement.tsx
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/ui/AdminDisplayThemeManagement.tsx .github/workflows/ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Stage 24 theme studio lint autofixes"
          git push origin HEAD:stage-24/display-theme-management
