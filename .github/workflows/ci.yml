name: Quality Gate

on:
  push:
    branches: ['agent/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Retire temporary validation branch
        run: echo 'Temporary Qiblah validation branch retired after merge.'
