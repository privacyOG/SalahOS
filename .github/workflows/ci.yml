name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-25/device-ux-refinement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Correct enlarged-text fixture, format and restore Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/visual-device-ux-refinement.mjs')
          text = path.read_text()
          old = """async function seed(page, locale, theme, fontScale = 1) {
            await page.addInitScript(
              ({ persistedSettings, now }) => {
                localStorage.setItem('salahos.settings', persistedSettings);
                const NativeDate = Date;
                class FrozenDate extends NativeDate {
                  constructor(...args) {
                    if (args.length === 0) super(now);
                    else super(...args);
                  }
                  static now() {
                    return now;
                  }
                }
                Object.setPrototypeOf(FrozenDate, NativeDate);
                globalThis.Date = FrozenDate;
              },
              { persistedSettings: JSON.stringify(settings(locale, theme)), now: fixedNow },
            );
            if (fontScale !== 1) {
              await page.addStyleTag({ content: `html { font-size: ${String(fontScale * 100)}% !important; }` });
            }
          }
          """
          new = """async function seed(page, locale, theme) {
            await page.addInitScript(
              ({ persistedSettings, now }) => {
                localStorage.setItem('salahos.settings', persistedSettings);
                const NativeDate = Date;
                class FrozenDate extends NativeDate {
                  constructor(...args) {
                    if (args.length === 0) super(now);
                    else super(...args);
                  }
                  static now() {
                    return now;
                  }
                }
                Object.setPrototypeOf(FrozenDate, NativeDate);
                globalThis.Date = FrozenDate;
              },
              { persistedSettings: JSON.stringify(settings(locale, theme)), now: fixedNow },
            );
          }
          """
          if old not in text:
            raise SystemExit('seed fixture block not found')
          text = text.replace(old, new, 1)

          old = """    await seed(page, scenario.locale, scenario.theme, scenario.fontScale ?? 1);
              await page.goto(baseUrl, { waitUntil: 'networkidle' });
              await page.locator('.today-prayer-table').waitFor({ state: 'visible' });
          """
          new = """    await seed(page, scenario.locale, scenario.theme);
              await page.goto(baseUrl, { waitUntil: 'networkidle' });
              await page.locator('.today-prayer-table').waitFor({ state: 'visible' });
              if ((scenario.fontScale ?? 1) !== 1) {
                const expectedScale = scenario.fontScale ?? 1;
                await page.addStyleTag({
                  content: `html { font-size: ${String(expectedScale * 100)}% !important; }`,
                });
                const rootFontSize = await page.evaluate(() =>
                  Number.parseFloat(getComputedStyle(document.documentElement).fontSize),
                );
                const expectedRootFontSize = 16 * expectedScale;
                if (Math.abs(rootFontSize - expectedRootFontSize) > 0.5) {
                  throw new Error(
                    `${scenario.name} enlarged-text fixture inactive: expected ${String(expectedRootFontSize)}px root, got ${String(rootFontSize)}px`,
                  );
                }
              }
          """
          if old not in text:
            raise SystemExit('validatePhone fixture block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/visual-device-ux-refinement.mjs
          npx prettier --check scripts/visual-device-ux-refinement.mjs
          npm run lint -- --no-warn-ignored scripts/visual-device-ux-refinement.mjs
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add scripts/visual-device-ux-refinement.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Harden Stage 25 enlarged text acceptance"
          echo "GENERATED_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:stage-25/device-ux-refinement
