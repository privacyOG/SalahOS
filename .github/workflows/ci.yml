name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply semantic lint fixes and restore read-only Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/AdminDisplayThemeManagement.tsx')
          text = path.read_text()
          replacements = {
              "return `${target.width}x${target.height}:${JSON.stringify(config)}`;": "return `${String(target.width)}x${String(target.height)}:${JSON.stringify(config)}`;",
              "  const fingerprint = JSON.stringify(draft);\n": "",
              "    // eslint-disable-next-line react-hooks/exhaustive-deps\n": "",
              "? `${target.width}×${target.height}`": "? `${String(target.width)}×${String(target.height)}`",
              "<article key={`${entry.scope}-${entry.targetId}-${entry.revision}`}": "<article key={`${entry.scope}-${entry.targetId}-${String(entry.revision)}`}",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing replacement target: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write src/ui/AdminDisplayThemeManagement.tsx
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/ui/AdminDisplayThemeManagement.tsx .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Resolve Stage 24 theme studio semantic lint issues"
          git push origin HEAD:stage-24/display-theme-management
