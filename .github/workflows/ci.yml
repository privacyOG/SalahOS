name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Finalize Stage 27 migration and publish blobs
        run: |
          node scripts/stage27-finalize.mjs
          npx prettier --write .
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run verify:web-build
          npm run ui:v2-retirement
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            blob_sha="$(jq -Rs '{content: ., encoding: "utf-8"}' "$file" | gh api --method POST /repos/privacyOG/SalahOS/git/blobs --input - --jq .sha)"
            echo "STAGE27_BLOB $file $blob_sha"
          done < stage27-files.txt
          exit 1

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Native permission policy
        run: npm run security:native-permissions

      - name: Remote network policy
        run: npm run security:remote-network

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Documentation link verification
        run: npm run docs:links

      - name: PWA raster icon reproducibility
        run: python3 scripts/generate_pwa_icons.py --check

      - name: Design-system ownership policy
        run: npm run ui:design-system-ownership

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify deployable web artifact
        run: npm run verify:web-build
