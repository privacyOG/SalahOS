name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Record verified Stage 5 status
        if: github.event_name == 'push'
        run: python scripts/record_stage5.py

      - name: Commit tracker evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add TODO.md TESTING.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record mosque timetable validation"
          git push origin HEAD:${{ github.ref_name }}
