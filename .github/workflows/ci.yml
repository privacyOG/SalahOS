name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Preserve theme draft across fleet refresh and restore read-only Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/AdminDisplayThemeManagement.tsx')
          text = path.read_text()
          old = """      setSelectedMosqueId(nextMosque);\n      if (nextMosque !== '') {\n        const currentDefault = nextDefaults.find((entry) => entry.mosqueId === nextMosque);\n        if (currentDefault !== undefined) setDraft(currentDefault.prayerBoardConfig);\n      }\n"""
          new = """      const shouldLoadMosqueDefault =\n        nextMosque !== '' && nextMosque !== selectedMosqueId;\n      setSelectedMosqueId(nextMosque);\n      if (shouldLoadMosqueDefault) {\n        const currentDefault = nextDefaults.find((entry) => entry.mosqueId === nextMosque);\n        if (currentDefault !== undefined) setDraft(currentDefault.prayerBoardConfig);\n      }\n"""
          if old not in text:
              raise SystemExit('expected refresh block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/ui/AdminDisplayThemeManagement.tsx
          npm run lint
          npm run typecheck
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/ui/AdminDisplayThemeManagement.tsx .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Preserve display theme draft across refresh"
          git push origin HEAD:stage-24/display-theme-management
