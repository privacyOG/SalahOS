name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Format retained visual coverage and restore read-only Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/visual-prayer-board-config.mjs scripts/visual-managed-display-assignment.mjs
          node --check scripts/visual-prayer-board-config.mjs
          node --check scripts/visual-managed-display-assignment.mjs
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add scripts/visual-prayer-board-config.mjs scripts/visual-managed-display-assignment.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Format retained display visual coverage"
          git push origin HEAD:stage-24/display-theme-management
