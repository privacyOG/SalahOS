name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply and validate managed artwork fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage24-managed-artwork-fix.py
          npx prettier --write src/domain/prayerBoardTemplate.ts src/domain/managedAdminProtocol.ts src/domain/prayerBoardTemplate.test.ts src/domain/managedAdminProtocol.stage24.test.ts
          npm run lint
          npm run typecheck
          npx vitest run src/domain/adminDisplayThemeManagement.test.ts src/domain/prayerBoardTemplate.test.ts src/domain/managedAdminProtocol.stage24.test.ts
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/stage24-managed-artwork-fix.py
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/domain/prayerBoardTemplate.ts src/domain/managedAdminProtocol.ts src/domain/prayerBoardTemplate.test.ts src/domain/managedAdminProtocol.stage24.test.ts .github/workflows/ci.yml scripts/stage24-managed-artwork-fix.py
          git diff --cached --check
          git commit -m "Preserve managed built-in display artwork"
          git push origin HEAD:stage-24/display-theme-management
