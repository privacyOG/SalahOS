name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Consolidate Design System v2 style ownership
        if: github.event_name == 'pull_request' && github.head_ref == 'stage-22/design-system-v2'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} marker missing')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} replacement failed')
              return updated

          design_path = Path('src/design-system.css')
          design = design_path.read_text()

          design = replace_once(
              design,
              ':root {\n  /* Semantic surfaces */',
              dedent("""\
              :root {
                font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  'Segoe UI',
                  sans-serif;
                color-scheme: dark;
                color: var(--salah-fg-primary);
                background: var(--salah-bg-canvas);
                font-synthesis: none;
                text-rendering: optimizeLegibility;

                /* Semantic surfaces */"""),
              'design-system root',
          )
          design = replace_once(
              design,
              ":root[data-theme='light'] {\n",
              ":root[data-theme='light'] {\n  color-scheme: light;\n",
              'light-theme root',
          )
          design = replace_once(
              design,
              "}\n\n@media (prefers-color-scheme: light) {",
              "}\n\n:root[data-theme='dark'] {\n  color-scheme: dark;\n}\n\n@media (prefers-color-scheme: light) {",
              'dark-theme insertion boundary',
          )
          design = replace_once(
              design,
              "  :root[data-theme='system'] {\n",
              "  :root[data-theme='system'] {\n    color-scheme: light;\n",
              'system light-theme root',
          )

          design = replace_once(
              design,
              "body {\n  background-color: var(--page);\n}",
              dedent("""\
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                min-width: 320px;
                min-height: 100vh;
                color: var(--salah-fg-primary);
                background:
                  radial-gradient(circle at top right, var(--page-glow), transparent 34rem),
                  var(--salah-bg-canvas);
              }

              button,
              input,
              select,
              textarea {
                border: 1px solid var(--salah-border-default);
                border-radius: var(--salah-radius-sm);
                color: var(--salah-fg-primary);
                background: var(--salah-bg-control);
                font: inherit;
                transition-duration: var(--salah-motion-fast);
                transition-timing-function: var(--salah-ease-standard);
              }

              button,
              select,
              input {
                min-height: 2.75rem;
              }

              button {
                padding-inline: var(--salah-space-4);
                cursor: pointer;
                font-weight: 700;
              }

              input,
              select,
              textarea {
                padding: 0.65rem 0.7rem;
              }

              textarea {
                width: 100%;
                resize: vertical;
              }

              h1,
              h2,
              p {
                margin-top: 0;
              }

              h1 {
                margin-block-end: 0.8rem;
                font-size: var(--salah-text-display);
                line-height: 0.98;
                letter-spacing: -0.055em;
              }

              [dir='rtl'] h1 {
                line-height: 1.15;
                letter-spacing: 0;
              }

              h2 {
                margin-block-end: 0;
                font-size: clamp(1.7rem, 3vw, 2.4rem);
              }"""),
              'base document styles',
          )

          design = sub_once(
              design,
              r"\.hero \{\n  max-width: none;.*?\n\}",
              dedent("""\
              .hero {
                max-width: none;
                margin-block-end: var(--salah-space-5);
                padding: clamp(1rem, 2vw, 1.4rem) clamp(1.2rem, 2.5vw, 2rem);
                border: 1px solid var(--salah-border-subtle);
                border-radius: var(--salah-radius-xl);
                background: var(--salah-bg-surface);
                box-shadow: var(--salah-shadow-md);
              }"""),
              'hero style',
          )
          design = replace_once(
              design,
              ".hero-toolbar {\n  align-items: center;\n}",
              dedent("""\
              .hero-toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--salah-space-4);
              }"""),
              'hero toolbar',
          )
          design = replace_once(
              design,
              ".live-clock {\n  color: var(--salah-fg-primary);\n  font-size: var(--salah-text-xl);\n  letter-spacing: -0.02em;\n}",
              dedent("""\
              .live-clock {
                margin: 0;
                color: var(--salah-fg-primary);
                font-size: var(--salah-text-xl);
                font-weight: 800;
                font-variant-numeric: tabular-nums;
                letter-spacing: -0.02em;
              }

              .language-control {
                display: inline-flex;
                align-items: center;
                gap: 0.55rem;
                color: var(--salah-fg-secondary);
                font-size: var(--salah-text-sm);
              }"""),
              'live clock',
          )
          design = sub_once(
              design,
              r"\.hero h1 \{\n  max-width: 12ch;.*?\n\}",
              dedent("""\
              .hero h1 {
                max-width: 18ch;
                margin-block: var(--salah-space-6) var(--salah-space-3);
                font-size: clamp(2rem, 1.55rem + 2vw, 3.8rem);
                line-height: 1;
              }"""),
              'hero heading',
          )
          design = sub_once(
              design,
              r"\.hero-copy \{\n  max-width: 56ch;.*?\n\}",
              dedent("""\
              .hero-copy {
                max-width: 62ch;
                margin-block-end: 0;
                color: var(--salah-fg-secondary);
                font-size: var(--salah-text-sm);
                line-height: 1.55;
              }"""),
              'hero copy',
          )

          design = sub_once(
              design,
              r"button,\nselect,\ninput,\ntextarea \{\n  border-radius: var\(--salah-radius-sm\);.*?\n\}\n\n",
              '',
              'duplicate control primitives',
          )
          design = sub_once(
              design,
              r"\.app-shell \{\n  width: min\(1240px,.*?\n\}",
              dedent("""\
              .app-shell {
                display: flex;
                width: min(1240px, calc(100% - clamp(1rem, 4vw, 3rem)));
                margin: 0 auto;
                padding-block-start: calc(clamp(1rem, 3vw, 2.75rem) + env(safe-area-inset-top));
                padding-block-end: calc(clamp(5rem, 7vw, 7rem) + env(safe-area-inset-bottom));
                padding-inline-start: env(safe-area-inset-left);
                padding-inline-end: env(safe-area-inset-right);
                flex-direction: column;
              }

              .offline-banner {
                order: -30;
              }

              .hero {
                order: -20;
              }

              .prayer-panel,
              .status-card {
                order: -10;
              }

              .location-panel {
                order: 10;
              }

              .settings-panel {
                order: 20;
              }"""),
              'application shell',
          )
          design = sub_once(
              design,
              r"\.location-panel,\n\.settings-panel,\n\.status-card,\n\.prayer-panel \{.*?\n\}\n\n\.location-panel,\n\.settings-panel \{.*?\n\}\n\n\.settings-panel summary \{.*?\n\}",
              dedent("""\
              .location-panel,
              .settings-panel,
              .status-card,
              .prayer-panel {
                border: 1px solid var(--salah-border-subtle);
                border-radius: var(--salah-radius-lg);
                background: var(--salah-bg-surface);
                box-shadow: var(--salah-shadow-sm);
                backdrop-filter: blur(18px);
              }

              .location-panel,
              .settings-panel {
                margin-block-end: var(--salah-space-4);
                padding: clamp(1rem, 2vw, 1.35rem);
                border-color: var(--salah-border-subtle);
              }

              .location-panel {
                background: color-mix(in srgb, var(--salah-bg-surface) 88%, transparent);
                box-shadow: none;
              }

              .settings-panel {
                margin-block-end: 0;
                background: color-mix(in srgb, var(--salah-bg-surface) 82%, transparent);
                box-shadow: none;
              }

              .settings-panel:not([open]) {
                padding-block: var(--salah-space-3);
              }

              .settings-panel summary {
                display: flex;
                min-height: 2.75rem;
                align-items: center;
                color: var(--salah-fg-tertiary);
                cursor: pointer;
                font-size: 1.05rem;
                font-weight: 800;
              }"""),
              'legacy panel primitives',
          )
          design = sub_once(
              design,
              r"\.eyebrow,\n\.label,\n\.prayer-time-label \{.*?\n\}",
              dedent("""\
              .eyebrow,
              .label,
              .prayer-time-label {
                color: var(--salah-fg-tertiary);
                font-size: var(--salah-text-xs);
                font-weight: 750;
                line-height: 1.4;
                letter-spacing: 0.1em;
                text-transform: uppercase;
              }

              .eyebrow,
              .label {
                margin: 0 0 0.45rem;
              }

              [dir='rtl'] .eyebrow,
              [dir='rtl'] .label,
              [dir='rtl'] .prayer-time-label {
                letter-spacing: 0;
                text-transform: none;
              }"""),
              'metadata typography',
          )
          design = sub_once(
              design,
              r"\.offline-banner \{\n  border-radius: var\(--salah-radius-md\);.*?\n\}",
              dedent("""\
              .offline-banner {
                margin: 0 0 var(--salah-space-4);
                padding: var(--salah-space-3) var(--salah-space-4);
                border: 1px solid color-mix(in srgb, var(--salah-fg-warning) 35%, transparent);
                border-radius: var(--salah-radius-md);
                color: var(--salah-fg-warning);
                background: var(--warning-bg);
                box-shadow: var(--salah-shadow-sm);
              }"""),
              'offline banner',
          )
          design = sub_once(
              design,
              r"@media \(max-width: 760px\) \{\n  \.app-shell \{.*?\n\}\n\n@media \(min-width: 1600px\)",
              dedent("""\
              @media (max-width: 760px) {
                .app-shell {
                  width: min(100% - 1rem, 42rem);
                  padding-block-start: max(0.75rem, env(safe-area-inset-top));
                  padding-inline-start: env(safe-area-inset-left);
                  padding-inline-end: env(safe-area-inset-right);
                }

                .hero {
                  padding: var(--salah-space-4);
                  border-radius: var(--salah-radius-lg);
                }

                .hero-toolbar {
                  flex-direction: row;
                  align-items: center;
                }

                .hero h1 {
                  margin-block-start: var(--salah-space-5);
                  font-size: clamp(1.9rem, 8vw, 2.8rem);
                }

                .hero-copy {
                  font-size: var(--salah-text-sm);
                }

                .status-card > div {
                  padding-inline-end: 0;
                  padding-block-end: var(--salah-space-3);
                  border-inline-end: 0;
                  border-block-end: 1px solid var(--salah-border-subtle);
                }

                .status-card > div:last-child {
                  padding-block-end: 0;
                  border-block-end: 0;
                }

                .prayer-panel {
                  border-radius: var(--salah-radius-lg);
                }

                .prayer-card {
                  min-height: 4.65rem;
                  padding: 0.85rem 1rem;
                }

                .section-heading {
                  gap: var(--salah-space-4);
                }

                .next-prayer-block {
                  width: 100%;
                }

                .location-panel,
                .settings-panel {
                  border-radius: var(--salah-radius-md);
                }
              }

              @media (min-width: 1000px) {
                .hero {
                  display: grid;
                  grid-template-columns: minmax(0, 1fr) minmax(16rem, 0.45fr);
                  column-gap: var(--salah-space-8);
                  align-items: end;
                }

                .hero-toolbar {
                  grid-column: 1 / -1;
                }

                .hero h1 {
                  margin-block-end: 0;
                }

                .hero-copy {
                  align-self: end;
                  margin-block-end: 0.2rem;
                }
              }

              @media (min-width: 1600px)"""),
              'responsive shell primitives',
          )
          design = replace_once(
              design,
              "@media (forced-colors: active) {\n  .hero,",
              dedent("""\
              @media (forced-colors: active) {
                :root {
                  --salah-bg-canvas: Canvas;
                  --salah-bg-subtle: Canvas;
                  --salah-bg-surface: Canvas;
                  --salah-bg-surface-raised: Canvas;
                  --salah-bg-control: Canvas;
                  --salah-bg-accent-soft: Canvas;
                  --salah-fg-primary: CanvasText;
                  --salah-fg-secondary: CanvasText;
                  --salah-fg-tertiary: CanvasText;
                  --salah-fg-accent: Highlight;
                  --salah-fg-warning: Mark;
                  --salah-fg-provenance: CanvasText;
                  --salah-border-subtle: CanvasText;
                  --salah-border-default: ButtonText;
                  --salah-border-strong: CanvasText;
                  --salah-focus-ring: Highlight;
                  --page-glow: transparent;
                  --warning-bg: Canvas;
                  --shadow: transparent;
                }

                .hero,"""),
              'forced-colour semantic tokens',
          )
          design = sub_once(
              design,
              r"@media \(prefers-reduced-motion: reduce\) \{\n  button,.*?\n\}",
              dedent("""\
              @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                  scroll-behavior: auto !important;
                  transition-duration: 0.01ms !important;
                  animation-duration: 0.01ms !important;
                  animation-iteration-count: 1 !important;
                }
              }"""),
              'reduced-motion ownership',
          )
          design_path.write_text(design)

          styles_path = Path('src/styles.css')
          styles = styles_path.read_text()
          marker = '.settings-grid,\n.offset-grid {'
          index = styles.find(marker)
          if index < 0:
              raise SystemExit('styles feature boundary missing')
          styles = styles[index:]
          styles = sub_once(
              styles,
              r"@media \(prefers-contrast: more\) \{\n  :root \{.*?\n  \}\n\n  :root\[data-theme='light'\] \{.*?\n  \}\n\n",
              '@media (prefers-contrast: more) {\n',
              'legacy contrast tokens',
          )
          styles = sub_once(
              styles,
              r"@media \(forced-colors: active\) \{\n  :root \{.*?\n  \}\n\n",
              '@media (forced-colors: active) {\n',
              'legacy forced-colour tokens',
          )
          styles = sub_once(
              styles,
              r"\n@media \(prefers-reduced-motion: reduce\) \{\n  \*,\n  \*::before,\n  \*::after \{.*?\n  \}\n\}\n",
              '\n',
              'legacy reduced-motion block',
          )
          styles_path.write_text(styles)

          responsive_path = Path('src/responsive-hardening.css')
          responsive = responsive_path.read_text()
          responsive = sub_once(
              responsive,
              r"\.app-shell \{.*?\n\}\n\n",
              '',
              'responsive app-shell ownership',
          )
          responsive_path.write_text(responsive)

          main_path = Path('src/main.tsx')
          main = main_path.read_text()
          main = replace_once(
              main,
              "import './prayer-first-home.css';\n",
              '',
              'prayer-first stylesheet import',
          )
          main_path.write_text(main)
          PY

          rm src/prayer-first-home.css
          npx prettier --write src/design-system.css src/styles.css src/responsive-hardening.css src/main.tsx
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Consolidate Design System v2 style ownership"
          git push origin HEAD:stage-22/design-system-v2

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Native permission policy
        run: npm run security:native-permissions

      - name: Remote network policy
        run: npm run security:remote-network

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Documentation link verification
        run: npm run docs:links

      - name: PWA raster icon reproducibility
        run: python3 scripts/generate_pwa_icons.py --check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify deployable web artifact
        run: npm run verify:web-build
