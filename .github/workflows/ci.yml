name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    if: github.ref == 'refs/heads/agent/notification-scheduling-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/notification-scheduling-integration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Canonicalize integration test
        run: npx prettier --write src/integration/notificationScheduling.test.ts

      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/integration/notificationScheduling.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/integration/notificationScheduling.test.ts
          git commit -m "style: canonicalize notification integration"
          git push origin HEAD:agent/notification-scheduling-integration
