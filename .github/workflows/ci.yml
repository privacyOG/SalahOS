name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply privacy-safe error logging
        if: github.event_name == 'push'
        run: python scripts/apply_privacy_safe_error_logging.py

      - name: Canonicalize integration
        if: github.event_name == 'push'
        run: npx prettier --write src/App.tsx src/platform/errorLog.ts src/platform/errorLog.test.ts

      - name: Commit integration
        if: github.event_name == 'push'
        run: |
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add src/App.tsx src/platform/errorLog.ts src/platform/errorLog.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add privacy-safe structured error logging"
          git push origin HEAD:${{ github.ref_name }}
