name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-24/display-theme-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Finalize Stage 24 trackers and restore read-only Quality workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo = Path('TODO.md')
          text = todo.read_text()
          replacements = {
              '- [~] Continue the dedicated managed-masjid administration surface introduced in Stage 22': '- [x] Continue the dedicated managed-masjid administration surface introduced in Stage 22',
              '- [ ] Complete display-theme management, assignment, publication and rollback UX': '- [x] Complete display-theme management, assignment, publication and rollback UX',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'TODO expected marker not found: {old}')
              text = text.replace(old, new, 1)
          old_boundary = "Stage 24.1 and 24.2 are complete; Stage 24.3 display-theme publication/rollback remains open.\n\n---\n\n## 25. Device-specific UX refinement"
          final_note = """Stage 24.1 and 24.2 are complete; Stage 24.3 display-theme publication/rollback remains open.\n\n**Stage 24.3 verification note (2026-08-23):** PR #189 code-bearing head `ac021b9597023bc677711cb6f5f2815171798875` passed Quality Gate `32626280463`, Android Build `32626280429`, Visual Regression `32626280436` and iOS Build `32626280453`. Exact Visual artifact `9489797523` (`sha256:f23991b33a70701a5fe0a1028db814dc1b952f1b2b4e9fce4a2fbd396082cd2c`) passed the complete permanent visual matrix and received human review across the desktop theme studio, rollback-published state, Arabic/RTL tablet, 390px narrow phone and destructive-confirmation evidence. The administration Displays studio now exposes all six display themes, branding and first-party built-in background configuration with live preview, exact 1920x1080/3840x2160 target preview, per-display and bulk assignment, mosque-default publication, monotonic revision history/rollback, and fail-closed blocking of unsupported orientation/resolution targets. Managed built-in backgrounds persist through the service/runtime boundary while device-local images are not uploaded; administrator credentials remain memory-only; post-publication fleet refreshes preserve the active draft; and prayer calculation/source/Iqamah semantics remain unchanged. Stage 24.3 and Stage 24 are complete.\n\n---\n\n## 25. Device-specific UX refinement"""
          if old_boundary not in text:
              raise SystemExit('TODO Stage 24 completion boundary not found')
          todo.write_text(text.replace(old_boundary, final_note, 1))

          plan = Path('docs/UI_UX_V2_PLAN.md')
          text = plan.read_text()
          ia_items = [
              'Overview.',
              'Prayer & Iqamah.',
              "Jumu'ah & Ramadan.",
              'Community content.',
              'Displays.',
              'Integrations.',
              'Members & permissions.',
              'Administration settings.',
          ]
          for item in ia_items:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if old not in text:
                  raise SystemExit(f'Plan admin IA marker not found: {old}')
              text = text.replace(old, new, 1)
          old_stage = """## 24.3 Display theme management\n\n- [ ] Add display-theme gallery inside the admin console.\n- [ ] Add branding/background configuration with live preview.\n- [ ] Add per-display assignment and bulk assignment flows.\n- [ ] Add publish/rollback workflow for template configuration revisions.\n- [ ] Prevent unsupported template/orientation/resolution combinations.\n\n---\n\n# Stage 25 — Device-specific UX refinement"""
          new_stage = """## 24.3 Display theme management\n\n- [x] Add display-theme gallery inside the admin console.\n- [x] Add branding/background configuration with live preview.\n- [x] Add per-display assignment and bulk assignment flows.\n- [x] Add publish/rollback workflow for template configuration revisions.\n- [x] Prevent unsupported template/orientation/resolution combinations.\n\n**Stage 24.3 verification note (2026-08-23):** PR #189 code-bearing head `ac021b9597023bc677711cb6f5f2815171798875` passed Quality Gate `32626280463`, Android Build `32626280429`, Visual Regression `32626280436` and iOS Build `32626280453`. Exact Visual artifact `9489797523` (`sha256:f23991b33a70701a5fe0a1028db814dc1b952f1b2b4e9fce4a2fbd396082cd2c`) passed the complete browser matrix and received human review across desktop, rollback, Arabic/RTL tablet, narrow-phone and destructive-action evidence. The admin Displays studio consolidates all six themes, branding, first-party built-in backgrounds and live preview; requires exact supported-target preview before publication; supports per-display/bulk overrides and mosque defaults; records bounded revision history and republishes rollback drafts as a new higher revision; blocks unsupported orientation/resolution combinations; preserves the administrator draft across ordinary fleet refreshes; and keeps managed credentials memory-only. Managed publication preserves validated built-in artwork but never transports device-local image assets, and all theme choices remain presentation-only with local prayer calculation authoritative. Stage 24.3 and the Stage 24 admin-console redesign are complete.\n\n---\n\n# Stage 25 — Device-specific UX refinement"""
          if old_stage not in text:
              raise SystemExit('Plan Stage 24.3 block not found')
          plan.write_text(text.replace(old_stage, new_stage, 1))
          PY
          npx prettier --write TODO.md docs/UI_UX_V2_PLAN.md
          npm run docs:links
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add TODO.md docs/UI_UX_V2_PLAN.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Mark Stage 24 display theme management complete"
          echo "GENERATED_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:stage-24/display-theme-management
