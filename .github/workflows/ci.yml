name: Prepare v1.4.0 Metadata

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/v1.4.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.4.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize v1.4.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          npm version 1.4.0 --no-git-tag-version
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 6/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.4.0"/' android/app/build.gradle
          sed -i -E 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = 6;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i -E 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.4.0;/g' ios/App/App.xcodeproj/project.pbxproj
          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/release-assets.yml
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.4.0'||l.version!=='1.4.0'||l.packages[''].version!=='1.4.0') process.exit(1)"
          grep -Eq 'versionCode[[:space:]]+6' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.4\.0"' android/app/build.gradle
          grep -Eq 'MARKETING_VERSION = 1\.4\.0;' ios/App/App.xcodeproj/project.pbxproj
          ! grep -Eq 'MARKETING_VERSION = 1\.3\.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -Eq 'CURRENT_PROJECT_VERSION = 6;' ios/App/App.xcodeproj/project.pbxproj
          ! grep -Eq 'CURRENT_PROJECT_VERSION = 5;' ios/App/App.xcodeproj/project.pbxproj

      - name: Commit synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'privacyOG'
          git config user.email 'privacyOG@users.noreply.github.com'
          git add package.json package-lock.json android/app/build.gradle ios/App/App.xcodeproj/project.pbxproj .github/workflows/ci.yml .github/workflows/release-assets.yml
          git commit -m 'Prepare SalahOS v1.4.0 version metadata'
          echo "PREPARED_RELEASE_COMMIT=$(git rev-parse HEAD)"
          git push --force origin HEAD:release-prep/v1.4.0-final
