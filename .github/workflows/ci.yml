name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Record high latitude indicator validation
        if: github.event_name == 'push'
        run: python scripts/record_high_latitude_indicators.py

      - name: Canonicalize tracker documentation
        if: github.event_name == 'push'
        run: npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add TODO.md TESTING.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record high latitude indicator validation"
          git push origin HEAD:${{ github.ref_name }}
