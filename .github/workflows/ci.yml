name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Publish formatter-canonical Stage 27 blobs
        run: |
          npx prettier --write scripts/visual-ui-v2-retirement.mjs src/ui/SettingsProgressiveDisclosureV2.test.ts
          for file in scripts/visual-ui-v2-retirement.mjs src/ui/SettingsProgressiveDisclosureV2.test.ts; do
            blob_sha="$(jq -Rs '{content: ., encoding: "utf-8"}' "$file" | gh api --method POST /repos/privacyOG/SalahOS/git/blobs --input - --jq .sha)"
            echo "STAGE27_FORMATTED_BLOB $file $blob_sha"
          done
          exit 1
