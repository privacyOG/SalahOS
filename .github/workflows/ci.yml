name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Record verified settings status
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path('TODO.md')
          todo = todo_path.read_text()
          replacements = {
              '- [ ] Calculation method selector': '- [x] Calculation method selector',
              '- [ ] Asr method selector': '- [x] Asr method selector',
              '- [ ] High-latitude rule selector': '- [x] High-latitude rule selector',
              '- [ ] Manual prayer offsets': '- [x] Manual prayer offsets',
              '- [ ] Hijri correction': '- [x] Hijri correction',
              '- [~] Language selector': '- [x] Language selector',
              '- [ ] Theme selector': '- [x] Theme selector',
              '- [ ] Time format (12/24-hour)': '- [x] Time format (12/24-hour)',
              '- [~] Export settings': '- [x] Export settings',
              '- [~] Import settings': '- [x] Import settings',
              '- [~] Reset to defaults': '- [x] Reset to defaults',
              '- [ ] Recompute after calculation-method change': '- [x] Recompute after calculation-method change',
              '- [ ] Recompute after Asr-method change': '- [x] Recompute after Asr-method change',
              '- [ ] Light theme': '- [~] Light theme',
              '- [ ] Dark theme': '- [~] Dark theme',
              '- [ ] Follow-system theme': '- [~] Follow-system theme',
          }
          for old, new in replacements.items():
              if old not in todo:
                  raise RuntimeError(f'Missing tracker marker: {old}')
              todo = todo.replace(old, new, 1)

          anchor = '- [x] Version/migration system for persisted configuration\n'
          note = (
              '\n**Settings-controls verification note (2026-08-16):** read-only Quality Gate run `31904751213` '
              'passed formatting, typed lint, strict typecheck, the complete unit/integration suite and production build. '
              'The settings panel now exposes calculation method, Asr convention, high-latitude rule, per-prayer minute offsets, '
              'Hijri correction, language, 12/24-hour time format and system/light/dark theme controls. Settings export, validated '
              'import and reset-to-defaults are wired to the versioned persistence core. Method/Asr changes feed the shared dashboard '
              'model immediately, and persistence no longer rewrites local storage on each one-second clock refresh. Theme controls are '
              'functional, while visual validation of light/dark/system appearance remains partial.\n'
          )
          if note.strip() not in todo:
              todo = todo.replace(anchor, anchor + note, 1)
          todo_path.write_text(todo)

          testing_path = Path('TESTING.md')
          testing = testing_path.read_text().rstrip()
          heading = '### 2026-08-16 — Persistent settings controls'
          entry = '''

### 2026-08-16 — Persistent settings controls

- Added user-facing selectors for calculation method, Asr convention, high-latitude rule, Hijri correction, 12/24-hour time format and system/light/dark theme preference.
- Added per-prayer minute adjustment inputs and wired them directly into the shared prayer dashboard calculation model.
- Added functional settings export, validated import and reset-to-defaults controls backed by the versioned local persistence layer.
- Changing method, Asr convention, high-latitude rule, Hijri correction or prayer offsets recomputes the shared dashboard without duplicated calculation logic.
- Local persistence now depends on effective configuration/location changes rather than the per-second dashboard refresh, avoiding unnecessary storage writes.
- Read-only Quality Gate run `31904751213` passed clean lockfile install, formatting, typed lint, strict typecheck, all tests and production build after the strict settings lint fixes.
- Visual validation of light/dark/system themes and full component-level interaction testing remain open.
'''
          if heading not in testing:
              testing_path.write_text(testing + entry + '\n')
          PY
          npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add TODO.md TESTING.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record settings controls validation"
          git push origin HEAD:${{ github.ref_name }}
