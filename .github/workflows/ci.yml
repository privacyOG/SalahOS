name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Detect missing lockfile
        id: lock-state
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply canonical formatting
        run: npm run format

      - name: Commit bootstrap changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && git diff --cached --quiet && [ "${{ steps.lock-state.outputs.missing }}" != "true" ]; then
            exit 0
          fi
          git config user.name "privacyOG"
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add package-lock.json src/domain/astronomy.ts src/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock dependencies and apply formatting"
          git push origin HEAD:${{ github.ref_name }}

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
