name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    if: github.ref == 'refs/heads/agent/notification-scheduling-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/notification-scheduling-integration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Record notification scheduling verification
        run: python scripts/record_notification_scheduling_verification.py

      - name: Canonicalize tracker evidence
        run: npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        run: |
          if git diff --quiet -- TODO.md TESTING.md; then
            echo "No tracker changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add TODO.md TESTING.md
          git commit -m "docs: verify notification scheduling flow"
          git push origin HEAD:agent/notification-scheduling-integration
