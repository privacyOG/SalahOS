name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-25/device-ux-refinement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Move burn-in shift to configured presentation frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('src/smart-display-themes.css')
          css = css_path.read_text()
          old = ".prayer-board-configured-surface {\n  display: contents;\n}\n"
          new = """.prayer-board-configured-surface {
            display: contents;
          }

          .smart-display .prayer-board-configured-surface {
            display: block;
            animation: smart-display-pixel-shift 60min steps(1, end) infinite;
          }

          @media (prefers-reduced-motion: reduce) {
            .smart-display .prayer-board-configured-surface {
              animation: none;
            }
          }
          """
          if old not in css:
            raise SystemExit('configured surface block not found')
          css_path.write_text(css.replace(old, new, 1))

          visual_path = Path('scripts/visual-display-device-refinement.mjs')
          visual = visual_path.read_text()
          old = """    const metrics = await root.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                animationName: style.animationName,
                animationDuration: style.animationDuration,
              };
            });
          """
          new = """    const geometry = await root.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              return {
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
              };
            });
            const burnInFrame = page.locator('.prayer-board-configured-surface');
            const animation = await burnInFrame.evaluate((element) => {
              const style = getComputedStyle(element);
              return {
                animationName: style.animationName,
                animationDuration: style.animationDuration,
              };
            });
            const metrics = { ...geometry, ...animation };
          """
          if old not in visual:
            raise SystemExit('TV metrics block not found')
          visual = visual.replace(old, new, 1)

          old = """    const root = page.locator('.minimal-modern-board');
            await root.waitFor({ state: 'visible' });
            const animationName = await root.evaluate((element) => getComputedStyle(element).animationName);
          """
          new = """    await page.locator('.minimal-modern-board').waitFor({ state: 'visible' });
            const burnInFrame = page.locator('.prayer-board-configured-surface');
            const animationName = await burnInFrame.evaluate(
              (element) => getComputedStyle(element).animationName,
            );
          """
          if old not in visual:
            raise SystemExit('reduced-motion metrics block not found')
          visual_path.write_text(visual.replace(old, new, 1))
          PY
          npx prettier --write src/smart-display-themes.css scripts/visual-display-device-refinement.mjs
          npx prettier --check src/smart-display-themes.css scripts/visual-display-device-refinement.mjs
          npm run lint -- --no-warn-ignored scripts/visual-display-device-refinement.mjs
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add src/smart-display-themes.css scripts/visual-display-device-refinement.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Apply burn-in shift to configured display frame"
          echo "GENERATED_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:stage-25/device-ux-refinement
