name: Quality Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Record location minimisation verification
        run: python3 scripts/record_location_minimisation_verification.py

      - name: Canonicalize tracker evidence
        run: npx prettier --write TODO.md TESTING.md

      - name: Commit tracker evidence
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "privacyOG"
          git config user.email "kriptiik@proton.me"
          git add TODO.md TESTING.md
          if git diff --cached --quiet; then
            echo "No tracker changes to commit"
            exit 0
          fi
          git commit -m "docs: verify location data minimisation"
          git push origin "HEAD:${BRANCH_NAME}"
