name: Stage 41 locale contract patch

on:
  push:
    branches:
      - 'stage-41/additional-languages'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Stage 41 locale contract'
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-41/additional-languages
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply locale contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          translations = Path('src/i18n/translations.ts')
          text = translations.read_text()
          text = text.replace(
              "export type Locale = 'en' | 'ar';",
              "import { indonesianTranslations, turkishTranslations } from './additionalTranslations';\n\nexport type Locale = 'en' | 'ar' | 'tr' | 'id';",
              1,
          )
          text = text.replace(
              "    english: 'English',\n    arabic: 'Arabic',",
              "    english: 'English',\n    arabic: 'Arabic',\n    turkish: 'Turkish',\n    indonesian: 'Indonesian',",
              1,
          )
          text = text.replace(
              "    english: 'الإنجليزية',\n    arabic: 'العربية',",
              "    english: 'الإنجليزية',\n    arabic: 'العربية',\n    turkish: 'التركية',\n    indonesian: 'الإندونيسية',",
              1,
          )
          marker = "  },\n} as const;\n\nexport type TranslationKey"
          replacement = "  },\n  tr: turkishTranslations,\n  id: indonesianTranslations,\n} as const;\n\nexport type TranslationKey"
          if marker not in text:
              raise SystemExit('translations closing marker not found')
          text = text.replace(marker, replacement, 1)
          translations.write_text(text)

          i18n = Path('src/i18n/i18n.ts')
          text = i18n.read_text()
          text = text.replace(
              "export function localeDirection(locale: Locale): TextDirection {\n  return locale === 'ar' ? 'rtl' : 'ltr';\n}\n\nexport function localeTag(locale: Locale): string {\n  return locale === 'ar' ? 'ar' : 'en-AU';\n}",
              "const localeTags: Readonly<Record<Locale, string>> = Object.freeze({\n  en: 'en-AU',\n  ar: 'ar',\n  tr: 'tr-TR',\n  id: 'id-ID',\n});\n\nexport function localeDirection(locale: Locale): TextDirection {\n  return locale === 'ar' ? 'rtl' : 'ltr';\n}\n\nexport function localeTag(locale: Locale): string {\n  return localeTags[locale];\n}",
              1,
          )
          i18n.write_text(text)

          settings = Path('src/platform/settingsStorage.ts')
          text = settings.read_text()
          text = text.replace(
              "function parseLocale(value: unknown): Locale {\n  return value === 'ar' ? 'ar' : 'en';\n}",
              "function parseLocale(value: unknown): Locale {\n  if (value === 'ar' || value === 'tr' || value === 'id') return value;\n  return 'en';\n}",
              1,
          )
          settings.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace(
              '              <option value="en">{translate(locale, \'english\')}</option>\n              <option value="ar">{translate(locale, \'arabic\')}</option>',
              '              <option value="en">{translate(locale, \'english\')}</option>\n              <option value="ar">{translate(locale, \'arabic\')}</option>\n              <option value="tr">{translate(locale, \'turkish\')}</option>\n              <option value="id">{translate(locale, \'indonesian\')}</option>',
              1,
          )
          app.write_text(text)

          test = Path('src/i18n/i18n.test.ts')
          text = test.read_text()
          text = text.replace(
              "    expect(translate('ar', 'prayerIsha')).toBe('العشاء');",
              "    expect(translate('ar', 'prayerIsha')).toBe('العشاء');\n    expect(translate('tr', 'dailyPrayers')).toBe('Günlük namazlar');\n    expect(translate('id', 'dailyPrayers')).toBe('Salat harian');\n    expect(translate('tr', 'prayerFajr')).toBe('Sabah');\n    expect(translate('id', 'prayerFajr')).toBe('Subuh');",
              1,
          )
          text = text.replace(
              "    expect(localeDirection('ar')).toBe('rtl');",
              "    expect(localeDirection('ar')).toBe('rtl');\n    expect(localeDirection('tr')).toBe('ltr');\n    expect(localeDirection('id')).toBe('ltr');",
              1,
          )
          text = text.replace(
              "    applyDocumentLocale(target, 'en');\n    expect(target.lang).toBe('en');\n    expect(target.dir).toBe('ltr');",
              "    applyDocumentLocale(target, 'en');\n    expect(target.lang).toBe('en');\n    expect(target.dir).toBe('ltr');\n\n    applyDocumentLocale(target, 'tr');\n    expect(target.lang).toBe('tr');\n    expect(target.dir).toBe('ltr');\n\n    applyDocumentLocale(target, 'id');\n    expect(target.lang).toBe('id');\n    expect(target.dir).toBe('ltr');",
              1,
          )
          test.write_text(text)
          PY

      - name: Canonical formatting
        run: npx prettier --write src/i18n/additionalTranslations.ts src/i18n/translations.ts src/i18n/i18n.ts src/i18n/i18n.test.ts src/platform/settingsStorage.ts src/App.tsx

      - name: Commit patched source
        run: |
          set -euo pipefail
          rm .github/workflows/stage41-locale-contract.yml
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add src/i18n/additionalTranslations.ts src/i18n/translations.ts src/i18n/i18n.ts src/i18n/i18n.test.ts src/platform/settingsStorage.ts src/App.tsx .github/workflows/stage41-locale-contract.yml
          git commit -m 'Apply Stage 41 locale contract'
          git push origin HEAD:stage-41/additional-languages
