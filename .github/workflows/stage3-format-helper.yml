name: Stage 3 Format Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-evidence:
    if: github.event.pull_request.head.ref == 'stage-52/v1.5-privacy-friction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact repository formatting
        run: |
          npx prettier --write \
            scripts/visual-privacy-diagnostics.mjs \
            src/platform/privacyDiagnostics.test.ts \
            src/platform/privacyDiagnostics.ts \
            src/ui/PrivacyDiagnosticsSettings.tsx \
            src/ui/SettingsScreen.tsx
          git diff --check
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name privacyOG
          git config user.email "102720550+privacyOG@users.noreply.github.com"
          git add \
            scripts/visual-privacy-diagnostics.mjs \
            src/platform/privacyDiagnostics.test.ts \
            src/platform/privacyDiagnostics.ts \
            src/ui/PrivacyDiagnosticsSettings.tsx \
            src/ui/SettingsScreen.tsx
          git commit -m "Stage 3: apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
