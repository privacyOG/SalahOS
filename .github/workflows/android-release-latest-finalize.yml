name: Android Release Latest Finalization

on:
  push:
    branches:
      - privacyog/android-release-latest

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-release-latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format
        run: npm run format
      - name: Repository quality gate
        run: npm run check
      - name: Android debug assembly and reboot verification
        run: npm run android:build
      - name: Unsigned release assembly
        run: npm run android:release-check
      - name: Reject partial release signing configuration
        run: |
          set +e
          output="$(cd android && SALAHOS_ANDROID_KEYSTORE_PATH=/tmp/placeholder ./gradlew :app:tasks 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Partial signing configuration was incorrectly accepted" >&2
            exit 1
          fi
          grep -F "Android release signing requires all SALAHOS_ANDROID_KEYSTORE_* / SALAHOS_ANDROID_KEY_* environment variables" <<<"$output"
      - name: Record verified release configuration
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          todo = Path('TODO.md')
          text = todo.read_text()
          old = '- [ ] Build signed/release-ready configuration without committing secrets'
          new = '- [x] Build signed/release-ready configuration without committing secrets'
          if old not in text:
            raise SystemExit('missing Android release TODO item')
          text = text.replace(old, new, 1)
          note = f'''\n\n**Android release-configuration verification note (2026-08-16):** validation run `{os.environ['GITHUB_RUN_ID']}` passed the complete repository quality gate, the normal Android debug assembly with reboot-restoration verification, and an unsigned `assembleRelease` build from the committed release configuration. Release signing is activated only when all four external `SALAHOS_ANDROID_KEYSTORE_PATH`, `SALAHOS_ANDROID_KEYSTORE_PASSWORD`, `SALAHOS_ANDROID_KEY_ALIAS` and `SALAHOS_ANDROID_KEY_PASSWORD` values are supplied; partial configuration fails closed, and no keystore, key alias or password is committed. This proves a release-ready signing path without claiming that a production distribution key was present in CI.\n'''
          text = text.replace(new, new + note, 1)
          todo.write_text(text)

          docs = Path('docs/ANDROID.md')
          d = docs.read_text()
          d += '''\n\n## Release signing\n\nRelease builds can be produced without a signing key for repository validation. For a distributable signed build, provide all four signing values only through the local environment or an encrypted CI secret store: `SALAHOS_ANDROID_KEYSTORE_PATH`, `SALAHOS_ANDROID_KEYSTORE_PASSWORD`, `SALAHOS_ANDROID_KEY_ALIAS`, and `SALAHOS_ANDROID_KEY_PASSWORD`. SalahOS deliberately rejects a partially supplied signing configuration. Keystores and credentials must remain outside the repository. Run `npm run android:release-check` to synchronize the shared application and assemble the release variant.\n'''
          docs.write_text(d)

          testing = Path('TESTING.md')
          t = testing.read_text()
          t += f'''\n\n## Android release configuration — 2026-08-16\n\nValidation run `{os.environ['GITHUB_RUN_ID']}` exercised the full repository gate, debug build/reboot verifier, unsigned release assembly, and a negative partial-signing test. The release Gradle configuration remains unsigned when no external secrets are supplied and switches to the external signing config only when all required values are present. No production keystore or password is required or stored for repository validation.\n'''
          testing.write_text(t)
          PY
      - name: Format evidence updates
        run: npm run format
      - name: Re-run repository quality gate
        run: npm run check
      - name: Commit verified batch
        run: |
          rm .github/workflows/android-release-latest-finalize.yml
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify Android release configuration [release-latest-verified]"
          git push origin HEAD:privacyog/android-release-latest
