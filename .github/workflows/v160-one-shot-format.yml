name: V1.6.0 one-shot format

on:
  push:
    branches:
      - codex/v1.6.0-implementation
    paths:
      - .github/workflows/v160-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/v1.6.0-implementation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format V1.6.0 changes
        run: |
          npx prettier --write \
            src/platform/quranOfflinePreparation.test.ts \
            src/platform/quranOfflinePreparation.ts \
            src/ui/KnowledgeScreen.tsx \
            src/ui/LazyRouteBoundary.tsx \
            TEMP_TODO_V1.6.0.md
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/quranOfflinePreparation.test.ts \
            src/platform/quranOfflinePreparation.ts \
            src/ui/KnowledgeScreen.tsx \
            src/ui/LazyRouteBoundary.tsx \
            TEMP_TODO_V1.6.0.md
          git rm .github/workflows/v160-one-shot-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(v1.6.0): format audit implementation [skip ci]"
          git push origin HEAD:codex/v1.6.0-implementation
