name: Stage 41 feature copy patch

on:
  push:
    branches:
      - 'stage-41/additional-languages'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Stage 41 feature locale coverage'
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-41/additional-languages
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Wire four-locale feature copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'src/ui/CommunityUpdatesPanel.tsx': 'communityUpdatesCopy',
              'src/ui/LocalAdhanAudioSettings.tsx': 'localAdhanAudioCopy',
              'src/ui/ManagedDisplayConnectionSettings.tsx': 'managedDisplayConnectionCopy',
              'src/ui/ManagedDisplayRemoteController.tsx': 'managedDisplayRuntimeCopy',
              'src/ui/MosqueProfilesPanel.tsx': 'mosqueProfilesCopy',
              'src/ui/QiblaCompassPanel.tsx': 'qiblaCompassCopy',
              'src/ui/RamadanModePanel.tsx': 'ramadanModeCopy',
              'src/ui/RemoteDisplayAdminPanel.tsx': 'remoteDisplayAdminCopy',
              'src/ui/SmartDisplayThemeSettings.tsx': 'smartDisplayThemeCopy',
              'src/ui/TaraweehPanel.tsx': 'taraweehCopy',
          }

          for path_string, copy_name in replacements.items():
              path = Path(path_string)
              text = path.read_text()
              locale_import = "import type { Locale } from '../i18n/translations';"
              feature_import = f"import {{ {copy_name} }} from '../i18n/featureTranslations';"
              if feature_import not in text:
                  if locale_import not in text:
                      raise SystemExit(f'locale import not found in {path_string}')
                  text = text.replace(locale_import, feature_import + '\n' + locale_import, 1)
              text, count = re.subn(
                  r"const copy = \{.*?\n\} as const;\n",
                  f"const copy = {copy_name};\n",
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'copy table not replaced in {path_string}')
              path.write_text(text)

          exact = Path('src/ui/AndroidExactAlarmNotice.tsx')
          text = exact.read_text()
          locale_import = "import type { Locale } from '../i18n/translations';"
          feature_import = "import { androidExactAlarmCopy } from '../i18n/featureTranslations';"
          if feature_import not in text:
              text = text.replace(locale_import, feature_import + '\n' + locale_import, 1)
          text, count = re.subn(
              r"const copy: Readonly<.*?\n\};\n\nexport interface AndroidExactAlarmNoticeProps",
              "const copy = androidExactAlarmCopy;\n\nexport interface AndroidExactAlarmNoticeProps",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Android exact-alarm copy table not replaced')
          exact.write_text(text)

          community = Path('src/ui/CommunityUpdatesPanel.tsx')
          text = community.read_text()
          locale_import = "import type { Locale } from '../i18n/translations';"
          if "import { localeTag } from '../i18n/i18n';" not in text:
              text = text.replace(locale_import, "import { localeTag } from '../i18n/i18n';\n" + locale_import, 1)
          text = text.replace(
              "  const localeTag = locale === 'ar' ? 'ar' : 'en-AU';\n  return new Intl.DateTimeFormat(localeTag, {",
              "  return new Intl.DateTimeFormat(localeTag(locale), {",
              1,
          )
          text = text.replace(
              "        locale,\n        surface: 'mobile',",
              "        locale: locale === 'ar' ? 'ar' : 'en',\n        surface: 'mobile',",
              1,
          )
          community.write_text(text)

          remote = Path('src/ui/RemoteDisplayAdminPanel.tsx')
          text = remote.read_text()
          locale_import = "import type { Locale } from '../i18n/translations';"
          if "import { localeTag } from '../i18n/i18n';" not in text:
              text = text.replace(locale_import, "import { localeTag } from '../i18n/i18n';\n" + locale_import, 1)
          text = text.replace(
              "  return new Intl.DateTimeFormat(locale === 'ar' ? 'ar' : 'en-AU', {",
              "  return new Intl.DateTimeFormat(localeTag(locale), {",
              1,
          )
          remote.write_text(text)

          for scheduler_path in ['src/platform/androidNotificationScheduler.ts', 'src/platform/iosNotificationScheduler.ts']:
              path = Path(scheduler_path)
              text = path.read_text()
              old_names = "  ar: { fajr: 'الفجر', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' },\n};"
              new_names = "  ar: { fajr: 'الفجر', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' },\n  tr: { fajr: 'Sabah', dhuhr: 'Öğle', asr: 'İkindi', maghrib: 'Akşam', isha: 'Yatsı' },\n  id: { fajr: 'Subuh', dhuhr: 'Zuhur', asr: 'Asar', maghrib: 'Magrib', isha: 'Isya' },\n};"
              if old_names not in text:
                  raise SystemExit(f'prayer-name marker not found in {scheduler_path}')
              text = text.replace(old_names, new_names, 1)
              marker = "  if (record.kind === 'reminder')\n    return { title: `${prayer} reminder`, body: `${prayer} prayer time is approaching.` };"
              localized = "  if (locale === 'tr') {\n    if (record.kind === 'reminder')\n      return { title: `${prayer} hatırlatması`, body: `${prayer} namazı yaklaşıyor.` };\n    if (record.kind === 'adhan')\n      return { title: `${prayer} ezanı`, body: `${prayer} vakti geldi.` };\n    return { title: `${prayer} namaz vakti`, body: `${prayer} vakti geldi.` };\n  }\n  if (locale === 'id') {\n    if (record.kind === 'reminder')\n      return { title: `Pengingat ${prayer}`, body: `Waktu salat ${prayer} sudah dekat.` };\n    if (record.kind === 'adhan')\n      return { title: `Azan ${prayer}`, body: `Waktu ${prayer} telah tiba.` };\n    return { title: `Waktu salat ${prayer}`, body: `Waktu ${prayer} telah tiba.` };\n  }\n" + marker
              if marker not in text:
                  raise SystemExit(f'notification-copy marker not found in {scheduler_path}')
              path.write_text(text.replace(marker, localized, 1))
          PY

      - name: Canonical formatting
        run: npx prettier --write src/i18n/featureTranslations.ts src/platform/androidNotificationScheduler.ts src/platform/iosNotificationScheduler.ts src/ui/AndroidExactAlarmNotice.tsx src/ui/CommunityUpdatesPanel.tsx src/ui/LocalAdhanAudioSettings.tsx src/ui/ManagedDisplayConnectionSettings.tsx src/ui/ManagedDisplayRemoteController.tsx src/ui/MosqueProfilesPanel.tsx src/ui/QiblaCompassPanel.tsx src/ui/RamadanModePanel.tsx src/ui/RemoteDisplayAdminPanel.tsx src/ui/SmartDisplayThemeSettings.tsx src/ui/TaraweehPanel.tsx

      - name: Commit feature locale coverage
        run: |
          set -euo pipefail
          rm .github/workflows/stage41-feature-copy.yml
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add src/i18n/featureTranslations.ts src/platform/androidNotificationScheduler.ts src/platform/iosNotificationScheduler.ts src/ui/AndroidExactAlarmNotice.tsx src/ui/CommunityUpdatesPanel.tsx src/ui/LocalAdhanAudioSettings.tsx src/ui/ManagedDisplayConnectionSettings.tsx src/ui/ManagedDisplayRemoteController.tsx src/ui/MosqueProfilesPanel.tsx src/ui/QiblaCompassPanel.tsx src/ui/RamadanModePanel.tsx src/ui/RemoteDisplayAdminPanel.tsx src/ui/SmartDisplayThemeSettings.tsx src/ui/TaraweehPanel.tsx .github/workflows/stage41-feature-copy.yml
          git commit -m 'Apply Stage 41 feature locale coverage'
          git push origin HEAD:stage-41/additional-languages
