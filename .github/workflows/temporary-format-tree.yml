name: Temporary Format Tree

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-format-tree.yml'

permissions:
  contents: write

jobs:
  format-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format repository
        run: npx prettier --write .

      - name: Validate format
        run: npm run format:check

      - name: Validate lint
        run: npm run lint

      - name: Validate typecheck
        run: npm run typecheck

      - name: Remove temporary workflow from final tree
        run: rm .github/workflows/temporary-format-tree.yml

      - name: Create remote tree preserving file bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_tree="$(git rev-parse HEAD^{tree})"
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree.json
          first=1
          while IFS=$'\t' read -r status path; do
            [ -n "$path" ] || continue
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            if [ "$status" = "D" ]; then
              jq -cn --arg path "$path" '{path:$path,mode:"100644",type:"blob",sha:null}' >> /tmp/tree.json
            else
              encoded="$(base64 -w0 "$path")"
              blob_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
              jq -cn --arg path "$path" --arg sha "$blob_sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree.json
            fi
          done < <(git diff --name-status)
          printf ']}' >> /tmp/tree.json
          tree_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq .sha)"
          printf '%s\n' "$tree_sha" | tee /tmp/format-tree-sha.txt

      - name: Upload tree SHA
        uses: actions/upload-artifact@v4
        with:
          name: salahos-format-tree-sha
          path: /tmp/format-tree-sha.txt
          if-no-files-found: error
          retention-days: 1
