name: Format License Review

on:
  push:
    branches:
      - agent/dependency-license-review

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/dependency-license-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-license-review

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Sensitive-file policy
        run: npm run security:sensitive-files

      - name: Dependency vulnerability audit
        run: npm run security:audit

      - name: Dependency license policy
        run: npm run security:licenses

      - name: Canonicalize license review files
        run: npx prettier --write scripts/check-dependency-licenses.mjs docs/DEPENDENCY_LICENSE_REVIEW.md

      - name: Commit formatted files
        run: |
          if git diff --quiet -- scripts/check-dependency-licenses.mjs docs/DEPENDENCY_LICENSE_REVIEW.md; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add scripts/check-dependency-licenses.mjs docs/DEPENDENCY_LICENSE_REVIEW.md
          git commit -m "style: format dependency license review"
          git push origin HEAD:agent/dependency-license-review
