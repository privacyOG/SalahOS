name: Android Emulator Acceptance Finalization

on:
  push:
    branches:
      - privacyog/android-emulator-acceptance

permissions:
  contents: write

jobs:
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[emulator-verified]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacyog/android-emulator-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Repository quality gate
        run: npm run check
      - name: Synchronize Android application
        run: npm run android:sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-emulator-acceptance.sh
      - name: Record verified emulator evidence
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let todo = fs.readFileSync('TODO.md', 'utf8');
          const replacements = [
            ['- [ ] Test offline cold start', '- [x] Test offline cold start'],
            ['- [ ] Test orientation changes', '- [x] Test orientation changes'],
            [
              '- [ ] Run on real Android device or emulator and record evidence',
              '- [x] Run on real Android device or emulator and record evidence',
            ],
          ];
          for (const [before, after] of replacements) {
            if (!todo.includes(before)) throw new Error(`Android emulator tracker marker missing: ${before}`);
            todo = todo.replace(before, after);
          }
          const marker = '- [x] Run on real Android device or emulator and record evidence';
          const markerIndex = todo.indexOf(marker);
          const insertion = todo.indexOf('\n\n---\n\n## 9. iOS / iPadOS application', markerIndex);
          if (insertion < 0) throw new Error('Android emulator evidence insertion point missing');
          const note = `\n\n**Android emulator acceptance note (2026-08-16):** validation run \`${process.env.VALIDATION_RUN}\` executed SalahOS on an Android 35 x86_64 Pixel-class emulator. The workflow enabled airplane mode, installed the debug APK, force-stopped the application, launched \`com.privacyog.salahos/.MainActivity\` as an offline cold start and required Android Activity Manager to report a successful start plus a live SalahOS process. Instrumentation then verified the actual application id and launched the native activity while offline, rotated the running activity to landscape and back to portrait, and required the activity to remain alive with the expected Android configuration in both orientations. The stale generated test for \`com.getcapacitor.app\` was removed. This is emulator evidence, not a claim about every physical OEM device.`;
          todo = todo.slice(0, insertion) + note + todo.slice(insertion);
          fs.writeFileSync('TODO.md', todo);

          let testing = fs.readFileSync('TESTING.md', 'utf8');
          if (!testing.includes('### 2026-08-16 — Android emulator acceptance')) {
            testing += `\n\n### 2026-08-16 — Android emulator acceptance\n\n- Validation run \`${process.env.VALIDATION_RUN}\` ran on an Android 35 x86_64 Pixel-class emulator.\n- Airplane mode was enabled before an explicit force-stop and cold launch of \`com.privacyog.salahos/.MainActivity\`; Activity Manager had to report \`Status: ok\` and the SalahOS process had to remain alive.\n- Android instrumentation asserts the real application id, requires airplane mode, launches \`MainActivity\`, rotates it to landscape and portrait, and verifies the activity remains alive with matching resource orientation.\n- The stale generated Capacitor package-name test was removed. Physical-OEM-specific behavior remains outside this emulator acceptance result.\n`;
          }
          fs.writeFileSync('TESTING.md', testing);

          let android = fs.readFileSync('docs/ANDROID.md', 'utf8');
          android += `\n\n## Emulator acceptance\n\nThe repository includes an Android emulator acceptance script and instrumentation test. The validated path runs with airplane mode enabled, performs a force-stop/cold launch of the real SalahOS activity, confirms the process is alive, and exercises landscape/portrait configuration changes through the native activity. This establishes repeatable emulator evidence for offline cold start and orientation handling; manufacturer-specific physical-device power management and presentation remain device-dependent.\n`;
          fs.writeFileSync('docs/ANDROID.md', android);
          NODE
      - name: Format evidence updates
        run: npm run format
      - name: Re-run repository quality gate
        run: npm run check
      - name: Commit verified acceptance
        run: |
          rm .github/workflows/android-emulator-acceptance-finalize.yml
          rm -f tsconfig.tsbuildinfo
          git config user.name privacyOG
          git config user.email privacyOG@users.noreply.github.com
          git add -A
          git commit -m "Verify Android emulator acceptance [emulator-verified]"
          git push origin HEAD:privacyog/android-emulator-acceptance
