name: Temporary v1.5.3 Item 7 Finalize

on:
  push:
    branches:
      - v1.5.3-work-item-7

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[item7-finalize]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-7
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Finalize files
        run: python3 scripts/temp-finalize-v153-item7.py
      - name: Format tracker
        run: npx prettier TEMP_TODO_V1.5.3.md --write
      - name: Publish finalized commit tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[item7-finalized] complete Qur’an reading UX'
          git tag -f temp-v153-item7-finalized
          git push --force origin refs/tags/temp-v153-item7-finalized
          git push origin :refs/tags/temp-v153-item7-generated || true
