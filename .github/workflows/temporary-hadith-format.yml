name: Temporary Hadith Feature Formatter

on:
  push:
    branches:
      - hadith-library-nawawi-collections

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: hadith-library-nawawi-collections

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fix strict Hadith entry narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/HadithLibraryScreen.tsx')
          text = path.read_text()
          old = """const legacyHadithEntries = islamicKnowledgeEntries.filter(\n  (entry): entry is HadithKnowledgeEntry => entry.module === 'hadith',\n);"""
          new = """const allKnowledgeEntries: readonly import('../domain/islamicKnowledge').IslamicKnowledgeEntry[] =\n  islamicKnowledgeEntries;\nconst legacyHadithEntries = allKnowledgeEntries.filter(\n  (entry): entry is HadithKnowledgeEntry => entry.module === 'hadith',\n);"""
          if old not in text:
              raise SystemExit('Expected narrowing block was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply project Prettier formatting
        run: npx prettier --write scripts/visual-hadith-library.mjs src/domain/nawawiHadithCollection.ts src/ui/HadithLibraryScreen.tsx src/ui/HadithLibraryScreen.test.ts src/hadith-library.css

      - name: Verify TypeScript build
        run: npm run typecheck

      - name: Package formatted source files
        run: |
          mkdir -p formatted-hadith/src/domain formatted-hadith/src/ui formatted-hadith/scripts
          cp src/domain/nawawiHadithCollection.ts formatted-hadith/src/domain/
          cp src/ui/HadithLibraryScreen.tsx formatted-hadith/src/ui/
          cp src/ui/HadithLibraryScreen.test.ts formatted-hadith/src/ui/
          cp src/hadith-library.css formatted-hadith/src/
          cp scripts/visual-hadith-library.mjs formatted-hadith/scripts/

      - name: Upload formatted source artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadith-feature-formatted
          path: formatted-hadith/
          if-no-files-found: error
          retention-days: 1
