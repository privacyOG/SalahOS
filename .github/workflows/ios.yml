name: iOS Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository quality gate
        run: npm run check

      - name: Synchronize iOS application
        run: npx cap sync ios

      - name: Build iOS Simulator application
        env:
          DERIVED_DATA: ${{ runner.temp }}/SalahOSDerivedData
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Resolve iPhone and iPad Simulator profiles
        id: profiles
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          ios = [runtime for runtime in runtimes if runtime.get('isAvailable') and runtime.get('platform') == 'iOS']
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          ios.sort(key=lambda runtime: tuple(int(part) for part in runtime['version'].split('.')), reverse=True)
          runtime = ios[0]['identifier']

          device_types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']

          def choose(preferred, prefix):
              for device_type in device_types:
                  if device_type['name'] == preferred:
                      return device_type['identifier']
              for device_type in device_types:
                  if device_type['name'].startswith(prefix):
                      return device_type['identifier']
              raise SystemExit(f'No available {prefix} Simulator device type')

          print(f'runtime={runtime}')
          print(f'iphone={choose("iPhone 17 Pro", "iPhone")}')
          print(f'ipad={choose("iPad Pro 13-inch (M5)", "iPad")}')
          PY

      - name: Install, launch and relaunch on fresh iPhone and iPad Simulators
        env:
          RUNTIME: ${{ steps.profiles.outputs.runtime }}
          IPHONE_TYPE: ${{ steps.profiles.outputs.iphone }}
          IPAD_TYPE: ${{ steps.profiles.outputs.ipad }}
          BUNDLE_ID: io.github.privacyog.salahos
          EVIDENCE_DIR: ${{ runner.temp }}/ios-simulator-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          CREATED_UDIDS=()

          cleanup() {
            for udid in "${CREATED_UDIDS[@]}"; do
              xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
              xcrun simctl delete "$udid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          verify_launch() {
            local output="$1"
            local pid
            echo "$output"
            pid="${output##*: }"
            [[ "$output" == "$BUNDLE_ID:"* ]]
            [[ "$pid" =~ ^[0-9]+$ ]]
            printf '%s' "$pid"
          }

          capture() {
            local udid="$1"
            local target="$2"
            local width height
            xcrun simctl io "$udid" screenshot --type=png "$target"
            test -s "$target"
            file "$target"
            width="$(sips -g pixelWidth "$target" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$target" | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$width" -gt 0 ]]
            [[ "$height" =~ ^[0-9]+$ && "$height" -gt 0 ]]
            echo "Screenshot ${width}x${height}: $target"
          }

          exercise() {
            local profile="$1"
            local device_type="$2"
            local appearance="$3"
            local name="SalahOS-${profile}-${GITHUB_RUN_ID}"
            local udid launch_output launch_pid relaunch_pid container_path

            udid="$(xcrun simctl create "$name" "$device_type" "$RUNTIME")"
            CREATED_UDIDS+=("$udid")
            echo "$profile UDID: $udid"

            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl install "$udid" "$APP_PATH"
            container_path="$(xcrun simctl get_app_container "$udid" "$BUNDLE_ID" app)"
            test -d "$container_path"

            launch_output="$(xcrun simctl launch "$udid" "$BUNDLE_ID")"
            launch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-launch.png"

            xcrun simctl terminate "$udid" "$BUNDLE_ID"
            launch_output="$(xcrun simctl launch "$udid" "$BUNDLE_ID")"
            relaunch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-relaunch.png"

            cat > "$EVIDENCE_DIR/${profile}.txt" <<EOF
          profile=$profile
          udid=$udid
          runtime=$RUNTIME
          device_type=$device_type
          app_path=$APP_PATH
          container_path=$container_path
          launch_pid=$launch_pid
          relaunch_pid=$relaunch_pid
          launch=passed
          relaunch=passed
          EOF
          }

          exercise iphone "$IPHONE_TYPE" light
          exercise ipad "$IPAD_TYPE" dark
          ls -lh "$EVIDENCE_DIR"

      - name: Upload iOS Simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          retention-days: 30
