name: iOS Build

on:
  pull_request:
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      # Repository-wide format/lint/security/test checks are owned by the
      # permanent Quality Gate workflow. Keep this job platform-specific so a
      # repository lint failure is reported once instead of masquerading as an
      # iOS build failure as well.
      - name: Build production web assets
        run: npm run build

      - name: Synchronize iOS application
        run: npx cap sync ios

      - name: Verify packaged Adhan audio in iOS bundle
        run: node scripts/check-adhan-audio-native-bundle.mjs ios

      - name: Build iOS Simulator application
        env:
          DERIVED_DATA: ${{ runner.temp }}/SalahOSDerivedData
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/App"
          test -f "$APP_PATH/Info.plist"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # The compile gate above is deterministic and is what blocks this check.
      #
      # The Simulator runtime acceptance below depends on CoreSimulator on a
      # shared hosted macOS runner. That dependency is infrastructure, not
      # repository state, so it is bounded and reported but never allowed to
      # fail or hang the job. Its real outcome is published to the run summary
      # and its evidence is retained as an artifact.
      - name: Install, launch and relaunch on fresh iPhone and iPad Simulators
        id: simulator_runtime
        continue-on-error: true
        timeout-minutes: 20
        env:
          BUNDLE_ID: com.privacyog.salahos
          EVIDENCE_DIR: ${{ runner.temp }}/ios-simulator-evidence
          ATTEMPTS_PER_PROFILE: 2
          RUNTIME_BUDGET_SECONDS: 1020
        run: |
          set -euo pipefail
          python3 scripts/ios_simulator_acceptance.py

      - name: Report Simulator runtime acceptance
        if: always()
        env:
          OUTCOME: ${{ steps.simulator_runtime.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" == "success" ]]; then
            echo "iOS Simulator runtime acceptance: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "iOS Simulator runtime acceptance: NOT COMPLETED ($OUTCOME)"
              echo ""
              echo "The Xcode Simulator compile gate passed. The runtime"
              echo "install/launch/relaunch acceptance did not complete on this"
              echo "hosted runner and is reported without blocking the check."
              echo "Inspect the step log and the retained evidence artifact"
              echo "before treating Simulator runtime behaviour as verified."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload iOS Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          retention-days: 30
          if-no-files-found: warn
