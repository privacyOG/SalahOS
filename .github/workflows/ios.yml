name: iOS Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository quality gate
        run: npm run check

      - name: Build production web assets
        run: npm run build

      - name: Synchronize iOS application
        run: npx cap sync ios

      - name: Build iOS Simulator application
        env:
          DERIVED_DATA: ${{ runner.temp }}/SalahOSDerivedData
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Resolve available iPhone and iPad Simulators
        id: profiles
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import json
          import subprocess

          def checked_json(*arguments):
              completed = subprocess.run(
                  ['xcrun', 'simctl', *arguments, '-j'],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              return json.loads(completed.stdout)

          runtimes = checked_json('list', 'runtimes')['runtimes']
          ios = [runtime for runtime in runtimes if runtime.get('isAvailable') and runtime.get('platform') == 'iOS']
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          ios.sort(key=lambda runtime: tuple(int(part) for part in runtime['version'].split('.')), reverse=True)

          devices_by_runtime = checked_json('list', 'devices', 'available')['devices']

          def candidates(prefix):
              selected = []
              for runtime in ios:
                  devices = [
                      device for device in devices_by_runtime.get(runtime['identifier'], [])
                      if device.get('isAvailable', True) and device.get('name', '').startswith(prefix)
                  ]
                  devices.sort(key=lambda device: device.get('state') != 'Booted')
                  for device in devices:
                      selected.append({
                          'runtime': runtime['identifier'],
                          'udid': device['udid'],
                          'name': device['name'],
                          'state': device.get('state', 'Unknown'),
                      })
                      if len(selected) == 3:
                          return selected
              if not selected:
                  raise SystemExit(f'No available {prefix} Simulator device')
              return selected

          def encode(value):
              payload = json.dumps(value, separators=(',', ':')).encode()
              return base64.b64encode(payload).decode()

          print(f'iphone_candidates={encode(candidates("iPhone"))}')
          print(f'ipad_candidates={encode(candidates("iPad"))}')
          PY

      - name: Install, launch and relaunch on available iPhone and iPad Simulators
        env:
          IPHONE_CANDIDATES: ${{ steps.profiles.outputs.iphone_candidates }}
          IPAD_CANDIDATES: ${{ steps.profiles.outputs.ipad_candidates }}
          BUNDLE_ID: com.privacyog.salahos
          EVIDENCE_DIR: ${{ runner.temp }}/ios-simulator-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ACTIVE_UDIDS=()
          RECOVERY_USED=0

          simctl() {
            local timeout_seconds="$1"
            shift
            python3 - "$timeout_seconds" "$@" <<'PY'
          import subprocess
          import sys

          timeout_seconds = int(sys.argv[1])
          arguments = sys.argv[2:]
          try:
              completed = subprocess.run(
                  ['xcrun', 'simctl', *arguments],
                  timeout=timeout_seconds,
              )
          except subprocess.TimeoutExpired:
              print(
                  f'simctl {" ".join(arguments)} exceeded {timeout_seconds} seconds.',
                  file=sys.stderr,
              )
              raise SystemExit(124)
          raise SystemExit(completed.returncode)
          PY
          }

          candidate_lines() {
            python3 - "$1" <<'PY'
          import base64
          import json
          import sys

          candidates = json.loads(base64.b64decode(sys.argv[1]))
          for candidate in candidates:
              print('\t'.join((candidate['runtime'], candidate['udid'], candidate['name'], candidate['state'])))
          PY
          }

          cleanup() {
            for udid in "${ACTIVE_UDIDS[@]}"; do
              simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          simulator_diagnostics() {
            local udid="$1"
            echo "Simulator diagnostics for $udid" >&2
            ps -ax | grep -E 'CoreSimulator|Simulator' | grep -v grep >&2 || true
            python3 - "$udid" <<'PY' >&2 || true
          import json
          import subprocess
          import sys

          udid = sys.argv[1]
          try:
              completed = subprocess.run(
                  ['xcrun', 'simctl', 'list', 'devices', '-j'],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              if completed.returncode == 0:
                  devices = json.loads(completed.stdout).get('devices', {})
                  for runtime, entries in devices.items():
                      for device in entries:
                          if device.get('udid') == udid:
                              print(runtime, device)
          except Exception as error:
              print(f'Unable to collect simctl diagnostics: {error}')
          PY
          }

          recover_core_simulator_once() {
            if [[ "$RECOVERY_USED" -eq 1 ]]; then
              return 0
            fi
            RECOVERY_USED=1
            echo "Restarting CoreSimulator service before trying another runner device." >&2
            python3 - <<'PY'
          import subprocess

          subprocess.run(
              ['killall', '-9', 'com.apple.CoreSimulator.CoreSimulatorService'],
              check=False,
              timeout=15,
          )
          PY
            sleep 5
          }

          boot_candidate() {
            local udid="$1"
            local state="$2"

            if [[ "$state" == "Booted" ]] && simctl 60 bootstatus "$udid" -b; then
              return 0
            fi

            simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
            simctl 30 boot "$udid" || return 1
            simctl 180 bootstatus "$udid" -b
          }

          select_bootable() {
            local profile="$1"
            local encoded_candidates="$2"
            local runtime udid device_name state

            while IFS=$'\t' read -r runtime udid device_name state; do
              echo "Trying $profile Simulator: $device_name ($udid), state=$state"
              if boot_candidate "$udid" "$state"; then
                SELECTED_RUNTIME="$runtime"
                SELECTED_UDID="$udid"
                SELECTED_NAME="$device_name"
                ACTIVE_UDIDS+=("$udid")
                return 0
              fi

              echo "$profile simulator boot infrastructure failed for $device_name ($udid)." >&2
              simulator_diagnostics "$udid"
              simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
              recover_core_simulator_once
            done < <(candidate_lines "$encoded_candidates")

            echo "No available $profile simulator completed a bounded boot." >&2
            return 1
          }

          verify_launch() {
            local output="$1"
            local pid
            echo "$output"
            pid="${output##*: }"
            [[ "$output" == "$BUNDLE_ID:"* ]]
            [[ "$pid" =~ ^[0-9]+$ ]]
            printf '%s' "$pid"
          }

          capture() {
            local udid="$1"
            local target="$2"
            local width height
            simctl 60 io "$udid" screenshot --type=png "$target"
            test -s "$target"
            file "$target"
            width="$(sips -g pixelWidth "$target" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$target" | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$width" -gt 0 ]]
            [[ "$height" =~ ^[0-9]+$ && "$height" -gt 0 ]]
            echo "Screenshot ${width}x${height}: $target"
          }

          exercise() {
            local profile="$1"
            local encoded_candidates="$2"
            local appearance="$3"
            local launch_output launch_pid relaunch_pid container_path

            select_bootable "$profile" "$encoded_candidates"
            echo "$profile selected Simulator: $SELECTED_NAME ($SELECTED_UDID)"
            echo "$profile selected Runtime: $SELECTED_RUNTIME"

            if ! simctl 30 ui "$SELECTED_UDID" appearance "$appearance"; then
              echo "Appearance preference unavailable; runtime acceptance continues." >&2
            fi

            simctl 60 install "$SELECTED_UDID" "$APP_PATH"
            container_path="$(simctl 30 get_app_container "$SELECTED_UDID" "$BUNDLE_ID" app)"
            test -d "$container_path"

            launch_output="$(simctl 60 launch "$SELECTED_UDID" "$BUNDLE_ID")"
            launch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$SELECTED_UDID" "$EVIDENCE_DIR/${profile}-launch.png"

            simctl 30 terminate "$SELECTED_UDID" "$BUNDLE_ID"
            launch_output="$(simctl 60 launch "$SELECTED_UDID" "$BUNDLE_ID")"
            relaunch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$SELECTED_UDID" "$EVIDENCE_DIR/${profile}-relaunch.png"

            cat > "$EVIDENCE_DIR/${profile}.txt" <<EOF
          profile=$profile
          udid=$SELECTED_UDID
          runtime=$SELECTED_RUNTIME
          device_name=$SELECTED_NAME
          app_path=$APP_PATH
          container_path=$container_path
          launch_pid=$launch_pid
          relaunch_pid=$relaunch_pid
          launch=passed
          relaunch=passed
          EOF
          }

          exercise iphone "$IPHONE_CANDIDATES" light
          exercise ipad "$IPAD_CANDIDATES" dark
          ls -lh "$EVIDENCE_DIR"

      - name: Upload iOS Simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          retention-days: 30
