name: iOS Build

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Repository quality gate
        run: npm run check
      - name: Synchronize iOS application
        run: npx cap sync ios
      - name: Build iOS simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SalahOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_BUNDLE="$(find "$RUNNER_TEMP/SalahOSDerivedData/Build/Products" -path '*Debug-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_BUNDLE"
          test -s "$APP_BUNDLE/public/index.html"
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
      - name: Select iPhone and iPad Simulators
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          devices = json.loads(
              subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'])
          )['devices']
          iphone = None
          ipad = None
          for runtime, entries in reversed(list(devices.items())):
              for device in entries:
                  name = device.get('name', '')
                  if iphone is None and name.startswith('iPhone'):
                      iphone = (name, device['udid'], runtime)
                  if ipad is None and name.startswith('iPad'):
                      ipad = (name, device['udid'], runtime)
              if iphone is not None and ipad is not None:
                  break

          if iphone is None:
              raise SystemExit('No available iPhone Simulator')
          if ipad is None:
              raise SystemExit('No available iPad Simulator')

          print('Selected iPhone:', iphone)
          print('Selected iPad:', ipad)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'IPHONE_NAME={iphone[0]}\nIPHONE_UDID={iphone[1]}\n')
              env.write(f'IPAD_NAME={ipad[0]}\nIPAD_UDID={ipad[1]}\n')
          PY
      - name: Capture iPhone and iPad visual evidence
        timeout-minutes: 10
        run: |
          mkdir -p simulator-evidence

          capture_device() {
            local udid="$1"
            local label="$2"

            xcrun simctl shutdown "$udid" 2>/dev/null || true
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_BUNDLE"
            xcrun simctl terminate "$udid" com.privacyog.salahos 2>/dev/null || true

            launch_output="$(xcrun simctl launch "$udid" com.privacyog.salahos)"
            echo "$launch_output"
            grep -F 'com.privacyog.salahos:' <<<"$launch_output"

            sleep 5
            xcrun simctl io "$udid" screenshot "simulator-evidence/${label}-5s.png"
            sleep 15
            xcrun simctl io "$udid" screenshot "simulator-evidence/${label}-20s.png"
            xcrun simctl get_app_container "$udid" com.privacyog.salahos app
            sips -g pixelWidth -g pixelHeight \
              "simulator-evidence/${label}-5s.png" \
              "simulator-evidence/${label}-20s.png"
            xcrun simctl shutdown "$udid"
          }

          capture_device "$IPHONE_UDID" iphone
          capture_device "$IPAD_UDID" ipad
      - name: Upload iOS simulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-visual-${{ github.sha }}
          path: simulator-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
