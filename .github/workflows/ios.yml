name: iOS Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository quality gate
        run: npm run check

      - name: Build production web assets
        run: npm run build

      - name: Synchronize iOS application
        run: npx cap sync ios

      - name: Build iOS Simulator application
        env:
          DERIVED_DATA: ${{ runner.temp }}/SalahOSDerivedData
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Resolve available iPhone and iPad Simulators
        id: profiles
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          def checked_json(*arguments):
              completed = subprocess.run(
                  ['xcrun', 'simctl', *arguments, '-j'],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              return json.loads(completed.stdout)

          runtimes = checked_json('list', 'runtimes')['runtimes']
          ios = [runtime for runtime in runtimes if runtime.get('isAvailable') and runtime.get('platform') == 'iOS']
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          ios.sort(key=lambda runtime: tuple(int(part) for part in runtime['version'].split('.')), reverse=True)

          devices_by_runtime = checked_json('list', 'devices', 'available')['devices']

          def choose(prefix):
              for runtime in ios:
                  for device in devices_by_runtime.get(runtime['identifier'], []):
                      if device.get('isAvailable', True) and device.get('name', '').startswith(prefix):
                          return runtime['identifier'], device['udid'], device['name']
              raise SystemExit(f'No available {prefix} Simulator device')

          iphone_runtime, iphone_udid, iphone_name = choose('iPhone')
          ipad_runtime, ipad_udid, ipad_name = choose('iPad')

          print(f'iphone_runtime={iphone_runtime}')
          print(f'iphone_udid={iphone_udid}')
          print(f'iphone_name={iphone_name}')
          print(f'ipad_runtime={ipad_runtime}')
          print(f'ipad_udid={ipad_udid}')
          print(f'ipad_name={ipad_name}')
          PY

      - name: Install, launch and relaunch on available iPhone and iPad Simulators
        env:
          IPHONE_RUNTIME: ${{ steps.profiles.outputs.iphone_runtime }}
          IPHONE_UDID: ${{ steps.profiles.outputs.iphone_udid }}
          IPHONE_NAME: ${{ steps.profiles.outputs.iphone_name }}
          IPAD_RUNTIME: ${{ steps.profiles.outputs.ipad_runtime }}
          IPAD_UDID: ${{ steps.profiles.outputs.ipad_udid }}
          IPAD_NAME: ${{ steps.profiles.outputs.ipad_name }}
          BUNDLE_ID: com.privacyog.salahos
          EVIDENCE_DIR: ${{ runner.temp }}/ios-simulator-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ACTIVE_UDIDS=()

          simctl() {
            local timeout_seconds="$1"
            shift
            python3 - "$timeout_seconds" "$@" <<'PY'
          import subprocess
          import sys

          timeout_seconds = int(sys.argv[1])
          arguments = sys.argv[2:]
          try:
              completed = subprocess.run(
                  ['xcrun', 'simctl', *arguments],
                  timeout=timeout_seconds,
              )
          except subprocess.TimeoutExpired:
              print(
                  f'simctl {" ".join(arguments)} exceeded {timeout_seconds} seconds.',
                  file=sys.stderr,
              )
              raise SystemExit(124)
          raise SystemExit(completed.returncode)
          PY
          }

          cleanup() {
            for udid in "${ACTIVE_UDIDS[@]}"; do
              simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          simulator_diagnostics() {
            local udid="$1"
            echo "Simulator diagnostics for $udid" >&2
            ps -ax | grep -E 'CoreSimulator|Simulator' | grep -v grep >&2 || true
            python3 - "$udid" <<'PY' >&2 || true
          import json
          import subprocess
          import sys

          udid = sys.argv[1]
          try:
              completed = subprocess.run(
                  ['xcrun', 'simctl', 'list', 'devices', '-j'],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              if completed.returncode == 0:
                  devices = json.loads(completed.stdout).get('devices', {})
                  for runtime, entries in devices.items():
                      for device in entries:
                          if device.get('udid') == udid:
                              print(runtime, device)
          except Exception as error:
              print(f'Unable to collect simctl diagnostics: {error}')
          PY
          }

          recover_core_simulator() {
            echo "Restarting CoreSimulator service before one bounded retry." >&2
            python3 - <<'PY'
          import subprocess

          subprocess.run(
              ['killall', '-9', 'com.apple.CoreSimulator.CoreSimulatorService'],
              check=False,
              timeout=15,
          )
          PY
            sleep 5
          }

          boot_or_recover() {
            local udid="$1"

            simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
            if simctl 30 boot "$udid" && simctl 180 bootstatus "$udid" -b; then
              return 0
            fi

            echo "Initial simulator boot failed for $udid." >&2
            simulator_diagnostics "$udid"
            simctl 30 shutdown "$udid" >/dev/null 2>&1 || true
            recover_core_simulator

            if simctl 30 boot "$udid" && simctl 180 bootstatus "$udid" -b; then
              echo "Simulator $udid recovered on the second boot attempt."
              return 0
            fi

            echo "Simulator $udid failed both bounded boot attempts." >&2
            simulator_diagnostics "$udid"
            return 1
          }

          verify_launch() {
            local output="$1"
            local pid
            echo "$output"
            pid="${output##*: }"
            [[ "$output" == "$BUNDLE_ID:"* ]]
            [[ "$pid" =~ ^[0-9]+$ ]]
            printf '%s' "$pid"
          }

          capture() {
            local udid="$1"
            local target="$2"
            local width height
            simctl 60 io "$udid" screenshot --type=png "$target"
            test -s "$target"
            file "$target"
            width="$(sips -g pixelWidth "$target" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$target" | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$width" -gt 0 ]]
            [[ "$height" =~ ^[0-9]+$ && "$height" -gt 0 ]]
            echo "Screenshot ${width}x${height}: $target"
          }

          exercise() {
            local profile="$1"
            local udid="$2"
            local runtime="$3"
            local device_name="$4"
            local appearance="$5"
            local launch_output launch_pid relaunch_pid container_path

            ACTIVE_UDIDS+=("$udid")
            echo "$profile Simulator: $device_name ($udid)"
            echo "$profile Runtime: $runtime"

            boot_or_recover "$udid"
            simctl 30 ui "$udid" appearance "$appearance"
            simctl 60 install "$udid" "$APP_PATH"
            container_path="$(simctl 30 get_app_container "$udid" "$BUNDLE_ID" app)"
            test -d "$container_path"

            launch_output="$(simctl 60 launch "$udid" "$BUNDLE_ID")"
            launch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-launch.png"

            simctl 30 terminate "$udid" "$BUNDLE_ID"
            launch_output="$(simctl 60 launch "$udid" "$BUNDLE_ID")"
            relaunch_pid="$(verify_launch "$launch_output" | tail -n 1)"
            sleep 4
            capture "$udid" "$EVIDENCE_DIR/${profile}-relaunch.png"

            cat > "$EVIDENCE_DIR/${profile}.txt" <<EOF
          profile=$profile
          udid=$udid
          runtime=$runtime
          device_name=$device_name
          app_path=$APP_PATH
          container_path=$container_path
          launch_pid=$launch_pid
          relaunch_pid=$relaunch_pid
          launch=passed
          relaunch=passed
          EOF
          }

          exercise iphone "$IPHONE_UDID" "$IPHONE_RUNTIME" "$IPHONE_NAME" light
          exercise ipad "$IPAD_UDID" "$IPAD_RUNTIME" "$IPAD_NAME" dark
          ls -lh "$EVIDENCE_DIR"

      - name: Upload iOS Simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          retention-days: 30
