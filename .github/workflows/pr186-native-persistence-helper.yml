name: PR 186 native persistence helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'uiux/mobile-prayer-theme-fix'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add exact iOS Phone/Home persistence evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ios_simulator_acceptance.py')
          content = path.read_text()

          constants_marker = "\n\nclass AcceptanceError(RuntimeError):"
          constants = r'''

MOBILE_THEME_STORAGE_KEY = 'salahos.mobilePrayerBoardDisplayConfig'
MOBILE_THEME_NATIVE_KEY = 'CapacitorStorage.' + MOBILE_THEME_STORAGE_KEY


def mobile_theme_fixture(profile_name):
    template_id = 'scenic-spiritual' if profile_name == 'iphone' else 'family-classroom'
    accent = 'jewel' if profile_name == 'iphone' else 'sandstone'
    artwork = 'scenic-gradient' if profile_name == 'iphone' else 'classroom-pattern'
    return json.dumps(
        {
            'version': 1,
            'templateId': template_id,
            'primaryLocale': 'en',
            'languageMode': 'single',
            'timeFormat': 'h23',
            'accentPreset': accent,
            'moduleVisibility': {
                'current-time': True,
                'dates': True,
                'next-prayer': True,
                'countdown': True,
                'prayer-timetable': True,
                'jumuah': True,
                'sunrise-sunset': True,
                'mosque-branding': True,
                'announcements': True,
                'weather': False,
            },
            'branding': {'mosqueName': None, 'logo': None},
            'background': {'kind': 'builtin', 'artworkId': artwork},
        },
        separators=(',', ':'),
    )
'''
          if constants_marker not in content:
              raise SystemExit('AcceptanceError marker not found')
          content = content.replace(constants_marker, constants + constants_marker, 1)

          helper_marker = "\n\ndef exercise_once(deadline, profile, runtime, device_type, app_path, bundle_id, evidence_dir):"
          helpers = r'''


def seed_mobile_theme(deadline, udid, bundle_id, value):
    simctl(
        deadline,
        60,
        'spawn',
        udid,
        'defaults',
        'write',
        bundle_id,
        MOBILE_THEME_NATIVE_KEY,
        '-string',
        value,
    )


def read_mobile_theme(deadline, udid, bundle_id):
    return simctl(
        deadline,
        60,
        'spawn',
        udid,
        'defaults',
        'read',
        bundle_id,
        MOBILE_THEME_NATIVE_KEY,
    )


def assert_mobile_theme(deadline, udid, bundle_id, expected, phase):
    observed = read_mobile_theme(deadline, udid, bundle_id)
    if observed != expected:
        raise AcceptanceError(
            'Phone/Home theme changed during iOS {}. Expected {!r}, observed {!r}.'.format(
                phase, expected, observed
            )
        )
    log('Phone/Home native theme persistence verified after iOS {}.'.format(phase))
'''
          if helper_marker not in content:
              raise SystemExit('exercise_once marker not found')
          content = content.replace(helper_marker, helpers + helper_marker, 1)

          install_marker = """        container_path = simctl(deadline, 60, 'get_app_container', udid, bundle_id, 'app')
        if not os.path.isdir(container_path):
            raise AcceptanceError('Installed application container {} is missing.'.format(container_path))

        first_pid = start_and_capture(
"""
          install_replacement = """        container_path = simctl(deadline, 60, 'get_app_container', udid, bundle_id, 'app')
        if not os.path.isdir(container_path):
            raise AcceptanceError('Installed application container {} is missing.'.format(container_path))

        expected_mobile_theme = mobile_theme_fixture(profile['name'])
        seed_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme)
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'native seed')

        first_pid = start_and_capture(
"""
          if install_marker not in content:
              raise SystemExit('install/container marker not found')
          content = content.replace(install_marker, install_replacement, 1)

          launch_marker = """        first_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-launch.png')
        )
        simctl(deadline, 90, 'terminate', udid, bundle_id)
        second_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-relaunch.png')
        )

        evidence = [
"""
          launch_replacement = """        first_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-launch.png')
        )
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'launch')
        simctl(deadline, 90, 'terminate', udid, bundle_id)
        second_pid = start_and_capture(
            deadline, udid, bundle_id, os.path.join(evidence_dir, profile['name'] + '-relaunch.png')
        )
        assert_mobile_theme(deadline, udid, bundle_id, expected_mobile_theme, 'process relaunch')

        evidence = [
"""
          if launch_marker not in content:
              raise SystemExit('launch/relaunch marker not found')
          content = content.replace(launch_marker, launch_replacement, 1)

          evidence_marker = """            'settled_launch_screenshot=passed',
            'settled_relaunch_screenshot=passed',
"""
          evidence_replacement = """            'settled_launch_screenshot=passed',
            'settled_relaunch_screenshot=passed',
            'mobile_theme_storage_key={}'.format(MOBILE_THEME_STORAGE_KEY),
            'mobile_theme_native_key={}'.format(MOBILE_THEME_NATIVE_KEY),
            'mobile_theme_value={}'.format(expected_mobile_theme),
            'mobile_theme_launch=passed',
            'mobile_theme_relaunch=passed',
"""
          if evidence_marker not in content:
              raise SystemExit('evidence marker not found')
          content = content.replace(evidence_marker, evidence_replacement, 1)

          path.write_text(content)
          PY

      - name: Verify Python syntax
        run: python3 -m py_compile scripts/ios_simulator_acceptance.py

      - name: Publish correction commit object
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add scripts/ios_simulator_acceptance.py
          git commit -m 'Verify Phone/Home theme across iOS relaunch'
          echo "CORRECTION_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:${GITHUB_HEAD_REF}
