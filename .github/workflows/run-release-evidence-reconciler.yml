name: Run release evidence reconciler

on:
  push:
    branches:
      - privacyog/current-ios-release-evidence
    paths:
      - .github/workflows/run-release-evidence-reconciler.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: privacyog/current-ios-release-evidence
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply evidence reconciliation
        run: python3 .github/scripts/reconcile_release_candidate.py
      - name: Format reconciled documents
        run: npx prettier --write README.md TODO.md TESTING.md docs/IOS_VALIDATION_STATUS.md docs/PLATFORM_STATUS.md docs/VALIDATION_2026-08-17.md
      - name: Commit reconciliation and remove helpers
        run: |
          rm -f .github/scripts/reconcile_release_candidate.py
          rm -f .github/workflows/run-release-evidence-reconciler.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -A
          git commit -m "Record release candidate validation evidence"
          git push origin HEAD:privacyog/current-ios-release-evidence
