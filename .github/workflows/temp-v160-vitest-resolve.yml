name: Temporary V1.6 Vitest resolver

on:
  push:
    branches:
      - temp/v160-vitest-4.1.11

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve fixed Vitest patch line
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.0
          npm --version
          npm pkg set 'devDependencies.vitest=4.1.11' 'devDependencies.@vitest/coverage-v8=4.1.11'
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run typecheck
          npm run quran:offline:prepare
          npm run test
          echo '---BEGIN DEPENDENCY DIFF---'
          git diff -- package.json package-lock.json
          echo '---END DEPENDENCY DIFF---'
      - name: Retain exact resolved dependency files
        uses: actions/upload-artifact@v4
        with:
          name: v160-vitest-4.1.11-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Publish clean resolved tree as temporary tag
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-v160-vitest-resolve.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/temp-v160-vitest-resolve.yml
          git commit -m 'Fix Vitest security advisory for V1.6.0'
          git tag -f temp-vitest-4.1.11-resolved
          git push --force origin refs/tags/temp-vitest-4.1.11-resolved
