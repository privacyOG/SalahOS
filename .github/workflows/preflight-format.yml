name: Stage 7 Preflight Formatter

on:
  push:
    branches:
      - preflight/stage7-efficiency
    paths:
      - scripts/visual-theme-matrix.mjs
      - src/mosque-display-theme.css
      - .github/workflows/preflight-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preflight/stage7-efficiency

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Format Stage 7 files
        run: npx prettier --write scripts/visual-theme-matrix.mjs src/mosque-display-theme.css

      - name: Print formatter diff
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/visual-theme-matrix.mjs src/mosque-display-theme.css
