name: Stage 36 final validation once

on:
  push:
    branches:
      - 'validation/stage-36-final-check'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/stage-36-final-check
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run validation and persist result
        shell: bash
        run: |
          set +e
          : > stage36-validation-result.txt
          run_check() {
            name="$1"
            shift
            "$@"
            code=$?
            printf '%s=%s\n' "$name" "$code" >> stage36-validation-result.txt
            return 0
          }
          run_check sensitive npm run security:sensitive-files
          run_check native_permissions npm run security:native-permissions
          run_check remote_network npm run security:remote-network
          run_check audit npm run security:audit
          run_check licenses npm run security:licenses
          run_check docs npm run docs:links
          run_check icons python3 scripts/generate_pwa_icons.py --check
          run_check format npm run format:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check test npm run test
          run_check build npm run build
          run_check web_artifact npm run verify:web-build
      - name: Commit validation result and remove workflow
        run: |
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm .github/workflows/stage36-final-check-once.yml
          git add stage36-validation-result.txt
          git commit -m 'Record Stage 36 hosted validation result'
          git push origin HEAD:validation/stage-36-final-check
