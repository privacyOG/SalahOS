name: TEMP externalize Australian mosque runtime catalogue

on:
  push:
    branches:
      - release/bundle-budget-recovery

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/bundle-budget-recovery
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic catalogue externalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          # Revert the failed cross-module constant-inlining experiment.
          write(
              'vite.config.ts',
              """import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
            build: {
              target: 'es2022',
            },
          });
          """,
          )

          # Keep one canonical 254-record catalogue, but serve it as a fixed first-party
          # static asset instead of compiling it into JavaScript.
          source = Path('src/data/australian-mosques-combined.json')
          target = Path('public/data/australian-mosques-combined.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          source.replace(target)

          domain_path = 'src/domain/australianMosqueDirectoryCombined.ts'
          domain = read(domain_path)
          domain = domain.replace("import rawDirectory from '../data/australian-mosques-combined.json';\n", '', 1)
          domain = domain.replace(
              'function parseDirectory(value: unknown): AustralianMosqueDirectory {',
              'export function parseAustralianMosqueDirectory(value: unknown): AustralianMosqueDirectory {',
              1,
          )
          footer = "\nexport const australianMosqueDirectory = parseDirectory(rawDirectory);\nexport const australianMosques = australianMosqueDirectory.records;"
          if footer not in domain:
              raise SystemExit('Combined directory footer exports were not found')
          domain = domain.replace(footer, '', 1)
          write(domain_path, domain)

          write(
              'src/platform/australianMosqueDirectoryAsset.ts',
              """import {
            parseAustralianMosqueDirectory,
            type AustralianMosqueDirectory,
          } from '../domain/australianMosqueDirectoryCombined';

          export const AUSTRALIAN_MOSQUE_DIRECTORY_ASSET_URL =
            '/data/australian-mosques-combined.json';

          let pendingDirectory: Promise<AustralianMosqueDirectory> | null = null;

          async function fetchAustralianMosqueDirectory(): Promise<AustralianMosqueDirectory> {
            const response = await fetch(AUSTRALIAN_MOSQUE_DIRECTORY_ASSET_URL, {
              cache: 'force-cache',
              credentials: 'same-origin',
            });
            if (!response.ok) {
              throw new Error(
                `Australian mosque directory asset failed with HTTP ${String(response.status)}`,
              );
            }
            return parseAustralianMosqueDirectory((await response.json()) as unknown);
          }

          export function loadAustralianMosqueDirectoryAsset(): Promise<AustralianMosqueDirectory> {
            pendingDirectory ??= fetchAustralianMosqueDirectory().catch((error: unknown) => {
              pendingDirectory = null;
              throw error;
            });
            return pendingDirectory;
          }
          """,
          )

          write(
              'src/platform/australianMosqueDirectoryAsset.test.ts',
              """import rawDirectory from '../../public/data/australian-mosques-combined.json';
          import { afterEach, describe, expect, it, vi } from 'vitest';

          afterEach(() => {
            vi.unstubAllGlobals();
            vi.resetModules();
          });

          describe('Australian mosque directory asset', () => {
            it('loads and validates the fixed same-origin offline catalogue', async () => {
              const fetchMock = vi.fn().mockResolvedValue(
                new Response(JSON.stringify(rawDirectory), {
                  status: 200,
                  headers: { 'content-type': 'application/json' },
                }),
              );
              vi.stubGlobal('fetch', fetchMock);
              const {
                AUSTRALIAN_MOSQUE_DIRECTORY_ASSET_URL,
                loadAustralianMosqueDirectoryAsset,
              } = await import('./australianMosqueDirectoryAsset');

              const directory = await loadAustralianMosqueDirectoryAsset();

              expect(AUSTRALIAN_MOSQUE_DIRECTORY_ASSET_URL).toBe(
                '/data/australian-mosques-combined.json',
              );
              expect(directory.source.recordCount).toBe(254);
              expect(directory.records).toHaveLength(254);
              expect(fetchMock).toHaveBeenCalledWith(AUSTRALIAN_MOSQUE_DIRECTORY_ASSET_URL, {
                cache: 'force-cache',
                credentials: 'same-origin',
              });
            });

            it('fails closed when the packaged catalogue cannot be read', async () => {
              vi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response(null, { status: 503 })));
              const { loadAustralianMosqueDirectoryAsset } = await import(
                './australianMosqueDirectoryAsset'
              );

              await expect(loadAustralianMosqueDirectoryAsset()).rejects.toThrow('HTTP 503');
            });
          });
          """,
          )

          panel_path = 'src/ui/AustralianMosqueDirectoryPanel.tsx'
          panel = read(panel_path)
          old_import = """import {
            australianMosqueDirectory,
            australianMosques,
            australianMosqueToProfile,
            searchAustralianMosques,
            sortAustralianMosquesByDistance,
            type AustralianMosqueRecord,
          } from '../domain/australianMosqueDirectoryCombined';"""
          new_import = """import {
            australianMosqueToProfile,
            searchAustralianMosques,
            sortAustralianMosquesByDistance,
            type AustralianMosqueDirectory,
            type AustralianMosqueRecord,
          } from '../domain/australianMosqueDirectoryCombined';"""
          if old_import not in panel:
              raise SystemExit('Panel combined-directory import block was not found')
          panel = panel.replace(old_import, new_import, 1)
          panel = panel.replace(
              "import { getApplicationStorage } from '../platform/applicationStorage';",
              "import { getApplicationStorage } from '../platform/applicationStorage';\nimport { loadAustralianMosqueDirectoryAsset } from '../platform/australianMosqueDirectoryAsset';",
              1,
          )
          panel = panel.replace(
              'const COLLAPSED_RESULT_LIMIT = 24;',
              "const COLLAPSED_RESULT_LIMIT = 24;\nconst EMPTY_AUSTRALIAN_MOSQUES: readonly AustralianMosqueRecord[] = Object.freeze([]);",
              1,
          )
          panel = panel.replace(
              """  const [library, setLibrary] = useState<MosqueProfileLibraryState>(readMosques);
            const [query, setQuery] = useState('');""",
              """  const [library, setLibrary] = useState<MosqueProfileLibraryState>(readMosques);
            const [directory, setDirectory] = useState<AustralianMosqueDirectory | null>(null);
            const [directoryLoadFailed, setDirectoryLoadFailed] = useState(false);
            const [query, setQuery] = useState('');""",
              1,
          )
          panel = panel.replace(
              """  useEffect(() => {
              const refresh = () => {""",
              """  useEffect(() => {
              let active = true;
              void loadAustralianMosqueDirectoryAsset()
                .then((loadedDirectory) => {
                  if (!active) return;
                  setDirectory(loadedDirectory);
                  setDirectoryLoadFailed(false);
                })
                .catch(() => {
                  if (active) setDirectoryLoadFailed(true);
                });
              return () => {
                active = false;
              };
            }, []);

            useEffect(() => {
              const refresh = () => {""",
              1,
          )
          panel = panel.replace(
              """  const matchingMosques = useMemo(() => searchAustralianMosques(australianMosques, query), [query]);""",
              """  const australianMosques = directory?.records ?? EMPTY_AUSTRALIAN_MOSQUES;
            const matchingMosques = useMemo(
              () => searchAustralianMosques(australianMosques, query),
              [australianMosques, query],
            );""",
              1,
          )
          panel = panel.replace(
              'data-directory-record-count={australianMosqueDirectory.source.recordCount}',
              'data-directory-record-count={directory?.source.recordCount ?? 0}',
              1,
          )
          panel = panel.replace(
              '<strong>{australianMosqueDirectory.source.recordCount}</strong>',
              "<strong>{directory?.source.recordCount ?? '…'}</strong>",
              1,
          )
          panel = panel.replace(
              """      </header>

                <div className=\"australian-mosque-directory__controls\">""",
              """      </header>

                {directory === null && (
                  <p className=\"australian-mosque-directory__privacy-note\" role=\"status\">
                    {directoryLoadFailed ? text.loadError : text.loading}
                  </p>
                )}

                <div className=\"australian-mosque-directory__controls\">""",
              1,
          )
          panel = panel.replace(
              """            type=\"search\"
                    value={query}""",
              """            type=\"search\"
                    value={query}
                    disabled={directory === null}""",
              1,
          )
          panel = panel.replace(
              """            aria-pressed={!sortByDistance}
                    onClick={() => {""",
              """            aria-pressed={!sortByDistance}
                    disabled={directory === null}
                    onClick={() => {""",
              1,
          )
          panel = panel.replace(
              'disabled={savedCoordinates === null}',
              'disabled={directory === null || savedCoordinates === null}',
              1,
          )
          old_count = """      <p className=\"australian-mosque-directory__result-count\" role=\"status\">
                {new Intl.NumberFormat(localeTag(locale)).format(matchingMosques.length)} {text.results}
              </p>"""
          new_count = """      {directory !== null && (
                <p className=\"australian-mosque-directory__result-count\" role=\"status\">
                  {new Intl.NumberFormat(localeTag(locale)).format(matchingMosques.length)} {text.results}
                </p>
              )}"""
          if old_count not in panel:
              raise SystemExit('Panel result count block was not found')
          panel = panel.replace(old_count, new_count, 1)
          panel = panel.replace(
              '{visibleMosques.length === 0 ? (',
              '{directory === null ? null : visibleMosques.length === 0 ? (',
              1,
          )
          panel = panel.replace(
              '<footer className="australian-mosque-directory__source">',
              '{directory !== null && (\n        <footer className="australian-mosque-directory__source">',
              1,
          )
          panel = panel.replace('australianMosqueDirectory.source.', 'directory.source.')
          panel = panel.replace(
              """      </footer>
            </section>""",
              """        </footer>
              )}
            </section>""",
              1,
          )
          write(panel_path, panel)

          translations_path = 'src/i18n/australianMosqueDirectoryTranslations.ts'
          translations = read(translations_path)
          translations = translations.replace(
              '  offline: string;\n',
              '  offline: string;\n  loading: string;\n  loadError: string;\n',
              1,
          )
          translations = translations.replace(
              "    offline: 'Offline',\n",
              "    offline: 'Offline',\n    loading: 'Loading the preloaded Australian directory…',\n    loadError: 'The preloaded Australian directory could not be opened on this device.',\n",
              1,
          )
          translations = translations.replace(
              "    offline: 'دون اتصال',\n",
              "    offline: 'دون اتصال',\n    loading: 'جارٍ تحميل دليل أستراليا المحمّل مسبقاً…',\n    loadError: 'تعذّر فتح دليل أستراليا المحمّل مسبقاً على هذا الجهاز.',\n",
              1,
          )
          translations = translations.replace(
              "    offline: 'Çevrimdışı',\n",
              "    offline: 'Çevrimdışı',\n    loading: 'Önceden yüklenmiş Avustralya dizini yükleniyor…',\n    loadError: 'Önceden yüklenmiş Avustralya dizini bu cihazda açılamadı.',\n",
              1,
          )
          translations = translations.replace(
              "    offline: 'Luring',\n",
              "    offline: 'Luring',\n    loading: 'Memuat direktori Australia yang telah dimuat sebelumnya…',\n    loadError: 'Direktori Australia yang telah dimuat sebelumnya tidak dapat dibuka di perangkat ini.',\n",
              1,
          )
          write(translations_path, translations)

          combined_test_path = 'src/domain/australianMosqueDirectoryCombined.test.ts'
          combined_test = read(combined_test_path)
          combined_test = combined_test.replace(
              "import { describe, expect, it } from 'vitest';\n",
              "import rawDirectory from '../../public/data/australian-mosques-combined.json';\nimport { describe, expect, it } from 'vitest';\n",
              1,
          )
          combined_test = combined_test.replace('  australianMosqueDirectory,\n', '', 1)
          combined_test = combined_test.replace('  australianMosques,\n', '', 1)
          combined_test = combined_test.replace(
              '  australianMosqueToProfile,\n',
              '  australianMosqueToProfile,\n  parseAustralianMosqueDirectory,\n',
              1,
          )
          combined_test = combined_test.replace(
              "import { createCoordinates } from './coordinates';\n",
              "import { createCoordinates } from './coordinates';\n\nconst australianMosqueDirectory = parseAustralianMosqueDirectory(rawDirectory);\nconst australianMosques = australianMosqueDirectory.records;\n",
              1,
          )
          write(combined_test_path, combined_test)

          prayer_test_path = 'src/domain/australianMosquePrayerContext.test.ts'
          prayer_test = read(prayer_test_path)
          prayer_test = prayer_test.replace(
              "import { describe, expect, it } from 'vitest';\n",
              "import rawDirectory from '../../public/data/australian-mosques-combined.json';\nimport { describe, expect, it } from 'vitest';\n",
              1,
          )
          prayer_test = prayer_test.replace(
              """import {
            australianMosques,
            type AustralianMosqueRecord,
          } from './australianMosqueDirectoryCombined';""",
              """import {
            parseAustralianMosqueDirectory,
            type AustralianMosqueRecord,
          } from './australianMosqueDirectoryCombined';""",
              1,
          )
          prayer_test = prayer_test.replace(
              "import { applyPrayerSourceToDashboard } from './sourcedDashboard';\n",
              "import { applyPrayerSourceToDashboard } from './sourcedDashboard';\n\nconst australianMosques = parseAustralianMosqueDirectory(rawDirectory).records;\n",
              1,
          )
          write(prayer_test_path, prayer_test)

          # Canonical source-path consumers now read the same public/data file.
          replacements = {
              'scripts/generate-mosque-directory-packs.mjs': [
                  ("path.join(root, 'src', 'data', 'australian-mosques-combined.json')", "path.join(root, 'public', 'data', 'australian-mosques-combined.json')"),
              ],
              'scripts/generate-australian-mosque-combined.mjs': [
                  ("path.join(root, 'src', 'data', 'australian-mosques-combined.json')", "path.join(root, 'public', 'data', 'australian-mosques-combined.json')"),
              ],
              'directory-service/server.mjs': [
                  ("'src/data/australian-mosques-combined.json'", "'public/data/australian-mosques-combined.json'"),
              ],
              'directory-service/server.acceptance.mjs': [
                  ("'src/data/australian-mosques-combined.json'", "'public/data/australian-mosques-combined.json'"),
              ],
              'docs/AUSTRALIAN_MOSQUE_DIRECTORY.md': [
                  ('`src/data/australian-mosques-combined.json`', '`public/data/australian-mosques-combined.json`'),
              ],
          }
          for path, pairs in replacements.items():
              content = read(path)
              for old, new in pairs:
                  if old not in content:
                      raise SystemExit(f'{path}: source-path reference missing: {old}')
                  content = content.replace(old, new)
              write(path, content)

          sw_path = 'public/sw.js'
          sw = read(sw_path)
          sw = sw.replace(
              "  '/manifest.webmanifest',\n",
              "  '/manifest.webmanifest',\n  '/data/australian-mosques-combined.json',\n",
              1,
          )
          write(sw_path, sw)

          policy_path = 'scripts/check-remote-network-policy.mjs'
          policy = read(policy_path)
          policy = policy.replace(
              "const reviewedRemoteNetworkFiles = new Map([\n",
              "const reviewedRemoteNetworkFiles = new Map([\n  [\n    'src/platform/australianMosqueDirectoryAsset.ts',\n    'same-origin packaged Australian mosque directory asset',\n  ],\n",
              1,
          )
          write(policy_path, policy)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed text sources
        run: |
          npx prettier --write \
            vite.config.ts \
            src/domain/australianMosqueDirectoryCombined.ts \
            src/domain/australianMosqueDirectoryCombined.test.ts \
            src/domain/australianMosquePrayerContext.test.ts \
            src/platform/australianMosqueDirectoryAsset.ts \
            src/platform/australianMosqueDirectoryAsset.test.ts \
            src/ui/AustralianMosqueDirectoryPanel.tsx \
            src/i18n/australianMosqueDirectoryTranslations.ts \
            scripts/generate-mosque-directory-packs.mjs \
            scripts/generate-australian-mosque-combined.mjs \
            scripts/check-remote-network-policy.mjs \
            directory-service/server.mjs \
            directory-service/server.acceptance.mjs \
            public/sw.js \
            docs/AUSTRALIAN_MOSQUE_DIRECTORY.md

      - name: Create retained corrective commit
        shell: bash
        run: |
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -A
          git commit -m 'Externalize Australian mosque catalogue from JavaScript bundle'
          echo "RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/bundle-budget-recovery || true

      - name: Validate source gates
        run: npm run format:check && npm run lint && npm run typecheck && npm run test

      - name: Validate production bundle budget
        run: npm run build && npm run bundle:size
