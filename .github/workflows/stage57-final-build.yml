name: Stage 57 final product UX build

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement-final

permissions:
  contents: write

jobs:
  build-stage57:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout clean Stage 57 branch
        uses: actions/checkout@v4
        with:
          ref: stage-57/v1.5-product-ux-refinement-final
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Stage 57 product UX source
        shell: bash
        run: |
          set -euo pipefail
          git show 20e655af96004807b75fab97648c34f24cdf72c3:.github/workflows/stage57-ux-builder.yml > .github/workflows/stage57-ux-builder.yml
          git show 20e655af96004807b75fab97648c34f24cdf72c3:.github/workflows/stage57-ux-builder-v2.yml > /tmp/stage57-v2.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/stage57-v2.yml').read_text()
          step_start = workflow.index('      - name: Apply Stage 57 UX refinement robustly')
          marker = "          python3 - <<'PY'\n"
          script_start = workflow.index(marker, step_start) + len(marker)
          script_end = workflow.index('\n          PY\n          bash /tmp/stage57-apply.sh', script_start)
          script = textwrap.dedent(workflow[script_start:script_end])
          exec(compile(script, '/tmp/stage57-v2-transform.py', 'exec'), {})
          PY
          bash /tmp/stage57-apply.sh
          rm -f .github/workflows/stage57-ux-builder.yml

      - name: Apply final Stage 57 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          MAIN_SHA = '315cb264f0a0f6199b0db4c183a9fac8ff7423a1'

          subprocess.run(
              ['git', 'checkout', MAIN_SHA, '--',
               'src/ui/PrimaryNavigation.tsx',
               'src/ui/CongregationShell.tsx',
               'src/ui/SalahIcon.tsx',
               'src/congregation-shell.css'],
              check=True,
          )

          nav = Path('src/ui/PrimaryNavigation.tsx')
          text = nav.read_text()
          marker = '        className="congregation-nav-item"\n'
          if marker not in text:
              raise SystemExit('Primary navigation class marker missing')
          nav.write_text(text.replace(marker, marker + '        data-navigation-id={item.id}\n', 1))

          shell_css = Path('src/congregation-shell.css')
          shell_css.write_text(
              shell_css.read_text().rstrip()
              + "\n\n/* v1.5 Stage 8: keep the phone prayer bar to five focused destinations. */\n"
              + "@media (max-width: 799px) {\n"
              + "  .congregation-nav-item[data-navigation-id='community'] {\n"
              + "    display: none;\n"
              + "  }\n"
              + "}\n"
          )

          today = Path('src/ui/TodayScreen.tsx')
          text = today.read_text()
          marker = 'const locationAccuracyLabel ='
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('Location accuracy declaration missing')
          line_start = text.rfind('\n', 0, marker_index) + 1
          declaration_end = text.find(';', marker_index)
          if declaration_end < 0:
              raise SystemExit('Location accuracy declaration end missing')
          declaration_end += 1
          replacement = '''  const locationAccuracyMeters =
            recentLocation === null ? null : recentLocation.accuracyMeters;
          const locationAccuracyLabel =
            locationAccuracyMeters === null
              ? null
              : locationAccuracyMeters < 1_000
                ? `±${String(Math.round(locationAccuracyMeters))} m`
                : `±${(locationAccuracyMeters / 1_000).toFixed(1)} km`;'''
          today.write_text(text[:line_start] + replacement + text[declaration_end:])

          route_test = Path('src/ui/applicationRoute.test.ts')
          text = route_test.read_text()
          start = text.find('const fromAdmin')
          if start < 0:
              raise SystemExit('fromAdmin Settings test missing')
          end = text.find(';', start)
          if end < 0:
              raise SystemExit('fromAdmin Settings test terminator missing')
          segment = text[start:end]
          if "'appearance'" in segment:
              segment = segment.replace("'appearance'", "'display'", 1)
              text = text[:start] + segment + text[end:]
          route_test.write_text(text)

          visual = Path('scripts/visual-product-ux-stage8.mjs')
          text = visual.read_text()
          initial_more = re.compile(
              r"\n\s*await page\.locator\('\.congregation-nav-item--more'\)\.click\(\);\s*"
              r"const overflowMenu = page\.locator\('\.congregation-nav-overflow-menu'\);\s*"
              r"await overflowMenu\.waitFor\(\{ state: 'visible' \}\);\s*"
              r"if \(\(await overflowMenu\.getByRole\('menuitem'\)\.count\(\)\) !== 2\) \{\s*"
              r"throw new Error\('Mobile More menu must expose exactly Community and Settings'\);\s*\}\s*",
              flags=re.S,
          )
          text, count = initial_more.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Initial More acceptance removal count={count}')

          count_block = re.compile(
              r"(\s*const visibleNavItems = page\.locator\('\.congregation-nav > \.congregation-nav-item:visible'\);\s*"
              r"if \(\(await visibleNavItems\.count\(\)\) !== 5\) \{\s*"
              r"throw new Error\(`Expected 5 visible mobile navigation items, got \$\{String\(await visibleNavItems\.count\(\)\)\}`\);\s*\})",
              flags=re.S,
          )
          nav_assertion = '''
            const primaryNavLabels = await visibleNavItems
              .locator('.congregation-nav-label')
              .allTextContents();
            const expectedPrimaryNavLabels = ['Today', 'Mosques', 'Qiblah', 'Knowledge', 'Settings'];
            if (JSON.stringify(primaryNavLabels) !== JSON.stringify(expectedPrimaryNavLabels)) {
              throw new Error(`Unexpected mobile primary navigation: ${primaryNavLabels.join(', ')}`);
            }'''
          text, count = count_block.subn(lambda match: match.group(1) + nav_assertion, text, count=1)
          if count != 1:
              raise SystemExit(f'Mobile navigation label assertion count={count}')

          settings_more = re.compile(
              r"\s*await page\.locator\('\.congregation-nav-item--more'\)\.click\(\);\s*"
              r"await page\.getByRole\('menuitem', \{ name: 'Settings' \}\)\.click\(\);",
              flags=re.S,
          )
          direct_settings = "\n    await page.locator('.congregation-nav > .congregation-nav-item[data-navigation-id=\\\"settings\\\"]').click();"
          text, count = settings_more.subn(lambda _: direct_settings, text, count=1)
          if count != 1:
              raise SystemExit(f'Direct Settings acceptance replacement count={count}')
          visual.write_text(text)

          docs = Path('docs/PRODUCT_UX_V1.5.md')
          text = docs.read_text()
          old = "Phone navigation exposes Today, Mosques, Qiblah and Knowledge directly, plus a fifth `More` destination that contains Community and Settings. Tablet/desktop navigation continues to show all six destinations directly. This avoids the previous six-items-in-five-columns phone layout while retaining every route."
          new = "Phone navigation exposes Today, Mosques, Qiblah, Knowledge and Settings directly. Community remains available through contextual product surfaces instead of occupying the persistent prayer bar, while tablet/desktop navigation continues to show all six destinations directly. This avoids the previous six-items-in-five-columns phone layout without removing the Community route."
          if old not in text:
              raise SystemExit('Stage 8 mobile-navigation documentation marker missing')
          docs.write_text(text.replace(old, new, 1))
          PY

      - name: Format Stage 57 files
        run: |
          npx prettier --write \
            src/ui/applicationRoute.ts \
            src/ui/applicationRoute.test.ts \
            src/ui/SettingsScreen.tsx \
            src/ui/PrimaryNavigation.tsx \
            src/ui/CongregationShell.tsx \
            src/ui/MobilePrayerThemeSurface.tsx \
            src/ui/TodayScreen.tsx \
            src/congregation-shell.css \
            src/today-screen.css \
            src/ui/prayer-board-weather.css \
            src/settings-screen.css \
            scripts/visual-product-ux-stage8.mjs \
            docs/PRODUCT_UX_V1.5.md \
            package.json
          npx eslint src/ui/SettingsScreen.tsx --fix
          npx prettier --write src/ui/SettingsScreen.tsx

      - name: Validate Stage 57 source
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Publish validated Stage 57 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm .github/workflows/stage57-final-build.yml
          git add -A
          git status --short
          git commit -m "Stage 57: refine v1.5 product UX"
          echo "STAGE57_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:stage-57/v1.5-product-ux-refinement-final
