name: Stage 57 final product UX build

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement-final

permissions:
  contents: write

jobs:
  build-stage57:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout Stage 57 branch
        uses: actions/checkout@v4
        with:
          ref: stage-57/v1.5-product-ux-refinement-final
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Reconstruct Stage 57 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 66f1319e012584c499223c11850c22b62b940a9c:.github/workflows/stage57-final-build.yml > /tmp/stage57-source.yml
          python3 - <<'PY'
          from pathlib import Path

          src = Path('/tmp/stage57-source.yml').read_text().splitlines()
          def extract(name: str, target: str):
              start = next(i for i, line in enumerate(src) if line.strip() == f'- name: {name}')
              run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
              body = []
              for line in src[run_line + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              Path(target).write_text('\n'.join(body) + '\n')
          extract('Generate Stage 57 product UX source', '/tmp/generate.sh')
          extract('Apply final Stage 57 contracts', '/tmp/contracts.sh')
          extract('Format Stage 57 files', '/tmp/format.sh')
          PY
          bash /tmp/generate.sh
          bash /tmp/contracts.sh
          bash /tmp/format.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
