name: Stage 57 final product UX build

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement-final

permissions:
  contents: write

jobs:
  build-stage57:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout Stage 57 branch
        uses: actions/checkout@v4
        with:
          ref: stage-57/v1.5-product-ux-refinement-final
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Reconstruct Stage 57 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 66f1319e012584c499223c11850c22b62b940a9c:.github/workflows/stage57-final-build.yml > /tmp/stage57-source.yml
          python3 - <<'PY'
          from pathlib import Path

          src = Path('/tmp/stage57-source.yml').read_text().splitlines()
          def extract(name: str, target: str):
              start = next(i for i, line in enumerate(src) if line.strip() == f'- name: {name}')
              run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
              body = []
              for line in src[run_line + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              Path(target).write_text('\n'.join(body) + '\n')
          extract('Generate Stage 57 product UX source', '/tmp/generate.sh')
          extract('Apply final Stage 57 contracts', '/tmp/contracts.sh')
          extract('Format Stage 57 files', '/tmp/format.sh')
          PY
          bash /tmp/generate.sh
          bash /tmp/contracts.sh
          bash /tmp/format.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui/SettingsProgressiveDisclosureV2.test.ts')
          text = path.read_text()
          text = text.replace("describe('Settings progressive disclosure and Stage 27 ownership', () => {", "describe('Settings progressive disclosure and Stage 8 product UX ownership', () => {")
          text = text.replace("it('keeps the eight category destinations explicit and reloadable', () => {", "it('keeps the seven v1.5 category destinations explicit and reloadable', () => {")
          old_categories = "    for (const category of [\n      'prayer',\n      'location',\n      'mosque',\n      'notifications',\n      'appearance',\n      'data-privacy',\n      'display-themes',\n      'advanced',\n    ]) {"
          new_categories = "    for (const category of [\n      'location',\n      'prayer',\n      'adhan',\n      'display',\n      'mosques',\n      'privacy-data',\n      'advanced',\n    ]) {"
          if old_categories not in text:
              raise SystemExit('Settings progressive-disclosure category fixture is not at the expected baseline')
          text = text.replace(old_categories, new_categories, 1)
          replacements = {"category === 'mosque'": "category === 'mosques'", "category === 'data-privacy'": "category === 'privacy-data'", "category === 'notifications'": "category === 'adhan'", "category === 'display-themes'": "category === 'display'"}
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Settings test contract: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          npx prettier --write src/ui/SettingsProgressiveDisclosureV2.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Publish validated Stage 57 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git rm -f .github/workflows/stage57-final-build.yml .github/workflows/stage57-diagnostic.yml
          if git diff --unified=0 -- . ':!.github/workflows/stage57-final-build.yml' ':!.github/workflows/stage57-diagnostic.yml' | grep '^+' | grep -Eiq 'chatgpt|openai|gpt[- _]?[0-9]'; then
            echo 'Forbidden AI branding found in Stage 57 additions.' >&2
            exit 1
          fi
          git add -A
          git status --short
          git commit -m "Stage 57: refine v1.5 product UX"
          echo "STAGE57_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:stage-57/v1.5-product-ux-refinement-final
