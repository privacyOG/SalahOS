name: Temporary v1.5.3 Item 5

on:
  push:
    branches: [v1.5.3-work-item-5]

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[item5-bootstrap]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Work Item 5 patch
        run: python3 scripts/temp-v153-item5-patch.py
      - name: Make typography assertion formatting-safe
        run: python3 scripts/temp-v153-item5-test-fix.py
      - name: Format changes
        run: npx prettier src/islamic-knowledge.css src/quran-offline-reader.css src/ui/QuranOfflineReader.tsx src/ui/QuranTypographyArchitecture.test.tsx --write
      - name: Validate changed behavior
        run: npm run typecheck && npm run lint && npm run test
      - name: Required Work Item 5 gate
        run: npm run ui:theme-contrast && npm run ui:theme-architecture && npm run ui:design-system-ownership && npm run format:check
      - name: Mark Work Item 5 complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TEMP_TODO_V1.5.3.md')
          text = path.read_text()
          before = '''## Work Item 5 — Fix Arabic typography and unify selector systems

          - [ ] Remove conflicting `!important` typography declarations and set line-height per size step.
          - [ ] Use Qur'anic justification where it remains readable; add `letter-spacing: 0` and required ligature/font-feature settings.
          - [ ] Standardize on data-attribute state selectors for Qur'an font/scale and migrate both reader surfaces.
          - [ ] Delete dead modifier selectors and remove import-order dependence.
          - [ ] Gate: `npm run ui:theme-contrast && npm run ui:theme-architecture && npm run ui:design-system-ownership && npm run format:check`.
          '''
          after = '''## Work Item 5 — Fix Arabic typography and unify selector systems — COMPLETE

          - [x] Remove conflicting `!important` typography declarations and set line-height per size step.
          - [x] Use Qur'anic justification where it remains readable; add `letter-spacing: 0` and required ligature/font-feature settings.
          - [x] Standardize on data-attribute state selectors for Qur'an font/scale and migrate both reader surfaces.
          - [x] Delete dead modifier selectors and remove import-order dependence.
          - [x] Gate: `npm run ui:theme-contrast && npm run ui:theme-architecture && npm run ui:design-system-ownership && npm run format:check`.
          '''
          if before not in text:
              raise SystemExit('Work Item 5 tracker block not found')
          text = text.replace(before, after, 1)
          text = text.rstrip() + '\n- Work Item 5: complete on branch `v1.5.3-work-item-5`; unified both Qur’an reader surfaces on data-attribute font/scale state, removed duplicate modifier selectors and typography `!important`, added explicit Arabic shaping/spacing and scale-specific line heights, and passed the required theme/architecture/ownership/format gate.\n'
          path.write_text(text)
          PY
      - name: Commit generated result to temporary tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TEMP_TODO_V1.5.3.md src/islamic-knowledge.css src/quran-offline-reader.css src/ui/QuranOfflineReader.tsx src/ui/QuranTypographyArchitecture.test.tsx
          git commit -m '[item5-generated] unify Qur’an typography selectors'
          git tag -f temp-v153-item5-generated
          git push --force origin refs/tags/temp-v153-item5-generated

# bootstrap retry
