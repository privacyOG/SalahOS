name: Stage 26 bidi harness patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Patch targeted bidi acceptance and publish blob
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/visual-accessibility-rtl-acceptance.mjs')
          text = path.read_text()
          marker = '\nasync function validateCongregationScenario(browser, scenario) {'
          helper = r'''

async function mixedDirectionIsolationFailures(page) {
  return page.evaluate(() => {
    const riskyText = /(?:https?:\/\/|www\.|[\w.+-]+@[\w.-]+\.[a-z]{2,}|[+-]?\d{1,3}\.\d{3,}[,\s]+[+-]?\d{1,3}\.\d{3,}|[A-Za-z]+\/[A-Za-z_]+|\b\d{1,2}:\d{2}\b|\b[A-Za-z0-9]+(?:[-_:][A-Za-z0-9]+){1,}\b)/i;
    const visible = (element) => {
      const style = getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return (
        style.display !== 'none' &&
        style.visibility !== 'hidden' &&
        rect.width > 0 &&
        rect.height > 0
      );
    };
    return [...document.querySelectorAll('body *')]
      .filter(
        (element) =>
          element instanceof HTMLElement && visible(element) && element.childElementCount === 0,
      )
      .map((element) => ({
        element,
        text: element.textContent?.trim() ?? '',
      }))
      .filter(({ text }) => riskyText.test(text))
      .filter(
        ({ element }) => element.closest('bdi, [dir="ltr"], [dir="auto"]') === null,
      )
      .map(({ element, text }) => ({
        tag: element.tagName.toLowerCase(),
        className: typeof element.className === 'string' ? element.className : '',
        text: text.slice(0, 100),
      }));
  });
}
'''
          if marker not in text:
              raise SystemExit('validateCongregationScenario marker missing')
          text = text.replace(marker, helper + marker, 1)
          old = """    if (scenario.locale === 'ar' && state.bidiCount === 0) {\n      throw new Error(`${scenario.name} has no explicit mixed-direction isolation`);\n    }\n"""
          new = """    const bidiFailures =\n      scenario.locale === 'ar' ? await mixedDirectionIsolationFailures(page) : [];\n    if (bidiFailures.length > 0) {\n      throw new Error(\n        `${scenario.name} unisolated mixed-direction content: ${JSON.stringify(bidiFailures.slice(0, 8))}`,\n      );\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit('legacy bidi assertion not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/visual-accessibility-rtl-acceptance.mjs
          FORMATTED_BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' scripts/visual-accessibility-rtl-acceptance.mjs | gh api --method POST /repos/${{ github.repository }}/git/blobs --input - --jq .sha)"
          echo "STAGE26_BIDI_BLOB_SHA=${FORMATTED_BLOB_SHA}"
          exit 1
