name: Stage 36 storage formatter once

on:
  push:
    branches:
      - 'validation/stage-36-lint-fix'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: validation/stage-36-lint-fix
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Apply repository formatter
        run: npx prettier --write src/platform/applicationStorage.test.ts
      - name: Commit formatter output and remove one-shot workflow
        run: |
          rm .github/workflows/stage36-storage-format-once.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add src/platform/applicationStorage.test.ts .github/workflows/stage36-storage-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format managed display storage hydration test'
          git push origin HEAD:validation/stage-36-lint-fix
