name: V1.6.0 PR263 Format

on:
  push:
    branches:
      - v160-today-source-patch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-today-source-patch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repository formatter
        run: npx prettier --write scripts/visual-australian-mosque-directory.mjs src/ui/SelectedMosqueLocationStateV153.test.ts
      - name: Verify formatting and targeted test
        run: |
          npm run format:check
          npx vitest run src/ui/SelectedMosqueLocationStateV153.test.ts src/ui/TodayScreenV160.test.ts
      - name: Commit formatted source without helper
        run: |
          rm .github/workflows/v160-pr263-prettier.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/visual-australian-mosque-directory.mjs src/ui/SelectedMosqueLocationStateV153.test.ts .github/workflows/v160-pr263-prettier.yml
          git commit -m "style: format V1.6.0 Today acceptance"
          git push origin HEAD:v160-today-source-patch
