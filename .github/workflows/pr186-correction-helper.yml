name: PR 186 correction helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'uiux/mobile-prayer-theme-fix'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Correct Qibla acceptance flows and env typing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def remove_provider_assertion(lines, start_at=0):
              marker = "page.locator('.qibla-map-shell').getAttribute('data-map-provider')"
              marker_index = next(
                  (index for index in range(start_at, len(lines)) if marker in lines[index]),
                  None,
              )
              if marker_index is None:
                  raise SystemExit('Expected Qibla provider assertion was not found')
              block_start = marker_index - 1
              block_end = next(
                  (index for index in range(marker_index + 1, len(lines)) if lines[index].strip() == '}'),
                  None,
              )
              if block_end is None:
                  raise SystemExit('Qibla provider assertion end was not found')
              return lines[:block_start] + lines[block_end + 1 :]

          path = Path('src/ui/QiblaMapView.tsx')
          content = path.read_text()
          old = "  const value = import.meta.env.VITE_GOOGLE_MAPS_API_KEY;"
          new = "  const value: unknown = import.meta.env.VITE_GOOGLE_MAPS_API_KEY;"
          if old not in content:
              raise SystemExit('Expected Qibla env assignment was not found')
          path.write_text(content.replace(old, new, 1))

          path = Path('scripts/visual-mobile-prayer-themes.mjs')
          lines = path.read_text().splitlines()
          qibla_start = next(
              index for index, line in enumerate(lines) if line.startswith('async function validateQibla(')
          )
          lines = remove_provider_assertion(lines, qibla_start)
          capture_index = next(
              index
              for index in range(qibla_start, len(lines))
              if "await capture(page, 'qibla-premium-compass-phone-en');" in lines[index]
          )
          insertion = [
              '',
              "    await page.locator('.qibla-view-switch button').nth(1).click();",
              "    const map = page.locator('.qibla-map-shell');",
              "    await map.waitFor({ state: 'visible' });",
              "    if ((await map.getAttribute('data-map-provider')) !== 'openstreetmap') {",
              "      throw new Error('No-key visual build must retain the OpenStreetMap Qibla map fallback');",
              '    }',
              "    await assertNoHorizontalOverflow(page, 'qibla-premium-map-phone-en');",
              "    await capture(page, 'qibla-premium-map-phone-en');",
          ]
          lines[capture_index + 1 : capture_index + 1] = insertion
          path.write_text('\n'.join(lines) + '\n')

          path = Path('scripts/visual-mobile-prayer-themes-extended.mjs')
          lines = path.read_text().splitlines()
          qibla_start = next(
              index
              for index, line in enumerate(lines)
              if line.startswith('async function validateQiblaLayout(')
          )
          lines = remove_provider_assertion(lines, qibla_start)
          capture_index = next(
              index
              for index in range(qibla_start, len(lines))
              if 'await capture(page, scenario.name);' in lines[index]
          )
          insertion = [
              '',
              "    await page.locator('.qibla-view-switch button').nth(1).click();",
              "    const map = page.locator('.qibla-map-shell');",
              "    await map.waitFor({ state: 'visible' });",
              "    if ((await map.getAttribute('data-map-provider')) !== 'openstreetmap') {",
              '      throw new Error(',
              '        `${scenario.name} must use the no-key fallback provider in the normal visual build`,',
              '      );',
              '    }',
              '    await assertNoHorizontalOverflow(page, `${scenario.name}-map`);',
              '    await capture(page, `${scenario.name}-map`);',
          ]
          lines[capture_index + 1 : capture_index + 1] = insertion
          path.write_text('\n'.join(lines) + '\n')

          path = Path('scripts/visual-qibla-google.mjs')
          lines = path.read_text().splitlines()
          goto_index = next(
              index
              for index, line in enumerate(lines)
              if "await page.goto(`${baseUrl}/?view=qiblah`" in line
          )
          lines.insert(goto_index + 1, "  await page.locator('.qibla-view-switch button').nth(1).click();")
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Format corrected files
        run: |
          npx prettier --write \
            src/ui/QiblaMapView.tsx \
            scripts/visual-mobile-prayer-themes.mjs \
            scripts/visual-mobile-prayer-themes-extended.mjs \
            scripts/visual-qibla-google.mjs

      - name: Verify format and lint
        run: |
          npm run format:check
          npm run lint

      - name: Publish correction commit object
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add \
            src/ui/QiblaMapView.tsx \
            scripts/visual-mobile-prayer-themes.mjs \
            scripts/visual-mobile-prayer-themes-extended.mjs \
            scripts/visual-qibla-google.mjs
          git commit -m 'Correct Qibla acceptance user flows'
          echo "CORRECTION_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:${GITHUB_HEAD_REF}
