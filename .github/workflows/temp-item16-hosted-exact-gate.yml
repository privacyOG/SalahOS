name: TEMP V1.5.3 Item 16 hosted exact gate

on:
  push:
    branches:
      - temp/item16-hosted-exact-gate

permissions:
  contents: read

jobs:
  item16-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Item 16 head
        uses: actions/checkout@v4
        with:
          ref: 459863cf8aa14403d3963bb89579349c6ba22873
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without audit network call
        run: npm ci --ignore-scripts --no-audit
      - name: Format check
        run: npm run format:check
      - name: Item 16 gate
        run: npm run typecheck && npm run lint && npm run test
