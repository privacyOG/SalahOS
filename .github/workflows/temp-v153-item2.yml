name: Temporary v1.5.3 Item 2 Regeneration

on:
  push:
    branches: [v1.5.3-work-item-2]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[item2-export]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.3-work-item-2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Item 2 scraper fix and regenerate datasets
        run: node scripts/temp-v153-item2-patch.mjs
      - name: Format changed files
        run: npx prettier scripts/generate-australian-mosque-finder.mjs src/data/australian-mosque-finder.json src/data/australian-mosques-combined.json public/mosque-packs --write
      - name: Commit regenerated outputs and publish temporary tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-australian-mosque-finder.mjs src/data/australian-mosque-finder.json src/data/australian-mosques-combined.json public/mosque-packs
          git commit -m '[item2-generated] fix Australian mosque scraper sanitization'
          git tag -f temp-v153-item2-generated
          git push --force origin refs/tags/temp-v153-item2-generated
