name: Temporary v1.5.3 Item 2 Cleanup

on:
  push:
    branches: [v1.5.3-work-item-2]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[item2-cleanup-tag]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete temporary regeneration tag
        run: git push origin :refs/tags/temp-v153-item2-generated
