name: Temporary Home Hub Runtime Format Diff
on:
  push:
    branches:
      - feature/home-hub-prayer-dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Show exact runtime test formatting
        run: |
          npx prettier --write scripts/visual-prayer-board-config.mjs
          git diff --no-ext-diff -- scripts/visual-prayer-board-config.mjs
