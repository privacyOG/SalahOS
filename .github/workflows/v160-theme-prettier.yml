name: V1.6.0 Theme Exact Format

on:
  push:
    branches:
      - v160-theme-picker-validated

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-theme-picker-validated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply pinned Prettier
        run: npx prettier --write scripts/visual-theme-palette-picker.mjs
      - name: Verify theme change
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/ui/ThemePalettePickerV160.test.ts
      - name: Publish clean validated format commit
        run: |
          rm .github/workflows/v160-theme-prettier.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/visual-theme-palette-picker.mjs .github/workflows/v160-theme-prettier.yml
          git commit -m "style(theme): apply exact palette fixture formatting"
          echo "VALIDATED_THEME_COMMIT=$(git rev-parse HEAD)"
          git tag -f v160-theme-picker-format-validated
          git push origin refs/tags/v160-theme-picker-format-validated --force
