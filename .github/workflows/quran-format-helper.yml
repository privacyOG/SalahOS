name: Qur'an Format Helper

on:
  pull_request:
    paths:
      - 'scripts/check-quran-salahos-2026.mjs'
      - 'src/data/quran-mutashabih-full-audit.json'
      - 'src/data/quran-mutashabih-policy-triggers.json'
      - 'src/data/quran-mutashabih-review-register.json'
      - 'src/data/quran-salahos-2026-overrides.json'
      - 'src/domain/quranSalahos2026.test.ts'
      - 'docs/quran-salahos-2026-policy.md'
      - '.github/workflows/quran-format-helper.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact repository formatting
        run: |
          npx prettier --write \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/data/quran-salahos-2026-overrides.json \
            src/domain/quranSalahos2026.test.ts \
            docs/quran-salahos-2026-policy.md
      - name: Publish formatted commit to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/data/quran-salahos-2026-overrides.json \
            src/domain/quranSalahos2026.test.ts \
            docs/quran-salahos-2026-policy.md
          if ! git diff --cached --quiet; then
            git commit -m "style: apply exact Prettier output for Qur'an governance"
            git push --force origin HEAD:quran-prettier-143-pass
          fi
