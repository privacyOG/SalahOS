name: Qur'an Format Helper

on:
  pull_request:
    paths:
      - 'scripts/check-quran-salahos-2026.mjs'
      - 'src/data/quran-mutashabih-full-audit.json'
      - 'src/data/quran-mutashabih-policy-triggers.json'
      - 'src/data/quran-mutashabih-review-register.json'
      - 'src/domain/quranSalahos2026.test.ts'
      - '.github/workflows/quran-format-helper.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format targeted Qur'an files
        run: |
          npx prettier --write \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/domain/quranSalahos2026.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-quran-salahos-2026.mjs \
            src/data/quran-mutashabih-full-audit.json \
            src/data/quran-mutashabih-policy-triggers.json \
            src/data/quran-mutashabih-review-register.json \
            src/domain/quranSalahos2026.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: format Qur'an governance files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
