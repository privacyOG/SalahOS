name: V1.6.0 Quran Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'v160-salahos-2026-quran'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: v160-salahos-2026-quran
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Normalize changed Qur'an files
        run: |
          npx prettier --write \
            src/domain/quranOfflineLibrary.ts \
            src/domain/quranOpeningBasmala.test.ts \
            src/platform/quranReadingPreferences.ts \
            src/platform/quranReadingPreferences.test.ts \
            src/main.tsx \
            src/quran-mushaf-layout.css \
            scripts/visual-quran-offline-reader.mjs
          git diff --check

      - name: Create normalized commit object
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/quranOfflineLibrary.ts src/domain/quranOpeningBasmala.test.ts src/platform/quranReadingPreferences.ts src/platform/quranReadingPreferences.test.ts src/main.tsx src/quran-mushaf-layout.css scripts/visual-quran-offline-reader.mjs
          git commit --allow-empty -m 'style: normalize Quran surah presentation'
          echo "NORMALIZED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:v160-salahos-2026-quran
