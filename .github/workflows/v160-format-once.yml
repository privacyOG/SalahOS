name: V1.6.0 Quran Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'v160-salahos-2026-quran'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: v160-salahos-2026-quran
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Correct checker regex and format changed files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-quran-salahos-2026.mjs')
          text = path.read_text()
          text = text.replace('/usu.test(css)', '/us.test(css)')
          path.write_text(text)
          PY
          npx prettier --write \
            scripts/check-quran-editorial-release-gate.mjs \
            scripts/check-quran-salahos-2026.mjs \
            src/domain/quranSalahos2026.test.ts \
            src/domain/quranSalahos2026.ts \
            src/platform/quranReadingPreferences.test.ts \
            src/ui/QuranOfflineReader.tsx
          git diff --check

      - name: Export normalized files
        uses: actions/upload-artifact@v4
        with:
          name: v160-quran-prettier-output
          path: |
            scripts/check-quran-editorial-release-gate.mjs
            scripts/check-quran-salahos-2026.mjs
            src/domain/quranSalahos2026.test.ts
            src/domain/quranSalahos2026.ts
            src/platform/quranReadingPreferences.test.ts
            src/ui/QuranOfflineReader.tsx
          retention-days: 1
