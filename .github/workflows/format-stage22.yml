name: Stage 22 formatter

on:
  push:
    branches:
      - 'stage-22/today-settings-v2'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-22/today-settings-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Format Stage 22 files
        run: npx prettier --write src/today-screen.css src/ui/TodayScreen.tsx

      - name: Remove one-shot formatter
        run: rm .github/workflows/format-stage22.yml

      - name: Commit formatted files
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/today-screen.css src/ui/TodayScreen.tsx .github/workflows/format-stage22.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Stage 22 Today experience"
          git push origin HEAD:stage-22/today-settings-v2
