name: Stage 39 finalize

on:
  push:
    branches:
      - 'stage-39/calendar-integrations'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-39/calendar-integrations
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Wire calendar feed into local public API
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          server_path = Path('local-api/server.mjs')
          server = server_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global server
              count = server.count(old)
              if count != 1:
                  raise SystemExit(f'expected one server marker, found {count}: {old[:80]!r}')
              server = server.replace(old, new)

          replace_once(
              "import { fileURLToPath } from 'node:url';\n",
              "import { fileURLToPath } from 'node:url';\n\nimport { createPublicEventCalendar } from './calendar.mjs';\n",
          )
          replace_once(
              "const RATE_LIMITS = Object.freeze({ profile: 120, daily: 120, monthly: 60 });",
              "const RATE_LIMITS = Object.freeze({ profile: 120, daily: 120, monthly: 60, calendar: 60 });",
          )
          replace_once(
              "  monthly: 'public, max-age=300, stale-while-revalidate=900',\n});",
              "  monthly: 'public, max-age=300, stale-while-revalidate=900',\n  calendar: 'public, max-age=300, stale-while-revalidate=900',\n});",
          )

          event_validation = r'''function assertExactUtcTimestamp(value, label) {
            const normalized = assertTimestamp(value, label);
            const parsed = new Date(normalized);
            if (parsed.toISOString() !== normalized) {
              throw new RangeError(`${label} must be an exact ISO-8601 UTC timestamp`);
            }
            return normalized;
          }

          function normalizeLocalizedEventContent(value, label) {
            if (value === null || value === undefined) return null;
            const content = assertObject(value, label);
            return Object.freeze({
              title: assertBoundedString(content.title, `${label} title`, 140),
              description: assertBoundedString(content.description, `${label} description`, 6000),
            });
          }

          function normalizePublicEventUrl(value, label) {
            if (value === null || value === undefined) return null;
            const normalized = assertBoundedString(value, label, 2048);
            let parsed;
            try {
              parsed = new URL(normalized);
            } catch (error) {
              throw new RangeError(`${label} must be a valid HTTP(S) URL`, { cause: error });
            }
            if (
              (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') ||
              parsed.username !== '' ||
              parsed.password !== ''
            ) {
              throw new RangeError(`${label} must be a credential-free HTTP(S) URL`);
            }
            return parsed.toString();
          }

          function normalizePublicEvent(value, expectedMosqueId, index) {
            const event = assertObject(value, `Calendar event ${String(index)}`);
            assertNoForbiddenPublicFields(event, `events.${expectedMosqueId}[${String(index)}]`);
            const eventId = normalizeIdentifier(event.eventId, 'Calendar event ID');
            const mosqueId = normalizeIdentifier(event.mosqueId, 'Calendar event mosqueId');
            if (mosqueId !== expectedMosqueId) {
              throw new RangeError('Calendar event mosqueId does not match snapshot mosque');
            }
            const english = normalizeLocalizedEventContent(event.english, 'Calendar event English');
            const arabic = normalizeLocalizedEventContent(event.arabic, 'Calendar event Arabic');
            if (english === null && arabic === null) {
              throw new RangeError('Calendar event requires English or Arabic content');
            }
            const venue = assertBoundedString(event.venue, 'Calendar event venue', 300);
            if (typeof event.allDay !== 'boolean') {
              throw new TypeError('Calendar event allDay must be boolean');
            }
            const startsAt = assertExactUtcTimestamp(event.startsAt, 'Calendar event startsAt');
            const endsAt = assertExactUtcTimestamp(event.endsAt, 'Calendar event endsAt');
            if (new Date(endsAt).getTime() <= new Date(startsAt).getTime()) {
              throw new RangeError('Calendar event end must be later than start');
            }
            if (
              event.allDay &&
              (!startsAt.endsWith('T00:00:00.000Z') || !endsAt.endsWith('T00:00:00.000Z'))
            ) {
              throw new RangeError('All-day calendar events require UTC-midnight boundaries');
            }
            if (!['none', 'daily', 'weekly'].includes(event.recurrence)) {
              throw new RangeError('Calendar event recurrence must be none, daily or weekly');
            }
            return Object.freeze({
              eventId,
              mosqueId,
              english,
              arabic,
              venue,
              allDay: event.allDay,
              startsAt,
              endsAt,
              recurrence: event.recurrence,
              registrationUrl: normalizePublicEventUrl(
                event.registrationUrl,
                'Calendar event registration URL',
              ),
            });
          }

          function normalizePublicEvents(value, expectedMosqueId) {
            if (value === undefined) return Object.freeze([]);
            if (!Array.isArray(value) || value.length > 500) {
              throw new RangeError('Calendar events must be an array containing at most 500 entries');
            }
            const events = value.map((entry, index) =>
              normalizePublicEvent(entry, expectedMosqueId, index),
            );
            const eventIds = new Set(events.map((event) => event.eventId));
            if (eventIds.size !== events.length) {
              throw new RangeError('Calendar event IDs must be unique within a mosque snapshot');
            }
            return Object.freeze(events);
          }

          '''
          replace_once(
              'export function validatePublicSnapshot(value) {',
              event_validation + 'export function validatePublicSnapshot(value) {',
          )
          replace_once(
              "    mosques[mosqueId] = Object.freeze({\n      profile,\n      dailyPrayers: Object.freeze(dailyPrayers),\n      monthlyTimetables: Object.freeze(monthlyTimetables),\n    });",
              "    const events = normalizePublicEvents(mosque.events, mosqueId);\n    if (events.length > 0) {\n      if (root.generatedAt === undefined) {\n        throw new RangeError('Snapshot generatedAt is required when calendar events are published');\n      }\n      assertExactUtcTimestamp(root.generatedAt, 'Snapshot generatedAt');\n    }\n\n    mosques[mosqueId] = Object.freeze({\n      profile,\n      dailyPrayers: Object.freeze(dailyPrayers),\n      monthlyTimetables: Object.freeze(monthlyTimetables),\n      events,\n    });",
          )
          replace_once(
              "  const monthly = /^\\/api\\/v1\\/mosques\\/([^/]+)\\/timetables\\/(\\d{4}-\\d{2})$/u.exec(pathname);",
              "  const calendar = /^\\/api\\/v1\\/mosques\\/([^/]+)\\/calendar\\.ics$/u.exec(pathname);\n  if (calendar !== null) {\n    return { kind: 'calendar', mosqueId: decodeIdentifier(calendar[1]) };\n  }\n  const monthly = /^\\/api\\/v1\\/mosques\\/([^/]+)\\/timetables\\/(\\d{4}-\\d{2})$/u.exec(pathname);",
          )
          replace_once(
              "function sendJson(response, status, payload, options = {}) {\n  const body = JSON.stringify(payload);",
              "function sendCalendar(response, status, body, mosqueId, options = {}) {\n  response.writeHead(status, {\n    'Content-Type': 'text/calendar; charset=utf-8',\n    'Content-Length': Buffer.byteLength(body),\n    'Content-Disposition': `inline; filename=\\\"${mosqueId}-events.ics\\\"`,\n    ...responseHeaders(options.cacheControl ?? 'no-store', options.stale ?? false),\n  });\n  response.end(body);\n}\n\nfunction sendJson(response, status, payload, options = {}) {\n  const body = JSON.stringify(payload);",
          )
          replace_once(
              "      const current = await store.current();\n      const payload = findPublicPayload(current.snapshot, route);",
              "      const current = await store.current();\n      if (route.kind === 'calendar') {\n        const mosque = current.snapshot.mosques[route.mosqueId];\n        const calendar =\n          mosque === undefined\n            ? null\n            : createPublicEventCalendar(mosque, current.snapshot.generatedAt);\n        if (calendar === null) {\n          sendJson(\n            response,\n            404,\n            { error: 'Published calendar not found' },\n            { stale: current.stale },\n          );\n          return;\n        }\n        sendCalendar(response, 200, calendar, route.mosqueId, {\n          cacheControl: CACHE_POLICIES.calendar,\n          stale: current.stale,\n        });\n        return;\n      }\n      const payload = findPublicPayload(current.snapshot, route);",
          )
          server_path.write_text(server)

          example_path = Path('local-api/public-data.example.json')
          example = json.loads(example_path.read_text())
          mosque = example['mosques']['masjid.one']
          mosque['events'] = [
              {
                  'eventId': 'community-iftar-2026',
                  'mosqueId': 'masjid.one',
                  'english': {
                      'title': 'Community Iftar',
                      'description': 'Join the community for iftar after Maghrib.',
                  },
                  'arabic': None,
                  'venue': 'Main prayer hall',
                  'allDay': False,
                  'startsAt': '2026-08-20T08:00:00.000Z',
                  'endsAt': '2026-08-20T10:00:00.000Z',
                  'recurrence': 'none',
                  'registrationUrl': 'https://example.org/register',
              }
          ]
          example_path.write_text(json.dumps(example, indent=2, ensure_ascii=False) + '\n')

          local_doc_path = Path('docs/LOCAL_NETWORK_API.md')
          local_doc = local_doc_path.read_text()
          local_doc = local_doc.replace(
              'GET /api/v1/mosques/:mosqueId/timetables/:month\n```',
              'GET /api/v1/mosques/:mosqueId/timetables/:month\nGET /api/v1/mosques/:mosqueId/calendar.ics\n```',
          )
          local_doc = local_doc.replace(
              'Monthly timetables use a 300-second public cache lifetime. Per-socket-IP request ceilings follow the SalahOS public contract: 120 profile requests/minute, 120 daily requests/minute and 60 monthly requests/minute.',
              'Monthly timetables and calendar feeds use a 300-second public cache lifetime. Per-socket-IP request ceilings follow the SalahOS public contract: 120 profile requests/minute, 120 daily requests/minute, 60 monthly requests/minute and 60 calendar requests/minute.',
          )
          local_doc = local_doc.replace(
              '- optional `monthlyTimetables` records keyed by `YYYY-MM`.',
              '- optional `monthlyTimetables` records keyed by `YYYY-MM`;\n- optional public `events` used to generate the read-only iCalendar subscription feed.',
          )
          local_doc = local_doc.replace(
              'Every response is JSON and includes `nosniff`, restrictive content-security policy, frame denial and no-referrer headers.',
              'JSON API responses and the `text/calendar` event feed include `nosniff`, restrictive content-security policy, frame denial and no-referrer headers.',
          )
          local_doc = local_doc.replace(
              '- all three versioned public endpoint shapes;',
              '- all three JSON endpoint shapes plus the iCalendar subscription endpoint;',
          )
          local_doc_path.write_text(local_doc)

          calendar_doc_path = Path('docs/CALENDAR.md')
          calendar_doc = calendar_doc_path.read_text()
          if '## External calendar interoperability' not in calendar_doc:
              calendar_doc += '''\n\n## External calendar interoperability\n\nMosque-event calendar interoperability is implemented separately from Hijri/Gregorian date calculation. `calendarIntegration.ts` creates complete RFC 5545 `VCALENDAR` exports, while the optional local-network API publishes a read-only `calendar.ics` subscription feed from explicitly public mosque events. See `CALENDAR_INTEGRATIONS.md` for schema, security and client guidance.\n'''
          calendar_doc_path.write_text(calendar_doc)

          todo_path = Path('TODO.md')
          todo = todo_path.read_text()
          old = '- [ ] Calendar integrations'
          new = '- [x] Calendar integrations'
          if todo.count(old) != 1:
              raise SystemExit(f'expected exactly one Calendar integrations row, found {todo.count(old)}')
          todo_path.write_text(todo.replace(old, new))
          PY
      - name: Apply canonical formatting
        run: npm run format
      - name: Full repository check
        run: npm run check
      - name: Commit verified Stage 39 result
        run: |
          rm .github/workflows/stage39-finalize.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- TODO.md docs/CALENDAR.md docs/CALENDAR_INTEGRATIONS.md docs/LOCAL_NETWORK_API.md local-api src/domain/calendarIntegration.ts src/domain/calendarIntegration.test.ts .github/workflows/stage39-finalize.yml
          git commit -m 'Finalize Stage 39 calendar integrations'
          git push origin HEAD:stage-39/calendar-integrations
