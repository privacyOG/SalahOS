name: Temporary Format Mosque Directory

on:
  push:
    branches:
      - data/australia-mosque-finder

permissions:
  contents: write

concurrency:
  group: temporary-format-mosque-directory
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data/australia-mosque-finder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format mosque integration
        run: |
          npx prettier --write \
            scripts/generate-australian-mosque-combined.mjs \
            scripts/generate-australian-mosque-finder.mjs \
            src/data/australian-mosque-finder.json \
            src/data/australian-mosques-combined.json \
            src/domain/australianMosqueDirectoryCombined.ts

      - name: Verify formatting and typecheck
        run: |
          npm run format:check
          npm run typecheck
          node scripts/generate-australian-mosque-finder.mjs
          node scripts/generate-australian-mosque-combined.mjs --check

      - name: Stage canonical formatted commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add \
            scripts/generate-australian-mosque-combined.mjs \
            scripts/generate-australian-mosque-finder.mjs \
            src/data/australian-mosque-finder.json \
            src/data/australian-mosques-combined.json \
            src/domain/australianMosqueDirectoryCombined.ts
          git rm .github/workflows/temporary-format-mosque-directory.yml
          git commit -m 'style: format Australian mosque directory integration'
          echo "FORMATTED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:data/australia-mosque-finder
