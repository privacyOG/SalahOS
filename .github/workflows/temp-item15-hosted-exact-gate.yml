name: TEMP V1.5.3 Item 15 hosted exact gate

on:
  push:
    branches:
      - temp/item15-hosted-exact-gate

permissions:
  contents: read

jobs:
  item15-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Item 15 head
        uses: actions/checkout@v4
        with:
          ref: d3783b21d3ff29e75678bcca965d0deb9eac8b19
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without audit network call
        run: npm ci --ignore-scripts --no-audit
      - name: Format check
        run: npm run format:check
      - name: Item 15 gate
        run: npm run typecheck && npm run lint && npm run test
