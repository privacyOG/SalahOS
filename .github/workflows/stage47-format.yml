name: Stage 47 Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage47-format.yml
      - scripts/visual-australian-mosque-directory.mjs
      - src/domain/australianMosqueDirectory.test.ts
      - src/domain/australianMosqueDirectory.ts
      - src/i18n/australianMosqueDirectoryTranslations.ts
      - src/ui/AustralianMosqueDirectoryPanel.tsx

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-47/v1.4-australian-mosque-directory

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Canonicalize Stage 47 authored files
        run: >-
          npx prettier --write
          scripts/visual-australian-mosque-directory.mjs
          src/domain/australianMosqueDirectory.test.ts
          src/domain/australianMosqueDirectory.ts
          src/i18n/australianMosqueDirectoryTranslations.ts
          src/ui/AustralianMosqueDirectoryPanel.tsx

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: stage47-formatted-files
          path: |
            scripts/visual-australian-mosque-directory.mjs
            src/domain/australianMosqueDirectory.test.ts
            src/domain/australianMosqueDirectory.ts
            src/i18n/australianMosqueDirectoryTranslations.ts
            src/ui/AustralianMosqueDirectoryPanel.tsx
          if-no-files-found: error
          retention-days: 1
