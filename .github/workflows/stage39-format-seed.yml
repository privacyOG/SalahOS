name: Stage 39 format seed

on:
  push:
    branches:
      - 'stage-39/calendar-integrations'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage-39/calendar-integrations
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Apply pinned formatter to Stage 39 sources
        run: npx prettier --write src/domain/calendarIntegration.ts src/domain/calendarIntegration.test.ts local-api/calendar.mjs local-api/calendar.test.mjs local-api/calendar-route.test.mjs docs/CALENDAR_INTEGRATIONS.md
      - name: Commit canonical source formatting
        run: |
          rm .github/workflows/stage39-format-seed.yml
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add -- src/domain/calendarIntegration.ts src/domain/calendarIntegration.test.ts local-api/calendar.mjs local-api/calendar.test.mjs local-api/calendar-route.test.mjs docs/CALENDAR_INTEGRATIONS.md .github/workflows/stage39-format-seed.yml
          git commit -m 'Apply canonical Stage 39 source formatting'
          git push origin HEAD:stage-39/calendar-integrations
