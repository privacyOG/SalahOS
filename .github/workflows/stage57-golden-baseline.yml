name: Stage 57 Golden Baseline Promotion

on:
  push:
    branches:
      - stage-57/v1.5-product-ux-refinement-final
    paths:
      - .github/workflows/stage57-golden-baseline.yml

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated visual artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/stage57-visual
          mkdir -p /tmp/stage57-visual
          gh run download 32942060864 \
            --repo "$GITHUB_REPOSITORY" \
            --name visual-regression-903772d84d7f0af6dd083d820a15280a91741a88 \
            --dir /tmp/stage57-visual
          test -s /tmp/stage57-visual/golden-today-phone-en-light-actual.png
          file /tmp/stage57-visual/golden-today-phone-en-light-actual.png | grep -F '390 x 844'
          echo '88901b07307f1cf5f23e2491f8318a542be9e0b9b278c30ab0e34e3cfe6cc078  /tmp/stage57-visual/golden-today-phone-en-light-actual.png' | sha256sum --check

      - name: Create baseline commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=/tmp/stage57-visual/golden-today-phone-en-light-actual.png
          encoded=/tmp/stage57-golden.b64
          base64 -w0 "$image" > "$encoded"

          blob_sha="$({
            printf '{"content":"'
            cat "$encoded"
            printf '","encoding":"base64"}'
          } | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"

          base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          tree_sha="$(jq -n \
            --arg base "$base_tree" \
            --arg blob "$blob_sha" \
            '{base_tree:$base,tree:[{path:"tests/golden/today-phone-en-light.png",mode:"100644",type:"blob",sha:$blob}]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"

          commit_sha="$(jq -n \
            --arg message 'test: approve Stage 8 Today golden baseline' \
            --arg tree "$tree_sha" \
            --arg parent "$GITHUB_SHA" \
            '{message:$message,tree:$tree,parents:[$parent],author:{name:"privacyOG",email:"kriptiik@proton.me"},committer:{name:"privacyOG",email:"kriptiik@proton.me"}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"

          echo "PROMOTED_COMMIT_SHA=$commit_sha"
          printf '%s\n' "$commit_sha" > /tmp/stage57-promoted-commit.txt

      - name: Upload promoted commit reference
        uses: actions/upload-artifact@v4
        with:
          name: stage57-promoted-commit-${{ github.run_id }}
          path: /tmp/stage57-promoted-commit.txt
          retention-days: 1
