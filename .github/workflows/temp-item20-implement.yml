          cat > src/platform/notificationOnboarding.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            completeNotificationOnboarding,
            initializeNotificationOnboarding,
            loadNotificationOnboarding,
            notificationOnboardingRequired,
            NOTIFICATION_ONBOARDING_STORAGE_KEY,
          } from './notificationOnboarding';
          import { SETTINGS_STORAGE_KEY, type KeyValueStorage } from './settingsStorage';

          class MemoryStorage implements KeyValueStorage {
            private readonly values = new Map<string, string>();
            getItem(key: string) {
              return this.values.get(key) ?? null;
            }
            setItem(key: string, value: string) {
              this.values.set(key, value);
            }
            removeItem(key: string) {
              this.values.delete(key);
            }
          }

          describe('notification onboarding state', () => {
            it('persists a fresh incomplete state before settings can be created', () => {
              const storage = new MemoryStorage();
              expect(initializeNotificationOnboarding(storage)).toEqual({
                version: 1,
                completed: false,
                decision: null,
              });
              expect(storage.getItem(NOTIFICATION_ONBOARDING_STORAGE_KEY)).not.toBeNull();
              expect(notificationOnboardingRequired(storage)).toBe(true);
            });

            it('migrates an already configured installation as completed', () => {
              const storage = new MemoryStorage();
              storage.setItem(SETTINGS_STORAGE_KEY, '{}');
              expect(initializeNotificationOnboarding(storage).completed).toBe(true);
              expect(notificationOnboardingRequired(storage)).toBe(false);
            });

            it('does not automatically re-prompt after decline', () => {
              const storage = new MemoryStorage();
              initializeNotificationOnboarding(storage);
              completeNotificationOnboarding(storage, 'declined');
              expect(loadNotificationOnboarding(storage)).toEqual({
                version: 1,
                completed: true,
                decision: 'declined',
              });
              expect(notificationOnboardingRequired(storage)).toBe(false);
            });
          });
          EOF

          cat > src/platform/notificationPermission.test.ts <<'EOF'
          import type { PermissionStatus } from '@capacitor/local-notifications';
          import { describe, expect, it } from 'vitest';
          import {
            requestNativePrayerNotificationPermission,
            type NotificationPermissionClient,
          } from './notificationPermission';

          class FakeClient implements NotificationPermissionClient {
            requested = 0;
            constructor(
              private checked: PermissionStatus,
              private requestedStatus: PermissionStatus = checked,
            ) {}
            checkPermissions(): Promise<PermissionStatus> {
              return Promise.resolve(this.checked);
            }
            requestPermissions(): Promise<PermissionStatus> {
              this.requested += 1;
              return Promise.resolve(this.requestedStatus);
            }
          }

          const granted = { display: 'granted' } as PermissionStatus;
          const denied = { display: 'denied' } as PermissionStatus;

          describe('native notification permission', () => {
            it('does not touch native permission on unsupported/web surfaces', async () => {
              const client = new FakeClient(denied, granted);
              await expect(
                requestNativePrayerNotificationPermission({ client, supported: false }),
              ).resolves.toBe('unsupported');
              expect(client.requested).toBe(0);
            });

            it('does not re-request when display permission is already granted', async () => {
              const client = new FakeClient(granted);
              await expect(
                requestNativePrayerNotificationPermission({ client, supported: true }),
              ).resolves.toBe('granted');
              expect(client.requested).toBe(0);
            });

            it('requests display permission once after the caller opts in', async () => {
              const client = new FakeClient(denied, granted);
              await expect(
                requestNativePrayerNotificationPermission({ client, supported: true }),
              ).resolves.toBe('granted');
              expect(client.requested).toBe(1);
            });
          });
          EOF

          cat > src/domain/notificationOnboardingPreferences.test.ts <<'EOF'
