name: Integrate Smart Display Mode

on:
  push:
    branches:
      - agent/smart-display-mode

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/smart-display-mode'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/smart-display-mode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Repository policies
        run: npm run security:sensitive-files && npm run security:audit && npm run security:licenses && npm run docs:links && python scripts/generate_pwa_icons.py --check

      - name: Apply smart display integration
        run: python scripts/apply_smart_display_mode.py

      - name: Canonicalize changed sources
        run: npx prettier --write src/App.tsx src/main.tsx src/ui/SmartDisplay.tsx src/ui/SmartDisplay.test.tsx src/smart-display.css

      - name: Validate implementation
        run: npm run lint && npm run typecheck && npm run test && npm run build && npm run verify:web-build

      - name: Commit integration
        run: |
          if git diff --quiet -- src/App.tsx src/main.tsx src/ui/SmartDisplay.tsx src/ui/SmartDisplay.test.tsx src/smart-display.css; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add src/App.tsx src/main.tsx src/ui/SmartDisplay.tsx src/ui/SmartDisplay.test.tsx src/smart-display.css
          git commit -m "feat: integrate smart display mode"
          git push origin HEAD:agent/smart-display-mode
