name: Prepare v1.2.0 Release

on:
  push:
    branches:
      - 'release-prep/v1.2.0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@v4
        with:
          ref: release-prep/v1.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Apply v1.2.0 release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.2.0 --no-git-tag-version
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}: {old!r}; found {text.count(old)}')
              target.write_text(text.replace(old, new, 1))

          def replace_all_checked(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} matches in {path}: {old!r}; found {count}')
              target.write_text(text.replace(old, new))

          replace_once('android/app/build.gradle', '        versionCode 2\n        versionName "1.1.0"', '        versionCode 3\n        versionName "1.2.0"')
          replace_all_checked('ios/App/App.xcodeproj/project.pbxproj', 'CURRENT_PROJECT_VERSION = 2;', 'CURRENT_PROJECT_VERSION = 3;', 2)
          replace_all_checked('ios/App/App.xcodeproj/project.pbxproj', 'MARKETING_VERSION = 1.1.0;', 'MARKETING_VERSION = 1.2.0;', 2)

          changelog = """# Changelog

All notable SalahOS changes are recorded here.

## Unreleased

## 1.2.0 — 2026-08-20

### Managed masjid and congregation experience

- Add a modern prayer-first design system, responsive congregation navigation and separate Today/Settings views.
- Add managed mosque profiles, authoritative prayer/Iqamah/Jumu'ah publication revisions, mosque following/offline cache, multiple local mosque profiles and a congregation mosque-profile experience.
- Add role/permission, invitation/session and administrator-dashboard domain foundations while keeping core personal prayer functionality account-free.
- Add mosque announcements, events, congregation community feeds, managed community-notification policy and phone/web/TV publishing previews.
- Add mosque discovery/directory flows, monthly timetable presentation and CSV/JSON exports.

### Managed displays and integrations

- Add managed signage scenes, playlists, scheduling, display pairing/fleet state, TV/kiosk layouts and configurable display themes.
- Add optional remote administration for managed mosque displays with typed configuration, one-time display credentials, revision control, cached fail-soft operation and explicit network-policy review.
- Add public embed widgets and a versioned read-only mosque API surface.
- Add Home Assistant support, a loopback-default optional local-network API and RFC 5545 mosque-event calendar export/subscription.
- Add a privacy-minimised wearable companion snapshot contract and platform exploration for future watchOS/Wear OS targets.

### Qiblah, Ramadan and languages

- Add deterministic local Qiblah bearing and the full Qiblah Finder with true-north compass guidance, WMM2025 magnetic-declination correction, screen-orientation compensation, smoothing, calibration feedback, alignment haptics and saved/current/city/map-pin location flows.
- Add privacy-gated OpenStreetMap imagery for the Qiblah Finder with attribution, offline fallback and a narrowly reviewed network capability.
- Add automatic Ramadan mode, Suhur/Imsak/Iftar presentation and mosque-specific Taraweeh timetable support.
- Add complete bundled Turkish and Indonesian application localisation alongside English and Arabic/RTL.

### Release and quality

- Keep the v1.1.0 downloadable asset matrix: signed Android APK, Web/PWA ZIP, Raspberry Pi kiosk tarball and portable SHA-256 manifest.
- Extend release preflight to verify npm, Android and iOS version consistency.
- Add an exact-main `release/v*` publication path so release assets can be built and published only from the current `main` commit.

## 1.1.0 — 2026-08-18

- Adopt the project owner's canonical SalahOS logo and icon across Web/PWA, Android, iOS and smart-display surfaces.
- Add reproducible source/hash/dimension validation for the canonical platform icon set.
- Add GitHub release packaging for Web/PWA and Raspberry Pi/kiosk bundles.
- Add a signed Android release APK pipeline that refuses to publish unsigned or debug APKs.
- Add SHA-256 checksum publication for downloadable release assets.
- Document the current distribution boundary: iOS IPA awaits Apple distribution signing and macOS DMG awaits a real macOS application target.

## 1.0.0 — 2026-08-18

### Added

- Local-first five-prayer calculation engine with Sunrise, supplementary night/day times, selectable calculation methods, Standard/Shafi'i-family and Hanafi Asr conventions, high-latitude handling and explicit manual adjustments.
- Gregorian and Hijri/Umm al-Qura date presentation with local civil-date, DST and rollover handling.
- Browser and native foreground location, manual coordinates, offline city search, saved locations and offline IANA timezone resolution.
- Calculated, adjusted and local-mosque timetable modes with validated CSV/JSON import/export, Iqamah rules and multiple Jumu'ah sessions.
- English and Arabic localisation, RTL/bidirectional handling, light/dark/system themes, scalable text, keyboard navigation and touch-oriented layouts.
- Android and iOS/iPadOS native shells with local persistence, prayer-notification scheduling and documented lifecycle/platform limits.
- Private user-selected local Adhan audio with foreground playback attempts and notification-based background/terminated delivery.
- PWA offline shell, Raspberry Pi Touch Display 2 deployment/fixtures and browser-based smart-display mode for TV/kiosk use.
- Permanent security, dependency, documentation, Android, iOS and 14-scenario visual-regression quality gates.

### Fixed

- iPhone safe-area handling for status-bar/Dynamic-Island insets, with a source-contract regression test.
- Responsive overflow cases found by the automated Arabic/RTL and scalable-text visual matrix.

### Release validation boundary

- v1.0.0 is a production repository/source release. It does not claim App Store/Play Store publication or signed store binaries.
- Physical iPhone/iPad, Android OEM, Raspberry Pi Touch Display 2 and TV/panel acceptance remains explicitly unperformed where recorded in TODO.md and platform documentation.
- Emulator, Simulator and browser evidence is not represented as physical-hardware evidence.

---

**Author:** privacyOG
"""
          Path('CHANGELOG.md').write_text(changelog)

          release_notes = """# SalahOS v1.2.0 release notes

SalahOS v1.2.0 expands the local-first prayer application into a substantially broader mosque, congregation and managed-display platform while preserving the privacy boundary of the core prayer experience. It also introduces the full Qiblah Finder, Ramadan presentation improvements and complete Turkish/Indonesian localisation.

## Managed masjid and congregation platform

- Modern prayer-first design system with responsive mobile, tablet and desktop congregation navigation.
- Managed mosque profile identities with bilingual public details, facilities, contact metadata and stable mosque/organization IDs.
- Authoritative prayer publication revisions covering calculated, adjusted and supplied prayer starts, fixed/offset Iqamah, multiple Jumu'ah sessions, seasonal/date-specific rules and rollback-as-new-revision provenance.
- Mosque following with last-known published prayer cache for offline/stale presentation.
- Congregation mosque directory and profile experiences, monthly timetables and CSV/JSON exports.
- Multiple local mosque profiles with versioned import/export and Android native persistence.
- Managed authorization foundations for organization owners, mosque administrators, prayer-time managers, content editors, signage operators and read-only auditors without making personal prayer use account-dependent.
- Mosque announcements/events, local congregation feeds, publishing previews and managed community-notification policy.

## Managed displays and signage

- Managed signage scene model for prayer boards, announcements, events, images, allowlisted web content, QR actions and countdowns.
- Ordered playlists with dwell times, schedule windows, prayer-relative scheduling, Jumu'ah/Ramadan contexts and deterministic conflict resolution.
- Display pairing/fleet identity with orientation/resolution profiles, cached configuration, last-seen/sync metadata and revocation handling.
- Dedicated 16:9 TV, portrait foyer and Raspberry Pi Touch Display 2 managed-display layouts.
- Four deterministic smart-display themes: Classic, Midnight, Sandstone and Emerald.
- Optional remote managed-display administration with administrator-authenticated fleet actions, one-time display credentials, revisioned configuration, heartbeats and fail-soft cached prayer operation. The channel is constrained to typed SalahOS display configuration rather than arbitrary remote code/content execution.

## Public and home integrations

- Versioned read-only mosque profile, daily prayer and monthly timetable API contracts plus constrained embeddable daily/monthly/next-prayer widgets.
- Home Assistant custom integration exposing timezone-aware Fajr, Dhuhr, Asr, Maghrib and Isha sensors from the public mosque contract.
- Optional loopback-default local network API with explicit LAN opt-in, read-only endpoints, rate limits, cache policy, validation and last-known-good snapshot handling.
- RFC 5545 mosque-event calendar export and read-only calendar subscription feed with deterministic UIDs, recurrence, escaping and UTF-8 line folding.
- Privacy-minimised wearable companion snapshot contract and architecture exploration for future watchOS and Wear OS targets.

## Qiblah Finder

- Deterministic local great-circle bearing to the Kaaba.
- True-north live compass guidance where supported.
- WMM2025 magnetic-declination correction, screen-orientation compensation and circular smoothing.
- Calibration feedback, two-degree alignment tolerance and haptic alignment cue.
- Saved location, current position, foreground live updates, offline city search and map-pin location selection.
- Optional OpenStreetMap imagery is user-enabled, attributed and isolated behind an explicit reviewed network/privacy boundary; core bearing and compass operation remain local/offline.

## Ramadan and languages

- Automatic Ramadan mode derived from the corrected local Umm al-Qura date.
- Suhur/Imsak/Iftar presentation using the same selected prayer source as the main dashboard; Imsak is explicitly presented as a precautionary offset, not a hidden prayer-calculation rule.
- Mosque-specific Taraweeh timetable sessions without imposing a rak'ah-count convention.
- Complete bundled Turkish and Indonesian UI localisation alongside English and Arabic/RTL, including settings persistence and application-owned feature surfaces.

## Downloadable v1.2.0 assets

A successful v1.2.0 release workflow publishes the same verified distribution set established by v1.1.0:

- `SalahOS-v1.2.0-android.apk` — persistently signed Android release APK, verified with Android `apksigner`;
- `SalahOS-v1.2.0-web-pwa.zip` — production Web/PWA package;
- `SalahOS-v1.2.0-raspberry-pi-kiosk.tar.gz` — production Web/PWA files plus Raspberry Pi/Linux Chromium kiosk launch and autostart helpers;
- `SHA256SUMS.txt` — portable SHA-256 hashes for all published packages.

The release workflow fails closed if the persistent Android signing inputs are unavailable, verifies each package and checksum manifest, and verifies the exact final asset set before publication.

## Distribution boundaries

- The iOS/iPadOS application remains build- and Simulator-validated, but a consumer `.ipa` is not published until Apple distribution signing/provisioning is configured and the resulting distribution archive is validated.
- SalahOS does not yet contain a native macOS desktop target, so no `.dmg` is published.
- Physical Raspberry Pi, TV/panel, iPhone/iPad and broad Android OEM acceptance remains separate from CI packaging evidence and is not implied by this release.

## Release gates

The v1.2.0 release revision must be the exact current `main` commit and must pass the permanent Quality, Android, Visual Regression and iOS workflows before publication. The release-asset workflow then reruns the full repository quality gate for Web/PWA/kiosk packaging, verifies persistent Android signing and `apksigner`, checks archive integrity, combines portable SHA-256 manifests, verifies the exact four-file asset set, and only then creates/uploads the GitHub release.

See `docs/RELEASE_ASSETS.md`, `TESTING.md`, `TODO.md` and `docs/PLATFORM_STATUS.md` for the exact distribution and validation boundaries.

## Author

privacyOG
"""
          Path('RELEASE_NOTES.md').write_text(release_notes)

          readme = Path('README.md').read_text()
          replacement = """## Release status

SalahOS v1.0.0 is the first production repository/source release. SalahOS v1.1.0, tagged at `ed194c8608e7cb471ba552ab625a4abcb95ba55b`, established the downloadable release pipeline with canonical branding, a persistently signed Android APK, Web/PWA ZIP, Raspberry Pi kiosk tarball and portable SHA-256 checksums.

SalahOS v1.2.0 packages the Phase 2 managed-masjid/community expansion, managed displays and integrations, Ramadan improvements, additional languages and the full Qiblah Finder. Publication remains fail-closed: the release revision must be the exact current `main` commit, permanent Quality/Android/Visual/iOS gates must pass, the Android APK must be signed with the persistent release identity and verified with `apksigner`, and the final package preflight must contain only the expected four downloadable assets.

The tested platform matrix and remaining physical/target-environment validation are documented in [docs/PLATFORM_STATUS.md](docs/PLATFORM_STATUS.md), [TESTING.md](TESTING.md) and [TODO.md](TODO.md). App Store/Play Store publication, a consumer iOS `.ipa`, a native macOS `.dmg`, and unperformed physical-device acceptance are not implied by the GitHub release.
"""
          readme, count = re.subn(r'## Release status\n.*?\n## Author', replacement + '\n## Author', readme, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one README release-status section, found {count}')
          Path('README.md').write_text(readme)

          workflow_path = Path('.github/workflows/release-assets.yml')
          workflow = workflow_path.read_text()
          trigger_old = """  push:
    tags:
      - 'v*'
"""
          trigger_new = """  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'
"""
          if workflow.count(trigger_old) != 1:
              raise SystemExit('Release workflow push trigger did not match expected v1.1.0 form')
          workflow = workflow.replace(trigger_old, trigger_new, 1)

          version_old = """          ANDROID_VERSION=\"$(sed -n 's/^[[:space:]]*versionName[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' android/app/build.gradle | head -1)\"
          [[ -n \"$PACKAGE_VERSION\" && \"$ANDROID_VERSION\" == \"$PACKAGE_VERSION\" ]] || {
            echo \"Package version ${PACKAGE_VERSION} and Android version ${ANDROID_VERSION} do not match\" >&2
            exit 1
          }
"""
          version_new = """          ANDROID_VERSION=\"$(sed -n 's/^[[:space:]]*versionName[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' android/app/build.gradle | head -1)\"
          IOS_VERSION=\"$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \\([^;]*\\);/\\1/p' ios/App/App.xcodeproj/project.pbxproj | sort -u)\"
          [[ -n \"$PACKAGE_VERSION\" && \"$ANDROID_VERSION\" == \"$PACKAGE_VERSION\" ]] || {
            echo \"Package version ${PACKAGE_VERSION} and Android version ${ANDROID_VERSION} do not match\" >&2
            exit 1
          }
          [[ \"$IOS_VERSION\" == \"$PACKAGE_VERSION\" ]] || {
            echo \"Package version ${PACKAGE_VERSION} and iOS marketing version ${IOS_VERSION} do not match\" >&2
            exit 1
          }
"""
          if workflow.count(version_old) != 1:
              raise SystemExit('Release workflow version preflight did not match expected form')
          workflow = workflow.replace(version_old, version_new, 1)

          publish_old = """          [[ \"$GITHUB_REF_NAME\" == v* ]]
          if gh release view \"$GITHUB_REF_NAME\" >/dev/null 2>&1; then
            gh release upload \"$GITHUB_REF_NAME\" release/* --clobber
          else
            gh release create \"$GITHUB_REF_NAME\" \\
              --title \"SalahOS ${GITHUB_REF_NAME}\" \\
              --notes-file RELEASE_NOTES.md \\
              release/*
          fi
"""
          publish_new = """          VERSION='${{ needs.preflight.outputs.version }}'
          RELEASE_TAG=\"v${VERSION}\"
          if [[ \"${GITHUB_REF_TYPE:-}\" == \"tag\" ]]; then
            [[ \"$GITHUB_REF_NAME\" == \"$RELEASE_TAG\" ]] || {
              echo \"Tag ${GITHUB_REF_NAME} does not match release version ${RELEASE_TAG}\" >&2
              exit 1
            }
          else
            [[ \"${GITHUB_REF_NAME:-}\" == \"release/${RELEASE_TAG}\" ]] || {
              echo \"Release branch ${GITHUB_REF_NAME:-unknown} must be release/${RELEASE_TAG}\" >&2
              exit 1
            }
          fi
          if gh release view \"$RELEASE_TAG\" >/dev/null 2>&1; then
            gh release upload \"$RELEASE_TAG\" release/* --clobber
          else
            gh release create \"$RELEASE_TAG\" \\
              --target \"$GITHUB_SHA\" \\
              --title \"SalahOS ${RELEASE_TAG}\" \\
              --notes-file RELEASE_NOTES.md \\
              release/*
          fi
"""
          if workflow.count(publish_old) != 1:
              raise SystemExit('Release workflow publish block did not match expected form')
          workflow_path.write_text(workflow.replace(publish_old, publish_new, 1))

          test_path = Path('scripts/release-packaging.test.mjs')
          test = test_path.read_text()
          test = test.replace(
              "    expect(workflow).toContain('git rev-parse origin/main');\n",
              "    expect(workflow).toContain('git rev-parse origin/main');\n    expect(workflow).toContain(\"- 'release/v*'\");\n",
              1,
          )
          test = test.replace(
              "    expect(workflow).toContain('does not match package version v${PACKAGE_VERSION}');\n",
              "    expect(workflow).toContain('does not match package version v${PACKAGE_VERSION}');\n    expect(workflow).toContain('iOS marketing version ${IOS_VERSION} do not match');\n",
              1,
          )
          test = test.replace(
              "    expect(workflow).toContain(\"if: github.event_name == 'push'\");\n",
              "    expect(workflow).toContain(\"if: github.event_name == 'push'\");\n    expect(workflow).toContain('RELEASE_TAG=\"v${VERSION}\"');\n    expect(workflow).toContain('release/${RELEASE_TAG}');\n    expect(workflow).toContain('--target \"$GITHUB_SHA\"');\n",
              1,
          )
          test_path.write_text(test)
          PY

      - name: Apply canonical formatting
        run: >-
          npx prettier --write package.json package-lock.json CHANGELOG.md RELEASE_NOTES.md README.md
          .github/workflows/release-assets.yml .github/workflows/release-prep-v1.2.0.yml
          scripts/release-packaging.test.mjs

      - name: Verify v1.2.0 version metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node -p "require('./package.json').version")" == '1.2.0' ]]
          grep -Fq 'versionCode 3' android/app/build.gradle
          grep -Fq 'versionName "1.2.0"' android/app/build.gradle
          [[ "$(grep -c 'CURRENT_PROJECT_VERSION = 3;' ios/App/App.xcodeproj/project.pbxproj)" == '2' ]]
          [[ "$(grep -c 'MARKETING_VERSION = 1.2.0;' ios/App/App.xcodeproj/project.pbxproj)" == '2' ]]

      - name: Run complete repository quality gate
        run: npm run check

      - name: Remove temporary release-prep workflow
        run: rm .github/workflows/release-prep-v1.2.0.yml

      - name: Commit verified v1.2.0 release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add -- \
            package.json \
            package-lock.json \
            android/app/build.gradle \
            ios/App/App.xcodeproj/project.pbxproj \
            CHANGELOG.md \
            RELEASE_NOTES.md \
            README.md \
            .github/workflows/release-assets.yml \
            scripts/release-packaging.test.mjs \
            .github/workflows/release-prep-v1.2.0.yml
          git diff --cached --check
          git commit -m 'Prepare SalahOS v1.2.0 release'
          git push origin HEAD:release-prep/v1.2.0
