name: TEMP Item 17 Tracker Completion

on:
  push:
    branches:
      - v1.5.3/item-17-tracker-complete
    paths:
      - .github/workflows/temp-item17-tracker-complete.yml

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.3/item-17-tracker-complete
      - name: Mark Item 17 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TEMP_TODO_V1.5.3.md')
          text = path.read_text()
          heading = '## Work Item 17 — Make 6,236 ayat navigable'
          next_heading = '\n## Work Item 18 — Consolidate bottom navigation and label overflow'
          start = text.index(heading)
          end = text.index(next_heading, start)
          block = text[start:end]
          if '— COMPLETE' not in block.splitlines()[0]:
              block = block.replace(heading, f'{heading} — COMPLETE', 1)
          block = block.replace('- [ ]', '- [x]')
          text = text[:start] + block + text[end:]

          completion = ('- Work Item 17: complete via PR #250, merged as '
                        '`088c3ba8abd49ab6807f5cf153056391411e87d0`; final head '
                        '`133bcfa5c8abd2c9d629215d31e6a0fc15f46f86` passed Quality, Visual, '
                        'Android, iOS, and Windows gates. Five-iteration Al-Baqarah browser benchmark '
                        'measured 20.1 ms → 23.6 ms selection latency while reducing the chapter DOM '
                        'from 286 rows to a 7–9 row virtual window and the full-chapter navigation path '
                        'from 273.6 ms expand-all to 32.3 ms virtual scroll-to-bottom.')
          if completion not in text:
              text = text.rstrip() + '\n' + completion + '\n'
          path.write_text(text)
          PY
          rm .github/workflows/temp-item17-tracker-complete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMP_TODO_V1.5.3.md .github/workflows/temp-item17-tracker-complete.yml
          git commit -m "Mark v1.5.3 Item 17 complete"
          git push origin HEAD:v1.5.3/item-17-tracker-complete
