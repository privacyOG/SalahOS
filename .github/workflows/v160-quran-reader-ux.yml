name: V1.6.0 Quran Reader UX Patch

on:
  push:
    branches:
      - v160-quran-reader-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-quran-reader-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply reader UX transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import indent

          path = Path('src/ui/QuranOfflineReader.tsx')
          text = path.read_text()

          first_import = "import { Fragment, useEffect, useMemo, useState } from 'react';"
          if first_import not in text:
              raise SystemExit('reader import marker drifted')
          text = text.replace(
              first_import,
              "import { Fragment, useEffect, useMemo, useState } from 'react';\n\nimport '../quran-reader-disclosures.css';",
              1,
          )

          type_marker = "  quran: string;\n  provenance: string;"
          if type_marker not in text:
              raise SystemExit('reader copy type marker drifted')
          text = text.replace(
              type_marker,
              "  quran: string;\n  navigation: string;\n  readingPreferences: string;\n  backToSearch: string;\n  pageGroupingNote: string;\n  provenance: string;",
              1,
          )

          locale_replacements = {
              "    quran: 'Qur’an',\n    provenance:": "    quran: 'Qur’an',\n    navigation: 'Navigation',\n    readingPreferences: 'Reading preferences',\n    backToSearch: 'Back to search results',\n    pageGroupingNote:\n      'Groups ayat by the source Mushaf page number in the packaged corpus; this is not a facsimile page.',\n    provenance:",
              "    quran: 'القرآن',\n    provenance:": "    quran: 'القرآن',\n    navigation: 'التنقل',\n    readingPreferences: 'تفضيلات القراءة',\n    backToSearch: 'العودة إلى نتائج البحث',\n    pageGroupingNote:\n      'تُجمع الآيات حسب رقم صفحة المصحف في المصدر المحفوظ؛ وهذا العرض ليس صورة مطابقة لصفحة المصحف.',\n    provenance:",
              "    quran: 'Kur’an',\n    provenance:": "    quran: 'Kur’an',\n    navigation: 'Gezinme',\n    readingPreferences: 'Okuma tercihleri',\n    backToSearch: 'Arama sonuçlarına dön',\n    pageGroupingNote:\n      'Ayetleri paketlenmiş kaynaktaki mushaf sayfa numarasına göre gruplar; bu görünüm tıpkıbasım bir mushaf sayfası değildir.',\n    provenance:",
              "    quran: 'Qur’an',\n    provenance: 'Teks Arab Utsmani": "    quran: 'Qur’an',\n    navigation: 'Navigasi',\n    readingPreferences: 'Preferensi membaca',\n    backToSearch: 'Kembali ke hasil pencarian',\n    pageGroupingNote:\n      'Mengelompokkan ayat berdasarkan nomor halaman mushaf pada sumber terkemas; tampilan ini bukan faksimile halaman mushaf.',\n    provenance: 'Teks Arab Utsmani",
          }
          for old, new in locale_replacements.items():
              if old not in text:
                  raise SystemExit(f'locale copy marker drifted: {old[:24]}')
              text = text.replace(old, new, 1)

          search_state = "  const [search, setSearch] = useState('');\n"
          if search_state not in text:
              raise SystemExit('search state marker drifted')
          text = text.replace(
              search_state,
              search_state + "  const [searchReturnQuery, setSearchReturnQuery] = useState<string | null>(null);\n",
              1,
          )

          initial_navigation = "    setBookmarksOnly(false);\n    setSearch('');\n    setSelectedSurah(target.surah.surah);"
          if initial_navigation not in text:
              raise SystemExit('initial verse navigation marker drifted')
          text = text.replace(
              initial_navigation,
              "    setBookmarksOnly(false);\n    setSearch('');\n    setSearchReturnQuery(null);\n    setSelectedSurah(target.surah.surah);",
              1,
          )

          old_jump = """  const jumpToVerse = (verseKey: string): void => {
    const parsed = parseQuranVerseKey(verseKey);
    if (!parsed) return;
    setBookmarksOnly(false);
    setSearch('');
"""
          new_jump = """  const jumpToVerse = (verseKey: string, preserveSearchContext = false): void => {
    const parsed = parseQuranVerseKey(verseKey);
    if (!parsed) return;
    if (preserveSearchContext && search.trim().length > 0) {
      setSearchReturnQuery(search);
    } else {
      setSearchReturnQuery(null);
    }
    setBookmarksOnly(false);
    setSearch('');
"""
          if old_jump not in text:
              raise SystemExit('jumpToVerse marker drifted')
          text = text.replace(old_jump, new_jump, 1)

          first_navigation = "    setBookmarksOnly(false);\n    setSearch('');\n    if (first) {"
          if text.count(first_navigation) != 2:
              raise SystemExit('select Surah/page navigation count drifted')
          text = text.replace(
              first_navigation,
              "    setBookmarksOnly(false);\n    setSearch('');\n    setSearchReturnQuery(null);\n    if (first) {",
          )

          bookmark_toggle = "              setBookmarksOnly((current) => !current);\n              setSearch('');"
          if bookmark_toggle not in text:
              raise SystemExit('bookmark toggle marker drifted')
          text = text.replace(
              bookmark_toggle,
              bookmark_toggle + "\n              setSearchReturnQuery(null);",
              1,
          )

          search_change = "                  setSearch(event.target.value);\n                  setBookmarksOnly(false);"
          if search_change not in text:
              raise SystemExit('Quran search onChange marker drifted')
          text = text.replace(
              search_change,
              "                  setSearch(event.target.value);\n                  setBookmarksOnly(false);\n                  setSearchReturnQuery(null);",
              1,
          )

          related_call = "                                  jumpToVerse(verseKey);"
          if text.count(related_call) != 2:
              raise SystemExit('related ayah jump count drifted')
          text = text.replace(related_call, "                                  jumpToVerse(verseKey, true);")

          qsi_start = text.index('            <QuranSurahIndex')
          qsi_end_marker = '          </div>\n\n          <div className="quran-jump-navigation"'
          qsi_end = text.index(qsi_end_marker, qsi_start)
          qsi_block = text[qsi_start:qsi_end].rstrip()
          jump_start = text.index('          <div className="quran-jump-navigation"', qsi_end)
          reading_open = '          <div className="quran-offline-reader__reading-controls" data-quran-reading-controls>\n'
          reading_start = text.index(reading_open, jump_start)
          jump_block = text[jump_start:reading_start].rstrip()
          replacement = (
              '            <details className="quran-reader-disclosure" data-quran-navigation-disclosure>\n'
              '              <summary>{labels.navigation}</summary>\n'
              '              <div className="quran-reader-disclosure__content">\n'
              + indent(qsi_block, '    ')
              + '\n'
              + indent(jump_block, '      ')
              + '\n              </div>\n'
              '            </details>\n'
              '          </div>\n\n'
              '          <details\n'
              '            className="quran-reader-disclosure quran-reader-disclosure--preferences"\n'
              '            data-quran-preferences-disclosure\n'
              '          >\n'
              '            <summary>{labels.readingPreferences}</summary>\n'
              + reading_open
          )
          text = text[:qsi_start] + replacement + text[reading_start + len(reading_open):]

          page_marker = "          {preferences.readingMode === 'page' && normalBrowsing ? ("
          page_start = text.index(page_marker)
          close_pattern = '\n          </div>\n\n'
          reading_close = text.rfind(close_pattern, 0, page_start)
          if reading_close < 0:
              raise SystemExit('reading controls closing marker drifted')
          text = (
              text[:reading_close]
              + '\n          </div>\n          </details>\n\n'
              + text[reading_close + len(close_pattern):]
          )

          page_start = text.index(page_marker)
          active_marker = '          {activeResult ? ('
          active_start = text.index(active_marker, page_start)
          page_block = """          {preferences.readingMode === 'page' && normalBrowsing ? (
            <>
              <div className="quran-page-navigation" aria-label={labels.readingMode}>
                <button
                  type="button"
                  disabled={currentPage <= 1}
                  onClick={() => {
                    selectPage(currentPage - 1);
                  }}
                >
                  {labels.previousPage}
                </button>
                <strong>
                  {labels.page} {formatQuranUiNumber(currentPage, locale)} /{' '}
                  {formatQuranUiNumber(maxPage, locale)}
                </strong>
                <button
                  type="button"
                  disabled={currentPage >= maxPage}
                  onClick={() => {
                    selectPage(currentPage + 1);
                  }}
                >
                  {labels.nextPage}
                </button>
              </div>
              <p className="quran-page-grouping-note" data-quran-page-grouping-note>
                {labels.pageGroupingNote}
              </p>
            </>
          ) : null}

"""
          text = text[:page_start] + page_block + text[active_start:]

          result_limit_marker = "          {search.trim().length > 0 && searchResults.length === 50 ? ("
          result_limit = text.index(result_limit_marker)
          return_block = """          {searchReturnQuery !== null ? (
            <button
              type="button"
              className="quran-offline-reader__return-search"
              data-quran-return-to-search
              onClick={() => {
                setSearch(searchReturnQuery);
                setSearchReturnQuery(null);
                setBookmarksOnly(false);
              }}
            >
              {labels.backToSearch}
            </button>
          ) : null}

"""
          text = text[:result_limit] + return_block + text[result_limit:]

          path.write_text(text)

          visual_path = Path('scripts/visual-quran-offline-reader.mjs')
          visual = visual_path.read_text()
          surah_marker = "  const surahIndex = reader.locator('[data-quran-surah-index]');\n"
          if surah_marker not in visual:
              raise SystemExit('visual Surah marker drifted')
          disclosure_setup = """  const navigationDisclosure = reader.locator('[data-quran-navigation-disclosure]');
  assert(
    (await navigationDisclosure.getAttribute('open')) === null,
    'Secondary Qur’an navigation should be collapsed by default',
  );
  await navigationDisclosure.locator('summary').click();
  assert(
    (await navigationDisclosure.getAttribute('open')) !== null,
    'Qur’an navigation disclosure did not open on demand',
  );

"""
          visual = visual.replace(surah_marker, disclosure_setup + surah_marker, 1)

          count_marker = """  assert(
    (await surahIndex.locator('[data-quran-surah-option]').count()) === 114,
    'Complete Qur’an reader did not expose all 114 surahs in the searchable index',
  );
  const surahSearch = surahIndex.locator('[data-quran-surah-search]');
  await surahSearch.fill('2');
"""
          count_replacement = """  assert(
    (await surahIndex.locator('[data-quran-surah-option]').count()) === 114,
    'Complete Qur’an reader did not expose all 114 surahs in the searchable index',
  );
  const surahSearch = surahIndex.locator('[data-quran-surah-search]');
  await surahSearch.fill('not-a-surah');
  await surahIndex.locator('[data-quran-surah-search-empty]').waitFor({ state: 'visible' });
  await surahSearch.fill('2');
"""
          if count_marker not in visual:
              raise SystemExit('visual Surah count marker drifted')
          visual = visual.replace(count_marker, count_replacement, 1)

          preference_marker = "  await reader.locator('[data-quran-translation-mode]').selectOption('none');\n"
          preference_setup = """  const preferencesDisclosure = reader.locator('[data-quran-preferences-disclosure]');
  assert(
    (await preferencesDisclosure.getAttribute('open')) === null,
    'Qur’an reading preferences should be collapsed by default',
  );
  await preferencesDisclosure.locator('summary').click();
  await reader.locator('[data-quran-reading-mode="page"]').click();
  const pageGroupingNote = reader.locator('[data-quran-page-grouping-note]');
  await pageGroupingNote.waitFor({ state: 'visible' });
  assert(
    ((await pageGroupingNote.textContent()) ?? '').includes('not a facsimile page'),
    'Page mode did not disclose that source-page grouping is not a facsimile',
  );
  await reader.locator('[data-quran-reading-mode="list"]').click();

"""
          if preference_marker not in visual:
              raise SystemExit('visual preference marker drifted')
          visual = visual.replace(preference_marker, preference_setup + preference_marker, 1)

          tafsir_marker = "  await curatedAyah.getByText('Tafsir al-Jalalayn', { exact: true }).waitFor();\n"
          return_setup = """  const relatedAyah = curatedAyah.locator('[data-quran-related-reference]').first();
  await relatedAyah.click();
  const returnToSearch = reader.locator('[data-quran-return-to-search]');
  await returnToSearch.waitFor({ state: 'visible' });
  assert((await search.inputValue()) === '', 'Related ayah navigation did not leave search view');
  await returnToSearch.click();
  assert(
    (await search.inputValue()) === '20:14',
    'Return-to-search did not restore the previous Qur’an query',
  );
  await curatedAyah.waitFor({ state: 'visible' });
"""
          if tafsir_marker not in visual:
              raise SystemExit('visual tafsir marker drifted')
          visual = visual.replace(tafsir_marker, tafsir_marker + '\n' + return_setup, 1)
          visual_path.write_text(visual)
          PY
      - name: Verify reader UX transform
        run: |
          npx prettier --write src/ui/QuranOfflineReader.tsx src/quran-reader-disclosures.css src/ui/QuranReaderUxV160.test.ts scripts/visual-quran-offline-reader.mjs
          npm run lint
          npm run typecheck
          npx vitest run src/ui/QuranReaderUxV160.test.ts src/platform/quranReadingPreferences.test.ts src/domain/quranOfflineLibrary.test.ts
      - name: Publish immutable validated commit
        run: |
          rm .github/workflows/v160-quran-reader-ux.yml
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/QuranOfflineReader.tsx src/quran-reader-disclosures.css src/ui/QuranReaderUxV160.test.ts scripts/visual-quran-offline-reader.mjs .github/workflows/v160-quran-reader-ux.yml
          git commit -m "feat(quran): refine reader navigation and context"
          git tag v160-quran-reader-ux-temp
          git push origin refs/tags/v160-quran-reader-ux-temp
