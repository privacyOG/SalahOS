name: V1.6.0 Quran Reader UX Patch

on:
  push:
    branches:
      - v160-quran-reader-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v160-quran-reader-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Repair structural navigation markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-v160-quran-reader-ux.py')
          text = path.read_text()
          old = "first_navigation = \"    setBookmarksOnly(false);\\n    setSearch('');\\n    if (first) {\"\nif text.count(first_navigation) != 2:\n    raise SystemExit('select Surah/page navigation count drifted')\ntext = text.replace(\n    first_navigation,\n    \"    setBookmarksOnly(false);\\n    setSearch('');\\n    setSearchReturnQuery(null);\\n    if (first) {\",\n)\n"
          new = "surah_navigation = \"    setBookmarksOnly(false);\\n    setSearch('');\\n    if (first) {\"\nif surah_navigation not in text:\n    raise SystemExit('select Surah navigation marker drifted')\ntext = text.replace(\n    surah_navigation,\n    \"    setBookmarksOnly(false);\\n    setSearch('');\\n    setSearchReturnQuery(null);\\n    if (first) {\",\n    1,\n)\n\npage_navigation = \"    setBookmarksOnly(false);\\n    setSearch('');\\n    const first = allResults.find((result) => result.ayah.page === nextPage);\"\nif page_navigation not in text:\n    raise SystemExit('select page navigation marker drifted')\ntext = text.replace(\n    page_navigation,\n    \"    setBookmarksOnly(false);\\n    setSearch('');\\n    setSearchReturnQuery(null);\\n    const first = allResults.find((result) => result.ayah.page === nextPage);\",\n    1,\n)\n"
          if old not in text:
              raise SystemExit('helper repair target drifted')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply reader UX transform
        run: python3 scripts/apply-v160-quran-reader-ux.py
      - name: Verify reader UX transform
        run: |
          npx prettier --write src/ui/QuranOfflineReader.tsx src/quran-reader-disclosures.css src/ui/QuranReaderUxV160.test.ts scripts/visual-quran-offline-reader.mjs
          npm run lint
          npm run typecheck
          npx vitest run src/ui/QuranReaderUxV160.test.ts src/platform/quranReadingPreferences.test.ts src/domain/quranOfflineLibrary.test.ts
      - name: Publish clean validated commit
        run: |
          rm .github/workflows/v160-quran-reader-ux.yml scripts/apply-v160-quran-reader-ux.py
          git config user.name "SalahOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/QuranOfflineReader.tsx src/quran-reader-disclosures.css src/ui/QuranReaderUxV160.test.ts scripts/visual-quran-offline-reader.mjs .github/workflows/v160-quran-reader-ux.yml scripts/apply-v160-quran-reader-ux.py
          git commit -m "feat(quran): simplify reader navigation and preserve context"
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          git tag -f v160-quran-reader-ux-validated
          git push origin refs/tags/v160-quran-reader-ux-validated --force
