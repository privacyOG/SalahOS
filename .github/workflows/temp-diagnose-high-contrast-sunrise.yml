name: Temp diagnose high contrast Sunrise

on:
  push:
    branches:
      - temp/diagnose-high-contrast-sunrise

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Chromium harness
        run: |
          rm -rf /tmp/salahos-diagnostic-harness
          mkdir -p /tmp/salahos-diagnostic-harness
          cd /tmp/salahos-diagnostic-harness
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/salahos-diagnostic-http.log 2>&1 &
          echo $! >/tmp/salahos-diagnostic-server.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit('server not ready')
          PY
      - name: Print Sunrise computed styles
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '/tmp/salahos-diagnostic-harness/node_modules/playwright/index.mjs';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, colorScheme: 'light', reducedMotion: 'reduce', serviceWorkers: 'block' });
          const page = await context.newPage();
          await page.addInitScript(() => {
            localStorage.setItem('salahos.settings', JSON.stringify({
              version: 2,
              locale: 'en',
              theme: 'light',
              palette: 'high-contrast',
              timeFormat: 'h23',
              calculationMethodId: 'muslim-world-league',
              asrConvention: 'standard',
              highLatitudeRule: 'angle-based',
              hijriCorrectionDays: 0,
              prayerAdjustments: {},
              prayerSourceMode: 'calculated',
              location: { coordinates: { latitude: -33.8688, longitude: 151.2093 }, timeZone: 'Australia/Sydney' },
              mosqueTimetable: null,
              notifications: {},
            }));
          });
          await page.goto('http://127.0.0.1:4173/?view=today', { waitUntil: 'networkidle' });
          await page.locator('.today-screen').waitFor({ state: 'visible' });
          const result = await page.evaluate(() => {
            const row = document.querySelector('.today-prayer-row--sunrise');
            const name = row?.querySelector('.today-prayer-row__name > strong');
            const time = row?.querySelector('.today-prayer-row__time');
            const iqamah = row?.querySelector('.today-prayer-row__iqamah');
            const table = row?.closest('.today-prayer-table');
            const surface = row?.closest('.mobile-prayer-theme-surface');
            const snapshot = (element) => {
              if (!(element instanceof Element)) return null;
              const style = getComputedStyle(element);
              return {
                className: element.className,
                color: style.color,
                backgroundColor: style.backgroundColor,
                backgroundImage: style.backgroundImage,
                borderColor: style.borderColor,
              };
            };
            const root = getComputedStyle(document.documentElement);
            const mobile = surface ? getComputedStyle(surface) : null;
            return {
              rootDataset: { ...document.documentElement.dataset },
              surfaceDataset: surface ? { ...surface.dataset } : null,
              row: snapshot(row),
              name: snapshot(name),
              time: snapshot(time),
              iqamah: snapshot(iqamah),
              table: snapshot(table),
              tokens: {
                salahFgPrimary: root.getPropertyValue('--salah-fg-primary').trim(),
                salahFgSecondary: root.getPropertyValue('--salah-fg-secondary').trim(),
                salahFgTertiary: root.getPropertyValue('--salah-fg-tertiary').trim(),
                salahBgSurface: root.getPropertyValue('--salah-bg-surface').trim(),
                mobileFg: mobile?.getPropertyValue('--mobile-theme-fg').trim(),
                mobileSecondary: mobile?.getPropertyValue('--mobile-theme-secondary').trim(),
                mobileTertiary: mobile?.getPropertyValue('--mobile-theme-tertiary').trim(),
                mobileSurface: mobile?.getPropertyValue('--mobile-theme-surface').trim(),
              },
            };
          });
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          NODE
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/salahos-diagnostic-server.pid ]; then
            kill "$(cat /tmp/salahos-diagnostic-server.pid)" 2>/dev/null || true
          fi
